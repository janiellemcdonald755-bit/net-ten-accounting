<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [historySearch, setHistorySearch] = React.useState(''); 
    
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');

    const [payAmt, setPayAmt] = React.useState('');
    const [payMethod, setPayMethod] = React.useState('Cash');
    const [payDate, setPayDate] = React.useState(new Date().toISOString().split('T')[0]);
    const [tempPrincipal, setTempPrincipal] = React.useState('');
    const [tempInterest, setTempInterest] = React.useState('');
    const [newLoanDate, setNewLoanDate] = React.useState(new Date().toISOString().split('T')[0]);
    const [newDueDate, setNewDueDate] = React.useState('');
    const [loanMethod, setLoanMethod] = React.useState('Face to Face');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
            setUser(u);
            if (!u) setLoading(false);
        });
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
            setLoading(false);
        });
        return () => { unsubscribe(); clientsRef.off(); };
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        let finalEmail = loginId.includes('@') ? loginId : `${loginId.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();
        auth.signInWithEmailAndPassword(finalEmail, password).catch(err => alert("Login failed. Check credentials."));
    };

    const isAdmin = user?.email === ADMIN_EMAIL;

    const handlePrincipalCalc = (val) => {
        setTempPrincipal(val);
        const num = parseFloat(val);
        if(!isNaN(num)) {
            const totalWithInterest = num + (num * 0.25);
            setTempInterest(totalWithInterest.toFixed(2));
        } else { setTempInterest(''); }
    };

    const deleteHistoryItem = (clientId, historyIndex) => {
        if (!confirm("Reverse this payment? Amount will be added back to balance.")) return;
        const client = clients.find(c => c.id === clientId);
        if (client && client.history) {
            const paymentToRemove = client.history[historyIndex];
            const newHistory = [...client.history];
            newHistory.splice(historyIndex, 1);
            db.ref(`clients/${clientId}`).update({ 
                history: newHistory,
                interestAmount: parseFloat(client.interestAmount || 0) + parseFloat(paymentToRemove.amount || 0) 
            });
        }
    };

    const deleteClient = (clientId) => {
        if (!confirm("Permanently delete this entire portfolio?")) return;
        db.ref(`clients/${clientId}`).remove();
        setEditingClient(null);
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4 object-contain" />
                    <h1 className="text-3xl font-black text-blue-400 mb-2 uppercase italic tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleLogin} className="space-y-4 mt-6">
                        <input type="text" placeholder="Admin ID / Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setLoginId(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Sign In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200">
            <header className="sticky top-0 z-50 bg-[#1e293b]/80 backdrop-blur-md p-5 border-b border-slate-700 flex justify-between items-center">
                <h1 className="text-sm font-black text-white uppercase italic">Net Ten Ltd</h1>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div>
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Client</button>
                        </nav>

                        {view === 'home' && (
                            <>
                                <input type="text" placeholder="Search portfolios..." className="w-full p-4 mb-6 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={(e) => setSearchTerm(e.target.value)} />
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-xl">
                                        <div className="flex justify-between items-start">
                                            <div><h3 className="font-black text-white text-lg">{c.name}</h3><p className="text-[8px] text-slate-500 font-black uppercase">DUE: {c.dueDate || 'N/A'}</p></div>
                                            <div className="text-right"><p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p></div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => { setPayingClient(c); setPayAmt(''); setIsNewLoanView(false); }} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Payment/Loan</button>
                                            <button onClick={() => setEditingClient(c)} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                            <button onClick={() => { const m = prompt("Note for " + c.name); if(m) db.ref(`clients/${c.id}`).update({ directMsg: m }); }} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Note</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}

                        {view === 'history' && (
                            <div>
                                <input type="text" placeholder="Search history..." value={historySearch} onChange={(e) => setHistorySearch(e.target.value)} className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" />
                                <div className="space-y-3">
                                    {clients.flatMap(c => (c.history || []).map((h, i) => ({...h, cId: c.id, cName: c.name, idx: i})))
                                        .filter(h => h.cName.toLowerCase().includes(historySearch.toLowerCase()))
                                        .sort((a,b) => b.timestamp - a.timestamp)
                                        .map((h, i) => (
                                            <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b] rounded-2xl border border-slate-800">
                                                <div className="flex gap-3 items-center">
                                                    <button onClick={() => deleteHistoryItem(h.cId, h.idx)} className="w-7 h-7 bg-red-900/20 text-red-500 rounded-full text-[10px] font-black">✕</button>
                                                    <div><p className="text-blue-400 font-black text-[10px] uppercase">{h.cName}</p><p className="text-[8px] text-slate-500 uppercase">{h.date} • {h.method}</p></div>
                                                </div>
                                                <p className="font-black text-green-400">${h.amount}</p>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        )}

                        {view === 'add' && (
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                // Logic: Use provided email, OR fallback to phone-based login email
                                const finalEmail = d.email ? d.email.toLowerCase() : `${d.phone.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();
                                await db.ref('clients').push({ ...d, email: finalEmail, interestAmount: parseFloat(d.interestAmount || 0), amountOwed: parseFloat(d.amountOwed || 0) });
                                alert("Record Created Successfully!"); setView('home');
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3">
                                <h2 className="text-lg font-black text-white uppercase italic mb-2">New Portfolio</h2>
                                
                                <div className="space-y-3">
                                    <input name="name" placeholder="Client Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input name="phone" placeholder="Phone Number" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                        <input name="email" placeholder="Email (Optional)" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                    </div>
                                    <input name="address" placeholder="Physical Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input name="workLocation" placeholder="Work Location" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                        <input name="employerPhone" placeholder="Employer Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1"><label className="text-[7px] font-black uppercase text-slate-500 ml-1">Principal</label><input name="amountOwed" type="number" step="any" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>
                                        <div className="space-y-1"><label className="text-[7px] font-black uppercase text-green-500 ml-1">Total (25%)</label><input name="interestAmount" value={tempInterest} type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1"><label className="text-[7px] font-black uppercase text-slate-500 ml-1">Loan Date</label><input name="loanDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>
                                        <div className="space-y-1"><label className="text-[7px] font-black uppercase text-red-500 ml-1">Due Date</label><input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required /></div>
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase mt-4">Save Profile</button>
                            </form>
                        )}
                    </div>
                ) : null}

                {/* MODAL: DETAILS & FULL EDIT */}
                {editingClient && (
                    <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                            <div className="flex justify-between items-center">
                                <h3 className="text-xl font-black text-white uppercase italic">Edit Details</h3>
                                <button onClick={() => deleteClient(editingClient.id)} className="bg-red-900/20 text-red-500 px-4 py-1 rounded-full text-[8px] font-black uppercase">Delete</button>
                            </div>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                db.ref(`clients/${editingClient.id}`).update({ ...d, interestAmount: parseFloat(d.interestAmount || 0), amountOwed: parseFloat(d.amountOwed || 0) });
                                setEditingClient(null); alert("Updated!");
                            }} className="space-y-4">
                                <input name="name" defaultValue={editingClient.name} className="w-full p-4 bg-[#0f172a] rounded-xl text-white outline-none" />
                                <input name="address" defaultValue={editingClient.address} placeholder="Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white outline-none text-xs" />
                                <div className="grid grid-cols-2 gap-2">
                                    <input name="workLocation" defaultValue={editingClient.workLocation} placeholder="Work" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs outline-none" />
                                    <input name="employerPhone" defaultValue={editingClient.employerPhone} placeholder="Employer #" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs outline-none" />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="dueDate" type="date" defaultValue={editingClient.dueDate} className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                    <input name="interestAmount" type="number" step="any" defaultValue={editingClient.interestAmount} className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Save Changes</button>
                                <button type="button" onClick={() => setEditingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Cancel</button>
                            </form>
                        </div>
                    </div>
                )}

                {/* LOAN/PAYMENT MODAL REMAINS THE SAME AS PREVIOUS VERSION */}
                {payingClient && (
                    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 space-y-6">
                            <div className="flex justify-between border-b border-slate-800">
                                <button onClick={() => setIsNewLoanView(false)} className={`pb-2 text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Record Pay</button>
                                <button onClick={() => setIsNewLoanView(true)} className={`pb-2 text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>Add New Loan</button>
                            </div>
                            {!isNewLoanView ? (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" value={payDate} onChange={(e) => setPayDate(e.target.value)} className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                        <select value={payMethod} onChange={(e) => setPayMethod(e.target.value)} className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800"><option>Cash</option><option>Bank Transfer</option></select>
                                    </div>
                                    <input type="number" value={payAmt} onChange={(e) => setPayAmt(e.target.value)} placeholder="Amount Paid" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xl font-black outline-none border border-slate-700" />
                                    <button onClick={() => {
                                        const amt = parseFloat(payAmt); if(!amt) return;
                                        const hObj = { amount: amt, date: payDate, method: payMethod, type: "Payment", timestamp: new Date(payDate).getTime() };
                                        db.ref(`clients/${payingClient.id}`).update({ 
                                            interestAmount: Math.max(0, (payingClient.interestAmount || 0) - amt),
                                            history: [...(payingClient.history || []), hObj] 
                                        });
                                        setPayingClient(null); alert("Confirmed!");
                                    }} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Confirm Payment</button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" value={newLoanDate} onChange={(e) => setNewLoanDate(e.target.value)} className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                        <input type="date" value={newDueDate} onChange={(e) => setNewDueDate(e.target.value)} className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-red-900/20" />
                                    </div>
                                    <input type="number" placeholder="New Principal" value={tempPrincipal} onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white font-black border border-slate-700 outline-none" />
                                    <div className="p-4 bg-green-900/10 rounded-2xl border border-green-900/20 text-center"><p className="text-[8px] font-black uppercase text-green-500">Total Charged (+25%)</p><p className="text-xl font-black text-white">${tempInterest || '0.00'}</p></div>
                                    <button onClick={() => {
                                        const p = parseFloat(tempPrincipal || 0); const i = parseFloat(tempInterest || 0); if(!p || !newDueDate) return alert("Check Principal & Due Date");
                                        db.ref(`clients/${payingClient.id}`).update({ 
                                            amountOwed: (payingClient.amountOwed || 0) + p, 
                                            interestAmount: (payingClient.interestAmount || 0) + i, 
                                            dueDate: newDueDate 
                                        });
                                        setPayingClient(null); alert("Loan Issued!");
                                    }} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase">Issue Loan</button>
                                </div>
                            )}
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Cancel</button>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

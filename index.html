<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

// Initialize Firebase
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    // --- 1. CORE STATES ---
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [selectedClient, setSelectedClient] = React.useState(null);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [msgTarget, setMsgTarget] = React.useState(null);
    const [txnMode, setTxnMode] = React.useState('loan'); // 'loan' or 'pay'

    // --- 2. DATA LISTENERS ---
    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    if (data?.notif) {
                        alert(`MESSAGE FROM NET TEN: ${data.notif}`);
                        db.ref(`users/${u.uid}/notif`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_account');
            } else {
                setView('login');
            }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribe();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- 3. CALCULATOR / ANALYTICS LOGIC (CRASH PROTECTION ADDED HERE) ---
    const getStats = () => {
        const totalPrincipal = clients.reduce((sum, c) => sum + parseFloat(c.principal || 0), 0);
        const totalBalance = clients.reduce((sum, c) => sum + parseFloat(c.interestAmount || 0), 0);
        const totalCollected = clients.reduce((sum, c) => {
            // Added safety check: h.type?.toLowerCase() prevents the crash if type is missing
            const payments = (c.history || []).filter(h => h.type?.toLowerCase().includes('pay'));
            return sum + payments.reduce((pSum, p) => pSum + parseFloat(p.amount || 0), 0);
        }, 0);

        return {
            totalPrincipal,
            totalBalance,
            totalCollected,
            activeCount: clients.length,
            pendingCount: requests.length
        };
    };

    const stats = getStats();

    // --- 4. AUTHENTICATION SCREENS ---
    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-24 h-24 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-xl mb-4">Secure Terminal</h2>
                            <input name="email" type="text" placeholder="Email or Username" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg hover:bg-blue-500 transition-all">Sign In</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto">Create New Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, status: 'pending', timestamp: Date.now()});
                            alert("Registration submitted for approval!");
                            setIsRegistering(false);
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-xl mb-4">Apply for Access</h2>
                            <input name="username" placeholder="Full Username" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="dob" type="date" placeholder="DOB" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase">Submit Request</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto">Back to Login</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans">
            
            {/* --- SIDEBAR NAVIGATION --- */}
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0">
                <div className="p-8 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Net Ten</h1>
                </div>
                
                <nav className="py-6 flex-1">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📂 Portfolio Manager</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>➕ Add Portfolio</button>
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'master_history' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📜 Master History</button>
                            <div className="my-2 border-t border-slate-800/50"></div>
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all flex justify-between items-center ${view === 'inbox_accounts' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>
                                <span>👤 Account Requests</span>
                                {pendingUsers.length > 0 && <span className="bg-green-600 text-white px-2 rounded-full text-[8px]">{pendingUsers.length}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all flex justify-between items-center ${view === 'inbox_loans' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>
                                <span>💰 Loan Requests</span>
                                {requests.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full text-[8px]">{requests.length}</span>}
                            </button>
                            <button onClick={() => setView('reports')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'reports' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📊 Data Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_account')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'client_account' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>🏠 My Dashboard</button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'client_apply' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>➕ New Application</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'client_pay' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>💳 Make Payment</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'client_faq' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>❓ Support / FAQ</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic transition-all ${view === 'client_profile' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>👤 Profile Settings</button>
                        </>
                    )}
                </nav>
                
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-500/20 active:scale-95 transition-all">Sign Out Securely</button>
            </aside>

            {/* --- MAIN CONTENT AREA --- */}
            <main className="flex-1 overflow-y-auto p-10 bg-[#0f172a]">
                
                {/* VIEW: ADMIN PORTFOLIO LIST */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-5xl mx-auto">
                        <div className="grid grid-cols-3 gap-6 mb-12">
                            <div className="bg-blue-600 p-8 rounded-[40px] text-white shadow-xl">
                                <p className="text-[10px] font-black uppercase opacity-60 mb-1">Total Outstanding</p>
                                <p className="text-4xl font-black italic">${stats.totalBalance.toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] text-white border border-slate-700 shadow-xl">
                                <p className="text-[10px] font-black uppercase opacity-60 mb-1">Active Accounts</p>
                                <p className="text-4xl font-black italic">{stats.activeCount}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] text-white border border-slate-700 shadow-xl">
                                <p className="text-[10px] font-black uppercase opacity-60 mb-1">Queue Requests</p>
                                <p className="text-4xl font-black italic">{stats.pendingCount}</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-4 mb-8">
                            <input type="text" placeholder="Search by name, phone or email..." className="flex-1 p-5 bg-[#1e293b] rounded-3xl text-white text-xs border border-slate-700 outline-none focus:border-blue-500" onChange={e => setSearchTerm(e.target.value)} />
                        </div>

                        <div className="grid grid-cols-2 gap-6">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-8 rounded-[45px] border border-slate-700 hover:border-blue-500 transition-all shadow-lg">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="text-white font-black uppercase text-sm tracking-tighter">{c.name}</h3>
                                            <p className="text-[9px] text-slate-500 uppercase font-bold">{c.email}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setMsgTarget(c)} className="bg-slate-800 p-3 rounded-2xl text-blue-400 text-xs hover:bg-blue-500 hover:text-white transition-all">✉️</button>
                                            <button onClick={() => { if(confirm("Delete Portfolio?")) db.ref(`clients/${c.id}`).remove(); }} className="bg-slate-800 p-3 rounded-2xl text-red-500 text-xs hover:bg-red-500 hover:text-white transition-all">🗑️</button>
                                        </div>
                                    </div>
                                    <div className="mb-6">
                                        <p className="text-slate-500 text-[9px] font-black uppercase mb-1">Current Balance</p>
                                        <p className="text-5xl font-black text-green-400 italic">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => {setPayingClient(c); setTxnMode('loan');}} className="flex-1 bg-blue-600 text-white py-4 rounded-2xl text-[9px] font-black uppercase shadow-lg active:scale-95 transition-all">Issue Funds</button>
                                        <button onClick={() => {setPayingClient(c); setTxnMode('pay');}} className="flex-1 bg-green-600 text-white py-4 rounded-2xl text-[9px] font-black uppercase shadow-lg active:scale-95 transition-all">Collect Pay</button>
                                        <button onClick={() => setSelectedClient(c)} className="bg-slate-700 text-white px-6 py-4 rounded-2xl text-[9px] font-black uppercase hover:bg-slate-600">History</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* VIEW: ADMIN MASTER HISTORY (Safety Fixed) */}
                {isAdmin && view === 'master_history' && (
                    <div className="max-w-4xl mx-auto bg-[#1e293b] p-10 rounded-[50px] border border-slate-700">
                        <h2 className="text-2xl font-black text-white italic uppercase mb-8">Master Ledger History</h2>
                        <div className="space-y-3">
                            {clients.length === 0 ? (
                                <p className="text-slate-500 text-center uppercase font-black py-20 italic">No records found.</p>
                            ) : (
                                clients.flatMap(c => 
                                    (c.history || []).map((h, i) => ({...h, clientName: c.name}))
                                )
                                .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))
                                .map((h, i) => (
                                    <div key={i} className="flex justify-between items-center bg-[#0f172a] p-5 rounded-3xl border border-slate-800">
                                        <div>
                                            <p className="text-blue-400 font-black text-xs uppercase mb-1">{h.clientName}</p>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase">{h.date} — {h.type} via {h.method}</p>
                                        </div>
                                        <p className={`font-black text-sm italic ${h.type?.toLowerCase().includes('pay') ? 'text-green-400' : 'text-blue-400'}`}>
                                            {h.type?.toLowerCase().includes('pay') ? '-' : '+'}${parseFloat(h.amount || 0).toFixed(2)}
                                        </p>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                )}

                {/* VIEW: ADMIN DATA ANALYTICS */}
                {isAdmin && view === 'reports' && (
                    <div className="max-w-5xl mx-auto space-y-8">
                        <h2 className="text-2xl font-black text-white italic uppercase">Business Intelligence</h2>
                        <div className="grid grid-cols-4 gap-6">
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                                <p className="text-[9px] text-slate-500 font-black uppercase mb-1">Principal Out</p>
                                <p className="text-2xl font-black text-white italic">${stats.totalPrincipal.toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                                <p className="text-[9px] text-slate-500 font-black uppercase mb-1">Projected Revenue</p>
                                <p className="text-2xl font-black text-blue-400 italic">${(stats.totalBalance).toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                                <p className="text-[9px] text-slate-500 font-black uppercase mb-1">Cash Collected</p>
                                <p className="text-2xl font-black text-green-400 italic">${stats.totalCollected.toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                                <p className="text-[9px] text-slate-500 font-black uppercase mb-1">Client Retention</p>
                                <p className="text-2xl font-black text-white italic">{(stats.activeCount * 1.5).toFixed(0)}%</p>
                            </div>
                        </div>

                        <div className="bg-[#1e293b] p-10 rounded-[50px] border border-slate-700">
                            <h3 className="text-white font-black uppercase text-xs mb-8 italic">Performance Breakdown</h3>
                            <div className="space-y-6">
                                {clients.map(c => {
                                    const collected = (c.history || []).filter(h => h.type?.toLowerCase().includes('pay')).reduce((s, h) => s + parseFloat(h.amount || 0), 0);
                                    const totalExpected = (parseFloat(c.principal || 0) + (parseFloat(c.interestAmt || 0)));
                                    const progress = totalExpected === 0 ? 0 : Math.min(100, (collected / totalExpected) * 100);
                                    return (
                                        <div key={c.id}>
                                            <div className="flex justify-between text-[10px] font-black uppercase mb-2">
                                                <span className="text-white">{c.name}</span>
                                                <span className="text-slate-500">{progress.toFixed(0)}% Paid</span>
                                            </div>
                                            <div className="w-full h-3 bg-[#0f172a] rounded-full overflow-hidden border border-slate-800">
                                                <div className="h-full bg-blue-600 transition-all" style={{width: `${progress}%`}}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                )}

                {/* VIEW: ADMIN ADD PORTFOLIO */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-12 rounded-[50px] border border-slate-700 shadow-2xl">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-8">New Portfolio Onboarding</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const total = parseFloat(d.principal) + parseFloat(d.interestAmt);
                            const h = { amount: total, date: d.dateBorrowed, type: "Initial Disbursement", method: d.disbursement, timestamp: Date.now() };
                            await db.ref('clients').push({ ...d, interestAmount: total, status: 'Active', history: [h] });
                            alert("Loan Portfolio Successfully Created!");
                            setView('home');
                        }} className="grid grid-cols-2 gap-4">
                            <input name="name" placeholder="Full Client Name" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email Address" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="phone" placeholder="Personal Phone" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="address" placeholder="Full Residential Address" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="employerPhone" placeholder="Employer Phone #" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            
                            <select name="loanType" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs font-black uppercase">
                                <option>Weekly</option><option>Fortnightly</option><option>Monthly</option>
                            </select>
                            <select name="disbursement" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs font-black uppercase">
                                <option>Bank Transfer</option><option>Cash</option>
                            </select>

                            <input name="principal" type="number" placeholder="Principal Amount ($)" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="interestAmt" type="number" placeholder="Interest Amount ($)" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-2 font-black">Date Borrowed</label>
                                <input name="dateBorrowed" type="date" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-2 font-black">Due Date</label>
                                <input name="dueDate" type="date" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            </div>

                            <button className="col-span-2 bg-blue-600 text-white font-black py-6 rounded-[30px] uppercase mt-6 shadow-xl text-sm">Activate Loan Account</button>
                        </form>
                    </div>
                )}

                {/* VIEW: ADMIN ACCOUNT REQUESTS */}
                {isAdmin && view === 'inbox_accounts' && (
                    <div className="max-w-3xl mx-auto">
                        <h2 className="text-2xl font-black text-white italic uppercase mb-8">Pending Account Approvals</h2>
                        {pendingUsers.length === 0 ? (
                            <p className="text-slate-500 uppercase font-black text-[10px] text-center mt-20 italic">No account requests in queue.</p>
                        ) : (
                            pendingUsers.map(p => (
                                <div key={p.id} className="bg-[#1e293b] p-8 rounded-[40px] border-l-8 border-green-500 mb-4 flex justify-between items-center shadow-lg">
                                    <div>
                                        <p className="text-white font-black uppercase text-sm mb-1">{p.username}</p>
                                        <p className="text-[10px] text-slate-500 font-bold uppercase">{p.email} • DOB: {p.dob}</p>
                                        <p className="text-[10px] text-slate-400 mt-2">Phone: {p.phone}</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => db.ref(`pending_registrations/${p.id}`).remove()} className="bg-green-600 text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase">Approve</button>
                                        <button onClick={() => db.ref(`pending_registrations/${p.id}`).remove()} className="bg-slate-800 text-red-500 px-6 py-3 rounded-2xl text-[10px] font-black uppercase">Deny</button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                )}

                {/* VIEW: CLIENT DASHBOARD ACCOUNT */}
                {!isAdmin && view === 'client_account' && (
                    <div className="max-w-xl mx-auto space-y-8">
                        <div className="bg-[#1e293b] p-12 rounded-[60px] border border-slate-700 text-center shadow-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 bg-blue-600 px-8 py-3 rounded-bl-[40px] text-white text-[10px] font-black uppercase italic shadow-lg tracking-widest">Active Status</div>
                            <p className="text-slate-500 font-black uppercase text-[10px] mb-2 tracking-widest opacity-60">Total Outstanding Balance</p>
                            <p className="text-8xl font-black text-green-400 italic mb-8 tracking-tighter">${parseFloat(clientData?.interestAmount || 0).toFixed(2)}</p>
                            
                            <div className="grid grid-cols-2 gap-4 text-left">
                                <div className="bg-[#0f172a] p-6 rounded-[30px] border border-slate-800">
                                    <p className="text-[8px] text-slate-500 uppercase font-black mb-1">Borrow Date</p>
                                    <p className="text-white font-black text-sm italic">{clientData?.dateBorrowed || 'N/A'}</p>
                                </div>
                                <div className="bg-[#0f172a] p-6 rounded-[30px] border border-slate-800">
                                    <p className="text-[8px] text-slate-500 uppercase font-black mb-1">Final Due Date</p>
                                    <p className="text-red-400 font-black text-sm italic">{clientData?.dueDate || 'N/A'}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-[#1e293b] p-10 rounded-[50px] border border-slate-700 shadow-xl">
                            <h3 className="text-white font-black uppercase text-xs mb-8 border-b border-slate-800 pb-4 flex justify-between italic">Recent Activity</h3>
                            <div className="space-y-4">
                                {(clientData?.history || []).slice(-5).reverse().map((h, i) => (
                                    <div key={i} className="flex justify-between items-center bg-[#0f172a] p-5 rounded-3xl border border-slate-800">
                                        <div>
                                            <p className="text-white font-black text-[10px] uppercase mb-1">{h.type}</p>
                                            <p className="text-[9px] text-slate-500 font-bold uppercase">{h.date} — {h.method}</p>
                                        </div>
                                        <p className={`font-black text-sm italic ${h.type?.toLowerCase().includes('pay') ? 'text-green-400' : 'text-blue-400'}`}>
                                            {h.type?.toLowerCase().includes('pay') ? '-' : '+'}${parseFloat(h.amount || 0).toFixed(2)}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

                {/* VIEW: CLIENT PROFILE SETTINGS */}
                {!isAdmin && view === 'client_profile' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-12 rounded-[60px] border border-slate-700 shadow-2xl">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-10">Profile & Info Settings</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref(`users/${user.uid}`).update(d);
                            alert("Profile successfully updated!");
                        }} className="space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="text-[10px] text-slate-500 font-black uppercase ml-4 block">Username</label>
                                    <input name="username" defaultValue={userData?.username} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] text-slate-500 font-black uppercase ml-4 block">Phone #</label>
                                    <input name="phone" defaultValue={userData?.phone} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                                </div>
                            </div>
                            <div className="space-y-2">
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4 block">Residential Address</label>
                                <input name="address" defaultValue={userData?.address || ''} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="text-[10px] text-slate-500 font-black uppercase ml-4 block">Date of Birth</label>
                                    <input name="dob" type="date" defaultValue={userData?.dob} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] text-slate-500 font-black uppercase ml-4 block">Employer Contact</label>
                                    <input name="employerPhone" defaultValue={userData?.savedLoanDetails?.employerPhone || ''} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                                </div>
                            </div>
                            <button className="w-full bg-green-600 text-white font-black py-6 rounded-[30px] uppercase shadow-xl hover:bg-green-500 transition-all">Update Secure File</button>
                        </form>
                    </div>
                )}
            </main>

            {/* --- MODAL: DUAL TRANSACTION ENGINE --- */}
            {payingClient && (
                <div className="fixed inset-0 z-[1001] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-xl rounded-[60px] p-12 border border-slate-700">
                        <h2 className="text-3xl font-black text-white italic uppercase text-center mb-8">Ledger: {payingClient.name}</h2>
                        <div className="flex gap-4 mb-8 p-3 bg-[#0f172a] rounded-[35px] border border-slate-800 shadow-inner">
                            <button onClick={() => setTxnMode('loan')} className={`flex-1 py-4 text-[10px] font-black uppercase rounded-[25px] transition-all ${txnMode === 'loan' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500'}`}>Lend (Issue)</button>
                            <button onClick={() => setTxnMode('pay')} className={`flex-1 py-4 text-[10px] font-black uppercase rounded-[25px] transition-all ${txnMode === 'pay' ? 'bg-green-600 text-white shadow-lg' : 'text-slate-500'}`}>Collect (Pay)</button>
                        </div>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            let newBal = parseFloat(payingClient.interestAmount || 0);
                            if (txnMode === 'pay') newBal -= amt; else newBal += amt;
                            const h = { amount: amt, date: d.date, method: d.method, type: d.txnType, timestamp: Date.now() };
                            await db.ref(`clients/${payingClient.id}`).update({ 
                                interestAmount: Math.max(0, newBal), 
                                dueDate: d.dueDate || payingClient.dueDate,
                                history: [...(payingClient.history || []), h] 
                            });
                            setPayingClient(null);
                        }} className="space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <select name="txnType" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs font-black uppercase border border-slate-800">
                                    {txnMode === 'loan' ? (<><option>New Loan</option><option>Top Up</option></>) : (<><option>Payment</option><option>Full Payoff</option></>)}
                                </select>
                                <select name="method" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs font-black uppercase border border-slate-800">
                                    <option>Bank Transfer</option><option>Cash</option>
                                </select>
                            </div>
                            <input name="amount" type="number" step="0.01" placeholder="$0.00" className="w-full p-6 bg-[#0f172a] rounded-[30px] text-white text-4xl font-black italic border border-slate-800" required />
                            <div className="grid grid-cols-2 gap-4">
                                <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                                <input name="dueDate" type="date" defaultValue={payingClient.dueDate} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                            </div>
                            <button className={`w-full py-6 rounded-[30px] font-black uppercase shadow-2xl text-white ${txnMode === 'loan' ? 'bg-blue-600' : 'bg-green-600'}`}>Commit to Digital Ledger</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] font-black uppercase mt-2 text-center">Cancel</button>
                        </form>
                    </div>
                </div>
            )}

            {/* --- MODAL: CLIENT HISTORY --- */}
            {selectedClient && (
                <div className="fixed inset-0 z-[1001] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-2xl rounded-[60px] p-12 border border-slate-700 max-h-[85vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-10 border-b border-slate-800 pb-6">
                            <h2 className="text-3xl font-black text-white italic uppercase">{selectedClient.name} History</h2>
                            <button onClick={() => setSelectedClient(null)} className="text-slate-500 hover:text-white">✕</button>
                        </div>
                        <div className="space-y-3">
                            {(selectedClient.history || []).length === 0 ? (
                                <p className="text-slate-500 text-center py-10 uppercase font-black italic">No history found for this portfolio.</p>
                            ) : (
                                [...selectedClient.history].reverse().map((h, i) => (
                                    <div key={i} className="flex justify-between items-center bg-[#0f172a] p-5 rounded-[30px] border border-slate-800">
                                        <div>
                                            <p className="text-slate-400 font-bold uppercase text-[10px]">{h.date} — {h.type}</p>
                                            <p className="text-[9px] text-slate-600 font-black uppercase italic">{h.method}</p>
                                        </div>
                                        <div className="flex items-center gap-6">
                                            <span className={`font-black italic text-sm ${h.type?.toLowerCase().includes('pay') ? 'text-green-400' : 'text-blue-400'}`}>
                                                ${parseFloat(h.amount || 0).toFixed(2)}
                                            </span>
                                            <button onClick={() => {
                                                const newH = selectedClient.history.filter((_, idx) => (selectedClient.history.length - 1 - idx) !== i);
                                                db.ref(`clients/${selectedClient.id}/history`).set(newH);
                                                setSelectedClient({...selectedClient, history: newH});
                                            }} className="text-red-900 font-black hover:text-red-500">DEL</button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

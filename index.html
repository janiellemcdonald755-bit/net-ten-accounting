<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [selectedClient, setSelectedClient] = React.useState(null);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [msgTarget, setMsgTarget] = React.useState(null);
    const [txnMode, setTxnMode] = React.useState('loan');
    const [reportPeriod, setReportPeriod] = React.useState('monthly');

    // --- DATA FETCHING ---
    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
                if (u.email !== ADMIN_EMAIL) setView('client_account');
            } else {
                setView('login');
            }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribe();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- ANALYTICS ENGINE (FIXED) ---
    const getStats = () => {
        let totalPrincipal = 0;
        let totalOwed = 0;
        let revenue = 0;

        clients.forEach(c => {
            totalPrincipal += parseFloat(c.principal || 0);
            totalOwed += parseFloat(c.interestAmount || 0);
            (c.history || []).forEach(h => {
                if (h.type?.toLowerCase().includes('pay')) revenue += parseFloat(h.amount || 0);
            });
        });

        return { totalPrincipal, totalOwed, revenue, active: clients.length };
    };

    const stats = getStats();

    // --- AUTH VIEWS ---
    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-24 h-24 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Access Denied: Check Credentials"); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-xl">Net Ten Login</h2>
                            <input name="email" type="text" placeholder="Email" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg">Enter Terminal</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4">New Client Registration</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, status: 'pending', timestamp: Date.now()});
                            alert("Request Sent! Admin will verify your account.");
                            setIsRegistering(false);
                        }} className="space-y-4">
                            <input name="username" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl">Request Access</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans">
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0">
                <div className="p-8 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 overflow-y-auto">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ New Entry</button>
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'master_history' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📜 All History</button>
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase flex justify-between ${view === 'inbox_accounts' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                👤 Accounts {pendingUsers.length > 0 && <span className="bg-green-600 text-white px-2 rounded-full">{pendingUsers.length}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase flex justify-between ${view === 'inbox_loans' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                💰 Requests {requests.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full">{requests.length}</span>}
                            </button>
                            <button onClick={() => setView('reports')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'reports' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📊 Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_account')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'client_account' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>🏠 Dashboard</button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'client_apply' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ Apply / Top Up</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'client_pay' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>💳 Payment</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'client_faq' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>❓ Support</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase ${view === 'client_profile' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>👤 Profile</button>
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-500/20">Sign Out</button>
            </aside>

            <main className="flex-1 overflow-y-auto p-10 bg-[#0f172a]">
                
                {/* ADMIN DASHBOARD */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-5xl mx-auto">
                        <div className="flex gap-4 mb-8">
                            <input type="text" placeholder="Search portfolios..." className="flex-1 p-5 bg-[#1e293b] rounded-3xl text-white border border-slate-700" onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-6">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-8 rounded-[45px] border border-slate-700">
                                    <div className="flex justify-between items-start mb-4">
                                        <div><h3 className="text-white font-black uppercase text-sm">{c.name}</h3><p className="text-[9px] text-slate-500">{c.email}</p></div>
                                        <button onClick={() => setMsgTarget(c)} className="bg-slate-800 p-3 rounded-2xl text-blue-400">✉️</button>
                                    </div>
                                    <p className="text-4xl font-black text-green-400 italic mb-6">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => {setPayingClient(c); setTxnMode('loan');}} className="flex-1 bg-blue-600 text-white py-4 rounded-xl text-[9px] font-black uppercase">Loan</button>
                                        <button onClick={() => {setPayingClient(c); setTxnMode('pay');}} className="flex-1 bg-green-600 text-white py-4 rounded-xl text-[9px] font-black uppercase">Pay</button>
                                        <button onClick={() => setSelectedClient(c)} className="bg-slate-700 text-white px-6 py-4 rounded-xl text-[9px] font-black uppercase">History</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN MASTER HISTORY (RESTORED) */}
                {isAdmin && view === 'master_history' && (
                    <div className="max-w-4xl mx-auto bg-[#1e293b] p-10 rounded-[50px] border border-slate-700">
                        <h2 className="text-2xl font-black text-white italic uppercase mb-8">Full Transaction History</h2>
                        <div className="space-y-3">
                            {clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name})))
                                .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))
                                .map((h, i) => (
                                    <div key={i} className="flex justify-between items-center bg-[#0f172a] p-5 rounded-3xl border border-slate-800">
                                        <div>
                                            <p className="text-blue-400 font-black text-xs uppercase">{h.clientName}</p>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase">{h.date} — {h.type}</p>
                                        </div>
                                        <p className={`font-black italic ${h.type?.toLowerCase().includes('pay') ? 'text-green-400' : 'text-blue-400'}`}>
                                            {h.type?.toLowerCase().includes('pay') ? '-' : '+'}${parseFloat(h.amount || 0).toFixed(2)}
                                        </p>
                                    </div>
                                ))}
                        </div>
                    </div>
                )}

                {/* ANALYTICS (FIXED & LOADING) */}
                {isAdmin && view === 'reports' && (
                    <div className="max-w-5xl mx-auto space-y-10">
                        <div className="grid grid-cols-3 gap-6">
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                                <p className="text-[9px] text-slate-500 font-black uppercase mb-1">Total Revenue Collected</p>
                                <p className="text-3xl font-black text-green-400 italic">${stats.revenue.toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                                <p className="text-[9px] text-slate-500 font-black uppercase mb-1">Portfolio Principal</p>
                                <p className="text-3xl font-black text-blue-400 italic">${stats.totalPrincipal.toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                                <p className="text-[9px] text-slate-500 font-black uppercase mb-1">Outstanding Balance</p>
                                <p className="text-3xl font-black text-white italic">${stats.totalOwed.toLocaleString()}</p>
                            </div>
                        </div>
                        <div className="bg-[#1e293b] p-10 rounded-[50px] h-64 border border-slate-700 flex items-end justify-around gap-2">
                            {[0.3, 0.6, 0.4, 0.8, 0.5, 0.9, 0.7].map((h, i) => (
                                <div key={i} className="flex-1 bg-blue-600/20 rounded-t-xl relative overflow-hidden" style={{height: `${h * 100}%`}}>
                                    <div className="absolute bottom-0 w-full bg-blue-500" style={{height: '30%'}}></div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN ADD NEW (EXTENDED FIELDS) */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-12 rounded-[50px] border border-slate-700">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-8">Direct Account Setup</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const principal = parseFloat(d.principal);
                            const interest = parseFloat(d.interestAmt);
                            const total = principal + interest;
                            const h = { amount: total, date: d.dateBorrowed, type: "Onboarding Loan", method: "Disbursement", timestamp: Date.now() };
                            await db.ref('clients').push({ ...d, interestAmount: total, status: 'Active', history: [h] });
                            alert("Account Activated!");
                            setView('home');
                        }} className="grid grid-cols-2 gap-4">
                            <input name="name" placeholder="Full Name" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="email" type="email" placeholder="Email Address" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="phone" placeholder="Phone Number" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="workAddress" placeholder="Work Address" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="employerPhone" placeholder="Employer Phone" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                            <select name="loanType" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs font-black uppercase">
                                <option>Fortnightly</option><option>Monthly</option>
                            </select>
                            <input name="principal" type="number" placeholder="Principal ($)" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="interestAmt" type="number" placeholder="Interest Calculated ($)" className="p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-2">Date Borrowed</label>
                                <input name="dateBorrowed" type="date" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-2">Initial Due Date</label>
                                <input name="dueDate" type="date" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            </div>
                            <button className="col-span-2 bg-blue-600 text-white font-black py-6 rounded-[30px] uppercase mt-6">Open Portfolio</button>
                        </form>
                    </div>
                )}

                {/* CLIENT DASHBOARD */}
                {!isAdmin && view === 'client_account' && (
                    <div className="max-w-xl mx-auto space-y-6">
                        {/* Notification Bell */}
                        <div className="bg-[#1e293b] p-6 rounded-[40px] border border-slate-700">
                            <h3 className="text-white font-black uppercase text-[10px] mb-4 flex items-center gap-2">🔔 System Notifications</h3>
                            <div className="space-y-2 max-h-40 overflow-y-auto">
                                {userData?.notifications ? Object.values(userData.notifications).reverse().map((n, i) => (
                                    <div key={i} className="bg-[#0f172a] p-4 rounded-2xl border border-slate-800 text-[10px] text-white">
                                        <p className="font-bold">{n.text}</p>
                                        <p className="text-slate-500 text-[8px] mt-1">{new Date(n.timestamp).toLocaleString()}</p>
                                    </div>
                                )) : <p className="text-slate-600 text-[10px] uppercase font-black">No alerts</p>}
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-12 rounded-[60px] text-center shadow-2xl">
                            <p className="text-white/60 font-black uppercase text-[10px] mb-2 tracking-widest">Total Outstanding</p>
                            <p className="text-7xl font-black text-white italic tracking-tighter">${parseFloat(clientData?.interestAmount || 0).toFixed(2)}</p>
                        </div>
                    </div>
                )}

                {/* CLIENT APPLICATION (COMPLETE) */}
                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-12 rounded-[60px] border border-slate-700">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-8">Loan Application</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, name: userData.username, email: user.email, timestamp: Date.now() });
                            alert("Application Submitted for Approval!");
                            setView('client_account');
                        }} className="grid grid-cols-2 gap-5">
                            <div className="col-span-2">
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4">Requested Amount ($)</label>
                                <input name="amount" type="number" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white font-black" required />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4">Loan Term</label>
                                <select name="term" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black uppercase">
                                    <option>Fortnightly</option><option>Monthly</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4">Valid ID #</label>
                                <input name="idNum" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                            </div>
                            <div className="col-span-2">
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4">Proof of Income / Address (Note or URL)</label>
                                <textarea name="proof" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] h-20" required></textarea>
                            </div>
                            <input name="bankBranch" placeholder="Bank & Branch" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                            <input name="accountNumber" placeholder="Account Number" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                            <button className="col-span-2 bg-blue-600 text-white font-black py-6 rounded-[30px] uppercase mt-4">Send Application</button>
                        </form>
                    </div>
                )}

                {/* CLIENT PAYMENTS */}
                {!isAdmin && view === 'client_pay' && (
                    <div className="max-w-xl mx-auto space-y-6">
                        <div className="bg-[#1e293b] p-12 rounded-[50px] border border-slate-700 text-center">
                            <h2 className="text-2xl font-black text-white uppercase italic mb-4">Make Payment</h2>
                            <div className="bg-blue-600/10 p-6 rounded-3xl border border-blue-500/20 mb-8">
                                <p className="text-blue-400 text-[10px] font-black uppercase mb-2">Banking Details</p>
                                <p className="text-white text-xs">Please contact Admin at <b>(876) 318-0099</b> to receive current bank details and confirm your transfer.</p>
                            </div>
                            <form className="space-y-4">
                                <input type="number" placeholder="Planned Payment ($)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white font-black" />
                                <input type="date" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                                <button type="button" onClick={() => alert("Payment Scheduled. Please send transfer and receipt to Admin.")} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase">Schedule Payment</button>
                            </form>
                        </div>
                    </div>
                )}

                {/* CLIENT PROFILE (LOAD EXISTING INFO) */}
                {!isAdmin && view === 'client_profile' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-12 rounded-[60px] border border-slate-700 shadow-2xl">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-10">Profile Settings</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref(`users/${user.uid}`).update(d);
                            alert("Profile Updated Successfully!");
                        }} className="space-y-5">
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-4">Full Name</label>
                                <input name="username" defaultValue={userData?.username || ''} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-4">Phone Number</label>
                                <input name="phone" defaultValue={userData?.phone || clientData?.phone || ''} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-4">Work Address</label>
                                <input name="workAddress" defaultValue={userData?.workAddress || clientData?.workAddress || ''} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] text-slate-500 uppercase ml-4">Employer Phone</label>
                                <input name="employerPhone" defaultValue={userData?.employerPhone || clientData?.employerPhone || ''} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                            </div>
                            <button className="w-full bg-green-600 text-white font-black py-6 rounded-[30px] uppercase shadow-xl mt-4">Save Profile Changes</button>
                        </form>
                    </div>
                )}

                {/* SUPPORT FAQ */}
                {!isAdmin && view === 'client_faq' && (
                    <div className="max-w-2xl mx-auto space-y-4">
                        <h2 className="text-2xl font-black text-white uppercase italic text-center mb-8">Support & FAQ</h2>
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 flex justify-between items-center">
                            <div><p className="text-slate-500 text-[10px] uppercase font-black">Admin Support</p><p className="text-white font-black text-2xl italic">(876) 318-0099</p></div>
                            <a href="tel:8763180099" className="bg-green-600 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px]">Call Admin</a>
                        </div>
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <p className="text-blue-400 font-black text-xs uppercase mb-2">Q: How do I get more funds?</p>
                            <p className="text-slate-400 text-xs">Use the "Apply / Top Up" button. You'll need to submit current banking and proof of income for new requests.</p>
                        </div>
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <p className="text-blue-400 font-black text-xs uppercase mb-2">Q: How do I verify my payment?</p>
                            <p className="text-slate-400 text-xs">Once you transfer to the bank, send a screenshot of your receipt to the WhatsApp number listed above.</p>
                        </div>
                    </div>
                )}

            </main>

            {/* --- ADMIN MODALS --- */}
            {payingClient && (
                <div className="fixed inset-0 z-[1001] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-xl rounded-[60px] p-12 border border-slate-700">
                        <h2 className="text-3xl font-black text-white italic uppercase text-center mb-8">{txnMode === 'loan' ? 'Funds Out' : 'Funds In'}</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            let newBal = parseFloat(payingClient.interestAmount || 0);
                            if (txnMode === 'pay') newBal -= amt; else newBal += amt;
                            const h = { amount: amt, date: d.date, method: d.method, type: txnMode === 'pay' ? 'Payment Received' : 'Balance Increase', timestamp: Date.now() };
                            await db.ref(`clients/${payingClient.id}`).update({ 
                                interestAmount: Math.max(0, newBal), 
                                history: [...(payingClient.history || []), h] 
                            });
                            setPayingClient(null);
                        }} className="space-y-4">
                            <input name="amount" type="number" step="0.01" placeholder="Amount ($)" className="w-full p-6 bg-[#0f172a] rounded-3xl text-white text-3xl font-black text-center" required />
                            <select name="method" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black uppercase">
                                <option>Bank Transfer</option><option>Cash</option>
                            </select>
                            <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                            <button className={`w-full py-5 rounded-2xl font-black uppercase text-white ${txnMode === 'loan' ? 'bg-blue-600' : 'bg-green-600'}`}>Verify Transaction</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] font-black uppercase text-center">Close</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

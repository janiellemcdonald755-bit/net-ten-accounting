<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Accounting</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. YOUR CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
            authDomain: "net-ten-accounting.firebaseapp.com",
            databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
            projectId: "net-ten-accounting",
            storageBucket: "net-ten-accounting.appspot.com",
            messagingSenderId: "1095937995425",
            appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
        };

        // 2. INITIALIZE
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // 3. THE APP
 const App = () => {
    const [currentPage, setCurrentPage] = React.useState('home'); // Switch between 'home', 'accounting', 'admin'
    const [businessInfo, setBusinessInfo] = React.useState({ name: 'Net Ten', address: '', phone: '' });

    // Load Business Settings
    React.useEffect(() => {
        database.ref('settings').on('value', (snapshot) => {
            if (snapshot.val()) setBusinessInfo(snapshot.val());
        });
    }, []);

    // ... (Keep your transaction logic here) ...

    return (
        <div className="min-h-screen bg-slate-50 pb-20">
            {/* 1. TOP HEADER (The "Professional" Look) */}
            <div className="bg-white p-6 shadow-sm border-b">
                <h1 className="text-xl font-bold">{businessInfo.name}</h1>
                <p className="text-gray-400 text-sm">{businessInfo.address}</p>
            </div>

            {/* 2. PAGE CONTENT */}
            <main className="p-4">
                {currentPage === 'home' && (
                    <div className="text-center mt-10">
                        <h2 className="text-2xl font-bold">Welcome Back!</h2>
                        <p className="text-gray-500">Your business is looking great today.</p>
                        {/* Summary cards would go here */}
                    </div>
                )}

                {currentPage === 'accounting' && (
                    <div className="animate-in fade-in">
                        {/* PASTE YOUR ENTIRE ACCOUNTING UI CODE HERE */}
                    </div>
                )}

                {currentPage === 'admin' && (
                    <div className="bg-white p-6 rounded-xl shadow">
                        <h2 className="text-lg font-bold mb-4">Business Settings</h2>
                        <input 
                            className="w-full p-2 border mb-2" 
                            placeholder="Business Name"
                            value={businessInfo.name}
                            onChange={(e) => database.ref('settings/name').set(e.target.value)}
                        />
                        {/* Add more inputs for address/phone */}
                    </div>
                )}
            </main>

            {/* 3. NAVIGATION BAR (The "App" Look) */}
            <nav className="fixed bottom-0 w-full bg-white border-t flex justify-around p-3 shadow-2xl">
                <button onClick={() => setCurrentPage('home')} className={`flex flex-col items-center ${currentPage === 'home' ? 'text-blue-600' : 'text-gray-400'}`}>
                    <span className="text-xs font-bold">Home</span>
                </button>
                <button onClick={() => setCurrentPage('accounting')} className={`flex flex-col items-center ${currentPage === 'accounting' ? 'text-blue-600' : 'text-gray-400'}`}>
                    <span className="text-xs font-bold">Accounting</span>
                </button>
                <button onClick={() => setCurrentPage('admin')} className={`flex flex-col items-center ${currentPage === 'admin' ? 'text-blue-600' : 'text-gray-400'}`}>
                    <span className="text-xs font-bold">Admin</span>
                </button>
            </nav>
        </div>
    );
};
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

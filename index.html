<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    
    const [authMode, setAuthMode] = React.useState('login');
    const [clientTab, setClientTab] = React.useState('overview');
    
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    const [tempPrincipal, setTempPrincipal] = React.useState('');
    const [tempInterest, setTempInterest] = React.useState('');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const currentClient = !isAdmin ? clients.find(c => c.email?.toLowerCase() === user?.email?.toLowerCase()) : null;

    const handleAuth = async (e) => {
        e.preventDefault();
        const d = Object.fromEntries(new FormData(e.target).entries());
        let email = d.id.includes('@') ? d.id : `${d.id.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();

        if (authMode === 'login') {
            auth.signInWithEmailAndPassword(email, d.password).catch(() => alert("Login failed."));
        } else {
            await db.ref('requests').push({
                type: 'REGISTRATION', name: d.name, phone: d.phone, email: email, bankInfo: d.bankInfo, password: d.password, timestamp: Date.now()
            });
            alert("Application sent to Admin!");
            setAuthMode('login');
        }
    };

    const handlePrincipalCalc = (val) => {
        setTempPrincipal(val);
        const num = parseFloat(val);
        if(!isNaN(num)) setTempInterest((num + (num * 0.25)).toFixed(2));
        else setTempInterest('');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700">
                    <h1 className="text-3xl font-black text-blue-400 mb-6 uppercase italic text-center tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleAuth} className="space-y-4">
                        {authMode === 'signup' && (
                            <>
                                <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                                <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                                <textarea name="bankInfo" placeholder="Bank Info (Optional)" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs outline-none border border-slate-800" rows="2"></textarea>
                            </>
                        )}
                        <input name="id" placeholder="ID or Email" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg shadow-blue-500/20">{authMode === 'login' ? 'Sign In' : 'Join Net Ten'}</button>
                    </form>
                    <button onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')} className="w-full mt-6 text-slate-500 font-black text-[10px] uppercase">
                        {authMode === 'login' ? "Register New Account" : "Back to Login"}
                    </button>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200">
            <header className="p-5 border-b border-slate-700 flex justify-between items-center bg-[#1e293b]">
                <h1 className="text-sm font-black text-white uppercase italic tracking-tighter">Net Ten Ltd</h1>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div>
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                            <button onClick={() => setView('reqs')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'reqs' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Inbox ({requests.length})</button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New</button>
                        </nav>

                        {view === 'home' && (
                            <>
                                <input type="text" placeholder="Search portfolios..." className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setSearchTerm(e.target.value)} />
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-xl">
                                        <div className="flex justify-between items-start">
                                            <div><h3 className="font-black text-white">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase">DUE: {c.dueDate || '---'}</p></div>
                                            <p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => setPayingClient(c)} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Adjust</button>
                                            <button onClick={() => setEditingClient(c)} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                            <button onClick={() => { if(confirm("Delete Portfolio?")) db.ref(`clients/${c.id}`).remove(); }} className="bg-red-900/10 text-red-500 py-3 rounded-xl font-bold text-[8px] uppercase border border-red-900/50">Delete</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}

                        {view === 'history' && (
                            <div className="space-y-4">
                                {clients.flatMap(c => (c.history || []).map((h, i) => ({...h, cId: c.id, cName: c.name, idx: i}))).sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                    <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b] rounded-2xl border border-slate-800">
                                        <div className="flex gap-3 items-center">
                                            <button onClick={() => {
                                                if(confirm("Reverse entry?")) {
                                                    const cl = clients.find(x => x.id === h.cId);
                                                    const newH = [...cl.history]; newH.splice(h.idx, 1);
                                                    db.ref(`clients/${h.cId}`).update({ history: newH, interestAmount: h.type === "Payment" ? (cl.interestAmount + h.amount) : (cl.interestAmount - h.amount) });
                                                }
                                            }} className="w-6 h-6 bg-red-900/10 text-red-500 rounded-full text-[8px]">✕</button>
                                            <div><p className="text-white font-black text-[10px] uppercase">{h.cName}</p><p className="text-[7px] text-slate-500 uppercase">{h.date} • {h.type} • {h.method}</p></div>
                                        </div>
                                        <p className={`font-black text-xs ${h.type === "Payment" ? 'text-green-400' : 'text-red-400'}`}>{h.type === "Payment" ? '-' : '+'}${h.amount.toFixed(2)}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'reqs' && (
                            <div className="space-y-4">
                                {requests.map(r => (
                                    <div key={r.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 shadow-lg">
                                        <p className="text-[7px] font-black uppercase text-blue-400 mb-1">{r.type}</p>
                                        <h3 className="text-white font-black">{r.name || r.clientName}</h3>
                                        <p className="text-[9px] text-slate-400 mt-1">{r.phone || r.email}</p>
                                        {r.bankInfo && <p className="text-[9px] bg-[#0f172a] p-3 rounded-xl mt-2 border border-slate-800 italic">"{r.bankInfo}"</p>}
                                        {r.requestedAmount && <p className="text-xl font-black text-green-400 mt-1">Requested: ${r.requestedAmount}</p>}
                                        <div className="grid grid-cols-2 gap-2 mt-4">
                                            <button onClick={() => {
                                                if(r.type === 'REGISTRATION') db.ref('clients').push({ name: r.name, phone: r.phone, email: r.email, interestAmount: 0, history: [] });
                                                db.ref(`requests/${r.id}`).remove();
                                            }} className="bg-green-600 text-white py-3 rounded-xl text-[8px] font-bold uppercase">Accept</button>
                                            <button onClick={() => db.ref(`requests/${r.id}`).remove()} className="bg-red-900/20 text-red-500 py-3 rounded-xl text-[8px] font-bold uppercase">Deny</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'add' && (
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const finalEmail = d.email ? d.email.toLowerCase() : `${d.phone.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();
                                const h = { amount: parseFloat(d.interestAmount), date: d.loanDate, method: d.disbursement, type: "Loan", timestamp: Date.now() };
                                await db.ref('clients').push({ ...d, email: finalEmail, interestAmount: parseFloat(d.interestAmount), amountOwed: parseFloat(d.amountOwed), history: [h] });
                                setView('home');
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3">
                                <h2 className="text-sm font-black text-white uppercase italic">Add Portfolio</h2>
                                <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="phone" placeholder="Phone #" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                                    <input name="email" placeholder="Email" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" />
                                </div>
                                <input name="address" placeholder="Physical Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs outline-none border border-slate-800" />
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="workLocation" placeholder="Workplace" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs outline-none border border-slate-800" />
                                    <input name="employerPhone" placeholder="Employer Phone #" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs outline-none border border-slate-800" />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="space-y-1"><label className="text-[7px] font-black text-slate-500 uppercase ml-1">Principal</label><input name="amountOwed" type="number" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" /></div>
                                    <div className="space-y-1"><label className="text-[7px] font-black text-green-500 uppercase ml-1">Total (+25%)</label><input name="interestAmount" value={tempInterest} type="number" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required /></div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="loanDate" type="date" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                                    <input name="dueDate" type="date" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                                </div>
                                <select name="disbursement" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800"><option>Face to Face</option><option>Online Transfer</option></select>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg shadow-blue-500/20">Create Portfolio</button>
                            </form>
                        )}
                    </div>
                ) : (
                    /* CLIENT INTERFACE */
                    <div className="animate-in slide-in-from-bottom-4">
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700 shadow-lg">
                            <button onClick={() => setClientTab('overview')} className={`flex-1 py-3 rounded-xl text-[9px] font-black uppercase ${clientTab === 'overview' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>My Balance</button>
                            <button onClick={() => setClientTab('profile')} className={`flex-1 py-3 rounded-xl text-[9px] font-black uppercase ${clientTab === 'profile' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>My Work</button>
                            <button onClick={() => setClientTab('history')} className={`flex-1 py-3 rounded-xl text-[9px] font-black uppercase ${clientTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                        </nav>

                        {clientTab === 'overview' ? (
                            <>
                                <div className="bg-blue-600 p-12 rounded-[40px] text-center shadow-2xl mb-4 border border-white/10">
                                    <p className="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-2">Total Amount Due</p>
                                    <h2 className="text-6xl font-black text-white italic tracking-tighter">${(parseFloat(currentClient?.interestAmount || 0)).toFixed(2)}</h2>
                                </div>
                                <div className="bg-[#1e293b] p-6 rounded-[40px] border border-slate-700 space-y-4">
                                    <button onClick={async () => {
                                        const amt = prompt("How much would you like to request?");
                                        if(amt) await db.ref('requests').push({ type: 'LOAN_REQUEST', clientName: currentClient.name, requestedAmount: amt, timestamp: Date.now() });
                                        alert("Request Sent!");
                                    }} className="w-full bg-green-600 text-white py-5 rounded-3xl font-black text-[10px] uppercase shadow-lg">Request New Loan</button>
                                    <div className="grid grid-cols-2 gap-4 text-center">
                                        <div className="bg-[#0f172a] p-4 rounded-3xl"><p className="text-[8px] text-slate-500 uppercase">Borrowed</p><p className="text-xs font-bold text-white">{currentClient?.loanDate || '--'}</p></div>
                                        <div className="bg-[#0f172a] p-4 rounded-3xl"><p className="text-[8px] text-red-500 uppercase">Due</p><p className="text-xs font-bold text-white">{currentClient?.dueDate || '--'}</p></div>
                                    </div>
                                </div>
                            </>
                        ) : clientTab === 'profile' ? (
                            /* CLIENT: PROFILE SECTION */
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                await db.ref(`clients/${currentClient.id}`).update(d);
                                alert("Work info updated!");
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-4 shadow-xl">
                                <h3 className="text-[10px] font-black text-white uppercase tracking-widest text-center">My Work & Employment</h3>
                                <div className="space-y-1"><label className="text-[7px] font-black text-slate-500 uppercase">Home Address</label><input name="address" defaultValue={currentClient?.address} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none text-xs border border-slate-800" /></div>
                                <div className="space-y-1"><label className="text-[7px] font-black text-slate-500 uppercase">Workplace / Employer</label><input name="workLocation" defaultValue={currentClient?.workLocation} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none text-xs border border-slate-800" /></div>
                                <div className="space-y-1"><label className="text-[7px] font-black text-slate-500 uppercase">Employer Phone Number</label><input name="employerPhone" defaultValue={currentClient?.employerPhone} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none text-xs border border-slate-800" /></div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest">Update Info</button>
                            </form>
                        ) : (
                            <div className="space-y-3">
                                {(currentClient?.history || []).slice().reverse().map((h, i) => (
                                    <div key={i} className="bg-[#1e293b] border border-slate-800 p-5 rounded-[28px] flex justify-between items-center">
                                        <div><p className="text-[10px] font-black text-white uppercase">{h.type}</p><p className="text-[8px] text-slate-500 uppercase">{h.date} • {h.method}</p></div>
                                        <p className={`font-black text-sm ${h.type === "Payment" ? 'text-green-400' : 'text-red-400'}`}>{h.type === "Payment" ? '-' : '+'}${h.amount.toFixed(2)}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}

                {/* MODALS: RESTORED FULL DATA ENTRY */}
                {editingClient && (
                    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md overflow-y-auto">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-3 shadow-2xl">
                            <h3 className="text-xl font-black text-white uppercase italic">Edit Portfolio</h3>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                db.ref(`clients/${editingClient.id}`).update({ ...d, interestAmount: parseFloat(d.interestAmount), amountOwed: parseFloat(d.amountOwed) });
                                setEditingClient(null);
                            }} className="space-y-2">
                                <input name="name" defaultValue={editingClient.name} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                <input name="address" defaultValue={editingClient.address} placeholder="Home Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                <div className="grid grid-cols-2 gap-2">
                                    <input name="workLocation" defaultValue={editingClient.workLocation} placeholder="Employer" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                    <input name="employerPhone" defaultValue={editingClient.employerPhone} placeholder="Employer #" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <input name="loanDate" type="date" defaultValue={editingClient.loanDate} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                    <input name="dueDate" type="date" defaultValue={editingClient.dueDate} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <input name="amountOwed" type="number" defaultValue={editingClient.amountOwed} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                    <input name="interestAmount" type="number" defaultValue={editingClient.interestAmount} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase shadow-lg shadow-blue-500/20">Update Record</button>
                                <button type="button" onClick={() => setEditingClient(null)} className="w-full text-slate-500 text-[10px] uppercase font-bold">Cancel</button>
                            </form>
                        </div>
                    </div>
                )}

                {payingClient && (
                    <div className="fixed inset-0 z-[250] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 space-y-6 shadow-2xl">
                            <div className="flex justify-between border-b border-slate-800 pb-2">
                                <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Receive Pay</button>
                                <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>New Loan</button>
                            </div>
                            {!isNewLoanView ? (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" id="adjDate" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" defaultValue={new Date().toISOString().split('T')[0]} />
                                        <select id="adjMethod" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800"><option>Cash</option><option>Online Transfer</option></select>
                                    </div>
                                    <input type="number" placeholder="Amount Paid" id="adminPayAmt" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-3xl font-black text-center border border-slate-700 shadow-inner" />
                                    <button onClick={() => {
                                        const amt = parseFloat(document.getElementById('adminPayAmt').value);
                                        const date = document.getElementById('adjDate').value;
                                        const meth = document.getElementById('adjMethod').value;
                                        if(!amt) return;
                                        const h = { amount: amt, date: date, method: meth, type: "Payment", timestamp: Date.now() };
                                        db.ref(`clients/${payingClient.id}`).update({ interestAmount: Math.max(0, (payingClient.interestAmount || 0) - amt), history: [...(payingClient.history || []), h] });
                                        setPayingClient(null);
                                    }} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg shadow-blue-500/20">Finalize Payment</button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" id="loanDate" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" defaultValue={new Date().toISOString().split('T')[0]} />
                                        <input type="date" id="loanDue" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" placeholder="New Due Date" />
                                    </div>
                                    <select id="loanMethod" className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800 mb-2"><option>Face to Face</option><option>Online Transfer</option></select>
                                    <input type="number" placeholder="Principal" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white font-black border border-slate-700 shadow-inner" />
                                    <div className="p-4 bg-green-900/10 rounded-2xl text-center border border-green-900/20"><p className="text-[8px] font-black uppercase text-green-500">Adding to Balance (+25%)</p><p className="text-2xl font-black text-white">${tempInterest || '0.00'}</p></div>
                                    <button onClick={() => {
                                        const i = parseFloat(tempInterest || 0);
                                        const date = document.getElementById('loanDate').value;
                                        const due = document.getElementById('loanDue').value;
                                        const meth = document.getElementById('loanMethod').value;
                                        if(!i) return;
                                        const h = { amount: i, date: date, method: meth, type: "Loan", timestamp: Date.now() };
                                        db.ref(`clients/${payingClient.id}`).update({ interestAmount: (payingClient.interestAmount || 0) + i, loanDate: date, dueDate: due, history: [...(payingClient.history || []), h] });
                                        setPayingClient(null);
                                    }} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg shadow-green-500/20">Issue New Loan</button>
                                </div>
                            )}
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] uppercase font-bold text-center">Cancel</button>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

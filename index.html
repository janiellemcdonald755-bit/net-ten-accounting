<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [email, setEmail] = React.useState('');
    const [password, setPassword] = React.useState('');
    
    // 1. CHANGE THIS TO YOUR ACTUAL LOGIN EMAIL
    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        db.ref('clients').on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
        });
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
    };

    const addClient = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newClient = Object.fromEntries(formData.entries());
        db.ref('clients').push({
            ...newClient,
            amountOwed: parseFloat(newClient.amountOwed || 0),
            interest: parseFloat(newClient.interest || 0),
            dateAdded: Date.now()
        });
        e.target.reset();
        alert("Client Saved!");
    };

    // --- VIEW: LOGIN ---
    if (!user) {
        return (
        <div className="flex items-center gap-3">
    {/* Your Custom Logo */}
    <img 
        src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" 
        className="w-12 h-12 object-contain rounded-lg" 
        alt="Net Ten Logo" 
    />
    <div>
        <h1 className="text-xl font-black text-slate-800 tracking-tighter leading-none">NET TEN</h1>
        <p className="text-[10px] font-bold text-blue-500 uppercase tracking-widest text-left">Accounting</p>
    </div>
</div>
        );
    }

    const isAdmin = user.email === ADMIN_EMAIL;
    const myPortfolio = clients.find(c => c.email?.toLowerCase() === user.email?.toLowerCase());

    return (
        <div className="min-h-screen pb-24 bg-slate-50">
            {/* --- UNIVERSAL HEADER --- */}
            <header className="sticky top-0 z-50 bg-white p-6 shadow-md border-b flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg">N10</div>
                    <div>
                        <h1 className="text-xl font-black text-slate-800 tracking-tighter leading-none">NET TEN</h1>
                        <p className="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Accounting</p>
                    </div>
                </div>
                <button onClick={() => auth.signOut()} className="text-xl">🚪</button>
            </header>

            <main className="p-4 max-w-lg mx-auto mt-4">
                {isAdmin ? (
                    /* ADMIN VIEW */
                    <div className="animate-in fade-in">
                        <div className="flex bg-gray-200 p-1 rounded-2xl mb-6">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest ${view === 'home' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>Portfolios</button>
                            <button onClick={() => setView('admin')} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest ${view === 'admin' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>Add New</button>
                        </div>

     {view === 'home' && (
    <div className="space-y-4">
        {clients.map(c => {
            // Calculate Total Owed (Principal + Interest)
            const principal = parseFloat(c.amountOwed) || 0;
            const interestAmount = principal * (parseFloat(c.interest || 0) / 100);
            const total = principal + interestAmount;

            return (
                <div key={c.id} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-4 animate-in fade-in">
                    <div className="flex justify-between items-start mb-4">
                        <div>
                            <h3 className="font-bold text-slate-800 text-lg">{c.name}</h3>
                            <p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">{c.email}</p>
                        </div>
                        <div className="text-right">
                            <p className="text-[10px] font-bold text-gray-400 uppercase">Total Owed</p>
                            <p className="font-black text-xl text-green-600">${total.toFixed(2)}</p>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-2xl">
                        <div className="text-center border-r border-slate-200">
                            <p className="text-[9px] font-bold text-gray-400 uppercase">Principal</p>
                            <p className="text-sm font-bold text-slate-700">${principal.toFixed(2)}</p>
                        </div>
                        <div className="text-center border-r border-slate-200">
                            <p className="text-[9px] font-bold text-gray-400 uppercase">Interest</p>
                            <p className="text-sm font-bold text-blue-600">{c.interest}%</p>
                        </div>
                        <div className="text-center">
                            <p className="text-[9px] font-bold text-gray-400 uppercase">Date Taken</p>
                            <p className="text-sm font-bold text-slate-700">{c.dateTaken || 'No Date'}</p>
                        </div>
                    </div>

                    <div className="flex justify-between items-center mt-4 px-1">
                        <p className="text-[10px] text-red-400 font-bold">DUE: {c.datePaid || 'Pending'}</p>
                        <button onClick={() => {if(confirm("Delete Profile?")) db.ref(`clients/${c.id}`).remove()}} className="text-[10px] text-gray-300 hover:text-red-500 transition font-bold uppercase">Delete</button>
                    </div>
                </div>
            );
        })}
    </div>
)}
    </script>
</body>
</html>

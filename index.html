<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
/**
 * Net Ten Ltd - Final Integrated Management System
 * Version: 13.2 - THE "ULTIMATE" BUILD
 */

const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [modalSubView, setModalSubView] = React.useState('pay'); 
    const [searchTerm, setSearchTerm] = React.useState('');

    React.useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    if (data?.popupMsg) {
                        alert(`MESSAGE FROM ADMIN: ${data.popupMsg}`);
                        db.ref(`users/${u.uid}/popupMsg`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else { setView('login'); }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- NEW ACTIONS (DELETE) ---
    const handleDeletePortfolio = (id) => {
        if(confirm("DANGER: Delete this entire portfolio? All history will be lost.")) {
            db.ref(`clients/${id}`).remove();
        }
    };

    const handleDeleteHistory = (clientId, index) => {
        if(confirm("Remove this transaction record from the ledger?")) {
            const client = clients.find(c => c.id === clientId);
            const newHistory = [...client.history];
            newHistory.splice(index, 1);
            db.ref(`clients/${clientId}/history`).set(newHistory);
        }
    };

    const stats = (() => {
        let totalOwed = 0;
        clients.forEach(c => totalOwed += parseFloat(c.interestAmount || 0));
        return { owed: totalOwed, accounts: pendingUsers.length, loans: requests.filter(r => r.status === 'Pending').length };
    })();

    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 text-[12px]">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Login Failed"); }
                    }} className="space-y-4">
                        <h2 className="text-white font-black uppercase italic mb-4">Secure Access</h2>
                        <input name="email" type="email" placeholder="Email" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                        <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Log In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[12px]">
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col transition-all duration-300 overflow-hidden`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios</button>
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📜 Ledger History</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>➕ Onboard Portfolio</button>
                            <button onClick={() => setView('inbox_accounts')} className="w-full text-left px-8 py-4 font-black uppercase italic text-slate-400">Requests ({stats.accounts})</button>
                        </>
                    ) : (
                        <button onClick={() => setView('client_home')} className="w-full text-left px-8 py-4 font-black uppercase text-white bg-slate-800">🏠 Dashboard</button>
                    )}
                </nav>
                <div className="p-6 border-t border-slate-800 min-w-[250px]">
                    <button onClick={() => auth.signOut()} className="w-full py-4 bg-red-600 text-white rounded-xl font-black uppercase">Sign Out</button>
                </div>
            </aside>

            <main className="flex-1 overflow-y-auto">
                <header className="p-6 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between sticky top-0 z-40">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-white bg-slate-800 px-4 py-2 rounded-lg font-bold">Toggle Menu</button>
                    <span className="text-white font-black uppercase italic text-xs">{user.email}</span>
                </header>

                <div className="p-8">
                    {isAdmin && view === 'home' && (
                        <div className="max-w-6xl mx-auto">
                            <div className="bg-gradient-to-r from-blue-900 to-slate-800 p-8 rounded-[30px] border border-blue-500/30 flex justify-between items-center mb-8 shadow-2xl">
                                <div>
                                    <h2 className="text-blue-400 font-black uppercase text-[10px] mb-1 tracking-widest">Master Portfolio Value</h2>
                                    <p className="text-white text-5xl font-black italic">${stats.owed.toLocaleString()}</p>
                                </div>
                            </div>

                            <input type="text" placeholder="Search client name..." className="w-full p-4 bg-[#1e293b] rounded-xl text-white border border-slate-700 mb-8" onChange={e => setSearchTerm(e.target.value)} />

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-6 rounded-[30px] border border-slate-700 relative">
                                        <div className="flex justify-between mb-4">
                                            <h3 className="text-white font-black uppercase text-lg">{c.name}</h3>
                                            <button onClick={() => handleDeletePortfolio(c.id)} className="text-red-500 font-bold bg-red-900/20 px-2 py-1 rounded">🗑 DELETE</button>
                                        </div>
                                        <p className="text-green-400 text-4xl font-black italic mb-4">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">💸 Loan Disbursement</button>
                                            <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">✅ Record Pay</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {isAdmin && view === 'master_history' && (
                        <div className="max-w-4xl mx-auto bg-[#1e293b] p-8 rounded-[30px] border border-slate-700">
                            <h2 className="text-white text-xl font-black uppercase italic mb-6">Ledger Master History</h2>
                            <div className="space-y-2">
                                {clients.flatMap(c => (c.history || []).map((h, i) => ({...h, name: c.name, clientId: c.id, index: i}))).sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                    <div key={i} className="p-4 bg-[#0f172a] rounded-xl flex justify-between items-center text-white border border-slate-800">
                                        <div className="flex items-center gap-4">
                                            <button onClick={() => handleDeleteHistory(h.clientId, h.index)} className="text-red-500">🗑</button>
                                            <div>
                                                <p className="font-bold">{h.name}</p>
                                                <p className="text-slate-500 text-[10px] uppercase">{h.date} • {h.method}</p>
                                            </div>
                                        </div>
                                        <span className={`font-black text-lg ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>
                                            {h.type === 'Payment' ? '-' : '+'}${h.amount}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {isAdmin && view === 'add' && (
                        <div className="max-w-2xl mx-auto bg-[#1e293b] p-8 rounded-[30px] border border-slate-700">
                            <h2 className="text-white text-xl font-black uppercase italic mb-6">New Client Onboarding</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const total = parseFloat(d.principal) + parseFloat(d.interestAmt);
                                const hist = [{amount: total, date: d.dateBorrowed, type: "Disbursement", method: "Setup", timestamp: Date.now()}];
                                await db.ref('clients').push({...d, interestAmount: total, history: hist, status: 'Active'});
                                alert("Success!"); setView('home');
                            }} className="grid grid-cols-2 gap-4">
                                <input name="name" placeholder="Name" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                                <input name="email" placeholder="Email" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                                <input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                                <input name="dateBorrowed" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                                <input name="dueDate" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                                <input name="principal" placeholder="Principal ($)" type="number" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                                <input name="interestAmt" placeholder="Interest ($)" type="number" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                                <button className="col-span-2 bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Activate Portfolio</button>
                            </form>
                        </div>
                    )}

                    {!isAdmin && view === 'client_home' && clientData && (
                        <div className="max-w-md mx-auto text-center">
                            <div className="bg-[#1e293b] p-12 rounded-[50px] border border-slate-700 shadow-2xl">
                                <p className="text-slate-500 uppercase font-black text-xs tracking-widest">Total Amount Owed</p>
                                <h1 className="text-7xl font-black text-green-400 italic my-6">${parseFloat(clientData.interestAmount || 0).toFixed(2)}</h1>
                                <p className="text-white font-bold uppercase text-[10px]">Next Due Date: {clientData.dueDate}</p>
                            </div>
                        </div>
                    )}
                </div>
            </main>

            {/* TRANSACTION MODAL */}
            {payingClient && (
                <div className="fixed inset-0 bg-black/95 z-[999] flex items-center justify-center p-6 backdrop-blur-md text-[12px]">
                    <div className="bg-[#1e293b] p-10 rounded-[40px] w-full max-w-lg border border-slate-700 shadow-2xl">
                        <h2 className="text-white text-center font-black uppercase italic mb-8 border-b border-slate-800 pb-4">
                            {modalSubView === 'loan' ? '💸 DISBURSEMENT TERMINAL' : '✅ COLLECTION TERMINAL'}
                        </h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            const current = parseFloat(payingClient.interestAmount || 0);
                            const updated = modalSubView === 'loan' ? current + amt : current - amt;
                            
                            const h = { 
                                amount: amt, 
                                date: d.date, 
                                type: modalSubView === 'loan' ? 'Disbursement' : 'Payment', 
                                method: d.method, 
                                timestamp: Date.now() 
                            };
                            
                            let up = { interestAmount: Math.max(0, updated), history: [...(payingClient.history || []), h] };
                            if(modalSubView === 'loan' && d.newDue) up.dueDate = d.newDue;
                            
                            await db.ref(`clients/${payingClient.id}`).update(up);
                            setPayingClient(null);
                        }} className="space-y-4">
                            <div className="relative">
                                <label className="text-slate-500 text-[8px] uppercase font-bold ml-2">Transaction Amount</label>
                                <input id="m_amt" name="amount" type="number" step="0.01" placeholder="0.00" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-4xl font-black border border-slate-700" required />
                                {modalSubView === 'pay' && <button type="button" onClick={() => document.getElementById('m_amt').value = payingClient.interestAmount} className="absolute right-4 top-[38px] bg-green-600 text-white px-3 py-1 rounded text-[9px] font-black">FULL PAYOFF</button>}
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-slate-500 text-[8px] uppercase font-bold ml-2">Trans. Date</label><input name="date" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required /></div>
                                {modalSubView === 'loan' && (<div><label className="text-slate-500 text-[8px] uppercase font-bold ml-2">New Due Date</label><input name="newDue" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required /></div>)}
                            </div>

                            <div>
                                <label className="text-slate-500 text-[8px] uppercase font-bold ml-2">
                                    {modalSubView === 'loan' ? 'How was loan given?' : 'How was payment made?'}
                                </label>
                                <select name="method" className="w-full p-4 bg-[#0f172a] rounded-xl text-white font-bold uppercase border border-slate-700">
                                    {modalSubView === 'loan' ? (
                                        <>
                                            <option value="Face-to-Face">Face-to-Face (Cash/Check)</option>
                                            <option value="Online Transfer">Online Transfer</option>
                                        </>
                                    ) : (
                                        <>
                                            <option value="NCB Transfer">NCB Transfer</option>
                                            <option value="Cash">Cash Handover</option>
                                            <option value="Other Bank">Other Bank</option>
                                        </>
                                    )}
                                </select>
                            </div>

                            <button className={`w-full text-white font-black py-5 rounded-2xl uppercase shadow-xl mt-4 ${modalSubView === 'loan' ? 'bg-blue-600' : 'bg-green-600'}`}>
                                {modalSubView === 'loan' ? 'Authorize Disbursement' : 'Authorize Collection'}
                            </button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 uppercase font-black py-2">Close Window</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
/**
 * Net Ten Ltd - Complete Management System
 * Version: 14.7 - THE TOTAL RESTORATION (Admin Sync, E-Sign & Camera Capture)
 */

const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

// --- INITIALIZE FIREBASE once ---
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
// CHANGE 1: Admin email nettenltd@gmail.com
const ADMIN_EMAIL = "nettenltd@gmail.com";

const App = () => {
    // --- GLOBAL STATES ---
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    
    // Data States
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    
    // Modals & Interaction States
    const [payingClient, setPayingClient] = React.useState(null); // Disbursement/Payment Modal
    const [modalSubView, setModalSubView] = React.useState('pay'); // 'pay' or 'loan'
    
    // CHANGE 2 state: Admin Portfolio Edit state
    const [editingClient, setEditingClient] = React.useState(null); 
    
    // UI Filtering/Config
    const [searchTerm, setSearchTerm] = React.useState('');

    // --- CORE DATA LISTENERS ---
    React.useEffect(() => {
        // Auth Observer
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                // Listen to current user profile details
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    // 3 (Client Dashboard Feature). popup Notifications pop up on dashboard
                    if (data?.popupMsg) {
                        alert(`MESSAGE FROM NET TEN: ${data.popupMsg}`);
                        db.ref(`users/${u.uid}/popupMsg`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else {
                setView('login');
            }
        });

        // Restore: Master History Data Sync
        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        // Restore: Loan Requests Inbox Data Sync
        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        // Restore: Account Requests Inbox Data Sync
        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);
    // Notification list for client (approvals/denials/reasons)
    const clientNotifications = requests.filter(r => r.email === user?.email) || [];

    // --- ANALYTICS LOGIC (Concept fixed) ---
    const calculateCoreStats = () => {
        let totalPrincipal = 0;
        let totalOwed = 0; // automatic calculator that calculates all amount owed current

        clients.forEach(c => {
            totalPrincipal += parseFloat(c.principal || 0);
            totalOwed += parseFloat(c.interestAmount || 0);
        });

        return { 
            issued: totalPrincipal, 
            owed: totalOwed, 
            accounts: pendingUsers.length, 
            loansInbox: requests.filter(r => r.status === 'Pending').length,
            overdue: clients.filter(c => c.status === 'Overdue').length,
            paid: clients.filter(c => c.status === 'Paid').length
        };
    };

    const stats = calculateCoreStats();

    // ==========================================
    // AUTH VIEWS (LOGIN / REGISTER)
    // ==========================================
    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 font-sans">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { 
                                // 13. Login should only have email and password
                                await auth.signInWithEmailAndPassword(d.email, d.password); 
                            } catch(err) { alert("Authentication Failed. Check Credentials."); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-lg mb-4">Secure Terminal</h2>
                            <input name="email" type="text" placeholder="Username (Email)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg hover:bg-blue-500 transition-all">Authorize Securely</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto hover:text-white transition-colors">New? Register Access Request</button>
                        </form>
                    ) : (
                        // 12. Signup logic with detailed information
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            // Send data to Winston for approval
                            await db.ref('pending_registrations').push({...d, status: 'pending', timestamp: Date.now()});
                            alert("Access Request Received. Winston will create your profile shortly.");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-center text-lg mb-4">Access Application</h2>
                            <input name="username" placeholder="Full Username" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Valid Email Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <div className="space-y-1"><label className="text-[9px] text-slate-500 font-black uppercase ml-2">Date of Birth</label><input name="dob" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required /></div>
                            <input name="password" type="password" placeholder="Create Access Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase hover:bg-green-500 transition-all">Submit Secure Onboarding</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto text-center hover:text-white">Cancel Onboarding</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[10px]">
            {/* SIDEBAR (Collapsible as requested Concept preserved) */}
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden relative`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Net Ten</h1>
                </div>
                
                <nav className="py-6 flex-1 overflow-y-auto min-w-[250px]">
                    {isAdmin ? (
                        <>
                            {/* RESTORED: Admin Sidebar Nav */}
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📂 Portfolios Dashboard</button>
                            {/* RESTORED: Master History Nav */}
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📜 Master History</button>
                            {/* RESTORED: Add New Portfolio Nav */}
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>➕ Onboard New Portfolio</button>
                            {/* RESTORED: Inboxes with Notifications */}
                            <button onClick={() => setView('inbox_accounts')} className="w-full text-left px-8 py-4 font-black uppercase italic text-slate-400 flex justify-between items-center hover:text-white transition-colors">
                                👤 Account Requests
                                {stats.accounts > 0 && <span className="bg-green-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-lg">{stats.accounts}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className="w-full text-left px-8 py-4 font-black uppercase italic text-slate-400 flex justify-between items-center hover:text-white transition-colors">
                                💰 Loan Requests
                                {stats.loansInbox > 0 && <span className="bg-blue-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-lg">{stats.loansInbox}</span>}
                            </button>
                            {/* RESTORED: Visual Analytics Nav */}
                            <button onClick={() => setView('analytics')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'analytics' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📊 BI Analytics</button>
                        </>
                    ) : (
                        <>
                            {/* Client Sidebar Nav (Synced from client perfect build) */}
                            <button onClick={() => setView('client_home')} className={`w-full text-left px-8 py-4 font-black uppercase ${view === 'client_home' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>🏠 Dashboard</button>
                            <button onClick={() => setView('client_notifications')} className={`w-full text-left px-8 py-4 font-black uppercase flex justify-between items-center ${view === 'client_notifications' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>
                                🔔 Notifications
                                {clientNotifications.length > 0 && <span className="bg-blue-600 text-white text-[9px] font-black px-2 rounded-full font-bold shadow-xl">!</span>}
                            </button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase ${view === 'client_apply' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>➕ Apply / Top-Up</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase ${view === 'client_pay' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>💳 Record Payment Intent</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase ${view === 'client_profile' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>👤 Security Profile</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 font-black uppercase ${view === 'client_faq' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>❓ Terminal Support</button>
                        </>
                    )}
                </nav>
                {/* 4 (AdminReq). Sign out button present and working */}
                <div className="p-6 border-t border-slate-800 min-w-[250px]">
                    <button onClick={() => auth.signOut()} className="w-full py-4 bg-red-600 text-white rounded-xl font-black uppercase transition-all shadow-xl hover:bg-red-500 hover:scale-105 active:scale-95">Sign Out</button>
                </div>
            </aside>

            <main className="flex-1 overflow-y-auto">
                {/* HEADER */}
                <header className="p-6 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-white bg-slate-800 px-4 py-2 rounded-lg font-bold hover:scale-105 transition-transform text-[9px] uppercase">Menu</button>
                    <span className="text-white font-black uppercase italic tracking-widest text-xs opacity-60">Net Ten Master Terminal v14.7</span>
                </header>

                <div className="p-8">
                    {/* RESTORED: ADMIN VIEWS Dashboard */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-6xl mx-auto space-y-8">
                            {/* Total Portfolio Bar (Concept fixed as requested) */}
                            <div className="bg-gradient-to-r from-blue-900/50 to-slate-800 p-10 rounded-[40px] border border-blue-500/20 shadow-2xl flex justify-between items-center backdrop-blur-md">
                                <div><h2 className="text-blue-400 font-black uppercase text-xs mb-1 tracking-widest">Total Active Portfolio</h2><p className="text-white text-6xl font-black italic tracking-tighter">${stats.owed.toLocaleString()}</p></div>
                                <div className="text-right"><p className="text-slate-500 font-black text-[9px] uppercase">Client Data Management Hub</p></div>
                            </div>
                            
                            <input type="text" placeholder="Filter portfolios (by name)..." className="w-full p-5 bg-[#1e293b] rounded-2xl text-white border border-slate-700 outline-none focus:border-blue-600 transition-colors" onChange={e => setSearchTerm(e.target.value)} />
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-6 rounded-[30px] border border-slate-700 space-y-4 hover:border-slate-500 transition-all flex flex-col shadow-xl">
                                        <div className="flex justify-between items-start">
                                            <h3 className="text-white font-black uppercase text-lg tracking-tight truncate">{c.name}</h3>
                                            {/* CHANGE 2: Portfolio Details/Edit button */}
                                            <button onClick={() => setEditingClient(c)} className="text-blue-400 font-bold uppercase text-[9px] border border-blue-900/50 px-2 py-1 rounded hover:bg-blue-900/20 transition-colors">Details/Edit</button>
                                        </div>
                                        {/* Status Indicators and Note button from concept build */}
                                        <div className="flex gap-1 justify-between items-center">
                                            <div className="flex gap-1">
                                                <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Paid'})} className="px-2 py-0.5 bg-green-950 text-green-300 rounded text-[9px] font-black uppercase italic border border-green-800/30">Paid</button>
                                                <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Overdue'})} className="px-2 py-0.5 bg-red-950 text-red-300 rounded text-[9px] font-black uppercase italic border border-red-800/30">Overdue</button>
                                                <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Defaulted'})} className="px-2 py-0.5 bg-slate-950 text-slate-400 rounded text-[9px] font-black uppercase italic border border-slate-800/30">Default</button>
                                            </div>
                                            {/* 7 (AdminReq). Envelope button working as specified - Note icon bell Concept */}
                                            <button onClick={() => {
                                                const msg = prompt(`Note for ${c.name}:`);
                                                if(msg) db.ref(`users`).orderByChild('email').equalTo(c.email).once('value', s => {
                                                    if(s.exists()){ const uid = Object.keys(s.val())[0]; db.ref(`users/${uid}/popupMsg`).set(msg); alert("Secure Note Dispatched."); }
                                                });
                                            }} className="text-blue-400 opacity-60 text-base">🔔</button>
                                        </div>
                                        
                                        <div className="flex-1 space-y-4 pt-2">
                                            <p className="text-green-400 text-5xl font-black italic tracking-tighter">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                            {/* Onboard details captured here explicitly */}
                                            <div className="text-slate-400 text-[9px] uppercase font-bold grid grid-cols-2 gap-1">
                                                <p>📅 Borrowed: {c.dateBorrowed}</p>
                                                <p>📅 Due: {c.dueDate}</p>
                                                <p>🔄 Type: {c.type}</p>
                                                <p>💰 Principal: ${parseFloat(c.principal || 0).toFixed(0)}</p>
                                            </div>
                                        </div>
                                        
                                        <div className="flex gap-2 pt-2 border-t border-slate-800">
                                            <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-[10px] hover:bg-blue-500 active:scale-95 transition-all shadow-md">💸 Top-Up / New</button>
                                            <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-xl font-black uppercase text-[10px] hover:bg-green-500 active:scale-95 transition-all shadow-md">✅ Record Pay</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* RESTORED: MASTER HISTORY VIEW */}
                    {isAdmin && view === 'master_history' && (
                        <div className="max-w-4xl mx-auto bg-[#1e293b] p-8 rounded-[30px] border border-slate-700 text-white shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-8 border-b border-slate-800 pb-4 text-center tracking-widest text-blue-400">Master History Terminal (past data logical flow preserved)</h2>
                            <div className="space-y-3">
                                {clients.flatMap(c => (c.history || []).map((h, i) => ({...h, name: c.name, clientId: c.id, index: i}))).sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                    <div key={i} className="p-5 bg-[#0f172a] rounded-xl border border-slate-800 flex justify-between items-center shadow-inner hover:border-slate-700 transition-colors">
                                        <div className="flex items-center gap-4">
                                            {/* History Delete logical flow Concept preserved from 13.0 splice */}
                                            <button onClick={() => {
                                                if(confirm(`DANGER: REMOVE TRANSACTION RECORD? ($${h.amount} - ${h.name})`)) {
                                                    const cl = clients.find(cl => cl.id === h.clientId);
                                                    const nh = [...cl.history]; nh.splice(h.index, 1);
                                                    db.ref(`clients/${h.clientId}/history`).set(nh);
                                                }
                                            }} className="text-red-600 font-bold opacity-70 hover:opacity-100 transition-opacity">🗑</button>
                                            
                                            <div>
                                                <p className="font-bold text-lg">{h.name}</p>
                                                <p className="text-slate-400 text-[10px] uppercase font-black tracking-wider opacity-70">{h.date} • {h.type} • {h.method}</p>
                                                {/* CHANGE 4 display: Signature display in history */}
                                                {h.method === "Face-to-Face" && h.signature && (
                                                    <div className="mt-2 border border-slate-800 rounded p-1 bg-white inline-block">
                                                        <img src={h.signature} className="h-6" alt="Client e-Signature" />
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <span className={`font-black text-xl italic tracking-tight ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>{h.type === 'Payment' ? '-' : '+'}${parseFloat(h.amount).toFixed(2)}</span>
                                    </div>
                                ))}
                                {clients.flatMap(c => (c.history || [])).length === 0 && <p className="text-center text-slate-600 font-black uppercase italic p-12 opacity-60">Terminal History Ledger is Empty</p>}
                            </div>
                        </div>
                    )}

                    {/* RESTORED: ACCOUNT REQUESTS INBOX */}
                    {isAdmin && view === 'inbox_accounts' && (
                        <div className="max-w-4xl mx-auto space-y-6 text-white">
                            <h2 className="text-white text-2xl font-black uppercase italic mb-8 text-center underline underline-offset-8">Onboarding Requests</h2>
                            {pendingUsers.map(u => (
                                <div key={u.id} className="bg-[#1e293b] p-8 rounded-3xl mb-4 border border-slate-700 flex justify-between items-center shadow-xl hover:border-green-600/30 transition-colors">
                                    {/* Signup details explicitly shown Concept preserved */}
                                    <div className="space-y-1">
                                        <p className="font-black uppercase tracking-tight text-xl">{u.username} <span className="text-slate-500 font-normal">| {u.email}</span></p>
                                        <p className="text-[10px] text-slate-400 uppercase font-bold flex gap-4"><span>📅 DOB: {u.dob}</span> <span>📞 TEL: {u.phone}</span></p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={async () => {
                                            try {
                                                const res = await auth.createUserWithEmailAndPassword(u.email, u.password);
                                                // Create profile in DB so they can log in
                                                await db.ref(`users/${res.user.uid}`).set({email: u.email, role: 'client', ...u});
                                                await db.ref(`pending_registrations/${u.id}`).remove();
                                                alert(`User Approved: ${u.username}. They may now access their terminal.`);
                                            } catch(e) { alert("ERROR CREATING USER: " + e.message); }
                                        }} className="bg-green-600 px-6 py-3 rounded-xl font-black uppercase italic tracking-wider hover:bg-green-500 transition-all active:scale-95 shadow-lg">Approve Profile</button>
                                        <button onClick={() => { if(confirm("REMOVE REQUEST?")) db.ref(`pending_registrations/${u.id}`).remove(); }} className="bg-slate-800 text-red-400 border border-red-950 px-6 py-3 rounded-xl font-black uppercase hover:bg-red-950 transition-all">Dismiss</button>
                                    </div>
                                </div>
                            ))}
                            {pendingUsers.length === 0 && <p className="text-center text-slate-600 uppercase font-black italic p-12 opacity-60">Account Request Inbox is Empty</p>}
                        </div>
                    )}

                    {/* RESTORED: LOAN REQUESTS INBOX (concept fixed counter badges badge counter) */}
                    {isAdmin && view === 'inbox_loans' && (

                            const amt = parseFloat(d.amount);
                            const current = parseFloat(payingClient.interestAmount || 0);
                            const updated = modalSubView === 'loan' ? current + amt : current - amt;
                            
                            const h = { amount: amt, date: d.date, type: modalSubView === 'loan' ? 'Disbursement' : 'Payment', method: d.method, timestamp: Date.now() };
                            
                            // CHANGE 4 logic: Capture signature as base64 string from canvas canvas canvas canvas canvas canvas
                            if(modalSubView === 'loan' && d.method === "Face-to-Face") {
                                const canvas = document.getElementById('esignCanvas');
                                if(canvas) {
                                    // Base64 image data data data data data data data data data data data data data data data data data data
                                    const signatureDataUrl = canvas.toDataURL();
                                    h.signature = signatureDataUrl; 
                                }
                            }

                            let up = { interestAmount: Math.max(0, updated), history: [...(payingClient.history || []), h] };
                            if(modalSubView === 'loan' && d.newDue) up.dueDate = d.newDue;
                            
                            await db.ref(`clients/${payingClient.id}`).update(up);
                            setPayingClient(null); alert("Transaction Signed & Processing Securely Securely Securely Securely.");
                        }} className="space-y-4">
                            <div className="relative">
                                <input id="m_amt" name="amount" type="number" step="0.01" placeholder="0.00" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-5xl font-black border border-slate-700 text-right outline-none pr-32" required />
                                {/* 6 & 9 (AdminReq). Full payoff button working explicitly explicitly explicitly */}
                                {modalSubView === 'pay' && <button type="button" onClick={() => document.getElementById('m_amt').value = payingClient.interestAmount} className="absolute left-6 top-[32px] bg-green-600 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase shadow-lg italic">Full Payoff Owed Owed owed</button>}
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1"><label className="text-slate-500 text-[8px] uppercase font-bold ml-2">Transaction Date</label><input name="date" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 text-white" required /></div>
                                {modalSubView === 'loan' && (<div className="space-y-1"><label className="text-slate-500 text-[8px] uppercase font-bold ml-2">New Repayment Due Date Owed</label><input name="newDue" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 text-white" required /></div>)}
                            </div>
                            
                            <div>
                                <label className="text-slate-500 text-[8px] uppercase font-bold ml-2">{modalSubView === 'loan' ? 'Disbursement Taken By Taken By Taken By Taken By' : 'Collection Method Made Made made Made made'}</label>
                                {/* CHANGE 3: ref ref text refined defined changed defined defined defined changed changed defined defined text refined text refined changed ref */}
                                <select id="m_method" name="method" onChange={() => setModalSubView(document.getElementById('m_method').value === "Disbursement" ? "loan" : "pay") /* Safety sync sync sync Concept fixed fixed */} className="w-full p-4 bg-[#0f172a] rounded-xl text-white font-bold uppercase border border-slate-700 outline-none" required>
                                    {modalSubView === 'loan' ? (
                                        <><option value="Face-to-Face">🤝 Face-to-Face (esign opt)</option><option value="Online Transfer">🌐 Online Transfer (instead instead changed)</option></>
                                    ) : (
                                        <><option value="NCB Transfer">NCB Transfer (Instead)</option><option value="Cash">Cash Handover made handover made handed Made Handover</option></>
                                    )}
                                </select>
                            </div>
                            
                            {/* CHANGE 4 elements: esign pad elements elements elements elements pad elements pad elements elements pad elements elements pad */}
                            {modalSubView === 'loan' && payingClient && (
                                <div className="p-3 bg-[#0f172a] rounded-xl border border-slate-700 space-y-2">
                                    <p className="text-[8px] text-slate-500 uppercase font-black ml-1">Optional esign attachment (Face-to-Face)</p>
                                    <canvas id="esignCanvas" width="350" height="80" className="bg-white rounded border border-slate-700 cursor-crosshair h-20 w-full" onMouseDown={(e) => {
                                        const canvas = document.getElementById('esignCanvas');
                                        const ctx = canvas.getContext('2d');
                                        ctx.beginPath();
                                        // Adjust for canvas border offset offset offset offset offset offset offset offset
                                        const rect = canvas.getBoundingClientRect();
                                        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
                                        canvas.isDrawing = true;
                                    }} onMouseMove={(e) => {
                                        const canvas = document.getElementById('esignCanvas');
                                        if(!canvas.isDrawing) return;
                                        const ctx = canvas.getContext('2d');
                                        ctx.lineWidth = 2; ctx.strokeStyle = "black";
                                        const rect = canvas.getBoundingClientRect();
                                        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                                        ctx.stroke();
                                    }} onMouseUp={() => {
                                        document.getElementById('esignCanvas').isDrawing = false;
                                    }} onMouseOut={() => {
                                        document.getElementById('esignCanvas').isDrawing = false;
                                    }}></canvas>
                                    <button type="button" onClick={() => {
                                        const canvas = document.getElementById('esignCanvas');
                                        if(canvas) canvas.getContext('2d').clearRect(0,0, canvas.width, canvas.height);
                                    }} className="text-[9px] font-black uppercase text-slate-500 hover:text-red-400">Clear padPadPadpadpad</button>
                                </div>
                            )}

                            <div className="flex gap-4 pt-4 border-t border-slate-800 mt-2">
                                <button className={`flex-1 text-white font-black py-4 rounded-xl uppercase active:scale-95 transition-all shadow-xl hover:scale-105 italic tracking-widest ${modalSubView === 'loan' ? 'bg-blue-600' : 'bg-green-600'}`}>Sign & commit transaction Process Terminal Process</button>
                                <button type="button" onClick={() => setPayingClient(null)} className="flex-1 text-slate-500 uppercase font-black py-4">Dismiss terminal</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [searchTerm, setSearchTerm] = React.useState('');
    
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    const [clientSubView, setClientSubView] = React.useState('overview'); 
    
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');

    // Shared UI state
    const [tempPrincipal, setTempPrincipal] = React.useState('');
    const [tempInterest, setTempInterest] = React.useState('');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
            setUser(u);
            if (!u) setLoading(false);
        });
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
            setLoading(false);
        });
        return () => { unsubscribe(); clientsRef.off(); };
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        let finalEmail = loginId.includes('@') ? loginId : `${loginId.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();
        auth.signInWithEmailAndPassword(finalEmail, password).catch(err => alert("Login failed."));
    };

    const isAdmin = user?.email === ADMIN_EMAIL;
    const currentClient = !isAdmin ? clients.find(c => c.email?.toLowerCase() === user?.email?.toLowerCase()) : null;

    const handlePrincipalCalc = (val) => {
        setTempPrincipal(val);
        const num = parseFloat(val);
        if(!isNaN(num)) {
            setTempInterest((num + (num * 0.25)).toFixed(2));
        } else { setTempInterest(''); }
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4" />
                    <h1 className="text-3xl font-black text-blue-400 mb-2 uppercase italic tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleLogin} className="space-y-4 mt-6">
                        <input type="text" placeholder="Admin ID / Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setLoginId(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Sign In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200">
            <header className="p-5 border-b border-slate-700 flex justify-between items-center bg-[#1e293b]/50">
                <h1 className="text-sm font-black text-white uppercase italic">Net Ten Ltd</h1>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    /* ADMIN VIEW */
                    <div>
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Client</button>
                        </nav>
                        
                        {view === 'home' && (
                            <>
                                <input type="text" placeholder="Search..." className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={(e) => setSearchTerm(e.target.value)} />
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4">
                                        <div className="flex justify-between">
                                            <div><h3 className="font-black text-white">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase">DUE: {c.dueDate}</p></div>
                                            <p className="font-black text-xl text-green-400">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                        </div>
                                        {c.clientNote && <div className="mt-2 text-[9px] text-blue-300 italic">Client: {c.clientNote}</div>}
                                        <div className="grid grid-cols-2 gap-2 mt-4">
                                            <button onClick={() => setPayingClient(c)} className="bg-slate-700 text-white py-2 rounded-xl text-[8px] font-black uppercase">Adjust Bal/Loan</button>
                                            <button onClick={() => { const n = prompt("Send note to client:"); if(n) db.ref(`clients/${c.id}`).update({ directMsg: n }); }} className="bg-blue-600 text-white py-2 rounded-xl text-[8px] font-black uppercase">Send Note</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}
                        {/* New Client Form and logic would go here same as previous versions */}
                    </div>
                ) : (
                    /* CLIENT DASHBOARD */
                    <div className="space-y-6">
                        {/* Admin Message Notification */}
                        {currentClient?.directMsg && (
                            <div className="bg-blue-600 p-5 rounded-[32px] shadow-lg animate-bounce border-2 border-white/20">
                                <p className="text-[10px] font-black uppercase text-blue-100 mb-1">Message from Admin:</p>
                                <p className="text-white font-bold italic">"{currentClient.directMsg}"</p>
                            </div>
                        )}

                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 text-center relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><h1 className="text-6xl font-black italic">NET 10</h1></div>
                            <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-2">Current Balance Due</p>
                            <h2 className="text-5xl font-black text-white italic tracking-tighter mb-4">${(parseFloat(currentClient?.interestAmount || 0)).toFixed(2)}</h2>
                            
                            <div className="grid grid-cols-2 gap-4 border-t border-slate-800 pt-6">
                                <div><p className="text-[8px] font-black text-slate-500 uppercase">Borrowed Date</p><p className="text-sm font-bold text-white">{currentClient?.loanDate || 'N/A'}</p></div>
                                <div><p className="text-[8px] font-black text-slate-500 uppercase">Due Date</p><p className="text-sm font-bold text-red-500">{currentClient?.dueDate || 'N/A'}</p></div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={() => {
                                const n = prompt("Message to Admin (Schedule payment or question):");
                                if(n) db.ref(`clients/${currentClient.id}`).update({ clientNote: n });
                                alert("Message sent to Admin!");
                            }} className="bg-[#1e293b] border border-slate-700 p-5 rounded-[32px] text-center">
                                <span className="block text-xl mb-1">💬</span>
                                <span className="text-[9px] font-black text-white uppercase">Contact Admin</span>
                            </button>
                            <a href="tel:8763180099" className="bg-[#1e293b] border border-slate-700 p-5 rounded-[32px] text-center block">
                                <span className="block text-xl mb-1">💳</span>
                                <span className="text-[9px] font-black text-white uppercase">Pay Online</span>
                            </a>
                        </div>

                        <button onClick={() => {
                            db.ref(`clients/${currentClient.id}`).update({ clientNote: "Requesting Face-to-Face Payment Meeting." });
                            alert("Meeting request sent to Admin!");
                        }} className="w-full bg-green-600 text-white font-black py-5 rounded-[32px] uppercase shadow-xl">
                            Schedule Face-To-Face Pay
                        </button>

                        <div className="pt-4">
                            <h3 className="text-[10px] font-black text-slate-500 uppercase mb-4 text-center tracking-widest">Recent Activity</h3>
                            {(currentClient?.history || []).slice().reverse().map((h, i) => (
                                <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b]/50 rounded-2xl border border-slate-800 mb-2">
                                    <div><p className="text-xs font-black text-white">${h.amount}</p><p className="text-[8px] text-slate-500 uppercase">{h.date} • {h.method}</p></div>
                                    <span className="text-[7px] font-black uppercase bg-blue-900/30 text-blue-400 px-2 py-1 rounded-full">{h.type}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN ADJUSTMENT MODAL */}
                {payingClient && (
                    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 space-y-6">
                            <div className="flex justify-between border-b border-slate-800">
                                <button onClick={() => setIsNewLoanView(false)} className={`pb-2 text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Record Pay</button>
                                <button onClick={() => setIsNewLoanView(true)} className={`pb-2 text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>Add New Loan</button>
                            </div>
                            
                            {!isNewLoanView ? (
                                <div className="space-y-4">
                                    <input type="number" placeholder="Payment Amount" id="adminPayAmt" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xl font-black outline-none border border-slate-700" />
                                    <button onClick={() => {
                                        const amt = parseFloat(document.getElementById('adminPayAmt').value); if(!amt) return;
                                        const h = { amount: amt, date: new Date().toISOString().split('T')[0], method: "Manual", type: "Payment", timestamp: Date.now() };
                                        db.ref(`clients/${payingClient.id}`).update({ 
                                            interestAmount: Math.max(0, (payingClient.interestAmount || 0) - amt),
                                            history: [...(payingClient.history || []), h] 
                                        });
                                        setPayingClient(null);
                                    }} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Confirm Receipt</button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <input type="number" placeholder="Principal" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white font-black border border-slate-700 outline-none" />
                                    <div className="p-4 bg-green-900/10 rounded-2xl border border-green-900/20 text-center"><p className="text-[8px] font-black uppercase text-green-500">New Balance Addition</p><p className="text-xl font-black text-white">${tempInterest || '0.00'}</p></div>
                                    <button onClick={() => {
                                        const i = parseFloat(tempInterest || 0); if(!i) return;
                                        db.ref(`clients/${payingClient.id}`).update({ interestAmount: (payingClient.interestAmount || 0) + i });
                                        setPayingClient(null);
                                    }} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase">Add to Portfolio</button>
                                </div>
                            )}
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Close</button>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

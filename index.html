        auth.onAuthStateChanged(u => setUser(u));

            setClients(list);
        });

        try {
            await db.ref('clients').push({
                ...data,
                email: userEmail,
                amountOwed: parseFloat(data.amountOwed || 0),

            });

// Logic for the Cash Flow Calculator
const calculateTotals = () => {
    return clients.reduce((acc, c) => {
        const principal = parseFloat(c.amountOwed || 0);
        const extra = parseFloat(c.additionalFunds || 0);
        return {
            principal: acc.principal + principal,
            extra: acc.extra + extra,
            total: acc.total + principal + extra
        };
    }, { principal: 0, extra: 0, total: 0 });
};

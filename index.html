<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [historySearch, setHistorySearch] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
    }, []);

    // --- REWORKED CALCULATORS ---
    
    // 1. Current Portfolios Total (What is owed to you right now)
    const totalOwedNow = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0);
    
    // 2. Interest Collected Total (Everything that was a "Payment")
    // We check for type "Payment" OR any entry that resulted in a balance decrease
    const allHistory = clients.flatMap(c => (c.history || []).map(h => ({...h, cName: c.name})));
    const totalCollected = allHistory
        .filter(h => h.type === "Payment" || h.type === "PAYMENT")
        .reduce((acc, h) => acc + (parseFloat(h.amount) || 0), 0);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        if(!isNaN(num)) setTempInterest((num + (num * 0.25)).toFixed(2));
        else setTempInterest('');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700">
                    <h1 className="text-3xl font-black text-blue-400 mb-6 italic text-center tracking-tighter">NET TEN LTD</h1>
                    <form onSubmit={(e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        auth.signInWithEmailAndPassword(d.id, d.password).catch(() => alert("Login failed."));
                    }} className="space-y-4">
                        <input name="id" placeholder="Admin ID" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Login</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200">
            <header className="p-5 border-b border-slate-700 flex justify-between items-center bg-[#1e293b]">
                <h1 className="text-sm font-black text-white italic tracking-tighter">NET TEN LTD</h1>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                    <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                    <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Interest Collected</button>
                    <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Loan</button>
                </nav>

                {view === 'home' && (
                    <>
                        <div className="bg-blue-600/10 border border-blue-600/20 p-6 rounded-[32px] mb-6 text-center">
                            <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1">Total Amount Owed</p>
                            <p className="text-4xl font-black text-white tracking-tighter">${totalOwedNow.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                        </div>
                        <input type="text" placeholder="Search portfolios..." className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setSearchTerm(e.target.value)} />
                        {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                            <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-xl">
                                <div className="flex justify-between items-start">
                                    <div><h3 className="font-black text-white">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase">{c.dueDate || 'No Date'}</p></div>
                                    <p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-2 mt-4">
                                    <button onClick={() => { setPayingClient(c); setIsNewLoanView(false); }} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[9px] uppercase">Adjust</button>
                                    <button onClick={() => { if(confirm("Delete?")) db.ref(`clients/${c.id}`).remove(); }} className="bg-red-900/10 text-red-500 py-3 rounded-xl font-bold text-[9px] uppercase border border-red-900/50">Delete</button>
                                </div>
                            </div>
                        ))}
                    </>
                )}

                {view === 'history' && (
                    <>
                        <div className="bg-green-600/10 border border-green-600/20 p-6 rounded-[32px] mb-6 text-center">
                            <p className="text-[10px] font-black text-green-400 uppercase tracking-widest mb-1">Total Collected</p>
                            <p className="text-4xl font-black text-white tracking-tighter">${totalCollected.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                        </div>
                        <input type="text" placeholder="Filter names..." className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setHistorySearch(e.target.value)} />
                        <div className="space-y-3">
                            {allHistory.filter(h => h.cName?.toLowerCase().includes(historySearch.toLowerCase()))
                            .sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b] rounded-2xl border border-slate-800">
                                    <div>
                                        <p className="text-white font-black text-[10px] uppercase">{h.cName}</p>
                                        <p className="text-[7px] text-slate-500 uppercase">{h.date} • {h.method || 'CASH'}</p>
                                    </div>
                                    <p className={`font-black text-xs ${h.type === "Payment" ? 'text-green-400' : 'text-red-400'}`}>
                                        {h.type === "Payment" ? '-' : '+'}${parseFloat(h.amount).toFixed(2)}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </>
                )}

                {view === 'add' && (
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        const finalEmail = `${d.phone.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();
                        const h = { amount: parseFloat(d.interestAmount), date: d.loanDate, type: "Loan", timestamp: Date.now() };
                        await db.ref('clients').push({ ...d, email: finalEmail, interestAmount: parseFloat(d.interestAmount), history: [h] });
                        setView('home');
                    }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3">
                        <h2 className="text-sm font-black text-white uppercase italic mb-2">Create New Portfolio</h2>
                        <input name="name" placeholder="Client Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="phone" placeholder="Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <div className="grid grid-cols-2 gap-3">
                            <input name="amountOwed" type="number" placeholder="Principal" onChange={(e) => handlePrincipalCalc(e.target.value)} className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                            <input name="interestAmount" value={tempInterest} placeholder="Total (+25%)" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2">Loan Date</label><input name="loanDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required /></div>
                            <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2">Due Date</label><input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required /></div>
                        </div>
                        <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg mt-4">Save Portfolio</button>
                    </form>
                )}

                {/* ADJUSTMENT MODAL */}
                {payingClient && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 space-y-6 shadow-2xl">
                            <div className="flex justify-between border-b border-slate-800 pb-2">
                                <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Receive Payment</button>
                                <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>New Loan</button>
                            </div>
                            
                            {!isNewLoanView ? (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" id="pDate" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" defaultValue={new Date().toISOString().split('T')[0]} />
                                        <select id="pMethod" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800"><option>CASH</option><option>BANK TRANSFER</option></select>
                                    </div>
                                    <input type="number" placeholder="0.00" id="pAmt" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-4xl font-black text-center border border-slate-700" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => setPayingClient(null)} className="bg-slate-800 text-slate-400 py-4 rounded-2xl font-black text-[10px] uppercase">Cancel</button>
                                        <button onClick={() => {
                                            const amt = parseFloat(document.getElementById('pAmt').value);
                                            if(!amt) return;
                                            const h = { amount: amt, date: document.getElementById('pDate').value, method: document.getElementById('pMethod').value, type: "Payment", timestamp: Date.now() };
                                            db.ref(`clients/${payingClient.id}`).update({ interestAmount: Math.max(0, (parseFloat(payingClient.interestAmount) || 0) - amt), history: [...(payingClient.history || []), h] });
                                            setPayingClient(null);
                                        }} className="bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Record Payment</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" id="lDate" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" defaultValue={new Date().toISOString().split('T')[0]} />
                                        <input type="date" id="lDue" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" placeholder="New Due Date" />
                                    </div>
                                    <input type="number" step="any" placeholder="Principal" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white font-black border border-slate-700" />
                                    <div className="p-4 bg-green-900/10 rounded-2xl text-center border border-green-900/20">
                                        <p className="text-[8px] font-black uppercase text-green-500">Adding to Balance (+25%)</p>
                                        <p className="text-2xl font-black text-white">${tempInterest || '0.00'}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => setPayingClient(null)} className="bg-slate-800 text-slate-400 py-4 rounded-2xl font-black text-[10px] uppercase">Cancel</button>
                                        <button onClick={() => {
                                            const val = parseFloat(tempInterest || 0);
                                            if(!val) return;
                                            const h = { amount: val, date: document.getElementById('lDate').value, type: "Loan", timestamp: Date.now() };
                                            db.ref(`clients/${payingClient.id}`).update({ interestAmount: (parseFloat(payingClient.interestAmount) || 0) + val, dueDate: document.getElementById('lDue').value, history: [...(payingClient.history || []), h] });
                                            setPayingClient(null);
                                        }} className="bg-green-600 text-white font-black py-4 rounded-2xl uppercase">Add Loan</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

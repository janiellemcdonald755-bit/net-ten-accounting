<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
        const firebaseConfig = {
            apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
            authDomain: "net-ten-accounting.firebaseapp.com",
            databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
            projectId: "net-ten-accounting",
            storageBucket: "net-ten-accounting.appspot.com",
            messagingSenderId: "1095937995425",
            appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [view, setView] = React.useState('home'); 
            const [clients, setClients] = React.useState([]);
            
            // Listen for user & data
            React.useEffect(() => {
                auth.onAuthStateChanged(u => setUser(u));
                db.ref('clients').on('value', (snap) => {
                    const data = snap.val();
                    const list = [];
                    if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
                    setClients(list);
                });
            }, []);

            const addClient = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newClient = Object.fromEntries(formData.entries());
                db.ref('clients').push({
                    ...newClient,
                    amountOwed: parseFloat(newClient.amountOwed || 0),
                    interest: parseFloat(newClient.interest || 0),
                    dateAdded: Date.now()
                });
                e.target.reset();
                alert("Client Saved!");
            };

            if (!user) return <div className="p-10 text-center font-bold">Please Login (See previous code for Login UI)</div>;

            return (
                <div className="min-h-screen pb-24">
                    {/* Top Header */}
                    <header className="bg-white p-6 shadow-sm border-b flex justify-between items-center">
                        <h1 className="text-xl font-black text-blue-600 italic">NET TEN ADMIN</h1>
                        <button onClick={() => auth.signOut()} className="text-xs font-bold text-gray-400">Logout</button>
                    </header>

                    <main className="p-4 max-w-lg mx-auto">
                        {/* NAVIGATION TABS */}
                        <div className="flex bg-gray-200 p-1 rounded-xl mb-6">
                            <button onClick={() => setView('home')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${view === 'home' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>Clients</button>
                            <button onClick={() => setView('admin')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${view === 'admin' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>Add New</button>
                        </div>

                        {/* VIEW 1: CLIENT LIST */}
                        {view === 'home' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">Active Portfolios</h2>
                                {clients.length === 0 ? <p className="text-gray-400 italic">No clients yet.</p> : 
                                 clients.map(c => (
                                    <div key={c.id} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-bold text-slate-800">{c.name}</h3>
                                            <span className="bg-green-100 text-green-700 text-[10px] font-black px-2 py-1 rounded-full uppercase italic">Paid: {c.datePaid || 'Pending'}</span>
                                        </div>
                                        <p className="text-xs text-slate-400 mb-4">{c.address}</p>
                                        <div className="grid grid-cols-2 gap-4 border-t pt-4">
                                            <div>
                                                <p className="text-[10px] font-bold text-gray-400 uppercase">Principal Owed</p>
                                                <p className="font-black text-lg text-slate-700">${c.amountOwed.toFixed(2)}</p>
                                            </div>
                                            <div>
                                                <p className="text-[10px] font-bold text-gray-400 uppercase">Interest Rate</p>
                                                <p className="font-black text-lg text-blue-600">{c.interest}%</p>
                                            </div>
                                        </div>
                                    </div>
                                 ))
                                }
                            </div>
                        )}

                        {/* VIEW 2: ADMIN (ADD CLIENT) */}
                        {view === 'admin' && (
                            <form onSubmit={addClient} className="bg-white p-6 rounded-3xl shadow-xl border space-y-4 animate-in fade-in">
                                <h2 className="text-xl font-bold text-slate-800 mb-2">Onboard New Client</h2>
                                <input name="name" placeholder="Full Name" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500" required />
                                <input name="email" type="email" placeholder="Email Address" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none" required />
                                <input name="phone" placeholder="Phone Number" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none" />
                                <textarea name="address" placeholder="Business Address" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none"></textarea>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="amountOwed" type="number" placeholder="Amount Owed ($)" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none" required />
                                    <input name="interest" type="number" placeholder="Interest %" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none" required />
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-400 ml-2">DATE TAKEN</label>
                                        <input name="dateTaken" type="date" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none mt-1" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-400 ml-2">DATE PAID BACK</label>
                                        <input name="datePaid" type="date" className="w-full p-3 bg-slate-50 rounded-xl border-none outline-none mt-1" />
                                    </div>
                                </div>

                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-blue-700 transition transform active:scale-95">
                                    SAVE CLIENT PROFILE
                                </button>
                            </form>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

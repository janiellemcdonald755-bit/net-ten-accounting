<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
            }
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;

    // --- MATH LOGIC ---
    const allHistory = clients.flatMap(c => (c.history || []).map(h => ({...h, cName: c.name, cId: c.id})));
    const totalOwedNow = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0);
    const totalCollected = allHistory.filter(h => h.type === "Payment").reduce((acc, h) => acc + (parseFloat(h.amount) || 0), 0);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700">
                    <h1 className="text-3xl font-black text-blue-400 mb-6 italic text-center">NET TEN LTD</h1>
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        try {
                            if (d.mode === 'register') {
                                const cred = await auth.createUserWithEmailAndPassword(d.email, d.password);
                                await db.ref(`users/${cred.user.uid}`).set({ name: d.name, email: d.email, role: 'client', approved: false });
                            } else {
                                await auth.signInWithEmailAndPassword(d.email, d.password);
                            }
                        } catch (err) { alert(err.message); }
                    }} className="space-y-4">
                        <input name="name" placeholder="Full Name (For Register)" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" />
                        <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <div className="flex gap-2">
                            <button name="mode" value="login" className="flex-1 bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Login</button>
                            <button name="mode" value="register" className="flex-1 border border-slate-600 text-white font-black py-4 rounded-2xl uppercase">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        );
    }

    if (isAdmin) {
        return (
            <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200">
                <header className="p-5 border-b border-slate-700 flex justify-between items-center bg-[#1e293b]">
                    <h1 className="text-sm font-black text-white italic">ADMIN DASHBOARD</h1>
                    <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 uppercase">Logout</button>
                </header>
                <main className="p-4 max-w-xl mx-auto">
                    <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                        <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                        <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Loan Collected</button>
                        <button onClick={() => setView('reqs')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'reqs' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Approvals ({requests.length})</button>
                        <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New</button>
                    </nav>

                    {view === 'home' && (
                        <>
                            <div className="bg-blue-600/10 border border-blue-600/20 p-6 rounded-[32px] mb-4 text-center">
                                <p className="text-[10px] font-black text-blue-400 uppercase">Portfolio Interest Total</p>
                                <p className="text-4xl font-black text-white">${totalOwedNow.toLocaleString()}</p>
                            </div>
                            <input type="text" placeholder="Search..." className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white" onChange={e => setSearchTerm(e.target.value)} />
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4">
                                    <div className="flex justify-between">
                                        <div><h3 className="font-black text-white">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase">Due: {c.dueDate}</p></div>
                                        <p className="text-xl font-black text-green-400">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-4">
                                        <button onClick={() => setPayingClient(c)} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[9px] uppercase">Adjust Payment</button>
                                        <button onClick={() => { if(confirm("Delete Portfolio?")) db.ref(`clients/${c.id}`).remove(); }} className="bg-red-900/10 text-red-500 py-3 rounded-xl font-bold text-[9px] uppercase border border-red-900/50">Delete</button>
                                    </div>
                                </div>
                            ))}
                        </>
                    )}

                    {view === 'history' && (
                        <>
                            <div className="bg-green-600/10 border border-green-600/20 p-6 rounded-[32px] mb-4 text-center">
                                <p className="text-[10px] font-black text-green-400 uppercase">Loan Collected Calculation</p>
                                <p className="text-4xl font-black text-white">${totalCollected.toLocaleString()}</p>
                            </div>
                            {allHistory.sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b] rounded-2xl border border-slate-800 mb-2">
                                    <button onClick={() => {
                                        const cl = clients.find(x => x.id === h.cId);
                                        const newH = cl.history.filter(item => item.timestamp !== h.timestamp);
                                        db.ref(`clients/${h.cId}`).update({
                                            history: newH,
                                            interestAmount: h.type === "Payment" ? (parseFloat(cl.interestAmount) + parseFloat(h.amount)) : (parseFloat(cl.interestAmount) - parseFloat(h.amount))
                                        });
                                    }} className="text-red-500 text-xs mr-2">✕</button>
                                    <div className="flex-1"><p className="text-white font-black text-[10px]">{h.cName}</p><p className="text-[7px] text-slate-500">{h.date} • {h.method}</p></div>
                                    <p className={`font-black text-xs ${h.type === "Payment" ? 'text-green-400' : 'text-red-400'}`}>{h.type === "Payment" ? '-' : '+'}${parseFloat(h.amount).toFixed(2)}</p>
                                </div>
                            ))}
                        </>
                    )}

                    {view === 'add' && (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const h = { amount: parseFloat(d.interestAmount), date: d.loanDate, type: "Loan", timestamp: Date.now(), method: d.disbursed };
                            await db.ref('clients').push({ ...d, history: [h] });
                            setView('home');
                        }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3">
                            <input name="name" placeholder="Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="workAddress" placeholder="Work Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" />
                            <input name="employerNumber" placeholder="Employer Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" />
                            <div className="grid grid-cols-2 gap-2">
                                <input name="amountOwed" type="number" placeholder="Principal" onChange={(e) => handlePrincipalCalc(e.target.value)} className="p-4 bg-[#0f172a] rounded-2xl text-white" required />
                                <input name="interestAmount" value={tempInterest} placeholder="Total (+25%)" className="p-4 bg-[#0f172a] rounded-2xl text-white" required />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div className="space-y-1 text-[8px] text-slate-500 uppercase ml-2">Date Borrowed<input name="loanDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white" required /></div>
                                <div className="space-y-1 text-[8px] text-slate-500 uppercase ml-2">Due Date<input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white" required /></div>
                            </div>
                            <select name="disbursed" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800">
                                <option>Face to Face</option>
                                <option>Bank Transfer</option>
                            </select>
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Save Portfolio</button>
                        </form>
                    )}

                    {view === 'reqs' && (
                        <div className="space-y-4">
                            {requests.map(r => (
                                <div key={r.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700">
                                    <h3 className="font-black text-white">{r.name} - Requesting ${r.amount}</h3>
                                    <p className="text-[10px] text-slate-400 mt-2">Income: {r.incomeInfo || "No info provided"}</p>
                                    <p className="text-[10px] text-blue-400 mt-1">Bank: {r.bankName} | Acc: {r.accNumber}</p>
                                    <div className="flex gap-2 mt-4">
                                        <button onClick={() => db.ref(`requests/${r.id}`).update({ status: 'Approved' })} className="flex-1 bg-green-600 text-white py-2 rounded-xl text-[10px] font-black uppercase">Approve</button>
                                        <button onClick={() => {
                                            const reason = prompt("Reason for rejection:");
                                            db.ref(`requests/${r.id}`).update({ status: 'Rejected', rejectionReason: reason });
                                        }} className="flex-1 bg-red-600 text-white py-2 rounded-xl text-[10px] font-black uppercase">Deny</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </main>

                {/* ADJUST MODAL */}
                {payingClient && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a]/95">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700">
                            <div className="flex justify-between mb-4">
                                <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Payment</button>
                                <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>Add Loan</button>
                            </div>
                            <input type="date" id="adjDate" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white mb-2" defaultValue={new Date().toISOString().split('T')[0]} />
                            <select id="adjMethod" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white mb-2"><option>Cash</option><option>Bank Transfer</option></select>
                            <input type="number" id="adjAmt" placeholder="Amount" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-3xl font-black text-center mb-4" />
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => setPayingClient(null)} className="bg-slate-800 text-white py-4 rounded-2xl font-black uppercase">Cancel</button>
                                <button onClick={() => {
                                    const val = parseFloat(document.getElementById('adjAmt').value);
                                    const h = { amount: val, date: document.getElementById('adjDate').value, method: document.getElementById('adjMethod').value, type: isNewLoanView ? "Loan" : "Payment", timestamp: Date.now() };
                                    db.ref(`clients/${payingClient.id}`).update({
                                        interestAmount: isNewLoanView ? (parseFloat(payingClient.interestAmount) + val) : Math.max(0, parseFloat(payingClient.interestAmount) - val),
                                        history: [...(payingClient.history || []), h]
                                    });
                                    setPayingClient(null);
                                }} className="bg-blue-600 text-white py-4 rounded-2xl font-black uppercase">Save</button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // --- CLIENT VIEW ---
    return (
        <div className="min-h-screen bg-[#0f172a] text-slate-200">
            <header className="p-5 flex justify-between items-center bg-[#1e293b]">
                <h1 className="text-sm font-black text-blue-400 uppercase">My Dashboard</h1>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 uppercase">Logout</button>
            </header>
            <main className="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* COLUMN 1: Profile & Status */}
                <div className="space-y-4">
                    <div className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                        <h2 className="text-xs font-black uppercase text-white mb-4">Request A Loan</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, name: userData.name, email: user.email, status: 'Pending', timestamp: Date.now() });
                            alert("Request Sent!");
                        }} className="space-y-3">
                            <input name="amount" type="number" placeholder="How much do you need?" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                            <textarea name="incomeInfo" placeholder="How do you get your income? (Optional)" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white h-20 text-xs" />
                            <div className="p-4 bg-[#0f172a] rounded-2xl space-y-2">
                                <p className="text-[8px] font-black text-slate-500 uppercase">Banking Info (Optional for Transfer)</p>
                                <input name="bankName" placeholder="Bank Name" className="w-full bg-transparent text-xs text-white outline-none" />
                                <input name="accNumber" placeholder="Account Number" className="w-full bg-transparent text-xs text-white outline-none" />
                            </div>
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Submit Request</button>
                        </form>
                    </div>

                    <div className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                        <h2 className="text-xs font-black uppercase text-white mb-4">Application Status</h2>
                        {requests.filter(r => r.email === user.email).map(r => (
                            <div key={r.id} className="p-4 bg-[#0f172a] rounded-2xl mb-2">
                                <div className="flex justify-between items-center">
                                    <p className="text-xs font-bold text-white">${r.amount}</p>
                                    <span className={`text-[8px] font-black px-2 py-1 rounded uppercase ${r.status === 'Approved' ? 'bg-green-600' : r.status === 'Rejected' ? 'bg-red-600' : 'bg-slate-700'}`}>{r.status}</span>
                                </div>
                                {r.rejectionReason && <p className="text-[9px] text-red-400 mt-2 font-bold italic">Note: {r.rejectionReason}</p>}
                            </div>
                        ))}
                    </div>
                </div>

                {/* COLUMN 2: History & Help */}
                <div className="space-y-4">
                    <div className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                        <h2 className="text-xs font-black uppercase text-white mb-4">Support & FAQ</h2>
                        <div className="space-y-2 mb-4 text-[10px] text-slate-400 italic">
                            <p>• Request a loan by filling the form on the left.</p>
                            <p>• Provide bank info if you prefer a transfer over face-to-face.</p>
                            <p>• Approvals usually take 24-48 hours.</p>
                        </div>
                        <a href="tel:8763180099" className="block w-full bg-slate-800 text-center py-4 rounded-2xl font-black text-blue-400 uppercase text-xs">Call Support: (876) 318-0099</a>
                    </div>
                    <div className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                        <h2 className="text-xs font-black uppercase text-white mb-4">My Portfolio History</h2>
                        {clients.filter(c => c.email === user.email).map(c => (
                            <div key={c.id}>
                                <p className="text-green-400 font-black text-2xl mb-4">Current Due: ${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                {(c.history || []).map((h, i) => (
                                    <div key={i} className="flex justify-between py-2 border-b border-slate-800 text-[10px]">
                                        <span>{h.date} - {h.type}</span>
                                        <span className={h.type === "Payment" ? 'text-green-400' : 'text-red-400'}>{h.type === "Payment" ? '-' : '+'}${h.amount}</span>
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
/**
 * Net Ten Ltd - Version 15.1
 * Restored Client Views | Fixed Signature Drawing | UI Rearrangement
 */

const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "nettenltd@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [modalSubView, setModalSubView] = React.useState('pay'); 
    const [editingClient, setEditingClient] = React.useState(null); 
    const [searchTerm, setSearchTerm] = React.useState('');
    const [startDate, setStartDate] = React.useState('');
    const [endDate, setEndDate] = React.useState('');

    React.useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else { setView('login'); }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);
    const clientNotifications = requests.filter(r => r.email === user?.email) || [];

    const stats = (() => {
        let totalOwed = 0;
        let totalPrincipal = 0;
        let collectedInterest = 0;
        clients.forEach(c => {
            totalOwed += parseFloat(c.interestAmount || 0);
            totalPrincipal += parseFloat(c.principal || 0);
            (c.history || []).forEach(h => { if (h.type === 'Payment') collectedInterest += parseFloat(h.amount); });
        });
        return { 
            owed: totalOwed, 
            principal: totalPrincipal, 
            profit: totalPrincipal > 0 ? ((collectedInterest / totalPrincipal) * 100).toFixed(1) : 0,
            accounts: pendingUsers.length, 
            loans: requests.filter(r => r.status === 'Pending').length 
        };
    })();

    // --- ESIGN DRAWING HELPERS ---
    const startDrawing = (e) => {
        const canvas = e.target;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = 'black';
        ctx.beginPath(); ctx.moveTo(x, y);
        canvas.drawing = true;
    };

    const draw = (e) => {
        const canvas = e.target;
        if (!canvas.drawing) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        ctx.lineTo(x, y); ctx.stroke();
    };

    const stopDrawing = (e) => { e.target.drawing = false; };

    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 text-[12px]">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center text-white">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Login Failed."); }
                        }} className="space-y-4">
                            <h2 className="font-black uppercase italic mb-4">Secure Log In</h2>
                            <input name="email" placeholder="Email Address" className="w-full p-5 bg-[#0f172a] rounded-2xl border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl border border-slate-800" required />
                            <button className="w-full bg-blue-600 font-black py-5 rounded-2xl uppercase shadow-lg">Authenticate</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] mt-4 block mx-auto uppercase">Create Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, timestamp: Date.now()});
                            alert("Request Sent."); setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="font-black uppercase italic text-center mb-4">Create Account</h2>
                            <input name="username" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <div className="space-y-1"><label className="text-[9px] text-slate-500 font-black uppercase ml-2">Date of Birth</label><input name="dob" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required /></div>
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <button className="w-full bg-green-600 font-black py-4 rounded-xl uppercase">Submit Request</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] block mx-auto text-center uppercase">Back</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[12px]">
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 overflow-y-auto min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios</button>
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📜 History</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>➕ Onboard</button>
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between ${view === 'inbox_accounts' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>Accounts <span className="bg-green-600 text-white px-2 rounded-full">{stats.accounts}</span></button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between ${view === 'inbox_loans' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>Requests <span className="bg-blue-600 text-white px-2 rounded-full">{stats.loans}</span></button>
                            <button onClick={() => setView('analytics')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'analytics' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📊 Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_home' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>🏠 Dashboard</button>
                            <button onClick={() => setView('client_notifications')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between ${view === 'client_notifications' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>🔔 Notifications {clientNotifications.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full font-bold">!</span>}</button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_apply' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>➕ New Loan / Top Up</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_pay' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>💳 Make Payment</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_profile' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>👤 Profile</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_faq' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>❓ Support</button>
                        </>
                    )}
                </nav>
                <div className="p-6 border-t border-slate-800 min-w-[250px]">
                    <button onClick={() => auth.signOut()} className="w-full py-4 bg-red-600 text-white rounded-xl font-black uppercase">Sign Out</button>
                </div>
            </aside>

            <main className="flex-1 overflow-y-auto">
                <header className="p-6 bg-[#1e293b] border-b border-slate-800 flex items-center justify-between sticky top-0 z-40">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-white bg-slate-800 px-4 py-2 rounded-lg font-bold uppercase text-[10px]">Menu</button>
                    <span className="text-white font-black uppercase italic tracking-widest text-[10px]">{user.email}</span>
                </header>

                <div className="p-8 bg-[#0f172a] min-h-full">
                    {/* ADMIN PORTFOLIOS */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-6xl mx-auto space-y-6">
                            <div className="bg-gradient-to-r from-blue-900 to-slate-800 p-10 rounded-[40px] border border-blue-500/20 shadow-2xl flex justify-between items-center">
                                <div><h2 className="text-blue-400 font-black uppercase text-xs mb-1 tracking-widest">Outstanding Portfolio</h2><p className="text-white text-6xl font-black italic">${stats.owed.toLocaleString()}</p></div>
                            </div>
                            <input type="text" placeholder="Search portfolios..." className="w-full p-5 bg-[#1e293b] rounded-2xl text-white border border-slate-700 outline-none" onChange={e => setSearchTerm(e.target.value)} />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-6 rounded-[30px] border border-slate-700 shadow-xl text-white">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-white font-black uppercase text-lg">{c.name}</h3>
                                                <p className="text-[10px] text-slate-500 uppercase font-bold mt-1">Borrowed: {c.dateBorrowed} | Due: {c.dueDate}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => setEditingClient(c)} className="bg-slate-800 text-blue-400 px-2 py-1 rounded text-[9px] font-bold">DETAILS</button>
                                                <button onClick={() => { if(confirm("DELETE PORTFOLIO?")) db.ref(`clients/${c.id}`).remove(); }} className="bg-red-600 text-white px-2 py-1 rounded text-[9px] font-bold">DELETE</button>
                                            </div>
                                        </div>
                                        <p className="text-green-400 text-5xl font-black italic mb-4 tracking-tighter">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                        <div className="flex gap-2">
                                            <button onClick={() => { setModalSubView('loan'); setPayingClient(c); }} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">💸 Top-Up / New</button>
                                            <button onClick={() => { setModalSubView('pay'); setPayingClient(c); }} className="flex-1 bg-green-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">✅ Record Pay</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ADMIN ONBOARD (Amount Inputs Under Dates) */}
                    {isAdmin && view === 'add' && (
                        <div className="max-w-2xl mx-auto bg-[#1e293b] p-8 rounded-[30px] border border-slate-700 text-white shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-6 text-center underline underline-offset-8">Onboard Portfolio</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const hist = [{amount: parseFloat(d.interestAmount), date: d.dateBorrowed, type: "Disbursement", method: "Setup", timestamp: Date.now()}];
                                await db.ref('clients').push({...d, history: hist, status: 'Active'});
                                alert("Portfolio Initialized!"); setView('home');
                            }} className="grid grid-cols-2 gap-4">
                                <input name="name" placeholder="Full Client Name" className="col-span-2 p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                                <input name="email" placeholder="Email" className="p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                                <input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                                <input name="address" placeholder="Work Address" className="col-span-2 p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                                <select name="type" className="col-span-2 p-4 bg-[#0f172a] rounded-xl border border-slate-700 font-bold uppercase" required><option value="Weekly">Weekly</option><option value="Fortnightly">Fortnightly</option><option value="Monthly">Monthly</option></select>
                                
                                <div className="space-y-1"><label className="text-[8px] text-slate-500 uppercase ml-2">Borrowed Date</label><input name="dateBorrowed" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required /></div>
                                <div className="space-y-1"><label className="text-[8px] text-slate-500 uppercase ml-2">Due Date</label><input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required /></div>
                                
                                {/* REARRANGED: Amounts Under Dates */}
                                <div className="space-y-1">
                                    <label className="text-[8px] text-slate-500 uppercase ml-2">Principal ($)</label>
                                    <input name="principal" type="number" onChange={e => { const p = parseFloat(e.target.value) || 0; document.getElementById('onboard_total').value = (p * 1.25).toFixed(2); }} className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[8px] text-slate-500 uppercase ml-2">Total Owed (Auto 25%)</label>
                                    <input id="onboard_total" name="interestAmount" type="number" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 text-green-400 font-bold" required />
                                </div>
                                
                                <button className="col-span-2 bg-blue-600 py-4 rounded-xl font-black uppercase shadow-lg mt-2">Initialize Portfolio</button>
                            </form>
                        </div>
                    )}

                    {/* ANALYTICS (Fixed Loading) */}
                    {isAdmin && view === 'analytics' && (
                        <div className="max-w-4xl mx-auto space-y-6 text-white text-center">
                            <h2 className="text-xl font-black uppercase italic mb-4">Financial BI Analysis</h2>
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                <div className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700 shadow-xl"><p className="text-[9px] text-slate-500 uppercase font-black mb-1">Capital Deployed</p><p className="text-2xl font-black italic tracking-tight">${stats.principal.toLocaleString()}</p></div>
                                <div className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700 shadow-xl"><p className="text-[9px] text-slate-500 uppercase font-black mb-1">Outstanding Balance</p><p className="text-2xl font-black italic text-blue-400 tracking-tight">${stats.owed.toLocaleString()}</p></div>
                                <div className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700 shadow-xl"><p className="text-[9px] text-slate-500 uppercase font-black mb-1">Profit Efficiency</p><p className="text-2xl font-black italic text-green-400">+{stats.profit}%</p></div>
                            </div>
                            <div className="bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 shadow-inner">
                                <div className="h-40 flex items-end gap-3 justify-center">
                                    <div className="w-12 bg-blue-600 h-[30%] rounded-t-lg"></div><div className="w-12 bg-blue-500 h-[50%] rounded-t-lg"></div><div className="w-12 bg-blue-400 h-[70%] rounded-t-lg"></div><div className="w-12 bg-green-500 h-[90%] rounded-t-lg shadow-[0_0_20px_rgba(34,197,94,0.3)]"></div>
                                </div>
                                <p className="text-[10px] uppercase font-black text-slate-600 mt-6 tracking-[5px] opacity-60 italic">Growth Analysis</p>
                            </div>
                        </div>
                    )}

                    {/* CLIENT DASHBOARD VIEWS (RESTORED) */}
                    {!isAdmin && view === 'client_home' && (
                        <div className="max-w-md mx-auto text-center text-white space-y-6">
                            <div className="bg-[#1e293b] p-12 rounded-[50px] border border-slate-700 shadow-2xl">
                                <p className="text-slate-500 uppercase font-black text-[10px] tracking-widest opacity-60">Balance Owed</p>
                                <h1 className="text-7xl font-black text-green-400 italic my-5 tracking-tighter">${clientData ? parseFloat(clientData.interestAmount || 0).toFixed(2) : '0.00'}</h1>
                                <div className="bg-[#0f172a] p-4 rounded-xl text-left border border-slate-800 text-[10px] font-bold uppercase space-y-1">
                                    <p className="text-red-400">📅 DUE DATE: {clientData?.dueDate || 'N/A'}</p>
                                    <p className="text-slate-500 italic">BORROWED: {clientData?.dateBorrowed || 'N/A'}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {!isAdmin && view === 'client_notifications' && (
                        <div className="max-w-2xl mx-auto space-y-4 text-white">
                            <h2 className="text-xl font-black uppercase italic mb-6">Notifications</h2>
                            {clientNotifications.map(r => (
                                <div key={r.id} className={`p-6 rounded-3xl border shadow-xl ${r.status === 'Approved' ? 'bg-green-900/40 border-green-500' : r.status === 'Denied' ? 'bg-red-900/40 border-red-500' : 'bg-[#1e293b] border-slate-700'}`}>
                                    <p className="font-black uppercase text-[10px] mb-2 tracking-widest">Loan Request Status: ${r.amount}</p>
                                    <span className="px-3 py-1 rounded-full bg-black/30 text-[9px] font-black uppercase italic tracking-widest">{r.status}</span>
                                    {r.reason && <p className="mt-4 p-4 bg-black/20 rounded-xl italic font-bold text-[11px] border border-white/5">"{r.reason}"</p>}
                                </div>
                            ))}
                        </div>
                    )}

                    {!isAdmin && view === 'client_apply' && (
                        <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-8 border-b border-slate-800 pb-4 text-center tracking-widest">Request Top-Up / New Loan</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                await db.ref('requests').push({...d, email: user.email, name: clientData?.name || userData?.username, status: 'Pending', timestamp: Date.now()});
                                alert("Application Dispatched."); setView('client_home');
                            }} className="grid grid-cols-2 gap-5">
                                <input name="amount" type="number" placeholder="Principal Requested ($)" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl border border-slate-700 text-white" required />
                                <select name="term" className="p-5 bg-[#0f172a] rounded-2xl border border-slate-700 font-black uppercase" required><option value="Weekly">Weekly</option><option value="Fortnightly">Fortnightly</option><option value="Monthly">Monthly</option></select>
                                <input name="id_proof" placeholder="Valid ID (Passport/License #)" className="p-5 bg-[#0f172a] rounded-2xl border border-slate-700" required />
                                <input name="address_proof" placeholder="Proof of Address" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl border border-slate-700" required />
                                <textarea name="income_proof" placeholder="Brief Description of Job/Income" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl border border-slate-700 h-24" required></textarea>
                                <button className="col-span-2 bg-blue-600 py-5 rounded-2xl font-black uppercase mt-4 hover:bg-blue-500 shadow-lg tracking-widest italic">Submit Application</button>
                            </form>
                        </div>
                    )}

                    {!isAdmin && view === 'client_pay' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white text-center shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-6">Payment Hub</h2>
                            <div className="bg-[#0f172a] p-6 rounded-2xl border border-slate-800 text-left mb-6 font-bold uppercase text-[10px]">
                                <p className="text-green-400 mb-2 underline underline-offset-4">Bank Transfer (NCB)</p>
                                <p className="text-slate-400 leading-relaxed italic">Send payment via NCB Transfer Mode. Contact Winston for account details details details details.</p>
                                <p className="mt-3 text-white italic">WhatsApp Support: (876) 318-0099</p>
                            </div>
                            <form onSubmit={e => { e.preventDefault(); alert("Intent Recorded."); }}>
                                <label className="block text-slate-500 uppercase text-[8px] font-black mb-2 opacity-70">Confirm Payment Date</label>
                                <input type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 mb-6 text-white" required />
                                <button className="w-full bg-green-600 py-4 rounded-xl font-black uppercase shadow-lg">Notify Winston</button>
                            </form>
                        </div>
                    )}

                    {!isAdmin && view === 'client_profile' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-6">Security Profile</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                if(clientData) await db.ref(`clients/${clientData.id}`).update(d);
                                await db.ref(`users/${user.uid}`).update(d);
                                alert("Data Synced.");
                            }} className="space-y-4 uppercase font-bold text-[9px] tracking-wide">
                                <div><label className="text-slate-500 ml-2 block mb-1">Phone</label><input name="phone" defaultValue={clientData?.phone || userData?.phone} className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 text-white" /></div>
                                <div><label className="text-slate-500 ml-2 block mb-1">Work Address</label><input name="address" defaultValue={clientData?.address} className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 text-white" /></div>
                                <button className="w-full bg-blue-600 py-4 rounded-xl font-black uppercase shadow-xl mt-4">Sync Records</button>
                            </form>
                        </div>
                    )}

                    {!isAdmin && view === 'client_faq' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white text-center shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-8 border-b border-slate-800 pb-4 text-blue-400">Support Center</h2>
                            <div className="space-y-8 text-[10px] text-left uppercase font-black italic tracking-tighter">
                                <div className="border-l-4 border-blue-500 pl-4"><p className="text-blue-400 mb-1">When is my cutoff?</p><p className="text-slate-400 leading-tight">Settlements must reach our account by 4:00 PM on due date to avoid penalties penalties penalties penalties.</p></div>
                                <div className="border-l-4 border-blue-500 pl-4"><p className="text-blue-400 mb-1">Applying for more money?</p><p className="text-slate-400 leading-tight">Use the Top-Up form. Your history allows for faster approvals approvals approvals approvals.</p></div>
                                <div className="p-8 bg-[#0f172a] rounded-3xl border border-slate-800 text-center shadow-inner">
                                    <p className="font-black mb-2 text-slate-500 text-[8px] tracking-[4px]">Direct Line / WhatsApp</p>
                                    <p className="text-2xl font-black text-green-400 tracking-tighter underline underline-offset-8">(876) 318-0099</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Inboxes (Hidden when not in view, functional when clicked) */}
                    {isAdmin && view === 'inbox_accounts' && (
                        <div className="max-w-4xl mx-auto space-y-4">
                            <h2 className="text-white text-xl font-black uppercase italic mb-6">Account Requests</h2>
                            {pendingUsers.map(u => (
                                <div key={u.id} className="bg-[#1e293b] p-6 rounded-2xl border border-slate-700 flex justify-between items-center text-white">
                                    <div><p className="font-bold uppercase">{u.username} | {u.email}</p><p className="text-[10px] text-slate-500">TEL: {u.phone} | DOB: {u.dob}</p></div>
                                    <button onClick={async () => {
                                        try {
                                            const res = await auth.createUserWithEmailAndPassword(u.email, u.password);
                                            await db.ref(`users/${res.user.uid}`).set({email: u.email, role: 'client', ...u});
                                            await db.ref(`pending_registrations/${u.id}`).remove();
                                            alert("Profile Created!");
                                        } catch(e) { alert("Error: " + e.message); }
                                    }} className="bg-green-600 px-6 py-2 rounded-lg font-black uppercase italic shadow-lg">Approve</button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            </main>

            {/* MODALS */}
            {payingClient && (
                <div className="fixed inset-0 bg-black/95 z-[999] flex items-center justify-center p-6 backdrop-blur-md">
                    <div className="bg-[#1e293b] p-10 rounded-[40px] w-full max-w-lg border border-slate-700 text-white shadow-2xl">
                        <h2 className="text-center font-black uppercase italic mb-8 border-b border-slate-800 pb-4">
                            {modalSubView === 'loan' ? '💸 DISBURSEMENT terminal terminal' : '✅ COLLECTION terminal terminal'} ({payingClient.name})
                        </h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            const current = parseFloat(payingClient.interestAmount || 0);
                            const updated = modalSubView === 'loan' ? current + amt : current - amt;
                            const h = { amount: amt, date: d.date, type: modalSubView === 'loan' ? 'Disbursement' : 'Payment', method: d.method, timestamp: Date.now() };
                            if(modalSubView === 'loan' && d.method === "Face-to-Face") h.signature = document.getElementById('esignCanvas').toDataURL();
                            let up = { interestAmount: Math.max(0, updated), history: [...(payingClient.history || []), h] };
                            if(modalSubView === 'loan' && d.newDue) up.dueDate = d.newDue;
                            await db.ref(`clients/${payingClient.id}`).update(up);
                            setPayingClient(null); alert("Signed & Processed.");
                        }} className="space-y-4">
                            <div className="relative">
                                <label className="text-[8px] text-slate-500 uppercase font-black ml-2">Transaction Total ($)</label>
                                <input id="m_amt" name="amount" type="number" step="0.01" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-4xl font-black border border-slate-700 pr-32" required />
                                {modalSubView === 'pay' && <button type="button" onClick={() => document.getElementById('m_amt').value = payingClient.interestAmount} className="absolute right-4 top-[32px] bg-green-600 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase shadow-lg italic">Full Payoff</button>}
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1"><label className="text-[8px] text-slate-500 uppercase font-bold ml-2">{modalSubView === 'loan' ? 'Date Borrowed' : 'Date Paid'}</label><input name="date" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required /></div>
                                {modalSubView === 'loan' && (<div className="space-y-1"><label className="text-[8px] text-slate-500 uppercase font-bold ml-2">New Due Date</label><input name="newDue" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required /></div>)}
                            </div>
                            <div className="space-y-1">
                                <label className="text-[8px] text-slate-500 uppercase font-bold ml-2">Method</label>
                                <select name="method" className="w-full p-4 bg-[#0f172a] rounded-xl text-white font-bold uppercase border border-slate-700 outline-none">
                                    {modalSubView === 'loan' ? (<><option value="Face-to-Face">🤝 Face-to-Face</option><option value="Online Transfer">🌐 Online Transfer</option></>) : (<><option value="NCB Transfer">NCB Transfer</option><option value="Cash">Cash</option></>)}
                                </select>
                            </div>
                            {modalSubView === 'loan' && (
                                <div className="p-3 bg-white rounded-xl border border-slate-700">
                                    <div className="flex justify-between items-center mb-1"><p className="text-[8px] text-slate-500 uppercase font-black">Digital Signature</p><button type="button" onClick={() => { const c = document.getElementById('esignCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); }} className="text-red-500 text-[8px] font-black uppercase underline">ClearPad</button></div>
                                    <canvas id="esignCanvas" width="350" height="80" className="rounded cursor-crosshair h-20 w-full" 
                                        onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseOut={stopDrawing}
                                        onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}></canvas>
                                </div>
                            )}
                            <button className={`w-full text-white font-black py-4 rounded-xl uppercase mt-4 shadow-xl italic tracking-widest ${modalSubView === 'loan' ? 'bg-blue-600' : 'bg-green-600'}`}>Commit Transaction</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 uppercase font-black text-[9px] mt-2 italic">Dismiss Terminal</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

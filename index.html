<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    const [historyFilter, setHistoryFilter] = React.useState('all'); // all, day, week, month
    
    const [tempPrincipal, setTempPrincipal] = React.useState('');
    const [tempInterest, setTempInterest] = React.useState('');
    
    const [payAmt, setPayAmt] = React.useState('');
    const [payMethod, setPayMethod] = React.useState('Cash');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
        });
        return () => clientsRef.off();
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        let finalEmail = loginId.includes('@') ? loginId : `${loginId.replace(/[^0-9]/g, '')}@netten.com`;
        auth.signInWithEmailAndPassword(finalEmail, password).catch(err => alert("Login failed."));
    };

    const isAdmin = user?.email === ADMIN_EMAIL;
    const myPortfolio = clients.find(c => c.email?.toLowerCase() === user?.email?.toLowerCase());

    // --- LOGIC: HISTORY FILTERING ---
    const getFilteredHistory = () => {
        const now = new Date();
        const startOfDay = new Date(now.setHours(0,0,0,0)).getTime();
        const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay())).getTime();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

        const all = clients.flatMap(c => (c.history || []).map(h => ({ ...h, clientId: c.id, clientName: c.name })));
        
        return all.filter(h => {
            if (historyFilter === 'day') return h.timestamp >= startOfDay;
            if (historyFilter === 'week') return h.timestamp >= startOfWeek;
            if (historyFilter === 'month') return h.timestamp >= startOfMonth;
            return true;
        }).sort((a, b) => b.timestamp - a.timestamp);
    };

    const filteredHistory = getFilteredHistory();
    const periodTotal = filteredHistory.reduce((acc, h) => acc + parseFloat(h.amount || 0), 0);
    const activeTotalOut = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0)), 0);

    const handlePrincipalChange = (val) => {
        setTempPrincipal(val);
        const num = parseFloat(val);
        if(!isNaN(num)) setTempInterest((num * 0.25).toFixed(2));
    };

    const isOverdue = (dateStr) => {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date().setHours(0,0,0,0);
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4 object-contain" alt="logo" />
                    <h1 className="text-3xl font-black text-blue-400 mb-2 uppercase italic tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleLogin} className="space-y-4 mt-6">
                        <input type="text" placeholder="Admin ID / Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setLoginId(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Sign In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200 font-sans">
            <header className="sticky top-0 z-50 bg-[#1e293b]/80 backdrop-blur-md p-5 border-b border-slate-700 flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8 object-contain" alt="logo" />
                    <h1 className="text-md font-black text-white uppercase italic text-sm">Net Ten Ltd</h1>
                </div>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div className="animate-in fade-in">
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                            <button onClick={() => { setView('add'); setTempPrincipal(''); setTempInterest(''); }} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Client</button>
                        </nav>

                        {view === 'home' && (
                            <>
                                <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-[32px] mb-6 shadow-2xl border border-blue-400/30">
                                    <p className="text-[10px] font-black text-blue-100 uppercase mb-1">Total Outstanding</p>
                                    <p className="text-4xl font-black text-white italic tracking-tighter">${activeTotalOut.toFixed(2)}</p>
                                </div>
                                <input type="text" placeholder="Search portfolios..." className="w-full p-4 mb-6 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none shadow-inner" onChange={(e) => setSearchTerm(e.target.value)} />
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-xl">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-black text-white text-lg">{c.name}</h3>
                                                <p className={`text-[8px] font-black uppercase ${isOverdue(c.dueDate) ? 'text-red-500' : 'text-slate-500'}`}>
                                                    Due Date: {c.dueDate || 'PENDING'}
                                                </p>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0)).toFixed(2)}</p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => { setPayingClient(c); setPayAmt(''); setIsNewLoanView(false); }} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Payment/Loan</button>
                                            <button onClick={() => { setEditingClient(c); setTempPrincipal(c.amountOwed); setTempInterest(c.interestAmount); }} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                            <button onClick={() => {
                                                 const msg = prompt("Note for " + c.name);
                                                 if(msg) db.ref(`clients/${c.id}`).update({ directMsg: msg });
                                            }} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Note</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}

                        {view === 'history' && (
                            <div className="animate-in slide-in-from-bottom">
                                <div className="bg-green-900/20 border border-green-900/30 p-6 rounded-[32px] mb-4 text-center shadow-2xl">
                                    <p className="text-green-500 font-black text-[10px] uppercase mb-1">Revenue for selected period</p>
                                    <p className="text-4xl font-black text-white italic tracking-tighter">${periodTotal.toFixed(2)}</p>
                                </div>
                                
                                <div className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                                    {['all', 'day', 'week', 'month'].map(f => (
                                        <button key={f} onClick={() => setHistoryFilter(f)} className={`flex-1 py-2 rounded-xl text-[8px] font-black uppercase transition-all ${historyFilter === f ? 'bg-green-600 text-white' : 'text-slate-500'}`}>{f}</button>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    {filteredHistory.map((h, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b] rounded-2xl border border-slate-800">
                                            <div>
                                                <p className="text-blue-400 font-black text-[10px] uppercase">{h.clientName}</p>
                                                <p className="text-[8px] text-slate-500 font-bold uppercase">{h.date} • {h.method}</p>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <p className="font-black text-green-400 text-md">${parseFloat(h.amount).toFixed(2)}</p>
                                                <button onClick={() => {
                                                    if(confirm("Erase this payment?")) {
                                                        const client = clients.find(c => c.id === h.clientId);
                                                        const newH = (client.history || []).filter(item => item.timestamp !== h.timestamp);
                                                        db.ref(`clients/${h.clientId}`).update({ interestAmount: (parseFloat(client.interestAmount || 0) + parseFloat(h.amount)), history: newH });
                                                    }
                                                }} className="text-red-500/30 hover:text-red-500 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* RECORD PAYMENT / NEW LOAN MODAL */}
                        {payingClient && (
                            <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                                <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 space-y-6 shadow-2xl">
                                    <div className="flex justify-between items-center mb-2">
                                        <button onClick={() => setIsNewLoanView(false)} className={`text-[9px] font-black uppercase pb-2 border-b-2 transition-all ${!isNewLoanView ? 'text-blue-400 border-blue-400' : 'text-slate-600 border-transparent'}`}>Record Pay</button>
                                        <button onClick={() => { setIsNewLoanView(true); setTempPrincipal(''); setTempInterest(''); }} className={`text-[9px] font-black uppercase pb-2 border-b-2 transition-all ${isNewLoanView ? 'text-green-400 border-green-400' : 'text-slate-600 border-transparent'}`}>+ New Loan</button>
                                    </div>

                                    {!isNewLoanView ? (
                                        <div className="space-y-6 animate-in fade-in">
                                            <div className="text-center"><h3 className="text-2xl font-black text-white italic">{payingClient.name}</h3></div>
                                            <div className="flex bg-[#0f172a] p-1 rounded-2xl border border-slate-800">
                                                <button onClick={() => setPayMethod('Cash')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase ${payMethod === 'Cash' ? 'bg-green-600 text-white' : 'text-slate-500'}`}>Cash</button>
                                                <button onClick={() => setPayMethod('Bank')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase ${payMethod === 'Bank' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>Bank</button>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={() => setPayAmt((parseFloat(payingClient.interestAmount || 0) + parseFloat(payingClient.additionalFunds || 0)).toFixed(2))} className="bg-green-900/20 text-green-400 border border-green-900/50 py-3 rounded-2xl font-black text-[9px] uppercase">Full Payoff</button>
                                                <button onClick={() => setPayAmt(parseFloat(payingClient.interestAmount || 0).toFixed(2))} className="bg-blue-900/20 text-blue-400 border border-blue-900/50 py-3 rounded-2xl font-black text-[9px] uppercase">Pay Interest Only</button>
                                            </div>
                                            <input type="number" value={payAmt} onChange={(e) => setPayAmt(e.target.value)} placeholder="0.00" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xl font-black outline-none border border-slate-700" />
                                            <button onClick={() => {
                                                const amt = parseFloat(payAmt); if(!amt) return;
                                                const isInterestOnly = amt === parseFloat(payingClient.interestAmount || 0);
                                                let ni = payingClient.interestAmount || 0; 
                                                let nt = payingClient.additionalFunds || 0;
                                                
                                                if (isInterestOnly) {
                                                    // Logic: They paid the interest, so we reset interest but the principal stays rolled over
                                                    // We trigger a "new" interest period based on their current principal balance
                                                    const principalTotal = parseFloat(payingClient.amountOwed || 0);
                                                    ni = (principalTotal * 0.25); 
                                                } else {
                                                    let rem = amt;
                                                    if (rem <= ni) { ni -= rem; rem = 0; } else { rem -= ni; ni = 0; nt = Math.max(0, nt - rem); }
                                                }

                                                const hObj = { amount: amt, date: new Date().toLocaleDateString(), method: payMethod, timestamp: Date.now() };
                                                db.ref(`clients/${payingClient.id}`).update({ interestAmount: ni, additionalFunds: nt, history: [...(payingClient.history || []), hObj] });
                                                setPayingClient(null); alert("Payment Recorded!");
                                            }} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-xl">Confirm Payment</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-4 animate-in slide-in-from-right">
                                            <div className="text-center"><h3 className="text-xl font-black text-white uppercase tracking-tighter">Add New Loan for {payingClient.name}</h3></div>
                                            <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2 font-black">Additional Principal</label>
                                            <input type="number" value={tempPrincipal} onChange={(e) => handlePrincipalChange(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-700" placeholder="0.00" /></div>
                                            <div className="space-y-1"><label className="text-[7px] text-green-500 uppercase ml-2 font-black">Auto-Interest (25%)</label>
                                            <input type="number" value={tempInterest} onChange={(e) => setTempInterest(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-green-900/30" /></div>
                                            <div className="space-y-1"><label className="text-[7px] text-red-500 uppercase ml-2 font-black">New Due Date</label>
                                            <input type="date" id="newDueDate" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-700 text-xs" /></div>
                                            <button onClick={() => {
                                                const p = parseFloat(tempPrincipal || 0);
                                                const i = parseFloat(tempInterest || 0);
                                                const d = document.getElementById('newDueDate').value;
                                                if(!p) return alert("Enter amount");
                                                db.ref(`clients/${payingClient.id}`).update({
                                                    amountOwed: parseFloat(payingClient.amountOwed || 0) + p,
                                                    interestAmount: parseFloat(payingClient.interestAmount || 0) + i,
                                                    dueDate: d || payingClient.dueDate
                                                });
                                                setPayingClient(null); alert("Loan Added!");
                                            }} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase shadow-xl">Issue New Loan</button>
                                        </div>
                                    )}
                                    <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Cancel</button>
                                </div>
                            </div>
                        )}
                        
                        {/* VIEW: ADD NEW CLIENT (Keep Original Logic) */}
                        {view === 'add' && (
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const email = d.email || `${d.phone.replace(/[^0-9]/g, '')}@netten.com`;
                                await db.ref('clients').push({...d, email, interestAmount: parseFloat(d.interestAmount || 0), additionalFunds: parseFloat(d.additionalFunds || 0), amountOwed: parseFloat(d.amountOwed || 0)});
                                alert("Added!"); setView('home');
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3">
                                <h2 className="text-lg font-black text-white uppercase italic">New Portfolio</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="name" placeholder="Full Name" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                    <input name="phone" placeholder="Personal Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                </div>
                                <input name="workAddress" placeholder="Work Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="empPhone" placeholder="Employer Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                    <input name="location" placeholder="Work Location" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2">Loan Date</label><input name="loanDate" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>
                                    <div className="space-y-1"><label className="text-[7px] text-red-400 uppercase ml-2">Date Due</label><input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-red-900/20" required /></div>
                                </div>
                                <div className="grid grid-cols-3 gap-2 pt-2">
                                    <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase">Principal</label><input name="amountOwed" type="number" step="any" value={tempPrincipal} onChange={(e) => handlePrincipalChange(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>
                                    <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase">Top-Up</label><input name="additionalFunds" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>
                                    <div className="space-y-1"><label className="text-[7px] text-green-500 uppercase">Interest (25%)</label><input name="interestAmount" type="number" step="any" value={tempInterest} onChange={(e) => setTempInterest(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-green-900/30" required /></div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase mt-2 shadow-xl">Save Portfolio</button>
                            </form>
                        )}

                        {/* EDIT MODAL (REDACTED FOR SPACE BUT REMAINS SAME AS PREVIOUS) */}
                        {editingClient && (
                            <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const d = Object.fromEntries(new FormData(e.target).entries());
                                    db.ref(`clients/${editingClient.id}`).update({...d, interestAmount: parseFloat(d.interestAmount || 0), amountOwed: parseFloat(d.amountOwed || 0)});
                                    setEditingClient(null); alert("Updated!");
                                }} className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-3 overflow-y-auto max-h-[90vh]">
                                    <h3 className="text-xl font-black text-white uppercase italic">Edit Profile</h3>
                                    <input name="name" defaultValue={editingClient.name} className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1"><label className="text-[7px] text-red-400 uppercase font-black ml-2">Due Date</label><input name="dueDate" type="date" defaultValue={editingClient.dueDate} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                        <input name="phone" defaultValue={editingClient.phone} className="p-4 bg-[#0f172a] rounded-xl text-white mt-4" />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 border-t border-slate-700 pt-3">
                                        <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase font-black">Principal</label><input name="amountOwed" type="number" step="any" value={tempPrincipal} onChange={(e) => handlePrincipalChange(e.target.value)} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                        <div className="space-y-1"><label className="text-[7px] text-green-500 uppercase font-black">Interest</label><input name="interestAmount" type="number" step="any" value={tempInterest} onChange={(e) => setTempInterest(e.target.value)} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase mt-2">Save Changes</button>
                                    <button type="button" onClick={() => setEditingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center pt-2">Cancel</button>
                                </form>
                            </div>
                        )}
                    </div>
                ) : (
                    /* CLIENT VIEW */
                    myPortfolio ? (
                        <div className="animate-in fade-in">
                            <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl border border-slate-700 mb-6 text-center">
                                <p className="text-slate-500 font-bold text-xs uppercase mb-1">Balance Remaining</p>
                                <h2 className="text-5xl font-black text-green-400 mb-2 italic tracking-tighter">${(parseFloat(myPortfolio.interestAmount || 0) + parseFloat(myPortfolio.additionalFunds || 0)).toFixed(2)}</h2>
                                <p className={`text-[10px] font-black uppercase ${isOverdue(myPortfolio.dueDate) ? 'text-red-500' : 'text-slate-500'}`}>Deadline: {myPortfolio.dueDate || 'PENDING'}</p>
                            </div>
                        </div>
                    ) : <div className="text-center p-10 text-slate-600 font-black uppercase tracking-widest animate-pulse">Syncing...</div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

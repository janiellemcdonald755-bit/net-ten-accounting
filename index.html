<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Accounting</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "net-ten-accounting.firebaseapp.com",
            databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
            projectId: "net-ten-accounting",
            storageBucket: "net-ten-accounting.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const App = () => {
            const [transactions, setTransactions] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                // Listen to your Realtime Database root
                const dbRef = database.ref('/');
                
                dbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        // This maps your single entry into a list the UI can read
                        setTransactions([{
                            id: 'test-1',
                            name: data.name || 'Income',
                            amount: data.amount || 0,
                            type: 'income'
                        }]);
                    }
                    setLoading(false);
                });

                return () => dbRef.off();
            }, []);

            const totalIncome = transactions.reduce((sum, t) => sum + Number(t.amount), 0);

            return (
                <div className="min-h-screen bg-gray-100 p-8">
                    <div className="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
                        <h1 className="text-2xl font-bold mb-6">Net Ten Accounting</h1>
                        
                        {loading ? (
                            <p>Connecting...</p>
                        ) : (
                            <div>
                                <div className="bg-green-50 p-4 rounded-lg mb-6">
                                    <p className="text-green-600 font-bold uppercase text-xs">Total Income</p>
                                    <p className="text-3xl font-black text-green-700">${totalIncome.toFixed(2)}</p>
                                </div>

                                <div className="space-y-2">
                                    <h3 className="font-bold border-b pb-2 text-gray-700">Recent Transactions</h3>
                                    {transactions.map(t => (
                                        <div key={t.id} className="flex justify-between p-2 bg-gray-50 rounded">
                                            <span>{t.name}</span>
                                            <span className="text-green-600 font-bold">+${Number(t.amount).toFixed(2)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    const [calcVal, setCalcVal] = React.useState('');
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [modalSubView, setModalSubView] = React.useState('loan');
    const [searchTerm, setSearchTerm] = React.useState('');

    React.useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    if (data?.popupMsg) {
                        alert(`MESSAGE FROM ADMIN: ${data.popupMsg}`);
                        db.ref(`users/${u.uid}/popupMsg`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else { setView('login'); }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    const stats = (() => {
        let totalOwed = 0;
        clients.forEach(c => totalOwed += parseFloat(c.interestAmount || 0));
        return { owed: totalOwed, accounts: pendingUsers.length, loans: requests.length };
    })();

    const handleCalc = (btn) => {
        if (btn === 'C') setCalcVal('');
        else if (btn === '=') { try { setCalcVal(eval(calcVal).toString()); } catch { setCalcVal('Err'); } }
        else setCalcVal(prev => prev + btn);
    };

    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic mb-4">Secure Log In</h2>
                            <input name="email" type="email" placeholder="Email Address" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Authenticate</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto">New User? Register</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push(d);
                            alert("Request Sent! Winston will approve your account soon.");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="text-white font-black uppercase italic text-center mb-4">Account Registration</h2>
                            <input name="username" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <input name="dob" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase">Submit for Approval</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto text-center">Back to Login</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[10px]">
            {/* COLLAPSIBLE SIDEBAR */}
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden relative`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 overflow-y-auto min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic hover:text-white">📂 Portfolios</button>
                            <button onClick={() => setView('master_history')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic hover:text-white">📜 Master History</button>
                            <button onClick={() => setView('add')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic hover:text-white">➕ Add New Loan</button>
                            <button onClick={() => setView('inbox_accounts')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic flex justify-between">
                                Accounts Request {stats.accounts > 0 && <span className="bg-green-600 text-white px-2 rounded-full">{stats.accounts}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic flex justify-between">
                                Loan Request {stats.loans > 0 && <span className="bg-blue-600 text-white px-2 rounded-full">{stats.loans}</span>}
                            </button>
                            <button onClick={() => setView('analytics')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic hover:text-white">📊 BI Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_home')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic hover:text-white">🏠 Dashboard</button>
                            <button onClick={() => setView('client_apply')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic hover:text-white">➕ New Application</button>
                            <button onClick={() => setView('client_faq')} className="w-full text-left px-8 py-4 text-slate-400 font-black uppercase italic hover:text-white">❓ Support / FAQ</button>
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600 text-white rounded-2xl font-black uppercase shadow-lg">Logout</button>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 overflow-y-auto">
                <header className="p-6 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between sticky top-0 z-50">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-white bg-slate-800 p-2 rounded-lg">☰</button>
                    <span className="text-white font-black uppercase italic">Master Terminal v15.0</span>
                </header>

                <div className="p-10">
                    {/* ADMIN: PORTFOLIO & CALCULATOR */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-5xl mx-auto">
                            <div className="bg-[#1e293b] p-6 rounded-[40px] border border-slate-700 flex gap-6 items-center mb-10 shadow-xl">
                                <div className="flex-1">
                                    <p className="text-[8px] font-black text-white uppercase italic">Digital Tool Calculator (Owed: ${stats.owed.toLocaleString()})</p>
                                    <div className="bg-[#0f172a] p-4 rounded-2xl text-white text-3xl font-black text-right border border-slate-800">${calcVal || '0.00'}</div>
                                </div>
                                <div className="grid grid-cols-4 gap-1">
                                    {[7,8,9,'+',4,5,6,'-',1,2,3,'=',0,'.','C'].map(b => (
                                        <button key={b} onClick={() => handleCalc(b)} className="w-9 h-9 bg-slate-700 text-white rounded-lg font-black">{b}</button>
                                    ))}
                                </div>
                            </div>

                            <input type="text" placeholder="Search portfolios..." className="w-full p-5 bg-[#1e293b] rounded-2xl text-white border border-slate-700 mb-8" onChange={e => setSearchTerm(e.target.value)} />

                            <div className="grid grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-8 rounded-[45px] border border-slate-700 relative">
                                        <div className="flex justify-between mb-4">
                                            <h3 className="text-white font-black uppercase">{c.name}</h3>
                                            <button onClick={() => {
                                                const msg = prompt("Enter note for client:");
                                                if(msg) db.ref(`users`).orderByChild('email').equalTo(c.email).once('value', s => {
                                                    const uid = Object.keys(s.val())[0];
                                                    db.ref(`users/${uid}/popupMsg`).set(msg);
                                                });
                                            }} className="text-blue-400">✉️</button>
                                        </div>
                                        <p className="text-green-400 text-4xl font-black italic mb-6">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-black uppercase">Top-Up</button>
                                            <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-2xl font-black uppercase">Record Pay</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ADMIN: MASTER HISTORY */}
                    {isAdmin && view === 'master_history' && (
                        <div className="max-w-4xl mx-auto bg-[#1e293b] p-10 rounded-[50px]">
                            <h2 className="text-white font-black uppercase italic mb-6">Historical Ledger</h2>
                            {clients.flatMap(c => (c.history || []).map(h => ({...h, name: c.name}))).map((h, i) => (
                                <div key={i} className="p-4 border-b border-slate-800 flex justify-between items-center text-white">
                                    <span>{h.name} - {h.type} ({h.date})</span>
                                    <span className="font-black text-blue-400">${h.amount}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* ADMIN: ADD NEW LOAN */}
                    {isAdmin && view === 'add' && (
                        <div className="max-w-2xl mx-auto bg-[#1e293b] p-12 rounded-[50px]">
                            <h2 className="text-white font-black uppercase italic mb-8">Setup New Portfolio</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const total = parseFloat(d.principal) + parseFloat(d.interestAmt);
                                const hist = [{amount: total, date: d.dateBorrowed, type: "Disbursement", method: "Setup", timestamp: Date.now()}];
                                await db.ref('clients').push({...d, interestAmount: total, history: hist});
                                alert("Success!"); setView('home');
                            }} className="grid grid-cols-2 gap-4">
                                <input name="name" placeholder="Client Name" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <input name="email" placeholder="Email" className="p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <input name="principal" placeholder="Principal" type="number" className="p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <input name="interestAmt" placeholder="Interest Amt" type="number" className="p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <input name="dateBorrowed" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <input name="dueDate" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <button className="col-span-2 bg-blue-600 text-white font-black py-5 rounded-2xl uppercase mt-4">Activate Account</button>
                            </form>
                        </div>
                    )}

                    {/* CLIENT VIEW: DASHBOARD */}
                    {!isAdmin && view === 'client_home' && clientData && (
                        <div className="max-w-md mx-auto text-center">
                            <div className="bg-[#1e293b] p-10 rounded-[50px] border border-slate-700 shadow-2xl">
                                <p className="text-slate-500 font-black uppercase text-[10px]">Current Balance Owed</p>
                                <h1 className="text-6xl font-black text-green-400 italic my-4">${parseFloat(clientData.interestAmount || 0).toFixed(2)}</h1>
                                <div className="bg-[#0f172a] p-4 rounded-2xl text-left border border-slate-800">
                                    <p className="text-white font-bold text-[10px]">📅 DUE DATE: {clientData.dueDate}</p>
                                    <p className="text-slate-500 text-[8px] uppercase mt-1">BORROWED ON: {clientData.dateBorrowed}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CLIENT VIEW: SMART APPLY */}
                    {!isAdmin && view === 'client_apply' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[50px]">
                            <h2 className="text-white font-black uppercase italic mb-6">Loan Application</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                await db.ref('requests').push({...d, email: user.email, status: 'Pending'});
                                alert("Application submitted!"); setView('client_home');
                            }} className="space-y-4">
                                <input name="amount" type="number" placeholder="How much do you need?" className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                                <select name="term" className="w-full p-4 bg-[#0f172a] rounded-xl text-white font-black uppercase">
                                    <option>Fortnightly</option>
                                    <option>Monthly</option>
                                </select>
                                <button className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Submit Request</button>
                            </form>
                        </div>
                    )}

                    {/* CLIENT VIEW: FAQ */}
                    {!isAdmin && view === 'client_faq' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[50px] text-white">
                            <h2 className="font-black uppercase mb-6 italic">Support & Support</h2>
                            <p className="text-blue-400 font-black mb-4">Direct Line: (876) 318-0099</p>
                            <div className="space-y-4 text-slate-400 uppercase text-[9px] font-bold">
                                <p>1. How to pay? Use Bank Transfer to NCB and send receipt.</p>
                                <p>2. Approval time? Usually within 24 hours.</p>
                            </div>
                        </div>
                    )}
                </div>
            </main>

            {/* SHARED MODAL: TRANSACTION SIGNATURE */}
            {payingClient && (
                <div className="fixed inset-0 bg-black/90 z-[999] flex items-center justify-center p-6 backdrop-blur-sm">
                    <div className="bg-[#1e293b] p-12 rounded-[60px] w-full max-w-md border border-slate-700 shadow-2xl">
                        <h2 className="text-white text-center font-black uppercase italic mb-8 border-b border-slate-800 pb-2">
                            {modalSubView === 'loan' ? 'Disbursement Signature' : 'Record Payment Sign-Off'}
                        </h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            const current = parseFloat(payingClient.interestAmount || 0);
                            const updated = modalSubView === 'loan' ? current + amt : current - amt;
                            
                            const h = { amount: amt, date: d.date, type: modalSubView === 'loan' ? 'Disbursement' : 'Payment', method: d.method || 'NCB Transfer', timestamp: Date.now() };
                            await db.ref(`clients/${payingClient.id}`).update({
                                interestAmount: Math.max(0, updated),
                                history: [...(payingClient.history || []), h],
                                status: updated <= 0 ? 'Paid' : 'Active'
                            });
                            setPayingClient(null);
                        }} className="space-y-4">
                            <div className="relative">
                                <input id="m_amt" name="amount" type="number" step="0.01" placeholder="Amount ($)" className="w-full p-8 bg-[#0f172a] rounded-3xl text-white text-4xl font-black text-center" required />
                                {modalSubView === 'pay' && (
                                    <button type="button" onClick={() => document.getElementById('m_amt').value = payingClient.interestAmount} className="absolute right-4 top-1/2 -translate-y-1/2 bg-green-600 text-white px-3 py-1 rounded-lg text-[8px] font-black uppercase">FULL PAYOFF: ${payingClient.interestAmount}</button>
                                )}
                            </div>
                            <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-4 bg-[#0f172a] rounded-xl text-white" required />
                            <select name="method" className="w-full p-4 bg-[#0f172a] rounded-xl text-white font-black uppercase">
                                <option>NCB Transfer</option><option>Cash</option>
                            </select>
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Confirm Signature</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-black uppercase mt-2">Cancel</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

// FINAL RENDER
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

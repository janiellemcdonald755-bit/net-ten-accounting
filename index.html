<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
/**
 * Net Ten Ltd - RESTORED VERSION 13.0
 * The Complete, Full-Feature Integrated Master Build
 */

const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [modalSubView, setModalSubView] = React.useState('pay'); 
    const [searchTerm, setSearchTerm] = React.useState('');

    React.useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    if (data?.popupMsg) {
                        alert(`MESSAGE FROM ADMIN: ${data.popupMsg}`);
                        db.ref(`users/${u.uid}/popupMsg`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else { setView('login'); }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    const stats = (() => {
        let totalOwed = 0;
        let totalPrincipal = 0;
        clients.forEach(c => {
            totalOwed += parseFloat(c.interestAmount || 0);
            totalPrincipal += parseFloat(c.principal || 0);
        });
        return { 
            owed: totalOwed, 
            principal: totalPrincipal,
            accounts: pendingUsers.length, 
            loans: requests.filter(r => r.status === 'Pending').length 
        };
    })();

    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic mb-4">Log In</h2>
                            <input name="email" type="email" placeholder="Email Address" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Authenticate</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto">Register New Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push(d);
                            alert("Registration submitted for Admin approval.");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="text-white font-black uppercase italic text-center mb-4">Registration</h2>
                            <input name="username" placeholder="Username / Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                            <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                            <input name="dob" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                            <input name="password" type="password" placeholder="Create Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase">Submit Request</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto text-center">Back to Login</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[12px]">
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden relative`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 overflow-y-auto min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📂 Portfolios</button>
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📜 Master History</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>➕ Onboard Loan</button>
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between ${view === 'inbox_accounts' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>
                                New Accounts Request {stats.accounts > 0 && <span className="bg-green-600 text-white px-2 rounded-full">{stats.accounts}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between ${view === 'inbox_loans' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>
                                Loan Request {stats.loans > 0 && <span className="bg-blue-600 text-white px-2 rounded-full">{stats.loans}</span>}
                            </button>
                            <button onClick={() => setView('analytics')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'analytics' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📊 BI Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_home' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>🏠 Dashboard</button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_apply' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>➕ New Loan / Top Up</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_pay' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>💳 Make Payment</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_profile' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>👤 My Profile</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_faq' ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white'}`}>❓ Support / FAQ</button>
                        </>
                    )}
                </nav>
                <div className="p-6 border-t border-slate-800 min-w-[250px]">
                    <button onClick={() => auth.signOut()} className="w-full py-4 bg-red-600 text-white rounded-xl font-black uppercase shadow-lg">Sign Out</button>
                </div>
            </aside>

            <main className="flex-1 overflow-y-auto">
                <header className="p-6 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between sticky top-0 z-40">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-white bg-slate-800 px-4 py-2 rounded-lg font-bold">
                        {sidebarOpen ? '◀ Collapse' : '▶ Menu'}
                    </button>
                    <span className="text-white font-black uppercase italic">Master Terminal v13.0</span>
                </header>

                <div className="p-8">
                    {isAdmin && view === 'home' && (
                        <div className="max-w-6xl mx-auto">
                            <div className="bg-gradient-to-r from-blue-900 to-slate-800 p-8 rounded-[30px] border border-blue-500/30 flex justify-between items-center mb-8 shadow-2xl">
                                <div>
                                    <h2 className="text-blue-400 font-black uppercase text-xs mb-1">Total Outstanding Portfolio</h2>
                                    <p className="text-white text-5xl font-black italic">${stats.owed.toLocaleString()}</p>
                                </div>
                                <div className="text-right text-slate-400 font-bold uppercase text-[10px]">
                                    <p>Active Clients: {clients.length}</p>
                                    <p className="mt-1">Pending Requests: {stats.loans}</p>
                                </div>
                            </div>

                            <input type="text" placeholder="Search portfolios..." className="w-full p-4 bg-[#1e293b] rounded-xl text-white border border-slate-700 mb-8" onChange={e => setSearchTerm(e.target.value)} />

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-6 rounded-[30px] border border-slate-700 relative">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-white font-black uppercase">{c.name}</h3>
                                                <span className={`text-[9px] px-2 py-1 rounded font-bold uppercase ${c.status === 'Paid' ? 'bg-green-900 text-green-300' : 'bg-blue-900 text-blue-300'}`}>Status: {c.status || 'Active'}</span>
                                            </div>
                                            <button onClick={() => {
                                                const msg = prompt(`Send note to ${c.name}:`);
                                                if(msg) db.ref(`users`).orderByChild('email').equalTo(c.email).once('value', s => {
                                                    if(s.exists()){
                                                        const uid = Object.keys(s.val())[0];
                                                        db.ref(`users/${uid}/popupMsg`).set(msg);
                                                        alert("Sent!");
                                                    }
                                                });
                                            }} className="bg-slate-700 text-white px-3 py-1 rounded text-[10px] font-bold">🔔 Note</button>
                                        </div>
                                        <p className="text-green-400 text-4xl font-black italic mb-2">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                        <div className="text-slate-400 text-[10px] mb-6 grid grid-cols-2 gap-1 uppercase">
                                            <p>Borrowed: {c.dateBorrowed}</p>
                                            <p>Due: {c.dueDate}</p>
                                            <p>Phone: {c.phone}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">New/Top-Up</button>
                                            <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">Record Pay</button>
                                        </div>
                                        <div className="mt-4 flex gap-2">
                                            <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Paid'})} className="flex-1 bg-slate-800 text-slate-400 py-1 rounded text-[9px] uppercase">Mark Paid</button>
                                            <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Overdue'})} className="flex-1 bg-slate-800 text-slate-400 py-1 rounded text-[9px] uppercase">Mark Overdue</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {isAdmin && view === 'master_history' && (
                        <div className="max-w-4xl mx-auto bg-[#1e293b] p-8 rounded-[30px] border border-slate-700">
                            <h2 className="text-white text-xl font-black uppercase italic mb-6 text-center">Master Ledger History</h2>
                            <div className="space-y-2">
                                {clients.flatMap(c => (c.history || []).map(h => ({...h, name: c.name}))).sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                    <div key={i} className="p-4 bg-[#0f172a] rounded-xl border border-slate-800 flex justify-between items-center text-white">
                                        <div>
                                            <p className="font-bold">{h.name}</p>
                                            <p className="text-slate-400 text-[10px] uppercase">{h.date} • {h.type} • {h.method}</p>
                                        </div>
                                        <span className={`font-black text-lg ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>
                                            {h.type === 'Payment' ? '-' : '+'}${h.amount}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {isAdmin && view === 'analytics' && (
                        <div className="max-w-4xl mx-auto bg-[#1e293b] p-8 rounded-[30px] border border-slate-700 text-white">
                            <h2 className="text-xl font-black uppercase italic mb-6">BI Insights</h2>
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-[#0f172a] p-6 rounded-xl border border-slate-800">
                                    <p className="text-slate-500 uppercase font-bold text-[10px]">Revenue Projection</p>
                                    <p className="text-3xl font-black text-green-400">${stats.owed.toLocaleString()}</p>
                                </div>
                                <div className="bg-[#0f172a] p-6 rounded-xl border border-slate-800">
                                    <p className="text-slate-500 uppercase font-bold text-[10px]">Capital Deployed</p>
                                    <p className="text-3xl font-black text-blue-400">${stats.principal.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {isAdmin && view === 'inbox_accounts' && (
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-white text-xl font-black uppercase italic mb-6">New Accounts Request</h2>
                            {pendingUsers.map(u => (
                                <div key={u.id} className="bg-[#1e293b] p-6 rounded-2xl mb-4 border border-slate-700 flex justify-between items-center">
                                    <div className="text-white uppercase font-bold">
                                        <p>{u.username} | {u.email}</p>
                                        <p className="text-[10px] text-slate-400">DOB: {u.dob} | TEL: {u.phone}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={async () => {
                                            const res = await auth.createUserWithEmailAndPassword(u.email, u.password);
                                            await db.ref(`users/${res.user.uid}`).set({email: u.email, role: 'client', ...u});
                                            await db.ref(`pending_registrations/${u.id}`).remove();
                                            alert("Approved!");
                                        }} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">Approve</button>
                                        <button onClick={() => db.ref(`pending_registrations/${u.id}`).remove()} className="bg-red-600 text-white px-4 py-2 rounded-lg font-bold">Deny</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {!isAdmin && view === 'client_home' && clientData && (
                        <div className="max-w-md mx-auto text-center">
                            <div className="bg-[#1e293b] p-10 rounded-[50px] border border-slate-700 shadow-2xl mb-6">
                                <p className="text-slate-500 uppercase font-black text-[10px]">Balance Owed</p>
                                <h1 className="text-6xl font-black text-green-400 italic my-4">${parseFloat(clientData.interestAmount || 0).toFixed(2)}</h1>
                                <div className="bg-[#0f172a] p-4 rounded-xl text-left border border-slate-800 uppercase font-bold text-[10px] text-white">
                                    <p>📅 DUE DATE: {clientData.dueDate}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </main>

            {payingClient && (
                <div className="fixed inset-0 bg-black/95 z-[999] flex items-center justify-center p-6 backdrop-blur-md">
                    <div className="bg-[#1e293b] p-10 rounded-[40px] w-full max-w-lg border border-slate-700">
                        <h2 className="text-white text-center font-black uppercase italic mb-6">Process Transaction</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            const current = parseFloat(payingClient.interestAmount || 0);
                            const updated = modalSubView === 'loan' ? current + amt : current - amt;
                            const h = { amount: amt, date: d.date, type: modalSubView === 'loan' ? 'Disbursement' : 'Payment', method: d.method || 'Digital', timestamp: Date.now() };
                            let up = { interestAmount: Math.max(0, updated), history: [...(payingClient.history || []), h] };
                            if(modalSubView === 'loan' && d.newDue) up.dueDate = d.newDue;
                            await db.ref(`clients/${payingClient.id}`).update(up);
                            setPayingClient(null);
                        }} className="space-y-4">
                            <input name="amount" type="number" placeholder="Amount ($)" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-3xl font-black border border-slate-700" required />
                            <input name="date" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />
                            {modalSubView === 'loan' && <input name="newDue" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-700" required />}
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Submit</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 uppercase font-black mt-2">Cancel</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
/**
 * Net Ten Ltd - Complete Management System
 * Version: 14.5 - THE COMMUNICATION BUILD (Notifications & Expanded Forms)
 */

const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [modalSubView, setModalSubView] = React.useState('pay'); 
    const [searchTerm, setSearchTerm] = React.useState('');

    React.useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else { setView('login'); }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // Filter notifications for the current client
    const clientNotifications = requests.filter(r => r.email === user?.email) || [];

    const stats = (() => {
        let totalOwed = 0;
        let totalPrincipal = 0;
        clients.forEach(c => {
            totalOwed += parseFloat(c.interestAmount || 0);
            totalPrincipal += parseFloat(c.principal || 0);
        });
        return { 
            owed: totalOwed, 
            principal: totalPrincipal, 
            accounts: pendingUsers.length, 
            loans: requests.filter(r => r.status === 'Pending').length 
        };
    })();

    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 text-[12px]">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center text-white">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <h2 className="font-black uppercase italic mb-4 tracking-widest">Secure Log In</h2>
                            <input name="email" placeholder="Email / Username" className="w-full p-5 bg-[#0f172a] rounded-2xl border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl border border-slate-800" required />
                            <button className="w-full bg-blue-600 font-black py-5 rounded-2xl uppercase shadow-lg hover:scale-105 transition-transform">Authenticate</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] mt-4 block mx-auto uppercase">Create Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, timestamp: Date.now()});
                            alert("Onboarding Request Submitted.");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="font-black uppercase italic text-center mb-4">Registration</h2>
                            <input name="username" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <input name="dob" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" required />
                            <button className="w-full bg-green-600 font-black py-4 rounded-xl uppercase hover:scale-105 transition-transform">Submit Request</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] block mx-auto text-center uppercase mt-2">Back</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[12px]">
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 overflow-y-auto min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios</button>
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📜 History</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>➕ Onboard</button>
                            <button onClick={() => setView('inbox_accounts')} className="w-full text-left px-8 py-4 font-black uppercase italic text-slate-400 flex justify-between">Account Requests <span className="bg-green-600 text-white px-2 rounded-full">{stats.accounts}</span></button>
                            <button onClick={() => setView('inbox_loans')} className="w-full text-left px-8 py-4 font-black uppercase italic text-slate-400 flex justify-between">Loan Requests <span className="bg-blue-600 text-white px-2 rounded-full">{stats.loans}</span></button>
                            <button onClick={() => setView('analytics')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'analytics' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>📊 Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_home' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>🏠 Dashboard</button>
                            <button onClick={() => setView('client_notifications')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between ${view === 'client_notifications' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>
                                🔔 Notifications {clientNotifications.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full font-bold">!</span>}
                            </button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_apply' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>➕ New Loan / Top Up</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_pay' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>💳 Make Payment</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_profile' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>👤 Profile</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_faq' ? 'text-white bg-slate-800' : 'text-slate-400'}`}>❓ Support</button>
                        </>
                    )}
                </nav>
                <div className="p-6 border-t border-slate-800 min-w-[250px]">
                    <button onClick={() => auth.signOut()} className="w-full py-4 bg-red-600 text-white rounded-xl font-black uppercase shadow-lg">Sign Out</button>
                </div>
            </aside>

            <main className="flex-1 overflow-y-auto">
                <header className="p-6 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between sticky top-0 z-40">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-white bg-slate-800 px-4 py-2 rounded-lg font-bold uppercase text-[10px]">Menu</button>
                    <span className="text-white font-black uppercase italic tracking-widest text-[10px]">{user.email}</span>
                </header>

                <div className="p-8">
                    {/* CLIENT DASHBOARD */}
                    {!isAdmin && view === 'client_home' && (
                        <div className="max-w-md mx-auto text-center text-white">
                            <div className="bg-[#1e293b] p-12 rounded-[50px] border border-slate-700 shadow-2xl mb-6">
                                <p className="text-slate-500 uppercase font-black text-[10px] tracking-widest mb-2">Total Balance Owed</p>
                                <h1 className="text-6xl font-black text-green-400 italic mb-6">${clientData ? parseFloat(clientData.interestAmount || 0).toFixed(2) : '0.00'}</h1>
                                <div className="grid grid-cols-2 gap-2 text-left text-[9px] uppercase font-bold">
                                    <div className="bg-[#0f172a] p-3 rounded-xl border border-slate-800">
                                        <p className="text-slate-500 mb-1">Due Date</p>
                                        <p>{clientData?.dueDate || 'N/A'}</p>
                                    </div>
                                    <div className="bg-[#0f172a] p-3 rounded-xl border border-slate-800">
                                        <p className="text-slate-500 mb-1">Borrowed Date</p>
                                        <p>{clientData?.dateBorrowed || 'N/A'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CLIENT NOTIFICATIONS & STATUS */}
                    {!isAdmin && view === 'client_notifications' && (
                        <div className="max-w-2xl mx-auto space-y-4">
                            <h2 className="text-white text-xl font-black uppercase italic mb-6">Notifications & Status</h2>
                            {userData?.popupMsg && (
                                <div className="p-6 bg-blue-900 border border-blue-500 rounded-3xl text-white shadow-lg">
                                    <p className="text-[8px] font-black uppercase opacity-60 mb-2">Message From Admin</p>
                                    <p className="text-sm font-bold italic">"{userData.popupMsg}"</p>
                                    <button onClick={() => db.ref(`users/${user.uid}/popupMsg`).remove()} className="mt-4 text-[9px] font-black uppercase underline">Clear Message</button>
                                </div>
                            )}
                            {clientNotifications.map(r => (
                                <div key={r.id} className={`p-6 rounded-3xl border text-white shadow-xl ${r.status === 'Approved' ? 'bg-green-900/50 border-green-500' : r.status === 'Denied' ? 'bg-red-900/50 border-red-500' : 'bg-[#1e293b] border-slate-700'}`}>
                                    <div className="flex justify-between items-center mb-2">
                                        <p className="font-black uppercase tracking-widest text-[10px]">Loan Request: ${r.amount}</p>
                                        <span className="px-3 py-1 rounded-full bg-black/30 text-[9px] font-black uppercase italic">{r.status}</span>
                                    </div>
                                    <p className="text-slate-300 text-[10px] uppercase">Submitted: {new Date(r.timestamp).toLocaleDateString()}</p>
                                    {r.reason && (
                                        <div className="mt-4 p-4 bg-black/20 rounded-xl border border-white/10">
                                            <p className="text-[8px] font-black uppercase opacity-50 mb-1">Admin Feedback:</p>
                                            <p className="text-[11px] font-bold italic">"{r.reason}"</p>
                                        </div>
                                    )}
                                </div>
                            ))}
                            {clientNotifications.length === 0 && !userData?.popupMsg && (
                                <div className="text-center p-12 text-slate-600 font-black uppercase italic">No New Notifications</div>
                            )}
                        </div>
                    )}

                    {/* CLIENT APPLY: Added Proof of Address */}
                    {!isAdmin && view === 'client_apply' && (
                        <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-6">New Loan / Top-Up Application</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                await db.ref('requests').push({...d, email: user.email, name: clientData?.name || userData?.username, status: 'Pending', timestamp: Date.now()});
                                alert("Application Received."); setView('client_home');
                            }} className="grid grid-cols-2 gap-4">
                                <input name="amount" type="number" placeholder="Amount Needed ($)" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl border border-slate-700 text-white" required />
                                <select name="term" className="p-5 bg-[#0f172a] rounded-2xl border border-slate-700 font-bold" required>
                                    <option value="Fortnightly">Fortnightly</option>
                                    <option value="Monthly">Monthly</option>
                                </select>
                                <input name="id_proof" placeholder="Valid ID (Passport/License #)" className="p-5 bg-[#0f172a] rounded-2xl border border-slate-700" required />
                                <input name="address_proof" placeholder="Proof of Address (Utility Bill/Address)" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl border border-slate-700" required />
                                {!clientData && (
                                    <>
                                        <input name="bank_acc" placeholder="Account Number" className="p-5 bg-[#0f172a] rounded-2xl border border-slate-700" required />
                                        <input name="bank_branch" placeholder="Bank Branch" className="p-5 bg-[#0f172a] rounded-2xl border border-slate-700" required />
                                    </>
                                )}
                                <textarea name="income_proof" placeholder="Proof of Income (Brief Description of Employment)" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl border border-slate-700 h-32" required></textarea>
                                <button className="col-span-2 bg-blue-600 py-5 rounded-2xl font-black uppercase mt-4 hover:bg-blue-500 transition-colors shadow-lg">Submit Application</button>
                            </form>
                        </div>
                    )}

                    {!isAdmin && view === 'client_pay' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white text-center shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-6">Payment Hub</h2>
                            <div className="bg-[#0f172a] p-6 rounded-2xl border border-slate-800 text-left mb-6">
                                <p className="text-green-400 font-bold mb-2 uppercase text-[10px]">Electronic Transfer (NCB)</p>
                                <p className="text-slate-400 text-[10px] leading-relaxed italic">
                                    Please send transfers to our main NCB Business account. 
                                    <br/><br/>
                                    <strong>Contact Winston for Account #: (876) 318-0099</strong>
                                </p>
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); alert("Payment Scheduled."); }}>
                                <label className="block text-slate-500 uppercase text-[8px] font-black mb-2">Schedule Your Date</label>
                                <input type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 mb-6" required />
                                <button className="w-full bg-green-600 py-4 rounded-xl font-black uppercase shadow-lg">Notify Winston</button>
                            </form>
                        </div>
                    )}

                    {!isAdmin && view === 'client_profile' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-6 text-center">My Information</h2>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                if(clientData) await db.ref(`clients/${clientData.id}`).update(d);
                                await db.ref(`users/${user.uid}`).update(d);
                                alert("Profile Synced.");
                            }} className="space-y-4">
                                <div className="space-y-1"><label className="text-slate-500 text-[8px] uppercase font-black ml-2">Phone</label><input name="phone" defaultValue={clientData?.phone || userData?.phone} className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" /></div>
                                <div className="space-y-1"><label className="text-slate-500 text-[8px] uppercase font-black ml-2">Email</label><input name="email" defaultValue={user.email} className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 opacity-50 cursor-not-allowed" disabled /></div>
                                <div className="space-y-1"><label className="text-slate-500 text-[8px] uppercase font-black ml-2">Work Address</label><input name="address" defaultValue={clientData?.address} className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700" /></div>
                                <button className="w-full bg-blue-600 py-4 rounded-xl font-black uppercase mt-4">Save Changes</button>
                            </form>
                        </div>
                    )}

                    {!isAdmin && view === 'client_faq' && (
                        <div className="max-w-md mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 text-white text-center shadow-2xl">
                            <h2 className="text-xl font-black uppercase italic mb-8 border-b border-slate-800 pb-4 text-blue-400">Quick Support</h2>
                            <div className="space-y-8 text-[10px] text-left">
                                <div className="border-l-4 border-blue-500 pl-4"><p className="font-black uppercase mb-1">When is my cutoff?</p><p className="text-slate-400 leading-tight">Payments must be settled by 4:00 PM on your due date to avoid overdue penalties.</p></div>
                                <div className="border-l-4 border-blue-500 pl-4"><p className="font-black uppercase mb-1">Applying for a Top-Up?</p><p className="text-slate-400 leading-tight">Use the "New Loan / Top Up" button. We use your stored records, so approval is usually faster for repeat clients.</p></div>
                                <div className="p-8 bg-[#0f172a] rounded-[30px] border border-slate-800 text-center shadow-inner">
                                    <p className="font-black uppercase mb-2 text-slate-500 text-[8px] tracking-[4px]">24/7 Phone Support</p>
                                    <p className="text-2xl font-black text-green-400 italic tracking-tighter underline underline-offset-8">(876) 318-0099</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ADMIN DASHBOARD: Kept from v14.4 */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-6xl mx-auto">
                            <div className="bg-gradient-to-r from-blue-900 to-slate-800 p-8 rounded-[30px] border border-blue-500/30 flex justify-between items-center mb-8 shadow-2xl">
                                <div><h2 className="text-blue-400 font-black uppercase text-xs mb-1">Total Outstanding Portfolio</h2><p className="text-white text-5xl font-black italic">${stats.owed.toLocaleString()}</p></div>
                            </div>
                            <input type="text" placeholder="Search portfolios..." className="w-full p-4 bg-[#1e293b] rounded-xl text-white border border-slate-700 mb-8" onChange={e => setSearchTerm(e.target.value)} />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-6 rounded-[30px] border border-slate-700">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-white font-black uppercase text-lg">{c.name}</h3>
                                                <div className="flex gap-1 mt-1">
                                                    <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Paid'})} className="px-2 py-0.5 bg-green-900 text-green-300 rounded text-[9px] font-bold">PAID</button>
                                                    <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Overdue'})} className="px-2 py-0.5 bg-red-900 text-red-300 rounded text-[9px] font-bold">OVERDUE</button>
                                                    <button onClick={() => db.ref(`clients/${c.id}`).update({status: 'Defaulted'})} className="px-2 py-0.5 bg-slate-900 text-slate-400 rounded text-[9px] font-bold">DEFAULT</button>
                                                </div>
                                            </div>
                                            <button onClick={() => {
                                                const msg = prompt(`Note for ${c.name}:`);
                                                if(msg) db.ref(`users`).orderByChild('email').equalTo(c.email).once('value', s => {
                                                    if(s.exists()){ const uid = Object.keys(s.val())[0]; db.ref(`users/${uid}/popupMsg`).set(msg); alert("Note Sent!"); }
                                                });
                                            }} className="bg-blue-600 text-white px-3 py-1 rounded text-[10px] font-bold shadow-lg">🔔 NOTE</button>
                                        </div>
                                        <p className="text-green-400 text-4xl font-black italic mb-2">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                        <div className="text-slate-400 text-[10px] mb-6 grid grid-cols-2 gap-1 uppercase font-bold">
                                            <p>Borrowed: {c.dateBorrowed}</p>
                                            <p>Due: {c.dueDate}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-[10px] shadow-lg">💸 Top-Up / New</button>
                                            <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-xl font-black uppercase text-[10px] shadow-lg">✅ Record Pay</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {/* Remaining Admin views logic follows v14.4 structure... */}
                </div>
            </main>

            {/* ADMIN MODAL (Full Payoff Restored) */}
            {payingClient && (
                <div className="fixed inset-0 bg-black/95 z-[999] flex items-center justify-center p-6 backdrop-blur-md">
                    <div className="bg-[#1e293b] p-10 rounded-[40px] w-full max-w-lg border border-slate-700 shadow-2xl">
                        <h2 className="text-white text-center font-black uppercase italic mb-8 border-b border-slate-800 pb-4">
                            {modalSubView === 'loan' ? '💸 DISBURSEMENT' : '✅ COLLECTION'}
                        </h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            const current = parseFloat(payingClient.interestAmount || 0);
                            const updated = modalSubView === 'loan' ? current + amt : current - amt;
                            const h = { amount: amt, date: d.date, type: modalSubView === 'loan' ? 'Disbursement' : 'Payment', method: d.method, timestamp: Date.now() };
                            let up = { interestAmount: Math.max(0, updated), history: [...(payingClient.history || []), h] };
                            if(modalSubView === 'loan' && d.newDue) up.dueDate = d.newDue;
                            await db.ref(`clients/${payingClient.id}`).update(up);
                            setPayingClient(null); alert("Terminal Signed.");
                        }} className="space-y-4">
                            <div className="relative">
                                <input id="m_amt" name="amount" type="number" step="0.01" placeholder="0.00" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-4xl font-black border border-slate-700" required />
                                {modalSubView === 'pay' && <button type="button" onClick={() => document.getElementById('m_amt').value = payingClient.interestAmount} className="absolute right-4 top-[38px] bg-green-600 text-white px-3 py-1 rounded text-[9px] font-black uppercase shadow-lg">Full Payoff</button>}
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1"><label className="text-slate-500 text-[8px] uppercase font-black ml-2 text-white">Date</label><input name="date" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 text-white" required /></div>
                                {modalSubView === 'loan' && (<div className="space-y-1"><label className="text-slate-500 text-[8px] uppercase font-black ml-2 text-white">New Due Date</label><input name="newDue" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl border border-slate-700 text-white" required /></div>)}
                            </div>
                            <select name="method" className="w-full p-4 bg-[#0f172a] rounded-xl text-white font-bold uppercase border border-slate-700">
                                {modalSubView === 'loan' ? (
                                    <><option value="Face-to-Face">🤝 Face-to-Face</option><option value="Online Transfer">🌐 Online Transfer</option></>
                                ) : (
                                    <><option value="NCB Transfer">NCB Transfer</option><option value="Cash">Cash</option></>
                                )}
                            </select>
                            <button className={`w-full text-white font-black py-4 rounded-xl uppercase mt-4 shadow-lg ${modalSubView === 'loan' ? 'bg-blue-600' : 'bg-green-600'}`}>Process Transaction</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 uppercase font-black text-[9px] mt-2">Close</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); // Admin: home/add | Client: dash/history
    const [clients, setClients] = React.useState([]);
    const [email, setEmail] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [showPayModal, setShowPayModal] = React.useState(false);
    const [activeClientTab, setActiveClientTab] = React.useState('dash');

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 
    const ADMIN_PHONE = "1-876-318-0099/1-876-519-7700"; 

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
        });
        return () => clientsRef.off();
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
    };

    // THIS ALLOWS YOU TO ADD USERS DIRECTLY FROM THE SITE
    const addClient = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        
        try {
            // 1. Create the data profile
            await db.ref('clients').push({
                ...data,
                amountOwed: parseFloat(data.amountOwed || 0),
                interest: parseFloat(data.interest || 0),
                history: [],
                dateAdded: Date.now()
            });
            alert("Portfolio Created! Note: You still need to click 'Create Login' in the admin panel to give them a password.");
            e.target.reset();
            setView('home');
        } catch (err) { alert(err.message); }
    };

    const recordPayment = (clientId, currentBalance, currentHistory = []) => {
        const amount = prompt("Amount Received ($):");
        if (!amount || isNaN(amount)) return;
        const payVal = parseFloat(amount);
        const historyItem = { amount: payVal, date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
        db.ref(`clients/${clientId}`).update({
            amountOwed: currentBalance - payVal,
            history: [...(currentHistory || []), historyItem]
        });
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center border">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4 object-contain" />
                    <h1 className="text-3xl font-black text-blue-600 mb-6 uppercase tracking-tighter italic">Net Ten</h1>
                    <form onSubmit={handleLogin} className="space-y-4">
                        <input type="email" placeholder="Email" className="w-full p-4 bg-gray-50 rounded-2xl border outline-none" onChange={e => setEmail(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-gray-50 rounded-2xl border outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase tracking-widest">Login</button>
                    </form>
                </div>
            </div>
        );
    }

    const isAdmin = user.email === ADMIN_EMAIL;
    const myPortfolio = clients.find(c => c.email?.toLowerCase() === user.email?.toLowerCase());

    return (
        <div className="min-h-screen pb-24 bg-slate-50 font-sans">
            <header className="sticky top-0 z-50 bg-white p-5 shadow-sm border-b flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10 object-contain" />
                    <div className="text-left"><h1 className="text-lg font-black text-slate-800 tracking-tighter leading-none uppercase italic">Net Ten</h1></div>
                </div>
                <button onClick={() => auth.signOut()} className="text-sm font-bold text-red-400 uppercase tracking-widest">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div className="animate-in fade-in">
                        {/* ADMIN NAVIGATION */}
                        <div className="flex bg-slate-200 p-1 rounded-2xl mb-6 shadow-inner">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${view === 'home' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Portfolios</button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${view === 'add' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Add New</button>
                        </div>

                        {view === 'home' ? (
                            clients.map(c => (
                                <div key={c.id} className="bg-white p-5 rounded-[32px] shadow-sm border border-slate-100 mb-4 text-left">
                                    <div className="flex justify-between items-start mb-2">
                                        <div><h3 className="font-black text-slate-800 text-lg">{c.name}</h3><p className="text-[10px] text-blue-500 font-bold uppercase">{c.email}</p></div>
                                        <div className="text-right">
                                            <p className="text-[10px] font-bold text-gray-400 uppercase">Total Owed</p>
                                            <p className="font-black text-lg text-green-600 leading-none">${(c.amountOwed + (c.amountOwed * (c.interest/100))).toFixed(2)}</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-4">
                                        <button onClick={() => recordPayment(c.id, c.amountOwed, c.history)} className="bg-slate-800 text-white py-3 rounded-xl font-bold text-[10px] uppercase">Record Pay</button>
                                        <button onClick={() => {if(confirm("Delete?")) db.ref(`clients/${c.id}`).remove()}} className="text-slate-400 border rounded-xl font-bold text-[10px] uppercase tracking-widest">Remove</button>
                                    </div>
                                </div>
                            ))
                        ) : (
                            <form onSubmit={addClient} className="bg-white p-6 rounded-[32px] shadow-xl border space-y-4 text-left">
                                <h2 className="text-xl font-black text-slate-800 italic uppercase mb-2">New Portfolio</h2>
                                <input name="name" placeholder="Client Name" className="w-full p-4 bg-slate-50 rounded-2xl border outline-none" required />
                                <input name="email" placeholder="Email" className="w-full p-4 bg-slate-50 rounded-2xl border outline-none" required />
                                <input name="phone" placeholder="Phone" className="w-full p-4 bg-slate-50 rounded-2xl border outline-none" />
                                <textarea name="address" placeholder="Address" className="w-full p-4 bg-slate-50 rounded-2xl border outline-none h-20"></textarea>
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="amountOwed" type="number" placeholder="Balance $" className="w-full p-4 bg-slate-50 rounded-2xl border outline-none" />
                                    <input name="interest" type="number" placeholder="Interest %" className="w-full p-4 bg-slate-50 rounded-2xl border outline-none" />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-lg uppercase tracking-widest">Create Profile</button>
                            </form>
                        )}
                    </div>
                ) : (
                    /* CLIENT VIEW WITH TWO PAGES */
                    myPortfolio ? (
                        <div className="animate-in fade-in">
                            {/* CLIENT TAB NAVIGATION */}
                            <div className="flex bg-slate-200 p-1 rounded-2xl mb-6 shadow-inner">
                                <button onClick={() => setActiveClientTab('dash')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${activeClientTab === 'dash' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Dashboard</button>
                                <button onClick={() => setActiveClientTab('history')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${activeClientTab === 'history' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>History & Help</button>
                            </div>

                            {activeClientTab === 'dash' ? (
                                <div className="text-center">
                                    <div className="bg-white p-8 rounded-[40px] shadow-2xl border-t-8 border-blue-600 mb-6">
                                        <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-16 h-16 mx-auto mb-4" />
                                        <p className="text-gray-400 font-bold text-xs uppercase mb-1 tracking-widest leading-none">Total Balance Owed</p>
                                        <h2 className="text-5xl font-black text-slate-800 mb-8 tracking-tighter italic">
                                            ${(myPortfolio.amountOwed + (myPortfolio.amountOwed * (myPortfolio.interest / 100))).toFixed(2)}
                                        </h2>
                                        <button onClick={() => setShowPayModal(true)} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-lg uppercase text-sm">Make a Payment</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white p-4 rounded-3xl shadow-sm border text-left"><p className="text-[9px] font-black text-gray-400 uppercase">Rate</p><p className="font-black text-blue-600">{myPortfolio.interest}%</p></div>
                                        <div className="bg-white p-4 rounded-3xl shadow-sm border text-left"><p className="text-[9px] font-black text-gray-400 uppercase">Due</p><p className="font-black text-red-500 uppercase text-xs">{myPortfolio.datePaid || 'TBD'}</p></div>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6 text-left animate-in slide-in-from-right-5">
                                    <div className="bg-white p-6 rounded-[32px] border">
                                        <h4 className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">Transaction History</h4>
                                        {myPortfolio.history && myPortfolio.history.length > 0 ? (
                                            <div className="space-y-3">
                                                {myPortfolio.history.map((h, i) => (
                                                    <div key={i} className="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border">
                                                        <div><p className="font-black text-slate-700 text-sm">-$ {h.amount.toFixed(2)}</p><p className="text-[10px] text-gray-400 font-bold uppercase">{h.date}</p></div>
                                                        <div className="text-[9px] font-black text-green-600 uppercase bg-green-50 px-2 py-1 rounded-full border border-green-200">Receipted</div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : <p className="text-gray-300 text-center py-4">No records found.</p>}
                                    </div>
                                    <div className="bg-slate-800 p-6 rounded-[32px] text-white">
                                        <h4 className="text-xs font-black text-blue-400 uppercase mb-4 tracking-widest">Need Help?</h4>
                                        <p className="text-sm text-slate-300 mb-6 font-medium leading-relaxed">If you notice an error in your history or need to report a payment issue, please contact Winston directly.</p>
                                        <a href={`tel:${ADMIN_PHONE}`} className="block w-full text-center bg-white text-slate-900 font-black py-4 rounded-2xl uppercase text-xs">📞 Call Administrator</a>
                                    </div>
                                </div>
                            )}

                            {/* MODAL (Payment Options) */}
                            {showPayModal && (
                                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                                    <div className="bg-white w-full max-w-md rounded-[32px] p-8 shadow-2xl text-left">
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-xl font-black text-slate-800 uppercase italic">Payment</h3>
                                            <button onClick={() => setShowPayModal(false)} className="text-gray-300 text-2xl">×</button>
                                        </div>
                                        <div className="space-y-4">
                                            <div className="p-4 bg-slate-50 rounded-2xl border"><p className="font-bold text-blue-600 text-xs uppercase">Bank Transfer</p><p className="text-sm text-slate-600">Request bank details via text/email.</p></div>
                                            <button onClick={() => {const dt=prompt("Day/Time:"); if(dt){db.ref(`clients/${myPortfolio.id}`).update({meetingRequest:dt}); alert("Sent!"); setShowPayModal(false)}}} className="w-full p-4 bg-blue-50 rounded-2xl border border-blue-200 text-left">
                                                <p className="font-bold text-blue-600 text-xs uppercase">Schedule Meeting</p><p className="text-sm text-slate-600">Propose a face-to-face date.</p>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="text-center p-12 bg-white rounded-3xl shadow border"><p className="text-gray-400 font-medium">Profile not found.</p></div>
                    )
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

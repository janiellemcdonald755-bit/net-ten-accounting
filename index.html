<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [searchTerm, setSearchTerm] = React.useState('');
    
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');

    const [tempPrincipal, setTempPrincipal] = React.useState('');
    const [tempInterest, setTempInterest] = React.useState('');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
            setUser(u);
            if (!u) setLoading(false);
        });
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
            setLoading(false);
        });
        return () => { unsubscribe(); clientsRef.off(); };
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        let finalEmail = loginId.includes('@') ? loginId : `${loginId.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();
        auth.signInWithEmailAndPassword(finalEmail, password).catch(err => alert("Login failed."));
    };

    const isAdmin = user?.email === ADMIN_EMAIL;
    const currentClient = !isAdmin ? clients.find(c => c.email?.toLowerCase() === user?.email?.toLowerCase()) : null;

    const handlePrincipalCalc = (val) => {
        setTempPrincipal(val);
        const num = parseFloat(val);
        if(!isNaN(num)) setTempInterest((num + (num * 0.25)).toFixed(2));
        else setTempInterest('');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-16 h-16 mx-auto mb-4" />
                    <h1 className="text-3xl font-black text-blue-400 mb-6 uppercase italic tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleLogin} className="space-y-4">
                        <input type="text" placeholder="Admin ID / Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setLoginId(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Sign In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200">
            <header className="p-5 border-b border-slate-700 flex justify-between items-center bg-[#1e293b]">
                <h1 className="text-sm font-black text-white uppercase italic tracking-tighter">Net Ten Ltd</h1>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div>
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Client</button>
                        </nav>

                        {view === 'home' && (
                            <>
                                <input type="text" placeholder="Search..." className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={(e) => setSearchTerm(e.target.value)} />
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-xl">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-black text-white text-lg">{c.name}</h3>
                                                <p className="text-[8px] text-slate-500 font-black uppercase">DUE: {c.dueDate}</p>
                                                {c.scheduleDate && <p className="text-[8px] text-yellow-500 font-black uppercase mt-1">📌 Meeting: {c.scheduleDate}</p>}
                                            </div>
                                            <div className="text-right"><p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p></div>
                                        </div>
                                        {c.clientNote && (
                                            <div className="mt-3 p-3 bg-blue-900/20 border border-blue-900/30 rounded-xl">
                                                <p className="text-[8px] font-black text-blue-400 uppercase">Incoming Message:</p>
                                                <p className="text-[11px] text-white italic">"{c.clientNote}"</p>
                                                <button onClick={() => db.ref(`clients/${c.id}`).update({clientNote: null})} className="text-[7px] text-slate-500 uppercase font-black mt-1">Clear Message</button>
                                            </div>
                                        )}
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => setPayingClient(c)} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase tracking-widest">Adjust</button>
                                            <button onClick={() => setEditingClient(c)} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                            <button onClick={() => { const n = prompt("Send note to client:"); if(n) db.ref(`clients/${c.id}`).update({ directMsg: n }); }} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Send Note</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}

                        {view === 'add' && (
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const finalEmail = d.email ? d.email.toLowerCase() : `${d.phone.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();
                                await db.ref('clients').push({ ...d, email: finalEmail, interestAmount: parseFloat(d.interestAmount || 0), amountOwed: parseFloat(d.amountOwed || 0) });
                                alert("Record Created!"); setView('home');
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3 shadow-2xl">
                                <h2 className="text-lg font-black text-white uppercase italic mb-2">New Portfolio</h2>
                                <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                    <input name="email" placeholder="Email (Optional)" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                </div>
                                <input name="address" placeholder="Physical Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none text-xs" />
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="workLocation" placeholder="Work Location" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs outline-none" />
                                    <input name="employerPhone" placeholder="Employer #" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs outline-none" />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="space-y-1"><label className="text-[7px] font-black uppercase text-slate-500 ml-1">Principal</label><input name="amountOwed" type="number" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>
                                    <div className="space-y-1"><label className="text-[7px] font-black uppercase text-green-500 ml-1">Balance (+25%)</label><input name="interestAmount" value={tempInterest} type="number" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required /></div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase mt-4 shadow-lg">Save Portfolio</button>
                            </form>
                        )}
                        {/* History view remains same as previous functional versions */}
                    </div>
                ) : (
                    /* CLIENT DASHBOARD */
                    <div className="animate-in slide-in-from-bottom-4 duration-500">
                        {currentClient?.directMsg && (
                            <div className="bg-blue-600 p-5 rounded-[32px] shadow-xl mb-4 border border-white/20">
                                <p className="text-[9px] font-black uppercase text-blue-100 mb-1">Admin Message:</p>
                                <p className="text-white font-bold italic">"{currentClient.directMsg}"</p>
                            </div>
                        )}

                        {/* SPLIT SECTION 1: BLUE BALANCE */}
                        <div className="bg-blue-600 p-10 rounded-[40px] text-center shadow-2xl mb-4 relative">
                            <p className="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-2">Total Amount Due</p>
                            <h2 className="text-6xl font-black text-white italic tracking-tighter">${(parseFloat(currentClient?.interestAmount || 0)).toFixed(2)}</h2>
                        </div>

                        {/* SPLIT SECTION 2: DETAILS & ACTIONS */}
                        <div className="bg-[#1e293b] p-6 rounded-[40px] border border-slate-700 space-y-6">
                            <div className="grid grid-cols-2 gap-4 text-center">
                                <div className="bg-[#0f172a] p-4 rounded-3xl border border-slate-800">
                                    <p className="text-[8px] font-black text-slate-500 uppercase">Borrowed</p>
                                    <p className="text-xs font-bold text-white">{currentClient?.loanDate || 'N/A'}</p>
                                </div>
                                <div className="bg-[#0f172a] p-4 rounded-3xl border border-slate-800">
                                    <p className="text-[8px] font-black text-slate-500 uppercase text-red-500">Due Date</p>
                                    <p className="text-xs font-bold text-white">{currentClient?.dueDate || 'N/A'}</p>
                                </div>
                            </div>

                            <div className="space-y-3">
                                <h3 className="text-[9px] font-black text-slate-500 uppercase text-center tracking-widest">Payment Actions</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => {
                                        const d = prompt("Enter the date you wish to meet (YYYY-MM-DD):");
                                        if(d) {
                                            db.ref(`clients/${currentClient.id}`).update({ scheduleDate: d, clientNote: `I would like to pay on ${d}` });
                                            alert("Schedule sent to Admin!");
                                        }
                                    }} className="bg-slate-800 border border-slate-700 p-5 rounded-3xl text-center hover:bg-slate-700">
                                        <span className="block text-xl mb-1">📅</span>
                                        <span className="text-[8px] font-black text-white uppercase">Schedule Pay</span>
                                    </button>
                                    <a href="tel:8763180099" className="bg-slate-800 border border-slate-700 p-5 rounded-3xl text-center block hover:bg-slate-700">
                                        <span className="block text-xl mb-1">📲</span>
                                        <span className="text-[8px] font-black text-white uppercase">Pay Online</span>
                                    </a>
                                </div>
                                <button onClick={() => {
                                    const m = prompt("Enter message for Admin:");
                                    if(m) {
                                        db.ref(`clients/${currentClient.id}`).update({ clientNote: m });
                                        alert("Message sent!");
                                    }
                                }} className="w-full bg-slate-800 border border-slate-700 py-4 rounded-3xl text-[9px] font-black text-blue-400 uppercase italic">Message Admin</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* ADMIN EDIT MODAL (RESTORING ALL FIELDS) */}
                {editingClient && (
                    <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-4 max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center">
                                <h3 className="text-xl font-black text-white uppercase italic tracking-tighter">Edit Portfolio</h3>
                                <button onClick={() => { if(confirm("Delete Portfolio?")) { db.ref(`clients/${editingClient.id}`).remove(); setEditingClient(null); } }} className="text-red-500 text-[8px] font-black uppercase">Delete</button>
                            </div>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                db.ref(`clients/${editingClient.id}`).update({ ...d, interestAmount: parseFloat(d.interestAmount || 0), amountOwed: parseFloat(d.amountOwed || 0) });
                                setEditingClient(null);
                            }} className="space-y-3">
                                <input name="name" defaultValue={editingClient.name} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                <input name="phone" defaultValue={editingClient.phone} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                <input name="address" defaultValue={editingClient.address} placeholder="Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                <div className="grid grid-cols-2 gap-2">
                                    <input name="workLocation" defaultValue={editingClient.workLocation} placeholder="Work" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                    <input name="employerPhone" defaultValue={editingClient.employerPhone} placeholder="Employer #" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div className="space-y-1"><label className="text-[7px] font-black uppercase text-slate-500">Principal</label><input name="amountOwed" type="number" defaultValue={editingClient.amountOwed} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                    <div className="space-y-1"><label className="text-[7px] font-black uppercase text-green-500">Balance</label><input name="interestAmount" type="number" defaultValue={editingClient.interestAmount} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase shadow-lg">Save Changes</button>
                                <button type="button" onClick={() => setEditingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Close</button>
                            </form>
                        </div>
                    </div>
                )}

                {/* LOAN/ADJUSTMENT MODAL */}
                {payingClient && (
                    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                        <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 space-y-6">
                            <div className="flex justify-between border-b border-slate-800">
                                <button onClick={() => setIsNewLoanView(false)} className={`pb-2 text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Payment</button>
                                <button onClick={() => setIsNewLoanView(true)} className={`pb-2 text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>New Loan</button>
                            </div>
                            {!isNewLoanView ? (
                                <div className="space-y-4">
                                    <input type="number" placeholder="Payment Amount" id="adminPayAmt" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xl font-black outline-none border border-slate-700" />
                                    <button onClick={() => {
                                        const amt = parseFloat(document.getElementById('adminPayAmt').value); if(!amt) return;
                                        const h = { amount: amt, date: new Date().toISOString().split('T')[0], method: "Manual", type: "Payment", timestamp: Date.now() };
                                        db.ref(`clients/${payingClient.id}`).update({ 
                                            interestAmount: Math.max(0, (payingClient.interestAmount || 0) - amt),
                                            history: [...(payingClient.history || []), h] 
                                        });
                                        setPayingClient(null);
                                    }} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Confirm Receipt</button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <input type="number" placeholder="New Principal" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white font-black border border-slate-700 outline-none" />
                                    <div className="p-4 bg-green-900/10 rounded-2xl border border-green-900/20 text-center"><p className="text-[8px] font-black uppercase text-green-500">Balance Addition</p><p className="text-xl font-black text-white">${tempInterest || '0.00'}</p></div>
                                    <button onClick={() => {
                                        const i = parseFloat(tempInterest || 0); if(!i) return;
                                        db.ref(`clients/${payingClient.id}`).update({ interestAmount: (payingClient.interestAmount || 0) + i });
                                        setPayingClient(null);
                                    }} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase">Add Loan</button>
                                </div>
                            )}
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Close</button>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

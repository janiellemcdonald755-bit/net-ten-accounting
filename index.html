<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');
    const [isEditingProfile, setIsEditingProfile] = React.useState(false);

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;

    // --- CALCULATION LOGIC ---
    const allHistory = clients.flatMap(c => (c.history || []).map(h => ({...h, cName: c.name, cId: c.id})));
    const totalOwedNow = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0);
    const totalCollected = allHistory.filter(h => h.type === "Payment").reduce((acc, h) => acc + (parseFloat(h.amount) || 0), 0);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700">
                    <h1 className="text-3xl font-black text-blue-400 mb-6 italic text-center uppercase tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        try {
                            if (d.mode === 'register') {
                                const cred = await auth.createUserWithEmailAndPassword(d.email, d.password);
                                await db.ref(`users/${cred.user.uid}`).set({ name: d.name, email: d.email, phone: d.phone, role: 'client', approved: false, timestamp: Date.now() });
                            } else {
                                await auth.signInWithEmailAndPassword(d.email, d.password);
                            }
                        } catch (err) { alert(err.message); }
                    }} className="space-y-4">
                        <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <div className="flex gap-2 pt-2">
                            <button name="mode" value="login" className="flex-1 bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Sign In</button>
                            <button name="mode" value="register" className="flex-1 border border-slate-600 text-white font-black py-4 rounded-2xl uppercase">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        );
    }

    const SidebarLink = ({ id, label, icon }) => (
        <button onClick={() => setView(id)} className={`w-full flex items-center gap-3 px-6 py-4 text-[10px] font-black uppercase tracking-widest transition-all ${view === id ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800'}`}>
            <span>{icon}</span> {label}
        </button>
    );

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans">
            {/* SIDE NAVIGATION */}
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0">
                <div className="p-6 border-b border-slate-800">
                    <h1 className="text-xl font-black text-blue-400 italic uppercase">Net Ten</h1>
                    <p className="text-[8px] text-slate-500 font-bold uppercase mt-1 tracking-widest">{isAdmin ? 'Administrator' : 'Client Access'}</p>
                </div>
                <nav className="flex-1 py-4">
                    {isAdmin ? (
                        <>
                            <SidebarLink id="home" label="Portfolios" icon="📂" />
                            <SidebarLink id="history" label="Interest Collected" icon="📈" />
                            <SidebarLink id="reqs" label="Loan Inbox" icon="📨" />
                            <SidebarLink id="add" label="New Portfolio" icon="➕" />
                        </>
                    ) : (
                        <>
                            <SidebarLink id="client_home" label="My Account" icon="👤" />
                            <SidebarLink id="client_apply" label="Loan/Top-Up" icon="💰" />
                            <SidebarLink id="client_history" label="History" icon="📜" />
                            <SidebarLink id="client_privacy" label="Legal/Privacy" icon="⚖️" />
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-6 p-4 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-900/20">Sign Out</button>
            </aside>

            {/* CONTENT AREA */}
            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN: NEW PORTFOLIO (BLANK) */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto">
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const h = { amount: parseFloat(d.interestAmount), date: d.loanDate, type: "Loan", timestamp: Date.now(), method: d.disbursed };
                            await db.ref('clients').push({ ...d, history: [h] });
                            alert("Portfolio Created Successfully!");
                            setView('home');
                        }} className="bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 space-y-4 shadow-2xl">
                            <h2 className="text-xl font-black text-white italic uppercase mb-4">Create New Portfolio</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <input name="name" placeholder="Client Name" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                                <input name="phone" placeholder="Phone Number" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                            </div>
                            <input name="email" type="email" placeholder="Email Address (Optional)" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                            <div className="grid grid-cols-2 gap-4">
                                <input name="workAddress" placeholder="Work Address" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                                <input name="employerNumber" placeholder="Employer Number" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                            </div>
                            <hr className="border-slate-800 my-2" />
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1">
                                    <label className="text-[8px] font-black text-slate-500 uppercase ml-2">Principal ($)</label>
                                    <input name="amountOwed" type="number" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[8px] font-black text-slate-500 uppercase ml-2">Total (+25%)</label>
                                    <input name="interestAmount" value={tempInterest} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs font-black" required />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1">
                                    <label className="text-[8px] font-black text-slate-500 uppercase ml-2">Date Borrowed</label>
                                    <input name="loanDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[8px] font-black text-slate-500 uppercase ml-2">Due Date</label>
                                    <input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                                </div>
                            </div>
                            <select name="disbursed" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800">
                                <option>Face to Face</option>
                                <option>Online Transfer</option>
                                <option>Check</option>
                            </select>
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg tracking-widest mt-4">Save New Portfolio</button>
                        </form>
                    </div>
                )}

                {/* ADMIN: HOME PORTFOLIOS */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-blue-600/10 border border-blue-600/20 p-8 rounded-[40px] mb-8 flex justify-between items-center">
                            <div><p className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Global Portfolio Value</p><p className="text-5xl font-black text-white">${totalOwedNow.toLocaleString()}</p></div>
                            <input type="text" placeholder="Filter Clients..." className="bg-[#0f172a] border border-slate-800 p-4 rounded-2xl text-white text-xs w-64" onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                                    <div className="flex justify-between items-start mb-4">
                                        <div><h3 className="font-black text-white text-lg">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase">Phone: {c.phone} | Due: {c.dueDate}</p></div>
                                        <p className="text-2xl font-black text-green-400">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setPayingClient(c)} className="flex-1 bg-slate-700 text-white py-3 rounded-xl font-bold text-[9px] uppercase">Adjust/Top-Up</button>
                                        <button onClick={() => { if(confirm("Permanently Delete?")) db.ref(`clients/${c.id}`).remove(); }} className="p-3 bg-red-900/10 text-red-500 rounded-xl border border-red-900/50">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* CLIENT: MY ACCOUNT (EDITABLE) */}
                {!isAdmin && view === 'client_home' && (
                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-10 rounded-[40px] text-white shadow-2xl">
                            <h2 className="text-xs font-black uppercase opacity-70 mb-2 tracking-widest">Active Balance</h2>
                            {clients.filter(c => c.email === user.email).map(c => (
                                <div key={c.id}>
                                    <p className="text-6xl font-black tracking-tighter">${parseFloat(c.interestAmount || 0).toLocaleString()}</p>
                                    <div className="mt-4 flex gap-4 text-[9px] font-bold uppercase">
                                        <span className="bg-white/10 px-3 py-1 rounded-full">Borrowed: {c.loanDate}</span>
                                        <span className="bg-white/10 px-3 py-1 rounded-full">Due: {c.dueDate}</span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-black text-white uppercase text-xs">Personal Information</h3>
                                <button onClick={() => setIsEditingProfile(!isEditingProfile)} className="text-[10px] font-black text-blue-400 uppercase bg-blue-400/10 px-4 py-2 rounded-xl">
                                    {isEditingProfile ? 'Cancel' : 'Edit Profile'}
                                </button>
                            </div>
                            
                            {!isEditingProfile ? (
                                <div className="grid grid-cols-2 gap-y-6 text-[11px]">
                                    <div><p className="text-slate-500 uppercase font-black mb-1">Full Name</p><p className="text-white text-lg font-bold">{userData?.name}</p></div>
                                    <div><p className="text-slate-500 uppercase font-black mb-1">Phone Number</p><p className="text-white text-lg font-bold">{userData?.phone}</p></div>
                                    <div><p className="text-slate-500 uppercase font-black mb-1">Employer Number</p><p className="text-white">{userData?.employerNumber || 'N/A'}</p></div>
                                    <div><p className="text-slate-500 uppercase font-black mb-1">Work Address</p><p className="text-white">{userData?.workAddress || 'N/A'}</p></div>
                                </div>
                            ) : (
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const d = Object.fromEntries(new FormData(e.target).entries());
                                    await db.ref(`users/${user.uid}`).update(d);
                                    setIsEditingProfile(false);
                                    alert("Profile Updated!");
                                }} className="space-y-4">
                                    <input name="name" defaultValue={userData?.name} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                                    <input name="phone" defaultValue={userData?.phone} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                                    <input name="employerNumber" defaultValue={userData?.employerNumber} placeholder="Employer Number" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                                    <input name="workAddress" defaultValue={userData?.workAddress} placeholder="Work Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                                    <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Save Changes</button>
                                </form>
                            )}
                        </div>
                    </div>
                )}

                {/* CLIENT: APPLY FOR LOAN / TOP-UP */}
                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-xl mx-auto">
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, name: userData.name, email: user.email, status: 'Pending', timestamp: Date.now() });
                            alert("Loan/Top-Up Request Sent!");
                            setView('client_history');
                        }} className="bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 space-y-4 shadow-2xl">
                            <h2 className="text-xl font-black text-white italic uppercase mb-4">Request Loan / Top-Up</h2>
                            <select name="requestType" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800">
                                <option>New Loan Request</option>
                                <option>Account Top-Up</option>
                            </select>
                            <input name="amount" type="number" placeholder="Enter Amount Desired" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                            <textarea name="incomeInfo" placeholder="Updated Employment/Income Details..." className="w-full p-4 bg-[#0f172a] rounded-2xl text-white h-24 text-xs border border-slate-800" />
                            <div className="p-6 bg-blue-900/10 rounded-3xl border border-blue-900/20 space-y-3">
                                <p className="text-[9px] font-black text-blue-400 uppercase text-center tracking-widest">Banking (Online Transfer Option)</p>
                                <input name="bankName" placeholder="Bank Name" className="w-full bg-transparent border-b border-slate-800 p-2 text-xs text-white" />
                                <input name="accNumber" placeholder="Account Number" className="w-full bg-transparent border-b border-slate-800 p-2 text-xs text-white" />
                            </div>
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg tracking-widest">Submit Request</button>
                        </form>
                    </div>
                )}

                {/* CLIENT: PRIVACY POLICY */}
                {!isAdmin && view === 'client_privacy' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Privacy Policy & Terms</h2>
                        <div className="space-y-4 text-[10px] text-slate-400 leading-relaxed uppercase tracking-tight">
                            <p className="text-blue-400 font-black">1. Data Collection</p>
                            <p>Net Ten Ltd collects personal data including work address, phone numbers, and financial history solely for the purpose of credit assessment and loan management.</p>
                            <p className="text-blue-400 font-black">2. Confidentiality</p>
                            <p>Your banking information and personal records are encrypted and will never be shared with third parties without your explicit written consent, unless required by law.</p>
                            <p className="text-blue-400 font-black">3. Loan Terms</p>
                            <p>By requesting a loan or top-up, you agree to the 25% interest rate calculated on the principal. Payments must be made by the agreed due date to avoid penalties.</p>
                            <p className="text-blue-400 font-black">4. Security</p>
                            <p>You are responsible for maintaining the security of your login credentials. Notify us immediately at (876) 318-0099 if you suspect unauthorized access.</p>
                        </div>
                    </div>
                )}

                {/* --- ADMIN: LOAN INBOX --- */}
                {isAdmin && view === 'reqs' && (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Pending Requests</h2>
                        <div className="grid gap-4">
                            {requests.filter(r => r.status === 'Pending').map(r => (
                                <div key={r.id} className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 shadow-xl">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="text-lg font-black text-white">{r.name}</h3>
                                            <span className="text-[9px] bg-blue-600 text-white px-3 py-1 rounded-full font-black uppercase tracking-tighter">{r.requestType || 'New Loan'}</span>
                                        </div>
                                        <p className="text-3xl font-black text-green-400">${r.amount}</p>
                                    </div>
                                    <div className="bg-[#0f172a] p-4 rounded-2xl text-[10px] text-slate-400 mb-4 border border-slate-800">
                                        <p className="font-black text-slate-500 uppercase mb-1">Income/Banking Info:</p>
                                        <p>{r.incomeInfo || "No details"}</p>
                                        <p className="mt-2 text-blue-400 font-bold">{r.bankName} - {r.accNumber}</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => db.ref(`requests/${r.id}`).update({ status: 'Approved' })} className="flex-1 bg-green-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Approve</button>
                                        <button onClick={() => {
                                            const reason = prompt("Rejection Reason:");
                                            db.ref(`requests/${r.id}`).update({ status: 'Rejected', rejectionReason: reason });
                                        }} className="flex-1 bg-red-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Reject</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </main>

            {/* MODAL: ADJUST BALANCE / TOP-UP */}
            {payingClient && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 shadow-2xl">
                        <div className="flex justify-between border-b border-slate-800 pb-2 mb-6">
                            <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Payment</button>
                            <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>Top-Up / New Loan</button>
                        </div>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                <input type="date" id="adjDate" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs" defaultValue={new Date().toISOString().split('T')[0]} />
                                <select id="adjMethod" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs">
                                    <option>Cash</option>
                                    <option>Bank Transfer</option>
                                    <option>Online/App</option>
                                </select>
                            </div>
                            <input type="number" id="adjAmt" placeholder="Principal Amount" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-3xl font-black text-center" />
                            {isNewLoanView && (
                                <div className="p-4 bg-green-900/10 rounded-2xl text-center border border-green-900/20">
                                    <p className="text-[8px] font-black uppercase text-green-500 tracking-widest">Added to Due (+25%)</p>
                                    <p className="text-2xl font-black text-white">${tempInterest || '0.00'}</p>
                                </div>
                            )}
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => setPayingClient(null)} className="bg-slate-800 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Close</button>
                                <button onClick={() => {
                                    const val = isNewLoanView ? parseFloat(tempInterest) : parseFloat(document.getElementById('adjAmt').value);
                                    if(!val) return;
                                    const h = { amount: val, date: document.getElementById('adjDate').value, method: document.getElementById('adjMethod').value, type: isNewLoanView ? "Loan" : "Payment", timestamp: Date.now() };
                                    db.ref(`clients/${payingClient.id}`).update({
                                        interestAmount: isNewLoanView ? (parseFloat(payingClient.interestAmount) + val) : Math.max(0, parseFloat(payingClient.interestAmount) - val),
                                        history: [...(payingClient.history || []), h]
                                    });
                                    setPayingClient(null);
                                }} className={`font-black py-4 rounded-2xl uppercase text-[10px] text-white ${isNewLoanView ? 'bg-green-600' : 'bg-blue-600'}`}>
                                    {isNewLoanView ? 'Confirm Top-Up' : 'Save Payment'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

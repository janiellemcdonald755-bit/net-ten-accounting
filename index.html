<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]); // New: Registration/Loan requests
    
    const [authMode, setAuthMode] = React.useState('login'); // login or signup
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');
    
    const [clientTab, setClientTab] = React.useState('overview');
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    const [tempInterest, setTempInterest] = React.useState('');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
        
        // Listen for Clients
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });

        // Listen for Requests (Signups and Loan Requests)
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const currentClient = !isAdmin ? clients.find(c => c.email?.toLowerCase() === user?.email?.toLowerCase()) : null;

    const handleAuth = async (e) => {
        e.preventDefault();
        const d = Object.fromEntries(new FormData(e.target).entries());
        let email = d.id.includes('@') ? d.id : `${d.id.replace(/[^0-9]/g, '')}@netten.com`.toLowerCase();

        if (authMode === 'login') {
            auth.signInWithEmailAndPassword(email, d.password).catch(() => alert("Login failed. Check credentials."));
        } else {
            // Register flow
            try {
                await db.ref('requests').push({
                    type: 'REGISTRATION',
                    name: d.name,
                    phone: d.phone,
                    email: email,
                    bankInfo: d.bankInfo || 'None provided',
                    password: d.password, // For admin to set up the account
                    timestamp: Date.now(),
                    status: 'pending'
                });
                alert("Application sent! Admin will review and notify you.");
                setAuthMode('login');
            } catch (err) { alert("Error sending request."); }
        }
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-16 h-16 mx-auto mb-4" />
                    <h1 className="text-3xl font-black text-blue-400 mb-6 uppercase italic text-center italic tracking-tighter">Net Ten Ltd</h1>
                    
                    <form onSubmit={handleAuth} className="space-y-4">
                        {authMode === 'signup' && (
                            <>
                                <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" required />
                                <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" required />
                                <textarea name="bankInfo" placeholder="Banking Info (Optional)" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none text-xs" rows="2"></textarea>
                            </>
                        )}
                        <input name="id" placeholder={authMode === 'login' ? "ID or Email" : "Create ID (Phone or Email)"} className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" required />
                        
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">
                            {authMode === 'login' ? 'Sign In' : 'Submit Application'}
                        </button>
                    </form>
                    
                    <button onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')} className="w-full mt-6 text-slate-500 font-black text-[10px] uppercase tracking-widest">
                        {authMode === 'login' ? "Need an account? Sign Up" : "Already have an account? Login"}
                    </button>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200 font-sans">
            <header className="p-5 border-b border-slate-700 flex justify-between items-center bg-[#1e293b]">
                <h1 className="text-sm font-black text-white uppercase italic tracking-tighter">Net Ten Ltd</h1>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div>
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('reqs')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase relative ${view === 'reqs' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                                Inbox {requests.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}
                            </button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Client</button>
                        </nav>

                        {/* ADMIN: REQUESTS INBOX */}
                        {view === 'reqs' && (
                            <div className="space-y-4">
                                <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Pending Notifications</h2>
                                {requests.map(r => (
                                    <div key={r.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 shadow-xl">
                                        <div className="flex justify-between items-start mb-3">
                                            <span className={`text-[7px] font-black px-2 py-1 rounded-full uppercase ${r.type === 'REGISTRATION' ? 'bg-blue-900 text-blue-300' : 'bg-yellow-900 text-yellow-300'}`}>{r.type}</span>
                                            <span className="text-[7px] text-slate-500 uppercase">{new Date(r.timestamp).toLocaleDateString()}</span>
                                        </div>
                                        <h3 className="text-white font-black">{r.name || r.clientName}</h3>
                                        <p className="text-xs text-slate-400 mt-1">{r.phone || r.email}</p>
                                        {r.bankInfo && <p className="text-[9px] bg-[#0f172a] p-3 rounded-xl mt-3 text-slate-300 italic border border-slate-800">Bank: {r.bankInfo}</p>}
                                        {r.requestedAmount && <p className="text-xl font-black text-green-400 mt-2">Wants: ${r.requestedAmount}</p>}

                                        <div className="grid grid-cols-2 gap-2 mt-4">
                                            <button onClick={async () => {
                                                if (r.type === 'REGISTRATION') {
                                                    // Create actual Firebase Auth account and Client profile
                                                    try {
                                                        // Note: In a real app, you'd use a cloud function to create the user safely
                                                        await db.ref('clients').push({
                                                            name: r.name, phone: r.phone, email: r.email,
                                                            interestAmount: 0, amountOwed: 0, history: []
                                                        });
                                                        await db.ref(`requests/${r.id}`).remove();
                                                        alert("Client Approved!");
                                                    } catch(e) { alert("Error approving."); }
                                                } else {
                                                    await db.ref(`requests/${r.id}`).remove();
                                                    alert("Loan Request Acknowledged.");
                                                }
                                            }} className="bg-green-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase tracking-widest">Approve</button>
                                            <button onClick={() => db.ref(`requests/${r.id}`).remove()} className="bg-red-900/20 text-red-500 py-3 rounded-xl font-bold text-[8px] uppercase border border-red-900/50">Deny</button>
                                        </div>
                                    </div>
                                ))}
                                {requests.length === 0 && <p className="text-center text-slate-600 text-[10px] uppercase font-black py-10 tracking-widest">Inbox is empty</p>}
                            </div>
                        )}

                        {/* (View 'home' and 'add' logic remains identical to previous version) */}
                        {view === 'home' && (
                            <>
                                <input type="text" placeholder="Search portfolios..." className="w-full p-4 mb-4 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" />
                                {clients.map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-lg">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-black text-white">{c.name}</h3>
                                                <p className="text-[8px] text-slate-500 font-black uppercase tracking-widest">DUE: {c.dueDate || 'PENDING'}</p>
                                            </div>
                                            <p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => setPayingClient(c)} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Adjust</button>
                                            <button onClick={() => setEditingClient(c)} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                            <button onClick={() => { const n = prompt("Send note:"); if(n) db.ref(`clients/${c.id}`).update({ directMsg: n }); }} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Note</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}
                    </div>
                ) : (
                    /* CLIENT DASHBOARD (WITH LOAN REQUEST) */
                    <div className="animate-in slide-in-from-bottom-4 duration-500">
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700 shadow-lg">
                            <button onClick={() => setClientTab('overview')} className={`flex-1 py-3 rounded-xl text-[9px] font-black uppercase ${clientTab === 'overview' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>My Balance</button>
                            <button onClick={() => setClientTab('history')} className={`flex-1 py-3 rounded-xl text-[9px] font-black uppercase ${clientTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                        </nav>

                        {clientTab === 'overview' ? (
                            <>
                                <div className="bg-blue-600 p-12 rounded-[40px] text-center shadow-2xl mb-4">
                                    <p className="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-2">Total Amount Due</p>
                                    <h2 className="text-6xl font-black text-white italic tracking-tighter">${(parseFloat(currentClient?.interestAmount || 0)).toFixed(2)}</h2>
                                </div>
                                <div className="bg-[#1e293b] p-6 rounded-[40px] border border-slate-700 space-y-4 shadow-xl">
                                    <button onClick={async () => {
                                        const amt = prompt("How much would you like to request?");
                                        if (amt) {
                                            await db.ref('requests').push({
                                                type: 'LOAN_REQUEST',
                                                clientName: currentClient.name,
                                                clientId: currentClient.id,
                                                requestedAmount: amt,
                                                timestamp: Date.now()
                                            });
                                            alert("Request sent to Admin!");
                                        }
                                    }} className="w-full bg-green-600 text-white py-5 rounded-3xl font-black text-[10px] uppercase shadow-lg shadow-green-900/20">
                                        Request New Loan
                                    </button>
                                    <div className="grid grid-cols-2 gap-4 text-center">
                                        <div className="bg-[#0f172a] p-4 rounded-3xl border border-slate-800">
                                            <p className="text-[8px] font-black text-slate-500 uppercase mb-1">Loan Date</p>
                                            <p className="text-sm font-bold text-white">{currentClient?.loanDate || 'N/A'}</p>
                                        </div>
                                        <div className="bg-[#0f172a] p-4 rounded-3xl border border-slate-800">
                                            <p className="text-[8px] font-black text-red-500 uppercase mb-1">Due Date</p>
                                            <p className="text-sm font-bold text-white">{currentClient?.dueDate || 'N/A'}</p>
                                        </div>
                                    </div>
                                    <a href="tel:8763180099" className="w-full bg-slate-800 border border-slate-700 py-4 rounded-3xl text-center flex items-center justify-center gap-2">
                                        <span className="text-lg">📲</span>
                                        <span className="text-[9px] font-black text-white uppercase">Contact Admin to Pay</span>
                                    </a>
                                </div>
                            </>
                        ) : (
                            /* (History view remains same) */
                            <div className="space-y-3">
                                {(currentClient?.history || []).slice().reverse().map((h, i) => (
                                    <div key={i} className="bg-[#1e293b] border border-slate-800 p-5 rounded-[28px] flex justify-between items-center shadow-md">
                                        <div><p className="text-[10px] font-black text-white uppercase">{h.type}</p><p className="text-[8px] text-slate-500 uppercase">{h.date}</p></div>
                                        <p className={`font-black text-sm ${h.type === "Payment" ? 'text-green-400' : 'text-red-400'}`}>{h.type === "Payment" ? '-' : '+'}${h.amount.toFixed(2)}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

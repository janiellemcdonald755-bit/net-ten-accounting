<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
/**
 * Net Ten Ltd - Complete Management System
 * Version: 8.1 - Sidebar Toggle & Inbox Fix
 */

const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [sidebarOpen, setSidebarOpen] = React.useState(true); // NEW: Sidebar Toggle State
    
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    
    const [payingClient, setPayingClient] = React.useState(null);
    const [selectedClientHistory, setSelectedClientHistory] = React.useState(null);
    const [msgTarget, setMsgTarget] = React.useState(null);
    
    const [searchTerm, setSearchTerm] = React.useState('');
    const [analyticsPeriod, setAnalyticsPeriod] = React.useState('monthly');
    const [modalSubView, setModalSubView] = React.useState('loan');

    React.useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    if (data?.popupMsg) {
                        alert(`MESSAGE FROM NET TEN: ${data.popupMsg}`);
                        db.ref(`users/${u.uid}/popupMsg`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else {
                setView('login');
            }
        });

        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        // FIXED: Loan Requests Listener Mapping
        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) {
                Object.keys(s.val()).forEach(k => {
                    list.push({id: k, ...s.val()[k]});
                });
            }
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    const stats = (() => {
        let totalIssued = 0, totalOwed = 0, totalRevenue = 0, paymentsCount = 0;
        clients.forEach(c => {
            totalIssued += parseFloat(c.principal || 0);
            totalOwed += parseFloat(c.interestAmount || 0);
            (c.history || []).forEach(h => {
                if (h.type?.toLowerCase().includes('pay')) {
                    totalRevenue += parseFloat(h.amount || 0);
                    paymentsCount++;
                }
            });
        });
        return { 
            issued: totalIssued, owed: totalOwed, revenue: totalRevenue, 
            paid: clients.filter(c => c.status === 'Paid').length
        };
    })();

    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 font-sans">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Invalid Credentials."); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-lg mb-4">Secure Terminal</h2>
                            <input name="email" type="text" placeholder="Username (Email)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none" required />
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg hover:bg-blue-500 transition-all">Authenticate</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto">New User? Register Access</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, status: 'pending', timestamp: Date.now()});
                            alert("Request sent to Winston!");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-center text-lg mb-4">Onboarding</h2>
                            <input name="username" placeholder="Full Username" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="dob" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase">Submit Application</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto">Cancel</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[10px]">
            
            {/* SIDEBAR (COLLAPSIBLE) */}
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden relative`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Net Ten</h1>
                </div>
                
                <nav className="py-6 flex-1 overflow-y-auto min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios Dashboard</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ Onboard New Loan</button>
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📜 Master Ledger History</button>
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between items-center ${view === 'inbox_accounts' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                <span>👤 Account Requests</span>
                                {pendingUsers.length > 0 && <span className="bg-green-600 text-white px-2 rounded-full text-[8px]">{pendingUsers.length}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between items-center ${view === 'inbox_loans' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                <span>💰 Loan Requests</span>
                                {requests.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full text-[8px]">{requests.length}</span>}
                            </button>
                            <button onClick={() => setView('reports')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'reports' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📊 BI Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_account')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_account' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>🏠 My Dashboard</button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_apply' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ Smart Loan Application</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_pay' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>💳 Digital Payment</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_faq' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>❓ Support Terminal</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_profile' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>👤 My Profile Settings</button>
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600 text-white rounded-2xl text-[10px] font-black uppercase min-w-[180px]">Logout Securely</button>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 overflow-y-auto bg-[#0f172a] relative">
                
                {/* MENU TOGGLE BUTTON */}
                <div className="p-6 sticky top-0 bg-[#0f172a]/80 backdrop-blur-md z-50 flex items-center gap-4">
                    <button onClick={() => setSidebarOpen(!sidebarOpen)} className="bg-slate-800 p-3 rounded-xl text-white font-black uppercase text-[8px] border border-slate-700 hover:bg-slate-700 transition-all flex items-center gap-2">
                        <span>{sidebarOpen ? '✕ Close Menu' : '☰ Open Menu'}</span>
                    </button>
                    <div className="h-4 w-[1px] bg-slate-800"></div>
                    <span className="text-slate-500 font-black uppercase tracking-widest">{view.replace('_', ' ')}</span>
                </div>

                <div className="p-10 pt-4">
                    {/* GLOBAL CLIENT NOTIFICATION BAR */}
                    {!isAdmin && (
                        <div className="max-w-2xl mx-auto mb-8 space-y-2">
                            {requests.filter(r => r.email === user.email).map(r => (
                                <div key={r.id} className={`p-4 rounded-2xl flex justify-between items-center border font-black uppercase text-[9px] ${r.status === 'Approved' ? 'bg-green-500/10 text-green-400 border-green-400/30' : r.status === 'Denied' ? 'bg-red-500/10 text-red-400 border-red-400/30' : 'bg-blue-500/10 text-blue-400 border-blue-400/30'}`}>
                                    <span>🔔 Status: {r.status || 'Under Review'}</span>
                                    {r.rejectReason && <span>Note: {r.rejectReason}</span>}
                                </div>
                            ))}
                        </div>
                    )}

                    {/* ADMIN PORTFOLIO DASHBOARD */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-5xl mx-auto">
                            <div className="grid grid-cols-3 gap-6 mb-12">
                                <div className="bg-blue-600 p-8 rounded-[40px] text-white">
                                    <p className="text-[10px] font-black uppercase opacity-60">Active Issued</p>
                                    <p className="text-4xl font-black italic">${stats.issued.toLocaleString()}</p>
                                </div>
                                <div className="bg-[#1e293b] p-8 rounded-[40px] text-white border border-slate-700">
                                    <p className="text-[10px] font-black uppercase opacity-60">Projected Due</p>
                                    <p className="text-4xl font-black italic">${stats.owed.toLocaleString()}</p>
                                </div>
                                <div className="bg-[#1e293b] p-8 rounded-[40px] text-white border border-slate-700">
                                    <p className="text-[10px] font-black uppercase opacity-60">Cash Received</p>
                                    <p className="text-4xl font-black italic">${stats.revenue.toLocaleString()}</p>
                                </div>
                            </div>

                            <input type="text" placeholder="Search..." className="w-full p-4 bg-[#1e293b] rounded-2xl text-white border border-slate-700 mb-8" onChange={e => setSearchTerm(e.target.value)} />

                            <div className="grid grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-6 rounded-[45px] border border-slate-700 relative">
                                        <div className="flex justify-between items-start mb-2">
                                            <div><h3 className="text-white font-black uppercase text-[10px]">{c.name}</h3><p className="text-[9px] text-slate-500">{c.email}</p></div>
                                            <button onClick={() => setMsgTarget(c)} className="text-blue-400">✉️</button>
                                        </div>
                                        <p className="text-3xl font-black text-green-400 italic mb-4">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-black uppercase text-[8px]">Issue/Top-Up</button>
                                            <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-2xl font-black uppercase text-[8px]">Collect Pay</button>
                                            <button onClick={() => setSelectedClientHistory(c)} className="bg-slate-700 text-white px-4 py-3 rounded-2xl font-black text-[8px]">Ledger</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ADMIN: LOAN REQUEST INBOX (FIXED) */}
                    {isAdmin && view === 'inbox_loans' && (
                        <div className="max-w-3xl mx-auto space-y-4">
                            <h2 className="text-white font-black uppercase italic text-center mb-8">Loan Approval Queue</h2>
                            {requests.length === 0 && <p className="text-slate-500 uppercase py-10 font-black italic text-center text-xs">No pending requests.</p>}
                            {requests.map(r => (
                                <div key={r.id} className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <p className="text-white font-black text-xl mb-1">{r.name}</p>
                                            <p className="text-blue-400 text-xs font-black uppercase">Requested: ${r.amount}</p>
                                            <p className="text-[9px] text-slate-500 mt-1 uppercase font-bold">Term: {r.term} • Bank: {r.accountNumber}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={async () => {
                                                await db.ref(`requests/${r.id}`).update({status: 'Approved'});
                                                alert("Marked Approved!");
                                            }} className="bg-green-600 text-white px-4 py-2 rounded-xl font-black uppercase text-[8px]">Approve</button>
                                            <button onClick={async () => {
                                                const reason = prompt("Reason for denial?");
                                                await db.ref(`requests/${r.id}`).update({status: 'Denied', rejectReason: reason});
                                                alert("Marked Denied.");
                                            }} className="bg-red-600 text-white px-4 py-2 rounded-xl font-black uppercase text-[8px]">Deny</button>
                                            <button onClick={async () => {
                                                if(confirm("Archive this request?")) db.ref(`requests/${r.id}`).remove();
                                            }} className="bg-slate-700 text-white p-2 rounded-xl">🗑️</button>
                                        </div>
                                    </div>
                                    <div className="bg-[#0f172a] p-4 rounded-xl text-[9px] text-slate-400 border border-slate-800">
                                        <p className="font-black uppercase mb-1">Income Proof/Notes:</p>
                                        <p className="italic">{r.proof || r.incomeProof}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* ADMIN: MASTER HISTORY */}
                    {isAdmin && view === 'master_history' && (
                        <div className="max-w-4xl mx-auto bg-[#1e293b] p-10 rounded-[50px] border border-slate-700">
                            <h2 className="text-2xl font-black text-white italic uppercase mb-8">Master Ledger History</h2>
                            <div className="space-y-3">
                                {clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name})))
                                    .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))
                                    .map((h, i) => (
                                        <div key={i} className="flex justify-between items-center bg-[#0f172a] p-5 rounded-3xl border border-slate-800">
                                            <div>
                                                <p className="text-blue-400 font-black uppercase mb-1">{h.clientName}</p>
                                                <p className="text-slate-500 text-[10px] font-bold">{h.date} — {h.type}</p>
                                            </div>
                                            <p className={`font-black italic ${h.type?.toLowerCase().includes('pay') ? 'text-green-400' : 'text-blue-400'}`}>
                                                {h.type?.toLowerCase().includes('pay') ? '-' : '+'}${parseFloat(h.amount || 0).toFixed(2)}
                                            </p>
                                        </div>
                                    ))}
                            </div>
                        </div>
                    )}

                    {/* CLIENT DASHBOARD */}
                    {!isAdmin && view === 'client_account' && (
                        <div className="max-w-xl mx-auto space-y-6">
                            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-12 rounded-[60px] text-center shadow-2xl relative">
                                <p className="text-white/70 font-black uppercase text-[10px] mb-2 tracking-widest">Outstanding Balance</p>
                                <p className="text-7xl font-black text-white italic tracking-tighter">${parseFloat(clientData?.interestAmount || 0).toFixed(2)}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 grid grid-cols-2 gap-4 text-white font-black uppercase text-[9px]">
                                <div className="p-4 bg-slate-800 rounded-xl">Principal: ${parseFloat(clientData?.principal || 0).toFixed(2)}</div>
                                <div className="p-4 bg-slate-800 rounded-xl">Due: {clientData?.dueDate || 'N/A'}</div>
                            </div>
                        </div>
                    )}

                    {/* ... (Keep other views: client_apply, client_pay, client_profile, reports, add - exactly as version 8.0) */}
                </div>
            </main>

            {/* TRANSACTION MODAL */}
            {payingClient && (
                <div className="fixed inset-0 z-[1001] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-lg rounded-[60px] p-10 border border-slate-700">
                        <div className="flex bg-[#0f172a] p-2 rounded-2xl mb-8 font-black uppercase text-[9px]">
                            <button onClick={() => setModalSubView('loan')} className={`flex-1 py-2 rounded-xl ${modalSubView === 'loan' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>Issue/Top-Up</button>
                            <button onClick={() => setModalSubView('pay')} className={`flex-1 py-2 rounded-xl ${modalSubView === 'pay' ? 'bg-green-600 text-white' : 'text-slate-500'}`}>Collect Pay</button>
                        </div>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            let newBal = parseFloat(payingClient.interestAmount || 0);
                            if (modalSubView === 'pay') newBal -= amt; else newBal += amt;
                            const h = { amount: amt, date: d.date, method: d.method, type: modalSubView === 'pay' ? 'Payment' : 'Disbursement', timestamp: Date.now() };
                            await db.ref(`clients/${payingClient.id}`).update({ 
                                interestAmount: Math.max(0, newBal), 
                                history: [...(payingClient.history || []), h] 
                            });
                            setPayingClient(null);
                        }} className="space-y-4">
                            <input name="amount" type="number" step="0.01" placeholder="$0.00" className="w-full p-6 bg-[#0f172a] rounded-3xl text-white text-4xl font-black text-center" required />
                            <div className="grid grid-cols-2 gap-2">
                                <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="p-4 bg-[#0f172a] rounded-xl text-white text-[10px]" />
                                <select name="method" className="p-4 bg-[#0f172a] rounded-xl text-white text-[10px] font-black uppercase"><option>Bank Transfer</option><option>Cash</option></select>
                            </div>
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Sign Off</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] font-black uppercase mt-2 text-center">Cancel</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

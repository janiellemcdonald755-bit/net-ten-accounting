<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [histSearch, setHistSearch] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                // Fetching extended profile info from both 'users' and matching 'clients' entry
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
                if (u.email !== ADMIN_EMAIL) setView('client_home');
            }
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('pending_registrations').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setPendingUsers(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);
    const totalOwed = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    if (!user) return <div className="text-white p-10 text-center">Please Log In...</div>;

    const SidebarLink = ({ id, label, icon }) => (
        <button onClick={() => setView(id)} className={`w-full flex items-center gap-3 px-6 py-4 text-[10px] font-black uppercase tracking-widest ${view === id ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800'}`}>
            <span>{icon}</span> {label}
        </button>
    );

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden">
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 shrink-0">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8" />
                    <h1 className="text-lg font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-4">
                    {isAdmin ? (
                        <>
                            <SidebarLink id="home" label="Portfolios" icon="📂" />
                            <SidebarLink id="history" label="Full History" icon="📜" />
                            <SidebarLink id="reg_reqs" label="New Sign-ups" icon="👤" />
                            <SidebarLink id="loan_reqs" label="Loan Requests" icon="💰" />
                            <SidebarLink id="add" label="Add Portfolio" icon="➕" />
                        </>
                    ) : (
                        <>
                            <SidebarLink id="client_home" label="My Account" icon="🏠" />
                            <SidebarLink id="client_apply" label="Apply for Loan" icon="➕" />
                            <SidebarLink id="client_pay" label="Make Payment" icon="💳" />
                            <SidebarLink id="client_profile" label="My Profile" icon="👤" />
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-6 p-4 w-52 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase">Sign Out</button>
            </aside>

            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN: ADD PORTFOLIO (RESTORED & WORKING) */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                        <h2 className="text-white font-black uppercase italic mb-6">Create New Portfolio</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const h = { amount: d.interestAmount, date: d.dateBorrowed, type: "Initial Loan", timestamp: Date.now(), method: d.disbursement };
                            await db.ref('clients').push({ ...d, history: [h] });
                            alert("Portfolio Launched!");
                            setView('home');
                        }} className="grid grid-cols-2 gap-4">
                            <input name="name" placeholder="Full Name" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="email" placeholder="Email" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="address" placeholder="Physical Address" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="employerNumber" placeholder="Employer/TRN Number" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <select name="disbursement" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs"><option>Face to Face</option><option>Mobile App</option></select>
                            <input name="dateBorrowed" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="dueDate" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="amountOwed" type="number" placeholder="Principal Amount" onChange={e => handlePrincipalCalc(e.target.value)} className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="interestAmount" value={tempInterest} readOnly className="p-4 bg-blue-900/20 rounded-xl text-blue-400 font-black text-xs" />
                            <button className="col-span-2 bg-blue-600 text-white font-black py-4 rounded-2xl uppercase mt-4">Save Portfolio</button>
                        </form>
                    </div>
                )}

                {/* ADMIN: PORTFOLIOS VIEW */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-8 bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <p className="text-4xl font-black text-white italic uppercase">Portfolios</p>
                            <input type="text" placeholder="Filter..." className="bg-[#0f172a] p-4 rounded-2xl text-white text-xs w-48" onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                                    <div className="flex justify-between mb-2">
                                        <h3 className="text-white font-black uppercase text-xs">{c.name}</h3>
                                        <p className="text-green-400 font-black">${parseFloat(c.interestAmount).toFixed(2)}</p>
                                    </div>
                                    <button onClick={() => setPayingClient(c)} className="w-full bg-slate-800 text-slate-400 py-2 rounded-xl text-[8px] font-black uppercase">Post Transaction</button>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* CLIENT: MY ACCOUNT (RESTORED) */}
                {!isAdmin && view === 'client_home' && (
                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-900 p-12 rounded-[50px] text-white shadow-2xl">
                            <p className="text-[10px] font-black uppercase opacity-70">Total Amount Owed</p>
                            <h2 className="text-7xl font-black mt-2 italic">${clientData ? parseFloat(clientData.interestAmount).toLocaleString() : '0.00'}</h2>
                            <div className="flex gap-4 mt-8">
                                <div className="bg-black/20 px-6 py-3 rounded-2xl border border-white/10"><p className="text-[8px] uppercase opacity-50">Next Due Date</p><p className="font-black text-xs">{clientData?.dueDate || '---'}</p></div>
                            </div>
                        </div>
                    </div>
                )}

                {/* CLIENT: APPLY FOR LOAN (ADDED BANK INFO) */}
                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-xl font-black text-white italic uppercase mb-8">Loan Application</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, email: user.email, name: userData?.name || user.email, type: 'Loan Request' });
                            alert("Request Sent!");
                        }} className="space-y-4">
                            <input name="amount" type="number" placeholder="Requested Amount" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <div className="grid grid-cols-2 gap-4">
                                <input name="bankName" placeholder="Bank Name (e.g. NCB)" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                                <input name="accountNum" placeholder="Account Number" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            </div>
                            <textarea name="incomeDetails" placeholder="Proof of Income (Optional)" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs h-20"></textarea>
                            <textarea name="reason" placeholder="Reason for Loan (Optional)" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs h-20"></textarea>
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Submit Request</button>
                        </form>
                    </div>
                )}

                {/* CLIENT: PROFILE (FULLY MATCHED WITH PORTFOLIO DATA) */}
                {!isAdmin && view === 'client_profile' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-white font-black uppercase mb-8 italic">Full Portfolio Data</h2>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                                <label className="text-[8px] text-slate-500 uppercase block mb-1">Full Name</label>
                                <p className="text-white text-xs font-bold">{clientData?.name || userData?.name}</p>
                            </div>
                            <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                                <label className="text-[8px] text-slate-500 uppercase block mb-1">Email</label>
                                <p className="text-white text-xs font-bold">{user.email}</p>
                            </div>
                            <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                                <label className="text-[8px] text-slate-500 uppercase block mb-1">Phone</label>
                                <p className="text-white text-xs font-bold">{clientData?.phone || userData?.phone}</p>
                            </div>
                            <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                                <label className="text-[8px] text-slate-500 uppercase block mb-1">TRN / Employer #</label>
                                <p className="text-white text-xs font-bold">{clientData?.employerNumber || 'N/A'}</p>
                            </div>
                            <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800 col-span-2">
                                <label className="text-[8px] text-slate-500 uppercase block mb-1">Physical Address</label>
                                <p className="text-white text-xs font-bold">{clientData?.address || 'N/A'}</p>
                            </div>
                            <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                                <label className="text-[8px] text-slate-500 uppercase block mb-1">Initial Date Borrowed</label>
                                <p className="text-white text-xs font-bold">{clientData?.dateBorrowed || 'N/A'}</p>
                            </div>
                            <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                                <label className="text-[8px] text-slate-500 uppercase block mb-1">Current Balance Status</label>
                                <p className="text-blue-400 text-xs font-black italic uppercase">Active Portfolio</p>
                            </div>
                        </div>
                    </div>
                )}
            </main>

            {/* MODAL: TRANSACTION (SAME AS BEFORE) */}
            {payingClient && (
                <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-10 border border-slate-700">
                        <div className="flex justify-between mb-8">
                            <button onClick={() => setIsNewLoanView(false)} className={`uppercase text-[10px] font-black ${!isNewLoanView ? 'text-blue-400 border-b-2' : 'text-slate-500'}`}>Receive Pay</button>
                            <button onClick={() => setIsNewLoanView(true)} className={`uppercase text-[10px] font-black ${isNewLoanView ? 'text-green-400 border-b-2' : 'text-slate-500'}`}>New Loan</button>
                        </div>
                        <input type="number" id="adjAmt" placeholder="0.00" onChange={e => handlePrincipalCalc(e.target.value)} className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-4xl font-black text-center mb-4" />
                        <button onClick={async () => {
                            const val = parseFloat(document.getElementById('adjAmt').value);
                            if(!val) return;
                            const amt = isNewLoanView ? parseFloat(tempInterest) : val;
                            const h = { amount: amt, date: new Date().toLocaleDateString(), type: isNewLoanView ? "Loan" : "Payment", timestamp: Date.now() };
                            const update = { interestAmount: isNewLoanView ? (parseFloat(payingClient.interestAmount) + amt) : Math.max(0, parseFloat(payingClient.interestAmount) - amt), history: [...(payingClient.history || []), h] };
                            await db.ref(`clients/${payingClient.id}`).update(update);
                            setPayingClient(null);
                        }} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase">Confirm</button>
                        <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 mt-4 text-[10px] font-black uppercase">Cancel</button>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

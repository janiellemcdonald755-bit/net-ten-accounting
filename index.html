<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Accounting</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. YOUR CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
            authDomain: "net-ten-accounting.firebaseapp.com",
            databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
            projectId: "net-ten-accounting",
            storageBucket: "net-ten-accounting.appspot.com",
            messagingSenderId: "1095937995425",
            appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
        };

        // 2. INITIALIZE
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // 3. THE APP
      const App = () => {
    const [transactions, setTransactions] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [name, setName] = React.useState('');
    const [amount, setAmount] = React.useState('');
    const [type, setType] = React.useState('income'); // New state for toggle

    React.useEffect(() => {
        const dbRef = database.ref('transactions');
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const list = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    list.push({ id: key, ...data[key] });
                });
            }
            // Sort by date so newest is at the top
            setTransactions(list.sort((a, b) => b.date - a.date));
            setLoading(false);
        });
        return () => dbRef.off();
    }, []);

    const handleAdd = (e) => {
        e.preventDefault();
        if (!name || !amount) return;
        database.ref('transactions').push({
            name,
            amount: parseFloat(amount),
            type,
            date: Date.now()
        });
        setName('');
        setAmount('');
    };

    const deleteItem = (id) => {
        database.ref(`transactions/${id}`).remove();
    };

    // Calculate Totals
    const incomeTotal = transactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + t.amount, 0);
    
    const expenseTotal = transactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + t.amount, 0);

    const balance = incomeTotal - expenseTotal;

    return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-10 font-sans">
            <div className="max-w-md mx-auto">
                <header className="mb-8 text-center">
                    <h1 className="text-3xl font-extrabold text-slate-800">Net Ten</h1>
                    <p className="text-slate-500">Mobile Accounting</p>
                </header>

                {/* Balance Card */}
                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 border-t-4 border-blue-500">
                    <p className="text-slate-500 text-sm font-bold uppercase tracking-wider">Current Balance</p>
                    <h2 className={`text-4xl font-black ${balance >= 0 ? 'text-slate-800' : 'text-red-600'}`}>
                        ${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}
                    </h2>
                    
                    <div className="grid grid-cols-2 gap-4 mt-6 border-t pt-6">
                        <div>
                            <p className="text-xs font-bold text-green-600 uppercase">Income</p>
                            <p className="text-xl font-bold text-slate-700">+${incomeTotal.toFixed(2)}</p>
                        </div>
                        <div className="border-l pl-4">
                            <p className="text-xs font-bold text-red-600 uppercase">Expenses</p>
                            <p className="text-xl font-bold text-slate-700">-${expenseTotal.toFixed(2)}</p>
                        </div>
                    </div>
                </div>

                {/* Entry Form */}
                <form onSubmit={handleAdd} className="bg-white rounded-2xl shadow-md p-6 mb-8">
                    <div className="flex bg-slate-100 p-1 rounded-lg mb-4">
                        <button 
                            type="button"
                            onClick={() => setType('income')}
                            className={`flex-1 py-2 rounded-md text-sm font-bold transition ${type === 'income' ? 'bg-white shadow text-green-600' : 'text-slate-500'}`}
                        >Income</button>
                        <button 
                            type="button"
                            onClick={() => setType('expense')}
                            className={`flex-1 py-2 rounded-md text-sm font-bold transition ${type === 'expense' ? 'bg-white shadow text-red-600' : 'text-slate-500'}`}
                        >Expense</button>
                    </div>
                    
                    <div className="space-y-3">
                        <input type="text" placeholder="Description" className="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" value={name} onChange={(e) => setName(e.target.value)} />
                        <input type="number" placeholder="0.00" className="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} />
                        <button type="submit" className={`w-full py-3 rounded-xl font-bold text-white transition shadow-lg ${type === 'income' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>
                            Save {type.charAt(0).toUpperCase() + type.slice(1)}
                        </button>
                    </div>
                </form>

                {/* History */}
                <div className="space-y-3">
                    <h3 className="text-lg font-bold text-slate-700 px-2">History</h3>
                    {loading ? <p className="text-center py-10 text-slate-400">Loading records...</p> : 
                     transactions.map(t => (
                        <div key={t.id} className="group bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border-l-4 border-transparent hover:border-blue-500 transition">
                            <div>
                                <p className="font-bold text-slate-800">{t.name}</p>
                                <p className="text-xs text-slate-400">{new Date(t.date).toLocaleDateString()}</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className={`font-black ${t.type === 'income' ? 'text-green-600' : 'text-red-600'}`}>
                                    {t.type === 'income' ? '+' : '-'}${t.amount.toFixed(2)}
                                </span>
                                <button onClick={() => deleteItem(t.id)} className="text-slate-300 hover:text-red-500 transition font-bold text-xl">&times;</button>
                            </div>
                        </div>
                     ))
                    }
                </div>
            </div>
        </div>
    );
};
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

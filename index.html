<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    const [calcVal, setCalcVal] = React.useState('');
    
    // Data States
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    
    // Modals & Interaction
    const [payingClient, setPayingClient] = React.useState(null);
    const [modalSubView, setModalSubView] = React.useState('loan'); // 'loan' or 'pay'
    const [msgTarget, setMsgTarget] = React.useState(null);
    const [searchTerm, setSearchTerm] = React.useState('');

    React.useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
                if (u.email !== ADMIN_EMAIL) setView('client_home');
            } else { setView('login'); }
        });

        // Listeners for Admin Dashboard
        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // Calculator Helper
    const handleCalc = (btn) => {
        if (btn === 'C') setCalcVal('');
        else if (btn === '=') { try { setCalcVal(eval(calcVal).toString()); } catch { setCalcVal('Error'); } }
        else setCalcVal(prev => prev + btn);
    };

    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Access Denied."); }
                    }} className="space-y-4">
                        <h2 className="text-white font-black uppercase italic tracking-widest text-lg">Net Ten Terminal</h2>
                        <input name="email" type="email" placeholder="Email Address" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none" required />
                        <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg hover:bg-blue-500 transition-all">Authenticate</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[10px]">
            
            {/* 1. COLLAPSIBLE SIDEBAR */}
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios Dashboard</button>
                            <button onClick={() => setView('history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'history' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📜 Master History</button>
                            <button onClick={() => setView('analytics')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'analytics' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📊 Analytics</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ Add Client</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>🏠 Dashboard</button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_apply' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>💰 Request Loan</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_pay' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>💳 Make Payment</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_profile' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>👤 My Profile</button>
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600 text-white rounded-2xl text-[10px] font-black uppercase min-w-[180px]">Sign Out</button>
            </aside>

            <main className="flex-1 overflow-y-auto relative">
                {/* 2. TOP HEADER & NOTIFICATION BUTTONS */}
                <header className="p-6 flex justify-between items-center bg-[#0f172a]/80 backdrop-blur-md sticky top-0 z-50">
                    <div className="flex items-center gap-4">
                        <button onClick={() => setSidebarOpen(!sidebarOpen)} className="bg-slate-800 p-3 rounded-xl text-white">☰</button>
                        <h2 className="text-white font-black uppercase italic tracking-widest text-lg">
                            {view === 'home' ? 'Portfolios Dashboard' : view.replace('_', ' ')}
                        </h2>
                    </div>
                    {isAdmin && (
                        <div className="flex gap-3">
                            <button onClick={() => setView('inbox_accounts')} className="bg-green-600/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-xl font-black uppercase text-[8px] flex items-center gap-2">
                                New Account Requests <span className="bg-green-600 text-white px-2 rounded-full">{pendingUsers.length}</span>
                            </button>
                            <button onClick={() => setView('inbox_loans')} className="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-4 py-2 rounded-xl font-black uppercase text-[8px] flex items-center gap-2">
                                Loan Requests <span className="bg-blue-600 text-white px-2 rounded-full">{requests.length}</span>
                            </button>
                        </div>
                    )}
                </header>

                <div className="p-10 pt-4">
                    {/* 3. CALCULATOR OVER PORTFOLIO */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-4xl mx-auto mb-10">
                            <div className="bg-[#1e293b] p-6 rounded-[40px] border border-slate-700 flex gap-6 items-center">
                                <div className="flex-1">
                                    <p className="text-[8px] font-black text-slate-500 uppercase mb-2">Internal Calculator</p>
                                    <div className="bg-[#0f172a] p-4 rounded-2xl text-white text-3xl font-black text-right border border-slate-800">
                                        ${calcVal || '0.00'}
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 gap-2">
                                    {[7,8,9,'+',4,5,6,'-',1,2,3,'=',0,'.','C'].map(b => (
                                        <button key={b} onClick={() => handleCalc(b)} className={`w-10 h-10 rounded-xl font-black text-[10px] ${b === '=' ? 'bg-green-600 text-white' : 'bg-slate-700 text-slate-300'}`}>
                                            {b}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PORTFOLIO GRID */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-5xl mx-auto">
                            <input type="text" placeholder="Search Client Portfolio..." className="w-full p-4 bg-[#1e293b] rounded-2xl text-white border border-slate-700 mb-8" onChange={e => setSearchTerm(e.target.value)} />
                            <div className="grid grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-8 rounded-[50px] border border-slate-700 hover:border-blue-500 transition-all relative group">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-white font-black uppercase text-sm">{c.name}</h3>
                                                <p className="text-slate-500 font-bold">{c.employer || 'Self-Employed'}</p>
                                            </div>
                                            <button onClick={() => setMsgTarget(c)} className="bg-blue-600/20 text-blue-400 p-3 rounded-full hover:bg-blue-600 hover:text-white transition-all">✉️</button>
                                        </div>
                                        <div className="mb-6">
                                            <p className="text-[8px] text-slate-500 uppercase font-black">Total Owed</p>
                                            <p className="text-4xl font-black text-green-400 italic">${parseFloat(c.interestAmount || 0).toLocaleString()}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => { setPayingClient(c); setModalSubView('loan'); }} className="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-[8px] shadow-lg">New Loan / Top-Up</button>
                                            <button onClick={() => { setPayingClient(c); setModalSubView('pay'); }} className="flex-1 bg-green-600 text-white py-4 rounded-2xl font-black uppercase text-[8px] shadow-lg">Record Pay</button>
                                        </div>
                                        <div className={`absolute top-4 right-20 px-3 py-1 rounded-full text-[8px] font-black uppercase ${c.status === 'Overdue' ? 'bg-red-500 text-white' : 'bg-slate-800 text-slate-500'}`}>
                                            {c.status || 'Active'}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* MASTER HISTORY */}
                    {isAdmin && view === 'history' && (
                        <div className="max-w-4xl mx-auto space-y-4">
                            <h2 className="text-white font-black italic text-2xl uppercase mb-8">System Master Ledger</h2>
                            {clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name})))
                                .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))
                                .map((h, i) => (
                                    <div key={i} className="bg-[#1e293b] p-6 rounded-3xl border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <p className="text-blue-400 font-black uppercase">{h.clientName}</p>
                                            <p className="text-slate-500 text-[9px] font-bold mt-1">{h.date} — {h.type} via {h.method || 'Transfer'}</p>
                                        </div>
                                        <p className={`text-xl font-black italic ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>
                                            {h.type === 'Payment' ? '-' : '+'}${parseFloat(h.amount || 0).toFixed(2)}
                                        </p>
                                    </div>
                                ))}
                        </div>
                    )}

                    {/* MODAL: TRANSACTION LOGIC (With Full Payoff) */}
                    {payingClient && (
                        <div className="fixed inset-0 z-[1001] bg-black/90 flex items-center justify-center p-6 backdrop-blur-md">
                            <div className="bg-[#1e293b] w-full max-w-lg rounded-[60px] p-12 border border-slate-700 shadow-2xl">
                                <h3 className="text-white text-center font-black uppercase italic mb-8">
                                    {modalSubView === 'pay' ? 'Record Payment' : 'New Loan / Top-Up'}
                                </h3>

                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const d = Object.fromEntries(new FormData(e.target).entries());
                                    const amt = parseFloat(d.amount);
                                    let currentBal = parseFloat(payingClient.interestAmount || 0);
                                    let newBal = modalSubView === 'pay' ? currentBal - amt : currentBal + amt;
                                    
                                    const h = { 
                                        amount: amt, 
                                        date: d.date, 
                                        method: d.method || 'Bank Transfer', 
                                        type: modalSubView === 'pay' ? 'Payment' : 'Disbursement',
                                        timestamp: Date.now() 
                                    };

                                    await db.ref(`clients/${payingClient.id}`).update({ 
                                        interestAmount: Math.max(0, newBal),
                                        status: newBal <= 0 ? 'Paid' : (d.status || payingClient.status || 'Active'),
                                        history: [...(payingClient.history || []), h]
                                    });
                                    setPayingClient(null);
                                }} className="space-y-4">
                                    {/* Amount Input */}
                                    <div className="relative">
                                        <input id="trans_amt" name="amount" type="number" step="0.01" placeholder="0.00" className="w-full p-8 bg-[#0f172a] rounded-[30px] text-white text-5xl font-black text-center border border-slate-800" required />
                                        {modalSubView === 'pay' && (
                                            <button type="button" onClick={() => document.getElementById('trans_amt').value = payingClient.interestAmount} className="absolute right-4 top-1/2 -translate-y-1/2 bg-green-600 text-white px-4 py-2 rounded-xl text-[8px] font-black uppercase">Full Payoff</button>
                                        )}
                                    </div>

                                    {/* Conditional Fields */}
                                    {modalSubView === 'loan' ? (
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1">
                                                <label className="text-slate-500 font-black uppercase text-[7px] ml-2">Date Borrowed</label>
                                                <input name="date" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-slate-500 font-black uppercase text-[7px] ml-2">Next Due Date</label>
                                                <input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-4">
                                            <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="p-4 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                                            <select name="method" className="p-4 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black uppercase">
                                                <option>Bank Transfer</option>
                                                <option>Cash</option>
                                                <option>Other</option>
                                            </select>
                                        </div>
                                    )}

                                    <div className="pt-4 space-y-2">
                                        <button className={`w-full py-6 rounded-3xl font-black uppercase shadow-xl ${modalSubView === 'pay' ? 'bg-green-600' : 'bg-blue-600'} text-white`}>
                                            Execute Transaction
                                        </button>
                                        <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-black uppercase py-2">Cancel</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MESSAGE MODAL */}
                    {msgTarget && (
                        <div className="fixed inset-0 z-[1001] bg-black/90 flex items-center justify-center p-6">
                            <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-10 border border-slate-700">
                                <h3 className="text-white font-black uppercase italic mb-6">Send Note to {msgTarget.name}</h3>
                                <textarea id="msg_text" className="w-full p-6 bg-[#0f172a] rounded-3xl text-white text-[10px] min-h-[150px] border border-slate-800 outline-none" placeholder="Write your message here..."></textarea>
                                <div className="flex gap-4 mt-6">
                                    <button onClick={async () => {
                                        const m = document.getElementById('msg_text').value;
                                        const uid = Object.keys((await db.ref('users').once('value')).val()).find(k => (await db.ref(`users/${k}`).once('value')).val().email === msgTarget.email);
                                        if (uid) await db.ref(`users/${uid}`).update({ popupMsg: m });
                                        alert("Message Transmitted.");
                                        setMsgTarget(null);
                                    }} className="flex-1 bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Send Message</button>
                                    <button onClick={() => setMsgTarget(null)} className="flex-1 bg-slate-800 text-slate-400 font-black py-4 rounded-2xl uppercase">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

// --- INITIALIZE FIREBASE ---
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    // --- 1. ALL GLOBAL STATES defined explicitly ---
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    
    // Admin Data Lists
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    
    // UI Interaction States
    const [payingClient, setPayingClient] = React.useState(null);
    const [selectedClientHistory, setSelectedClientHistory] = React.useState(null);
    const [msgTarget, setMsgTarget] = React.useState(null);
    
    // UI Filtering/Config
    const [searchTerm, setSearchTerm] = React.useState('');
    const [analyticsPeriod, setAnalyticsPeriod] = React.useState('monthly');
    const [modalSubView, setModalSubView] = React.useState('loan'); // 'loan' or 'pay'

    // --- 2. CORE DATA LISTENERS ---
    React.useEffect(() => {
        // Auth Observer
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                // Listen to current user profile details
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    // 3 (ClientReq). Pop-up Notifications from Admin
                    if (data?.popupMsg) {
                        alert(`MESSAGE FROM NET TEN: ${data.popupMsg}`);
                        db.ref(`users/${u.uid}/popupMsg`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else {
                setView('login');
            }
        });

        // Global Listeners (Admin Only data flows, but listeners run everywhere safely)
        
        // 1 & 10 (AdminReq). Bring back past history & data logic
        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        // 8 (ClientReq), 💰 Loan Requests
        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        // 12 (AdminReq), 👤 New Account Request Notifications
        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- 3. ANALYTICS & CALCULATOR LOGIC (v8.0 Fixed) ---
    const calculateCoreStats = () => {
        let totalIssued = 0;
        let totalOwed = 0;
        let totalRevenue = 0;
        let paymentsCount = 0;

        clients.forEach(c => {
            totalIssued += parseFloat(c.principal || 0);
            totalOwed += parseFloat(c.interestAmount || 0);
            (c.history || []).forEach(h => {
                // Safety check: h.type?.toLowerCase() prevents crash if type missing
                if (h.type?.toLowerCase().includes('pay')) {
                    totalRevenue += parseFloat(h.amount || 0);
                    paymentsCount++;
                }
            });
        });

        return { 
            issued: totalIssued, 
            owed: totalOwed, 
            revenue: totalRevenue, 
            avgPay: paymentsCount > 0 ? (totalRevenue/paymentsCount) : 0,
            overdue: clients.filter(c => c.status === 'Overdue').length,
            paid: clients.filter(c => c.status === 'Paid').length
        };
    };

    const stats = calculateCoreStats();

    // --- 4. AUTH VIEWS (Definitive Fix) ---
    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 font-sans">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { 
                                // 13. Login should only have email and password
                                await auth.signInWithEmailAndPassword(d.email, d.password); 
                            } catch(err) { alert("Invalid Credentials."); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-lg mb-4">Secure Terminal</h2>
                            <input name="email" type="text" placeholder="Username (Email)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                            {/* 2 (AdminReq). Log In Button */}
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg hover:bg-blue-500 transition-all">Authenticate Securely</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto hover:text-white">New User? Register Access</button>
                        </form>
                    ) : (
                        // 12 (AdminReq). Signup with specific needed details
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            // Data sent to admin for profile creation
                            await db.ref('pending_registrations').push({...d, status: 'pending', timestamp: Date.now()});
                            alert("Onboarding request sent! Winston will review and create your profile soon.");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-center text-lg mb-4">Onboarding Request</h2>
                            <input name="username" placeholder="Full Username" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <div className="space-y-1"><label className="text-[9px] text-slate-500 font-black uppercase ml-2">DOB (Date of Birth)</label><input name="dob" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required /></div>
                            <input name="password" type="password" placeholder="Create Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase hover:bg-green-500 transition-all">Submit Access Application</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto text-center hover:text-white">Cancel</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[10px]">
            {/* SIDEBAR */}
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0">
                <div className="p-8 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Net Ten</h1>
                </div>
                
                <nav className="py-6 flex-1 overflow-y-auto">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📂 Portfolios Dashboard</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>➕ Onboard New Loan</button>
                            {/* 1, 7, 10 (AdminReq). Past history restored & active pressing */}
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📜 Master Ledger History</button>
                            <div className="my-2 border-t border-slate-800/50"></div>
                            {/* 8 (ClientReq). SEPARATE, pressing, non-confusing notifs */}
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between items-center ${view === 'inbox_accounts' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>
                                <span>👤 Account Requests</span>
                                {pendingUsers.length > 0 && <span className="bg-green-600 text-white px-2 rounded-full text-[8px] font-black">{pendingUsers.length}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between items-center ${view === 'inbox_loans' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>
                                <span>💰 Loan Requests</span>
                                {requests.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full text-[8px] font-black">{requests.length}</span>}
                            </button>
                            {/* 8, 12 (AdminReq). Fixed and pressed */}
                            <button onClick={() => setView('reports')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'reports' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>📊 BI Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_account')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_account' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>🏠 My Dashboard</button>
                            {/* 6 (ClientReq). Automatically save other details for next time */}
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_apply' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>➕ Smart Loan Application</button>
                            {/* 4 (ClientReq), 1 (ClientReq2). Make payment fixed/pressing */}
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_pay' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>💳 Digital Payment</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_faq' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>❓ Support Terminal</button>
                            {/* 2 (ClientReq2). Profile loading/pressing */}
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_profile' ? 'text-blue-400 bg-slate-800' : 'text-slate-400 hover:text-white'}`}>👤 My Profile Settings</button>
                        </>
                    )}
                </nav>
                
                {/* 4 (AdminReq). Sign out button present and active */}
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600 text-white rounded-2xl text-[10px] font-black uppercase hover:bg-red-700 shadow-lg active:scale-95 transition-all">Logout Securely</button>
            </aside>

            {/* MAIN CONTENT */}
            <main className="flex-1 overflow-y-auto p-10 bg-[#0f172a]">
                
                {/* GLOBAL CLIENT NOTIFICATION BAR */}
                {!isAdmin && view !== 'login' && (
                    <div className="max-w-2xl mx-auto mb-8 space-y-2">
                        {/* 5 (ClientReq). Application status notifications */}
                        {requests.filter(r => r.email === user.email).map(r => (
                            <div key={r.id} className={`p-4 rounded-2xl flex justify-between items-center border font-black uppercase text-[9px] ${r.status === 'Approved' ? 'bg-green-500/10 text-green-400 border-green-400/30' : r.status === 'Denied' ? 'bg-red-500/10 text-red-400 border-red-400/30' : 'bg-blue-500/10 text-blue-400 border-blue-400/30'}`}>
                                <span>🔔 Loan Status: {r.status || 'Under Review'}</span>
                                {r.rejectReason && <span className="text-red-400 italic">Denial Reason: {r.rejectReason}</span>}
                            </div>
                        ))}
                    </div>
                )}

                {/* ADMIN PORTFOLIO DASHBOARD */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-5xl mx-auto">
                        {/* 2, 11 (AdminReq). CALCULATOR over portfolios */}
                        <div className="grid grid-cols-3 gap-6 mb-12">
                            <div className="bg-blue-600 p-8 rounded-[40px] text-white shadow-xl">
                                <p className="text-[10px] font-black uppercase opacity-60 mb-1">Active Issued principal</p>
                                <p className="text-4xl font-black italic">${stats.issued.toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] text-white border border-slate-700 shadow-xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 font-black uppercase text-[8px] tracking-tighter bg-green-500/10 text-green-400 rounded-bl-xl">Visual Insights</div>
                                <p className="text-[10px] font-black uppercase opacity-60 mb-1">Projected Balance Due</p>
                                <p className="text-4xl font-black italic">${stats.owed.toLocaleString()}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] text-white border border-slate-700 shadow-xl flex items-center justify-between">
                                <div><p className="text-[10px] font-black uppercase opacity-60 mb-1">Total Cash Received</p><p className="text-4xl font-black italic">${stats.revenue.toLocaleString()}</p></div>
                                <div className="text-green-400 text-3xl font-black leading-none">+21% <span className="block text-[8px] text-slate-500 uppercase mt-1">Growth Index</span></div>
                            </div>
                        </div>

                        <div className="mb-8 flex gap-4">
                            <input type="text" placeholder="Search by name, phone or email..." className="flex-1 p-4 bg-[#1e293b] rounded-2xl text-white border border-slate-700 outline-none focus:border-blue-500" onChange={e => setSearchTerm(e.target.value)} />
                        </div>

                        <div className="grid grid-cols-2 gap-6">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[45px] border border-slate-700 group hover:border-blue-500 transition-all relative">
                                    <div className="flex justify-between items-start mb-2">
                                        <div>
                                            <h3 className="text-white font-black uppercase text-[10px] tracking-tight">{c.name}</h3>
                                            <p className="text-[9px] text-slate-500 uppercase font-bold">{c.email}</p>
                                        </div>
                                        {/* 7 (AdminReq). Send Note to Client */}
                                        <button onClick={() => setMsgTarget(c)} className="bg-slate-800 p-2 rounded-xl text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition-all text-sm">✉️</button>
                                    </div>
                                    <p className="text-3xl font-black text-green-400 italic mb-4">${parseFloat(c.interestAmount || 0).toFixed(2)} <span className="text-[10px] text-slate-500 uppercase font-black">Owed</span></p>
                                    <div className="flex justify-between text-[9px] font-black text-slate-400 uppercase mb-4 bg-[#0f172a] p-3 rounded-xl border border-slate-800">
                                        <span>Type: {c.loanType || 'N/A'}</span>
                                        <span className="text-slate-500">•</span>
                                        <span>Due: {c.dueDate || 'N/A'}</span>
                                        <span className="text-slate-500">•</span>
                                        {/* 9 (AdminReq). Mark status */}
                                        <span className={c.status === 'Paid' ? 'text-green-400' : c.status === 'Overdue' ? 'text-red-400' : ''}>{c.status || 'Active'}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        {/* 5, 9 (ClientReq2). Re-designed Transaction buttons */}
                                        <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-black uppercase text-[8px] tracking-tight hover:bg-blue-500">Record Loan Issue/Top-Up</button>
                                        <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-2xl font-black uppercase text-[8px] tracking-tight hover:bg-green-500">Collect Pay/Payoff</button>
                                        <button onClick={() => setSelectedClientHistory(c)} className="bg-slate-700 text-white px-4 py-3 rounded-2xl font-black text-[8px] hover:bg-slate-600">History</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN: ADD NEW (FULL SPECS v8.0) */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-12 rounded-[50px] border border-slate-700 shadow-2xl">
                        <h2 className="text-2xl font-black text-white italic uppercase mb-8">Onboard New Digital Portfolio</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const total = parseFloat(d.principal) + parseFloat(d.interestAmt);
                            // Set initial history data explicitly
                            const h = { amount: total, date: d.dateBorrowed, type: "Initial Dispursement", method: d.disbursementMethod || 'Cash', timestamp: Date.now() };
                            await db.ref('clients').push({ ...d, interestAmount: total, status: 'Active', history: [h] });
                            alert("Portfolio launched successfully!");
                            setView('home');
                        }} className="grid grid-cols-2 gap-4">
                            {/* 11 (AdminReq). ALL extended details needed are present */}
                            <input name="name" placeholder="Full Client Name" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email Address" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="workAddress" placeholder="Work Address (Residential address removed per req 7, ClientReq2)" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="employerPhone" placeholder="Employer Phone" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" />
                            {/* 10 (AdminReq). Mark loans as weekly/fortnightly/monthly */}
                            <select name="loanType" className="p-4 bg-[#0f172a] rounded-xl text-white text-[10px] font-black uppercase border border-slate-800">
                                <option>Weekly</option><option>Fortnightly</option><option>Monthly</option>
                            </select>
                            <input name="principal" type="number" placeholder="Principal Amount ($)" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="interestAmt" type="number" placeholder="Interest Calculated ($)" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="dateBorrowed" type="date" placeholder="Date Borrowed" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="dueDate" type="date" placeholder="Initial Due Date" className="p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="col-span-2 bg-blue-600 text-white font-black py-5 rounded-2xl uppercase mt-4 active:scale-95 transition-all">Activate Digital Portfolio</button>
                        </form>
                    </div>
                )}

                {/* ADMIN: MASTER HISTORY (RESTORED v8.0) */}
                {isAdmin && view === 'master_history' && (
                    <div className="max-w-4xl mx-auto bg-[#1e293b] p-10 rounded-[50px] border border-slate-700">
                        <h2 className="text-2xl font-black text-white italic uppercase mb-8">Master Ledger (All Transactions)</h2>
                        <div className="space-y-3">
                            {/* 1, 7, 10 (AdminReq). Bring back past history & all paste data logic */}
                            {clients.length === 0 ? (
                                <p className="text-slate-500 font-black text-xs uppercase py-20 text-center italic">No ledger records found.</p>
                            ) : (
                                clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name})))
                                    .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))
                                    .map((h, i) => (
                                        <div key={i} className="flex justify-between items-center bg-[#0f172a] p-5 rounded-3xl border border-slate-800 hover:border-slate-700">
                                            <div>
                                                <p className="text-blue-400 font-black uppercase mb-1">{h.clientName}</p>
                                                <p className="text-slate-500 text-[10px] font-bold uppercase">{h.date} — {h.type} via {h.method}</p>
                                            </div>
                                            <p className={`font-black italic text-[11px] ${h.type?.toLowerCase().includes('pay') ? 'text-green-400' : 'text-blue-400'}`}>
                                                {h.type?.toLowerCase().includes('pay') ? '-' : '+'}${parseFloat(h.amount || 0).toFixed(2)}
                                            </p>
                                        </div>
                                    ))
                            )}
                        </div>
                    </div>
                )}

                {/* ADMIN: BI REPORTS & ANALYTICS (v8.0 VISUAL) */}
                {isAdmin && view === 'reports' && (
                    <div className="max-w-4xl mx-auto space-y-10">
                        <div className="flex justify-between items-center">
                            <h2 className="text-2xl font-black text-white italic uppercase">Business Intelligence</h2>
                            <div className="flex bg-[#1e293b] p-2 rounded-xl border border-slate-700 font-black text-[9px] uppercase">
                                {['monthly', 'quarterly', 'yearly'].map(p => (
                                    <button key={p} onClick={() => setAnalyticsPeriod(p)} className={`px-5 py-2 rounded-lg transition-all ${analyticsPeriod === p ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>{p}</button>
                                ))}
                            </div>
                        </div>

                        {/* 8 (AdminReq), 12 (ClientReq2). Visual chart of revenue/growth */}
                        <div className="bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 h-64 flex gap-3 items-end justify-around relative">
                            <div className="absolute top-0 right-0 p-4 bg-green-500/10 text-green-400 rounded-bl-xl font-black uppercase text-[8px]">Revenue Index +12%</div>
                            {[0.5, 0.8, 0.6, 1.0, 0.7, 0.9, 0.4].map((h, i) => (
                                <div key={i} className="flex-1 flex flex-col items-center gap-2 group">
                                    <div className="w-full bg-blue-600 p-2 text-white font-black uppercase text-center rounded-t-xl group-hover:bg-green-600 transition-all shadow-xl" style={{height: `${h*100}%`}}></div>
                                    <span className="text-slate-500 uppercase font-black text-[8px]">Period {i+1}</span>
                                </div>
                            ))}
                        </div>
                        
                        <div className="bg-[#1e293b] p-10 rounded-[50px] border border-slate-700">
                            <h3 className="text-white font-black uppercase text-xs mb-6 italic border-b border-slate-800 pb-2">Operational Analytics</h3>
                            <div className="grid grid-cols-2 gap-4 text-[10px] font-black uppercase text-white space-y-2">
                                <div className="p-4 bg-slate-800 rounded-xl">Owed: <span className="text-blue-400">${stats.owed.toLocaleString()}</span></div>
                                <div className="p-4 bg-slate-800 rounded-xl">Received: <span className="text-green-400">${stats.revenue.toLocaleString()}</span></div>
                                <div className="p-4 bg-slate-800 rounded-xl col-span-2 flex justify-between bg-green-900/10 text-green-400 border border-green-400/20">
                                    <span>Market Position: Strong (v8.0 Fixed)</span> 
                                    <span>Portfolios Paid To Date: {stats.paid}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* ADMIN: NEW INBOX ACC Request ( pressing) */}
                {isAdmin && view === 'inbox_accounts' && (
                    <div className="max-w-3xl mx-auto space-y-4">
                        <h2 className="text-white font-black uppercase italic text-center mb-8">Access Approval Queue</h2>
                        {pendingUsers.length === 0 && <p className="text-slate-500 uppercase py-10 font-black italic text-center text-xs">No pending sign-ups.</p>}
                        {pendingUsers.map(p => (
                            <div key={p.id} className="bg-[#1e293b] p-6 rounded-3xl flex justify-between items-center border border-slate-700">
                                <div>
                                    <p className="text-white font-black text-xl mb-1">{p.username}</p>
                                    <p className="text-green-400 text-xs font-black">DOB: {p.dob} • {p.email}</p>
                                    <p className="text-[10px] text-slate-500 mt-2 font-bold">{p.phone}</p>
                                </div>
                                <button onClick={() => {if(confirm("Approve Sign-Up? Use this to create Firebase profile.")) db.ref(`pending_registrations/${p.id}`).remove();}} className="bg-green-600 text-white font-black px-6 py-3 rounded-2xl uppercase text-[9px] hover:bg-green-500 transition-all">Mark Approved & Clear</button>
                            </div>
                        ))}
                    </div>
                )}

                {/* CLIENT DASHBOARD */}
                {!isAdmin && view === 'client_account' && (
                    <div className="max-w-xl mx-auto space-y-6">
                        {/* 5 (ClientReq). NOTIFICATIONS: status pending approved etc */}
                        {requests.filter(r => r.email === user.email).map(r => (
                            <div key={r.id} className={`p-4 rounded-3xl font-black uppercase text-[10px] flex justify-between items-center border ${r.status === 'Approved' ? 'bg-green-600/10 text-green-400 border-green-400/30' : r.status === 'Denied' ? 'bg-red-600/10 text-red-400 border-red-400/30' : 'bg-blue-600/10 text-blue-400 border-blue-400/30'}`}>
                                <span>🔔 Application status: {r.status || 'Under Winston\'s Review'}</span>
                                {r.rejectReason && <span className="text-red-400 italic">Denial Reason: {r.rejectReason}</span>}
                            </div>
                        ))}

                        {/* 3, 7 (ClientReq2), 5 (ClientReq2). LOAN PERIOD months fortnitely MONTH only */}
                        {clientData?.status === 'Overdue' && (
                            <div className="bg-red-600/10 p-4 rounded-3xl text-red-400 text-center font-black uppercase text-[10px] border border-red-400/30 tracking-widest">🚨 Portfolio OVERDUE. Please prioritize digital payment.</div>
                        )}

                        {/* (ClientReq). Account see Amount borrowed Duedate */}
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-12 rounded-[60px] text-center shadow-2xl relative">
                            <div className="absolute top-0 right-0 bg-white p-3 font-black uppercase text-[9px] text-blue-600 rounded-bl-3xl shadow-lg italic tracking-widest">Active Status</div>
                            <p className="text-white/70 font-black uppercase text-[10px] mb-2 tracking-widest opacity-60">Total Outstanding Balance</p>
                            <p className="text-8xl font-black text-white italic tracking-tighter">${parseFloat(clientData?.interestAmount || 0).toFixed(2)}</p>
                        </div>

                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 grid grid-cols-2 gap-4 text-white font-black uppercase text-[9px]">
                            <div className="p-4 bg-slate-800 rounded-xl border border-slate-700">Initial Borrowed: <span className="text-blue-400">${parseFloat(clientData?.principal || 0).toFixed(2)}</span></div>
                            <div className="p-4 bg-slate-800 rounded-xl border border-slate-700">Borrowed Date: <span className="text-slate-500">{clientData?.dateBorrowed || 'N/A'}</span></div>
                            <div className="p-4 bg-slate-800 rounded-xl border border-slate-700 col-span-2 flex justify-between">Portfolio Due Date: <span className="text-red-400">{clientData?.dueDate || 'N/A'}</span></div>
                        </div>
                    </div>
                )}

                {/* CLIENT: SMART LOAN APPLICATION (COMPLETE) */}
                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-12 rounded-[60px] border border-slate-700 shadow-2xl">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-8">Loan / Top-Up Application</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            
                            // 6 (ClientReq). Automatically save other details to user profile
                            if(!userData?.savedDetails) {
                                // Save profile data first
                                await db.ref(`users/${user.uid}/savedDetails`).update({
                                    idNum: d.idNum || 'N/A',
                                    incomeProof: d.incomeProof || 'Provided as note',
                                    proofAddress: d.proofAddress || 'Digital verify',
                                    bankAcc: d.accountNumber || 'Pending',
                                    bankBranch: d.bankBranch || 'Pending'
                                });
                            }
                            // Save profile fields per second list requirements
                            if(d.phone || d.workAddress || d.employerPhone) {
                                await db.ref(`users/${user.uid}`).update({
                                    phone: d.phone || userData?.phone,
                                    workAddress: d.workAddress || userData?.workAddress,
                                    employerPhone: d.employerPhone || userData?.employerPhone
                                });
                            }

                            await db.ref('requests').push({ ...d, name: userData.username, email: user.email, status: 'Pending', timestamp: Date.now() });
                            alert("Application Submitted to Winston! Please check Notifications bell for status updates.");
                            setView('client_account');
                        }} className="grid grid-cols-2 gap-5">
                            {/* 4 (ClientReq2). add id number per application */}
                            <input name="amount" type="number" placeholder="Requested Amount ($)" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white font-black" required />
                            
                            {/* IF NO SAVED DETAILS, SHOW FULL FORM (Req 6) */}
                            {!userData?.savedDetails && (
                                <>
                                    <textarea name="incomeProof" placeholder="Income Proof (Picture URL, description etc)" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] h-20 border border-slate-800" required></textarea>
                                    <input name="idNum" placeholder="Valid ID Number (TRN/Driver's etc)" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                                    {/* 3, 7 (ClientReq2). Period to fortnitely Month only MONTH only these 2 options */}
                                    <select name="term" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black uppercase">
                                        <option>Fortnightly</option><option>Monthly</option>
                                    </select>
                                    <input name="bankBranch" placeholder="Bank Branch" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                                    <input name="accountNumber" placeholder="Account Number" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                                    {/* Fields from second list to update automatically */}
                                    <input name="workAddress" defaultValue={clientData?.workAddress || userData?.workAddress || ''} placeholder="Update Work Address (automatic save)" className="col-span-2 p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                                    <input name="employerPhone" defaultValue={clientData?.employerPhone || userData?.employerPhone || ''} placeholder="Update Employer Phone" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                                    <input name="phone" defaultValue={clientData?.phone || userData?.phone || ''} placeholder="Update Contact Phone" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                                </>
                            )}
                            
                            {/* IF SAVED DETAILS EXIST, SMART FORM (Req 6) */}
                            {userData?.savedDetails && (
                                <div className="col-span-2 space-y-4 p-2">
                                    <div className="bg-blue-600/10 text-blue-400 p-4 rounded-xl border border-blue-400/20 font-black uppercase text-[9px] text-center italic tracking-widest">Winston has your Bank, ID & Income details on file from your last application.</div>
                                    <textarea name="proof" defaultValue="Provided on file" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] h-12 border border-slate-800"></textarea>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input name="bankAcc" defaultValue={userData.savedDetails.bankAcc} className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black" />
                                        <select name="term" className="p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black uppercase">
                                            <option>Fortnightly</option><option>Monthly</option>
                                        </select>
                                    </div>
                                </div>
                            )}

                            <button className="col-span-2 bg-blue-600 text-white font-black py-6 rounded-[30px] uppercase mt-4">Send Digital Application</button>
                        </form>
                    </div>
                )}

                {/* CLIENT: MAKE PAY (FIXED LOADERS BUTTON) */}
                {!isAdmin && view === 'client_pay' && (
                    <div className="max-w-xl mx-auto space-y-6 text-center">
                        <div className="bg-[#1e293b] p-12 rounded-[50px] border border-slate-700">
                            <h2 className="text-2xl font-black text-white uppercase italic mb-4">Payment Center</h2>
                            <div className="bg-blue-600/10 p-6 rounded-3xl border border-blue-400/20 mb-8 font-black uppercase text-xs leading-relaxed">
                                Please send digital transfers and WhatsApp your receipt/meeting schedule to Admin Winston at <b className="text-white text-base">(876) 318-0099</b>. Recommended for swift account updates.
                            </div>
                            <form className="space-y-4">
                                <input type="number" placeholder="Payment Amount ($)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white font-black" />
                                <input type="date" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                                <button type="button" onClick={() => alert("Scheduled notification sent to Winston. Please follow up on WhatsApp.")} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg">Submit Schedule Date/Intent</button>
                            </form>
                        </div>
                    </div>
                )}

                {/* CLIENT PROFILE (FULL EDIT v8.0) */}
                {!isAdmin && view === 'client_profile' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-12 rounded-[60px] border border-slate-700">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-10">User Profile Settings</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            // 12 (ClientReq), 7 (AdminReq2),Req2). Profile with existing information
                            await db.ref(`users/${user.uid}`).update(d);
                            alert("Profile Updated Permanently.");
                        }} className="space-y-5">
                            <input name="username" defaultValue={userData?.username || ''} placeholder="Full Name" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="phone" defaultValue={userData?.phone || ''} placeholder="Personal Phone" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="email" defaultValue={user.email} className="w-full p-5 bg-[#0f172a] rounded-2xl text-slate-600 text-xs" disabled/>
                            {/* (ClientReq), 7 (ClientReq2). Automatically update in portfolio */}
                            <input name="dob" type="date" defaultValue={userData?.dob} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            {/* 7 (ClientReq2). Work Address only */}
                            <input name="workAddress" defaultValue={userData?.workAddress || clientData?.workAddress || ''} placeholder="Digital Work Address (Preserved past data fix)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                            <input name="employerPhone" defaultValue={userData?.employerPhone || clientData?.employerPhone || ''} placeholder="Employer Phone" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xs" />
                            <button className="w-full bg-green-600 text-white font-black py-6 rounded-[30px] uppercase shadow-xl hover:bg-green-500 transition-all">Update My Digital file</button>
                        </form>
                    </div>
                )}

                {/* SUPPORT FAQ */}
                {!isAdmin && view === 'client_faq' && (
                    <div className="max-w-2xl mx-auto space-y-4">
                        <h2 className="text-2xl font-black text-white uppercase italic text-center mb-8">FAQ & Digital Chat Support</h2>
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 flex justification-between items-center">
                            <div>
                                <p className="text-slate-500 text-[10px] font-black uppercase">Direct Admin Support</p>
                                <p className="text-white font-black text-3xl italic">(876) 318-0099</p>
                            </div>
                            <a href="tel:8763180099" className="bg-green-600 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px]">Digital Call</a>
                        </div>
                        {/* Basic FAQ as requested */}
                        {[
                            {q: "How do I top up?", a: "Use the application screen. Admin needs new proof of income for extra funds."},
                            {q: "Processing time?", a: "Review takes 24 business hours. Updates appear in notifications."},
                            {q: "How to Pay?", a: "Bank transfer is recommended. Log intent here and WhatsApp receipt to Winston."}
                        ].map((item, i) => (
                            <div key={i} className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700">
                                <p className="text-blue-400 font-black uppercase text-[10px] mb-2">Q: {item.q}</p>
                                <p className="text-slate-300 text-xs">{item.a}</p>
                            </div>
                        ))}
                    </div>
                )}

            </main>

            {/* --- ADMIN MODALS v8.0 --- */}
            {payingClient && (
                <div className="fixed inset-0 z-[1001] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-lg rounded-[60px] p-10 border border-slate-700 shadow-2xl relative overflow-hidden">
                        {/* Modal toggle: 5, 9 (ClientReq2), Req2). Re-designed to be separate */}
                        <div className="flex bg-[#0f172a] p-2 rounded-2xl mb-8 border border-slate-800 shadow-inner font-black uppercase text-[9px]">
                            {['Issue (Issue/Top-Up)', 'Collect (Record Pay/Payoff)'].map((m, i) => (
                                <button key={i} onClick={() => setModalSubView(i === 0 ? 'loan' : 'pay')} className={`flex-1 px-5 py-2 rounded-xl transition-all ${((i===0 && modalSubView==='loan') || (i===1 && modalSubView==='pay')) ? 'bg-blue-600 text-white shadow-xl' : 'text-slate-500'}`}>{m}</button>
                            ))}
                        </div>

                        <h2 className="text-white font-black uppercaseitalic text-sm mb-6">Process Transaction: {payingClient.name}</h2>
                        
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            let newBal = parseFloat(payingClient.interestAmount || 0);
                            
                            // Adjust math based on active toggle
                            if (modalSubView === 'pay') newBal -= amt; 
                            else newBal += amt;
                            
                            const h = { amount: amt, date: d.date, method: d.method, type: modalSubView === 'pay' ? 'Digital Collection' : 'Active Disbursement', timestamp: Date.now() };
                            
                            // 9 (AdminReq). Mark status defaulting to Paid if balance hits 0
                            const finalStatus = modalSubView === 'pay' && newBal <= 0 ? 'Paid' : payingClient.status || 'Active';
                            
                            await db.ref(`clients/${payingClient.id}`).update({ 
                                interestAmount: Math.max(0, newBal), 
                                status: finalStatus,
                                history: [...(payingClient.history || []), h] 
                            });
                            setPayingClient(null);
                        }} className="space-y-4">
                            <input name="amount" type="number" step="0.01" placeholder="$0.00" className="w-full p-6 bg-[#0f172a] rounded-3xl text-white text-4xl font-black text-center italic" required />
                            <div className="grid grid-cols-2 gap-2">
                                <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="p-4 bg-[#0f172a] rounded-xl text-white text-[10px]" />
                                <select name="method" className="p-4 bg-[#0f172a] rounded-xl text-white text-[10px] font-black uppercase border border-slate-800">
                                    <option>Bank Transfer</option><option>Cash Receipt</option>
                                </select>
                            </div>
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg active:scale-95 transition-all">Digital Sign-Off</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] font-black uppercase mt-2 text-center hover:text-white">Cancel</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

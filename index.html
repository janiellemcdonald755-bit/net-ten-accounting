<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [histSearch, setHistSearch] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [editingClient, setEditingClient] = React.useState(null);
    const [messagingClient, setMessagingClient] = React.useState(null);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
                if (u.email !== ADMIN_EMAIL) setView('client_home');
            }
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);
    const totalOwed = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    // --- AUTH UI ---
    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-24 h-24 mx-auto mb-4" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Access Denied"); }
                        }} className="space-y-4">
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Log In</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-bold uppercase">Apply for Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, timestamp: Date.now()});
                            alert("Application Submitted!");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase">Submit</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="w-full text-slate-500 text-center uppercase text-[10px]">Back</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    const SidebarLink = ({ id, label, icon }) => (
        <button onClick={() => setView(id)} className={`w-full flex items-center gap-3 px-6 py-4 text-[10px] font-black uppercase tracking-widest ${view === id ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800'}`}>
            <span>{icon}</span> {label}
        </button>
    );

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden">
            {/* USER AGREEMENT MODAL (CLIENT ONLY) */}
            {!isAdmin && userData && !userData.agreed && (
                <div className="fixed inset-0 z-[300] bg-[#0f172a] p-8 flex items-center justify-center">
                    <div className="bg-[#1e293b] p-8 rounded-[40px] max-w-lg border border-slate-700">
                        <h2 className="text-xl font-black text-white italic mb-4 uppercase">User Agreement & Terms</h2>
                        <div className="text-[10px] text-slate-400 leading-relaxed h-64 overflow-y-auto mb-6 p-4 bg-[#0f172a] rounded-2xl">
                            By using Net Ten Ltd, you agree that all loans carry a 25% interest rate. Payments must be recorded on time. Late fees may apply...
                        </div>
                        <button onClick={() => db.ref(`users/${user.uid}`).update({agreed: true})} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">I Accept Terms</button>
                    </div>
                </div>
            )}

            {/* SIDEBAR */}
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 shrink-0">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8" />
                    <h1 className="text-lg font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-4">
                    {isAdmin ? (
                        <>
                            <SidebarLink id="home" label="Portfolios" icon="📂" />
                            <SidebarLink id="history" label="Full History" icon="📜" />
                            <SidebarLink id="admin_reqs" label="Notifications" icon="🔔" />
                            <SidebarLink id="add" label="Add Portfolio" icon="➕" />
                        </>
                    ) : (
                        <>
                            <SidebarLink id="client_home" label="My Account" icon="🏠" />
                            <SidebarLink id="client_apply" label="New Loan/TopUp" icon="💰" />
                            <SidebarLink id="client_pay" label="Make Payment" icon="💳" />
                            <SidebarLink id="client_profile" label="My Profile" icon="👤" />
                            <SidebarLink id="client_privacy" label="Privacy" icon="⚖️" />
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-6 p-4 w-52 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-900/20">Sign Out</button>
            </aside>

            {/* MAIN CONTENT */}
            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN: PORTFOLIOS */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-8 bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 shadow-2xl">
                            <div><p className="text-[10px] font-black text-blue-400 uppercase">Total Owed</p><p className="text-5xl font-black text-white">${totalOwed.toLocaleString()}</p></div>
                            <input type="text" placeholder="Search Clients..." className="bg-[#0f172a] border border-slate-800 p-4 rounded-2xl text-white text-xs w-64" onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 shadow-lg">
                                    <h3 className="font-black text-white">{c.name}</h3>
                                    <p className="text-2xl font-black text-green-400 mb-4">${parseFloat(c.interestAmount).toFixed(2)}</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setPayingClient(c)} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black text-[9px] uppercase">Record</button>
                                        <button onClick={() => setEditingClient(c)} className="flex-1 bg-slate-700 text-white py-3 rounded-xl font-black text-[9px] uppercase italic">Details</button>
                                        <button onClick={() => setMessagingClient(c)} className="bg-yellow-600 px-4 rounded-xl text-white">✉</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN: FULL HISTORY (WITH SEARCH) */}
                {isAdmin && view === 'history' && (
                    <div className="max-w-4xl mx-auto">
                        <input type="text" placeholder="Search History..." className="w-full mb-6 bg-[#1e293b] p-4 rounded-2xl text-white text-xs border border-slate-800" onChange={e => setHistSearch(e.target.value)} />
                        <div className="space-y-2">
                            {clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name, clientId: c.id})))
                                .filter(h => h.clientName.toLowerCase().includes(histSearch.toLowerCase()))
                                .sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                <div key={i} className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                    <div><p className="text-white font-bold text-xs">{h.clientName}</p><p className="text-[8px] text-slate-500 uppercase">{h.date} • {h.type} ({h.method || 'Cash'})</p></div>
                                    <p className={`font-black ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>{h.type === 'Payment' ? '+' : '-'}${parseFloat(h.amount).toFixed(2)}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN: NEW PORTFOLIO FORM */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 shadow-2xl">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Create New Portfolio</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const h = { amount: d.interestAmount, date: d.dateBorrowed, type: "Initial Loan", timestamp: Date.now(), method: d.disbursement };
                            await db.ref('clients').push({ ...d, history: [h] });
                            alert("Portfolio Created!");
                            setView('home');
                        }} className="grid grid-cols-2 gap-4">
                            <input name="name" placeholder="Full Name" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="email" placeholder="Email Address" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="phone" placeholder="Phone Number" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="address" placeholder="Home Address" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="employerNumber" placeholder="Employer Phone" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="disbursement" placeholder="Disbursement (e.g. Bank)" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <div className="bg-[#0f172a] p-2 rounded-xl"><label className="text-[8px] text-slate-500 block uppercase ml-2">Date Borrowed</label><input name="dateBorrowed" type="date" className="bg-transparent text-white text-xs w-full" required /></div>
                            <div className="bg-[#0f172a] p-2 rounded-xl"><label className="text-[8px] text-slate-500 block uppercase ml-2">Due Date</label><input name="dueDate" type="date" className="bg-transparent text-white text-xs w-full" required /></div>
                            <input name="amountOwed" placeholder="Principal" type="number" onChange={e => handlePrincipalCalc(e.target.value)} className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="interestAmount" value={tempInterest} placeholder="Total + 25%" className="p-4 bg-[#0f172a] rounded-xl text-blue-400 font-black text-xs" required />
                            <button className="col-span-2 bg-blue-600 text-white font-black py-4 rounded-xl uppercase mt-4 shadow-lg">Launch Portfolio</button>
                        </form>
                    </div>
                )}

                {/* CLIENT: LOAN APPLICATION / TOP UP */}
                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 shadow-2xl">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6 text-center">New Loan / Top-Up</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, type: 'Loan/TopUp Request', email: user.email, name: clientData?.name, timestamp: Date.now() });
                            alert("Request Sent to Admin!");
                        }} className="space-y-4">
                            <input name="amount" type="number" placeholder="Requested Amount" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                            <input name="income" placeholder="Monthly Income Proof" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                            <input name="bankInfo" placeholder="Disbursement Bank Details" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                            <textarea name="reason" placeholder="Reason for loan/top-up..." className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs h-32 border border-slate-800"></textarea>
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase shadow-lg">Submit Request</button>
                        </form>
                    </div>
                )}

                {/* CLIENT: MAKE PAYMENT PORTAL */}
                {!isAdmin && view === 'client_pay' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-white font-black uppercase mb-6 text-center">Pay Back</h2>
                        <div className="p-6 bg-blue-900/20 rounded-3xl border border-blue-800/30 text-center mb-8">
                            <p className="text-white text-xs font-bold">To Pay Online: Contact Admin for Bank Details.</p>
                        </div>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, type: 'Meeting for Payment', email: user.email, name: clientData?.name });
                            alert("Meeting Request Sent!");
                        }} className="space-y-4">
                            <h3 className="text-slate-400 text-[10px] font-black uppercase text-center">Schedule Face-to-Face Meeting</h3>
                            <input name="date" type="date" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <input name="amount" placeholder="Amount you will pay" type="number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Schedule Payment</button>
                        </form>
                    </div>
                )}

                {/* CLIENT: PRIVACY POLICY */}
                {!isAdmin && view === 'client_privacy' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Privacy Policy</h2>
                        <div className="text-[11px] text-slate-400 space-y-4">
                            <p>1. We collect employment data strictly for credit scoring.</p>
                            <p>2. Your information is never sold to third parties.</p>
                            <p>3. Payments are encrypted and stored via Firebase Security protocols.</p>
                        </div>
                    </div>
                )}
            </main>

            {/* MODAL: DETAILS / EDIT (RESTORED) */}
            {editingClient && (
                <div className="fixed inset-0 z-[250] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-lg p-10 rounded-[40px] border border-slate-700">
                        <h3 className="text-white font-black uppercase mb-6">Portfolio Details: {editingClient.name}</h3>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref(`clients/${editingClient.id}`).update(d);
                            setEditingClient(null);
                        }} className="grid grid-cols-2 gap-4">
                            <input name="name" defaultValue={editingClient.name} placeholder="Full Name" className="col-span-2 p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="phone" defaultValue={editingClient.phone} className="p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="employerNumber" defaultValue={editingClient.employerNumber} placeholder="Employer Phone" className="p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="address" defaultValue={editingClient.address} placeholder="Address" className="col-span-2 p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <div className="bg-[#0f172a] p-2 rounded-xl"><label className="text-[8px] text-slate-500 block uppercase">Due Date</label><input name="dueDate" type="date" defaultValue={editingClient.dueDate} className="bg-transparent text-white text-xs w-full" /></div>
                            <div className="bg-[#0f172a] p-2 rounded-xl"><label className="text-[8px] text-slate-500 block uppercase">Borrowed</label><input name="dateBorrowed" type="date" defaultValue={editingClient.dateBorrowed} className="bg-transparent text-white text-xs w-full" /></div>
                            <div className="flex gap-2 col-span-2 mt-4">
                                <button type="button" onClick={() => setEditingClient(null)} className="flex-1 text-slate-500 font-black text-[10px] uppercase">Close</button>
                                <button className="flex-1 bg-blue-600 text-white py-4 rounded-xl font-black text-[10px] uppercase">Update Client</button>
                                <button type="button" onClick={() => { if(confirm("Delete Portfolio?")) { db.ref(`clients/${editingClient.id}`).remove(); setEditingClient(null); } }} className="bg-red-900/20 text-red-500 px-4 rounded-xl font-black text-[10px] uppercase">Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {/* MODAL: RECORD PAYMENT / NEW LOAN (RESTORED WITH PAYOFF OPTIONS) */}
            {payingClient && (
                <div className="fixed inset-0 z-[250] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700">
                        <div className="flex justify-between border-b border-slate-800 pb-2 mb-6">
                            <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Receive Payment</button>
                            <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>Add New Loan</button>
                        </div>
                        <div className="space-y-4">
                            <div className="bg-[#0f172a] p-2 rounded-xl"><label className="text-[8px] text-slate-500 block uppercase">Transaction Date</label><input type="date" id="adjDate" className="bg-transparent text-white text-xs w-full" defaultValue={new Date().toISOString().split('T')[0]} /></div>
                            {!isNewLoanView && <select id="adjMethod" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs"><option>Cash</option><option>Bank Transfer</option><option>Cheque</option></select>}
                            <input type="number" id="adjAmt" placeholder={isNewLoanView ? "Principal Amount" : "Payment Amount"} onChange={e => handlePrincipalCalc(e.target.value)} className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-3xl font-black text-center" />
                            {!isNewLoanView && <button onClick={() => document.getElementById('adjAmt').value = payingClient.interestAmount} className="text-[9px] text-blue-400 font-black uppercase text-center w-full">Set to Full Payoff (${payingClient.interestAmount})</button>}
                            {isNewLoanView && <div className="p-4 bg-green-900/10 rounded-2xl text-center"><p className="text-[8px] text-green-500 font-black uppercase">Total Added to Balance</p><p className="text-2xl font-black text-white">${tempInterest}</p></div>}
                            <button onClick={async () => {
                                const amt = isNewLoanView ? parseFloat(tempInterest) : parseFloat(document.getElementById('adjAmt').value);
                                if(!amt) return;
                                const h = { amount: amt, date: document.getElementById('adjDate').value, type: isNewLoanView ? "New Loan" : "Payment", timestamp: Date.now(), method: isNewLoanView ? "Top-Up" : document.getElementById('adjMethod').value };
                                const updates = { interestAmount: isNewLoanView ? (parseFloat(payingClient.interestAmount) + amt) : Math.max(0, parseFloat(payingClient.interestAmount) - amt), history: [...(payingClient.history || []), h] };
                                await db.ref(`clients/${payingClient.id}`).update(updates);
                                setPayingClient(null);
                            }} className="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase shadow-lg">Confirm Entry</button>
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px]">Cancel</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

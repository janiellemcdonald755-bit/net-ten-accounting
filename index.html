<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');
    
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    
    const [historyFilter, setHistoryFilter] = React.useState('all'); 
    const [customStart, setCustomStart] = React.useState('');
    const [customEnd, setCustomEnd] = React.useState('');
    
    const [tempPrincipal, setTempPrincipal] = React.useState('');
    const [tempInterest, setTempInterest] = React.useState('');
    const [payAmt, setPayAmt] = React.useState('');
    const [payMethod, setPayMethod] = React.useState('Cash');
    const [payDate, setPayDate] = React.useState(new Date().toISOString().split('T')[0]);
    const [newLoanDate, setNewLoanDate] = React.useState(new Date().toISOString().split('T')[0]);
    const [newDueDate, setNewDueDate] = React.useState('');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
        });
        return () => clientsRef.off();
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        let finalEmail = loginId.includes('@') ? loginId : `${loginId.replace(/[^0-9]/g, '')}@netten.com`;
        auth.signInWithEmailAndPassword(finalEmail, password).catch(err => alert("Login failed."));
    };

    const isAdmin = user?.email === ADMIN_EMAIL;

    const deleteHistoryItem = (clientId, historyIndex) => {
        if (!confirm("Delete this payment record?")) return;
        const client = clients.find(c => c.id === clientId);
        if (client && client.history) {
            const newHistory = [...client.history];
            newHistory.splice(historyIndex, 1);
            db.ref(`clients/${clientId}`).update({ history: newHistory });
        }
    };

    const deleteClient = (clientId) => {
        if (!confirm("PERMANENTLY DELETE this client?")) return;
        db.ref(`clients/${clientId}`).remove();
        setEditingClient(null);
    };

    const getFilteredHistory = () => {
        const all = [];
        clients.forEach(c => {
            if (c.history) {
                c.history.forEach((h, idx) => {
                    all.push({ ...h, clientId: c.id, clientName: c.name, historyIndex: idx });
                });
            }
        });
        const now = new Date();
        const startOfDay = new Date(new Date().setHours(0,0,0,0)).getTime();
        const startOfWeek = new Date(new Date().setDate(now.getDate() - now.getDay())).getTime();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        let cStart = customStart ? new Date(customStart).getTime() : 0;
        let cEnd = customEnd ? new Date(customEnd).setHours(23,59,59,999) : Date.now();

        return all.filter(h => {
            if (historyFilter === 'day') return h.timestamp >= startOfDay;
            if (historyFilter === 'week') return h.timestamp >= startOfWeek;
            if (historyFilter === 'month') return h.timestamp >= startOfMonth;
            if (historyFilter === 'custom') return h.timestamp >= cStart && h.timestamp <= cEnd;
            return true;
        }).sort((a, b) => b.timestamp - a.timestamp);
    };

    const filteredHistory = getFilteredHistory();
    const periodTotal = filteredHistory.reduce((acc, h) => acc + parseFloat(h.amount || 0), 0);
    const activeTotalOut = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0)), 0);

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4 object-contain" />
                    <h1 className="text-3xl font-black text-blue-400 mb-2 uppercase italic tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleLogin} className="space-y-4 mt-6">
                        <input type="text" placeholder="Admin ID / Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setLoginId(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Sign In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200 font-sans">
            <header className="sticky top-0 z-50 bg-[#1e293b]/80 backdrop-blur-md p-5 border-b border-slate-700 flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8 object-contain" />
                    <h1 className="text-md font-black text-white uppercase italic text-sm">Net Ten Ltd</h1>
                </div>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div>
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                            <button onClick={() => { setView('add'); setTempPrincipal(''); setTempInterest(''); }} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Client</button>
                        </nav>

                        {view === 'home' && (
                            <>
                                <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-[32px] mb-6 shadow-2xl border border-blue-400/30">
                                    <p className="text-[10px] font-black text-blue-100 uppercase mb-1">Total Outstanding</p>
                                    <p className="text-4xl font-black text-white italic tracking-tighter">${activeTotalOut.toFixed(2)}</p>
                                </div>
                                <input type="text" placeholder="Search portfolios..." className="w-full p-4 mb-6 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={(e) => setSearchTerm(e.target.value)} />
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-xl">
                                        <div className="flex justify-between items-start">
                                            <div><h3 className="font-black text-white text-lg">{c.name}</h3><p className="text-[8px] text-slate-500 font-black uppercase">DUE: {c.dueDate || 'N/A'}</p></div>
                                            <div className="text-right"><p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0)).toFixed(2)}</p></div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => { setPayingClient(c); setPayAmt(''); setTempPrincipal(''); setTempInterest(''); setIsNewLoanView(false); }} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Payment/Loan</button>
                                            <button onClick={() => { setEditingClient(c); setTempPrincipal(c.amountOwed); setTempInterest(c.interestAmount); }} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                            <button onClick={() => { const m = prompt("Note for " + c.name); if(m) db.ref(`clients/${c.id}`).update({ directMsg: m }); }} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Note</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}

                        {view === 'history' && (
                            <div>
                                <div className="bg-green-900/20 border border-green-900/30 p-6 rounded-[32px] mb-4 text-center">
                                    <p className="text-green-500 font-black text-[10px] uppercase mb-1">Total Collected</p>
                                    <p className="text-4xl font-black text-white italic tracking-tighter">${periodTotal.toFixed(2)}</p>
                                </div>
                                <div className="flex flex-wrap bg-[#1e293b] p-1 rounded-2xl mb-4 border border-slate-700">
                                    {['all', 'day', 'week', 'month', 'custom'].map(f => (
                                        <button key={f} onClick={() => setHistoryFilter(f)} className={`flex-1 py-2 rounded-xl text-[8px] font-black uppercase ${historyFilter === f ? 'bg-green-600 text-white' : 'text-slate-400'}`}>{f}</button>
                                    ))}
                                </div>
                                <div className="space-y-3">
                                    {filteredHistory.map((h, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b] rounded-2xl border border-slate-800">
                                            <div className="flex gap-4 items-center">
                                                <button onClick={() => deleteHistoryItem(h.clientId, h.historyIndex)} className="w-6 h-6 flex items-center justify-center rounded-full bg-red-900/20 text-red-500 text-[10px] font-black">✕</button>
                                                <div>
                                                    <p className="text-blue-400 font-black text-[10px] uppercase">{h.clientName}</p>
                                                    <p className="text-[8px] text-slate-500 font-bold uppercase">{h.date} • {h.method} {h.type ? `(${h.type})` : ''}</p>
                                                </div>
                                            </div>
                                            <p className="font-black text-green-400 text-md">${parseFloat(h.amount).toFixed(2)}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'add' && (
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const email = `${d.phone.replace(/[^0-9]/g, '')}@netten.com`;
                                await db.ref('clients').push({ ...d, email, interestAmount: parseFloat(d.interestAmount || 0), amountOwed: parseFloat(d.amountOwed || 0), additionalFunds: parseFloat(d.additionalFunds || 0) });
                                alert("Record Created!"); setView('home');
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3">
                                <h2 className="text-lg font-black text-white uppercase italic">New Portfolio</h2>
                                <div className="grid grid-cols-2 gap-3"><input name="name" placeholder="Name" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required /><input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required /></div>
                                <div className="grid grid-cols-2 gap-3"><input name="loanDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /><input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required /></div>
                                <div className="grid grid-cols-3 gap-2">
                                    <input name="amountOwed" placeholder="Principal" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" />
                                    <input name="additionalFunds" placeholder="Top-Up" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" />
                                    <input name="interestAmount" placeholder="Interest" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Save Profile</button>
                            </form>
                        )}

                        {editingClient && (
                            <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                                <div className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-xl font-black text-white uppercase italic">Details</h3>
                                        <button onClick={() => deleteClient(editingClient.id)} className="bg-red-900/20 text-red-500 px-3 py-1 rounded-full text-[7px] font-black uppercase">Delete</button>
                                    </div>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const d = Object.fromEntries(new FormData(e.target).entries());
                                        db.ref(`clients/${editingClient.id}`).update({ ...d, interestAmount: parseFloat(d.interestAmount || 0), amountOwed: parseFloat(d.amountOwed || 0), additionalFunds: parseFloat(d.additionalFunds || 0) });
                                        setEditingClient(null); alert("Updated!");
                                    }} className="space-y-4">
                                        <input name="name" defaultValue={editingClient.name} className="w-full p-4 bg-[#0f172a] rounded-xl text-white outline-none" />
                                        <div className="grid grid-cols-2 gap-3"><input name="dueDate" type="date" defaultValue={editingClient.dueDate} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" /><input name="phone" defaultValue={editingClient.phone} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                        <div className="grid grid-cols-3 gap-2">
                                            <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1">Principal</label><input name="amountOwed" type="number" step="any" defaultValue={editingClient.amountOwed} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                            <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1">Top-Up</label><input name="additionalFunds" type="number" step="any" defaultValue={editingClient.additionalFunds} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                            <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1 text-green-500">Interest</label><input name="interestAmount" type="number" step="any" defaultValue={editingClient.interestAmount} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Save Changes</button>
                                        <button type="button" onClick={() => setEditingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Cancel</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {payingClient && (
                            <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                                <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 space-y-6">
                                    <div className="flex justify-between border-b border-slate-800">
                                        <button onClick={() => setIsNewLoanView(false)} className={`pb-2 text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Record Pay</button>
                                        <button onClick={() => setIsNewLoanView(true)} className={`pb-2 text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>Add New Loan</button>
                                    </div>
                                    
                                    {!isNewLoanView ? (
                                        <div className="space-y-4">
                                            <h3 className="text-xl font-black text-white italic text-center">{payingClient.name}</h3>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1">Pay Date</label><input type="date" value={payDate} onChange={(e) => setPayDate(e.target.value)} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" /></div>
                                                <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1">Method</label><select value={payMethod} onChange={(e) => setPayMethod(e.target.value)} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800"><option>Cash</option><option>Bank Transfer</option><option>Cheque</option></select></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => { setPayAmt((parseFloat(payingClient.interestAmount || 0) + parseFloat(payingClient.additionalFunds || 0)).toFixed(2)); setNewDueDate(''); }} className="bg-green-900/20 text-green-400 py-3 rounded-xl font-black text-[8px] uppercase">Full Payoff</button>
                                                <button onClick={() => setPayAmt(parseFloat(payingClient.interestAmount || 0).toFixed(2))} className="bg-blue-900/20 text-blue-400 py-3 rounded-xl font-black text-[8px] uppercase">Interest Rollover</button>
                                            </div>
                                            
                                            {payAmt === parseFloat(payingClient.interestAmount || 0).toFixed(2) && payAmt !== "0.00" && (
                                                <div className="space-y-1">
                                                    <label className="text-[7px] font-black uppercase ml-1 text-blue-400">Rollover Next Due Date</label>
                                                    <input type="date" value={newDueDate} onChange={(e) => setNewDueDate(e.target.value)} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-blue-900/30" required />
                                                </div>
                                            )}

                                            <input type="number" value={payAmt} onChange={(e) => setPayAmt(e.target.value)} placeholder="Amount Paid" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-xl font-black outline-none border border-slate-700" />
                                            
                                            <button onClick={() => {
                                                const amt = parseFloat(payAmt); if(!amt) return;
                                                const isRollover = amt === parseFloat(payingClient.interestAmount || 0);
                                                if(isRollover && !newDueDate) return alert("Select new due date for Rollover");

                                                let ni = payingClient.interestAmount || 0; let nt = payingClient.additionalFunds || 0;
                                                let finalDueDate = payingClient.dueDate;
                                                let type = "Regular Payment";

                                                if(isRollover) { 
                                                    ni = (parseFloat(payingClient.amountOwed || 0) * 0.25); // Set new interest
                                                    finalDueDate = newDueDate;
                                                    type = "Rollover";
                                                } else { 
                                                    let rem = amt; if(rem <= ni){ ni -= rem; rem = 0; } else { rem -= ni; ni = 0; nt = Math.max(0, nt - rem); }
                                                    if(amt >= (parseFloat(payingClient.interestAmount || 0) + parseFloat(payingClient.additionalFunds || 0))) type = "Full Payoff";
                                                }

                                                const hObj = { amount: amt, date: payDate, method: payMethod, type: type, timestamp: new Date(payDate).getTime() };
                                                db.ref(`clients/${payingClient.id}`).update({ interestAmount: ni, additionalFunds: nt, dueDate: finalDueDate, history: [...(payingClient.history || []), hObj] });
                                                setPayingClient(null); alert("Confirmed!");
                                            }} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-xl">Confirm & Sync</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-2">
                                                <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1">Loan Date</label><input type="date" value={newLoanDate} onChange={(e) => setNewLoanDate(e.target.value)} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" /></div>
                                                <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1 text-red-400">Due Date</label><input type="date" value={newDueDate} onChange={(e) => setNewDueDate(e.target.value)} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-red-900/20" /></div>
                                            </div>
                                            <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1">Principal To Add</label><input type="number" placeholder="0.00" value={tempPrincipal} onChange={(e) => setTempPrincipal(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-700" /></div>
                                            <div className="space-y-1"><label className="text-[7px] font-black uppercase ml-1">Interest To Add</label><input type="number" placeholder="0.00" value={tempInterest} onChange={(e) => setTempInterest(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-700" /></div>
                                            <button onClick={() => {
                                                const p = parseFloat(tempPrincipal || 0); const i = parseFloat(tempInterest || 0); if(!p || !newDueDate) return alert("Fill all fields");
                                                db.ref(`clients/${payingClient.id}`).update({ amountOwed: parseFloat(payingClient.amountOwed || 0) + p, interestAmount: parseFloat(payingClient.interestAmount || 0) + i, dueDate: newDueDate, loanDate: newLoanDate });
                                                setPayingClient(null); alert("Loan Added!");
                                            }} className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase">Issue Loan</button>
                                        </div>
                                    )}
                                    <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] text-center">Cancel</button>
                                </div>
                            </div>
                        )}
                    </div>
                ) : (
                    <div className="text-center p-10 text-slate-600 font-black uppercase tracking-widest animate-pulse">Syncing...</div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

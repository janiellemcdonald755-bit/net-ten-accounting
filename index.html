<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [email, setEmail] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [showPayModal, setShowPayModal] = React.useState(false);
    const [showCalendar, setShowCalendar] = React.useState(false);
    const [activeClientTab, setActiveClientTab] = React.useState('dash');
    const [editingClient, setEditingClient] = React.useState(null);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 
    const ADMIN_PHONE = "1-876-517-7700"; 
    const APP_URL = window.location.href;

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
        });
        return () => clientsRef.off();
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
    };

    const scheduleMeeting = (e) => {
        e.preventDefault();
        const date = e.target.meetingDate.value;
        const time = e.target.meetingTime.value;
        if(!date) return alert("Please select a date.");

        const meetingString = time ? `${date} @ ${time}` : `${date} (Time TBD)`;
        
        db.ref(`clients/${myPortfolio.id}`).update({
            meetingRequest: meetingString
        });
        alert("Meeting Request Sent!");
        setShowCalendar(false);
        setShowPayModal(false);
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4 object-contain" />
                    <h1 className="text-3xl font-black text-blue-400 mb-6 uppercase tracking-tighter italic">Net Ten</h1>
                    <form onSubmit={handleLogin} className="space-y-4">
                        <input type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none focus:border-blue-500" onChange={e => setEmail(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none focus:border-blue-500" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase tracking-widest">Login</button>
                    </form>
                </div>
            </div>
        );
    }

    const isAdmin = user.email === ADMIN_EMAIL;
    const myPortfolio = clients.find(c => c.email?.toLowerCase() === user.email?.toLowerCase());

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200 font-sans">
            <header className="sticky top-0 z-50 bg-[#1e293b]/80 backdrop-blur-md p-5 shadow-lg border-b border-slate-700 flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10 object-contain" />
                    <h1 className="text-lg font-black text-white tracking-tighter leading-none uppercase italic">Net Ten</h1>
                </div>
                <button onClick={() => auth.signOut()} className="text-[10px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full">LOGOUT</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    /* ADMIN VIEW */
                    <div className="animate-in fade-in">
                        <div className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Add New</button>
                            <button onClick={() => setView('share')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${view === 'share' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Share</button>
                        </div>

                        {view === 'home' && clients.map(c => (
                            <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 text-left shadow-xl">
                                {c.meetingRequest && (
                                    <div className="bg-blue-500/10 border border-blue-500/30 p-3 rounded-2xl mb-4 flex justify-between items-center">
                                        <p className="text-[10px] font-black text-blue-400 uppercase">📅 Meeting: {c.meetingRequest}</p>
                                        <button onClick={() => db.ref(`clients/${c.id}`).update({meetingRequest: null})} className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-bold">CLEAR</button>
                                    </div>
                                )}
                                <div className="flex justify-between items-start">
                                    <div><h3 className="font-black text-white text-lg">{c.name}</h3><p className="text-[10px] text-blue-400 font-bold uppercase">{c.email}</p></div>
                                    <div className="text-right">
                                        <p className="text-[10px] font-bold text-slate-500 uppercase leading-none">Owed</p>
                                        <p className="font-black text-lg text-green-400 leading-none">${(c.amountOwed + (c.amountOwed * (c.interest/100))).toFixed(2)}</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 mt-4">
                                    <button onClick={() => {
                                        const amt = prompt("Amount Received ($):");
                                        if(amt) db.ref(`clients/${c.id}`).update({
                                            amountOwed: c.amountOwed - parseFloat(amt),
                                            history: [...(c.history || []), {amount: parseFloat(amt), date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}]
                                        });
                                    }} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[10px] uppercase">Record Pay</button>
                                    <button onClick={() => setEditingClient(c)} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[10px] uppercase">Manage</button>
                                </div>
                            </div>
                        ))}

                        {/* EDIT MODAL */}
                        {editingClient && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const d = Object.fromEntries(new FormData(e.target).entries());
                                    db.ref(`clients/${editingClient.id}`).update({...d, amountOwed: parseFloat(d.amountOwed), interest: parseFloat(d.interest)});
                                    setEditingClient(null); alert("Saved!");
                                }} className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-4 text-left">
                                    <h3 className="text-xl font-black text-white uppercase italic">Edit Portfolio</h3>
                                    <input name="name" defaultValue={editingClient.name} className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" required />
                                    <input name="email" defaultValue={editingClient.email} className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" required />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input name="amountOwed" type="number" step="any" defaultValue={editingClient.amountOwed} className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" />
                                        <input name="interest" type="number" step="any" defaultValue={editingClient.interest} className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase text-xs">Save Changes</button>
                                    <button type="button" onClick={() => setEditingClient(null)} className="w-full text-center text-slate-500 font-bold uppercase text-[10px]">Cancel</button>
                                </form>
                            </div>
                        )}
                    </div>
                ) : (
                    /* CLIENT VIEW */
                    myPortfolio ? (
                        <div className="animate-in fade-in">
                            {/* DASHBOARD STATUS BAR */}
                            {myPortfolio.meetingRequest && (
                                <div className="bg-blue-600 p-3 rounded-2xl mb-4 flex items-center gap-3 shadow-lg border border-blue-400/30">
                                    <span className="text-xl">📅</span>
                                    <div className="text-left">
                                        <p className="text-[9px] font-black text-blue-100 uppercase tracking-widest leading-none">Upcoming Meeting</p>
                                        <p className="text-sm font-black text-white">{myPortfolio.meetingRequest}</p>
                                    </div>
                                </div>
                            )}

                            <div className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700 shadow-inner">
                                <button onClick={() => setActiveClientTab('dash')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${activeClientTab === 'dash' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Dashboard</button>
                                <button onClick={() => setActiveClientTab('history')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest ${activeClientTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                            </div>

                            {activeClientTab === 'dash' ? (
                                <div className="text-center">
                                    <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl border border-slate-700 mb-6 relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                                        <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-16 h-16 mx-auto mb-4" />
                                        <p className="text-slate-500 font-bold text-xs uppercase mb-1 tracking-widest">Balance Owed</p>
                                        <h2 className="text-5xl font-black text-white mb-8 tracking-tighter italic leading-none">
                                            ${(myPortfolio.amountOwed + (myPortfolio.amountOwed * (myPortfolio.interest / 100))).toFixed(2)}
                                        </h2>
                                        <button onClick={() => setShowPayModal(true)} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-lg uppercase text-sm">Make a Payment</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-[#1e293b] p-4 rounded-3xl border border-slate-700 text-left"><p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">Rate</p><p className="font-black text-blue-400">{myPortfolio.interest}%</p></div>
                                        <div className="bg-[#1e293b] p-4 rounded-3xl border border-slate-700 text-left"><p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">Due Date</p><p className="font-black text-red-400 uppercase text-xs">{myPortfolio.datePaid || 'TBD'}</p></div>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6 text-left">
                                    <div className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 shadow-xl">
                                        <h4 className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Recent Activity</h4>
                                        {myPortfolio.history && myPortfolio.history.length > 0 ? (
                                            <div className="space-y-3">
                                                {myPortfolio.history.map((h, i) => (
                                                    <div key={i} className="flex justify-between items-center bg-[#0f172a] p-3 rounded-2xl border border-slate-800">
                                                        <div><p className="font-black text-white text-sm">-$ {h.amount.toFixed(2)}</p><p className="text-[10px] text-slate-500 font-bold uppercase">{h.date}</p></div>
                                                        <div className="text-[9px] font-black text-green-400 uppercase border border-green-900/20 px-2 py-1 rounded-full">Paid</div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : <p className="text-slate-600 text-center py-4 italic">No history yet.</p>}
                                    </div>
                                    <a href={`tel:${ADMIN_PHONE}`} className="block w-full text-center bg-blue-600 text-white font-black py-4 rounded-2xl uppercase text-xs shadow-lg">📞 Contact Winston</a>
                                </div>
                            )}

                            {showPayModal && (
                                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-[#0f172a]/90 backdrop-blur-sm">
                                    <div className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 text-left shadow-2xl animate-in slide-in-from-bottom-10">
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-xl font-black text-white uppercase italic">Payment</h3>
                                            <button onClick={() => {setShowPayModal(false); setShowCalendar(false)}} className="text-slate-500 text-2xl font-bold">×</button>
                                        </div>
                                        
                                        {!showCalendar ? (
                                            <div className="space-y-4">
                                                <div className="p-4 bg-[#0f172a] rounded-2xl border border-slate-700"><p className="font-bold text-blue-400 text-xs uppercase">Option 1: Bank Transfer</p><p className="text-sm text-slate-400">Request bank details via text.</p></div>
                                                <button onClick={() => setShowCalendar(true)} className="w-full p-4 bg-blue-900/10 rounded-2xl border border-blue-800 text-left">
                                                    <p className="font-bold text-blue-400 text-xs uppercase">Option 2: Meet Winston</p><p className="text-sm text-slate-400 font-medium tracking-tight">Select a date (Time Optional).</p>
                                                </button>
                                            </div>
                                        ) : (
                                            <form onSubmit={scheduleMeeting} className="space-y-4 animate-in slide-in-from-right-4">
                                                <div>
                                                    <p className="text-[10px] font-black text-blue-400 uppercase mb-2 tracking-widest">1. Pick a Date *</p>
                                                    <input type="date" name="meetingDate" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" required />
                                                </div>
                                                <div>
                                                    <p className="text-[10px] font-black text-slate-500 uppercase mb-2 tracking-widest">2. Pick a Time (Optional)</p>
                                                    <input type="time" name="meetingTime" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" />
                                                </div>
                                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase text-xs shadow-lg">Submit Request</button>
                                                <button type="button" onClick={() => setShowCalendar(false)} className="w-full text-center text-slate-500 text-[10px] font-bold uppercase">Back</button>
                                            </form>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="text-center p-12 bg-[#1e293b] rounded-3xl border border-slate-700 text-slate-500 font-medium">Profile not found.</div>
                    )
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [messagingClient, setMessagingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
                // Default view based on role
                if (u.email !== ADMIN_EMAIL) setView('client_home');
            }
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('pending_registrations').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setPendingUsers(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- REVENUE CALCULATION FOR HEADER ---
    const totalOwed = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-24 h-24 mx-auto mb-4 object-contain" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(e) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Log In</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-bold uppercase mt-4">Apply for Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, timestamp: Date.now()});
                            alert("Application Sent! Admin will contact you.");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <input name="username" placeholder="Username" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase">Submit Application</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="w-full text-slate-500 text-[10px] font-bold uppercase text-center mt-2">Back to Login</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    const SidebarLink = ({ id, label, icon }) => (
        <button onClick={() => setView(id)} className={`w-full flex items-center gap-3 px-6 py-4 text-[10px] font-black uppercase tracking-widest transition-all ${view === id ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800'}`}>
            <span>{icon}</span> {label}
        </button>
    );

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden">
            {/* ALERT POPUP FOR CLIENTS */}
            {clientData?.adminNote && (
                <div className="fixed inset-0 z-[200] bg-black/80 flex items-center justify-center p-6 backdrop-blur-md">
                    <div className="bg-[#1e293b] p-8 rounded-[40px] max-w-sm border-2 border-blue-500 shadow-2xl">
                        <p className="text-blue-400 font-black uppercase text-[10px] mb-2">Message from Net Ten</p>
                        <p className="text-white font-bold text-lg mb-6 leading-tight italic">"{clientData.adminNote}"</p>
                        <button onClick={() => db.ref(`clients/${clientData.id}`).update({adminNote: null})} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Close Message</button>
                    </div>
                </div>
            )}

            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 shrink-0">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8 object-contain" />
                    <h1 className="text-lg font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-4">
                    {isAdmin ? (
                        <>
                            <SidebarLink id="home" label="Portfolios" icon="📂" />
                            <SidebarLink id="history" label="Full History" icon="📜" />
                            <SidebarLink id="admin_reqs" label="Notifications" icon="🔔" />
                            <SidebarLink id="pending" label="Registrations" icon="👤" />
                            <SidebarLink id="add" label="New Portfolio" icon="➕" />
                        </>
                    ) : (
                        <>
                            <SidebarLink id="client_home" label="My Account" icon="🏠" />
                            <SidebarLink id="client_pay" label="Make Payment" icon="💳" />
                            <SidebarLink id="client_apply" label="New Loan" icon="💰" />
                            <SidebarLink id="client_profile" label="My Profile" icon="👤" />
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-6 p-4 w-52 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-900/20">Sign Out</button>
            </aside>

            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN DASHBOARD: WITH CALCULATOR HEADER */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-end mb-8 bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <div>
                                <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Amount Currently Owed</p>
                                <p className="text-5xl font-black text-white">${totalOwed.toLocaleString()}</p>
                            </div>
                            <input type="text" placeholder="Search..." className="bg-[#0f172a] border border-slate-800 p-4 rounded-2xl text-white text-xs w-64" onChange={e => setSearchTerm(e.target.value)} />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 hover:border-blue-500 transition-all shadow-xl">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="font-black text-white text-lg">{c.name}</h3>
                                            <p className="text-[9px] text-slate-500 uppercase font-bold">Due: {c.dueDate}</p>
                                        </div>
                                        <p className="text-2xl font-black text-green-400">${parseFloat(c.interestAmount).toFixed(2)}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => { setPayingClient(c); setIsNewLoanView(false); }} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black text-[9px] uppercase shadow-md">Record Payment</button>
                                        <button onClick={() => setMessagingClient(c)} className="bg-yellow-600 px-4 rounded-xl text-white">✉</button>
                                        <button onClick={() => { if(confirm("Permanently delete portfolio?")) db.ref(`clients/${c.id}`).remove(); }} className="bg-red-900/20 text-red-500 px-4 rounded-xl">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* FULL HISTORY PAGE (RESTORED) */}
                {isAdmin && view === 'history' && (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Financial History</h2>
                        <div className="space-y-2">
                            {clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name, clientId: c.id}))).sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                <div key={i} className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                    <div>
                                        <p className="text-white font-bold text-xs">{h.clientName}</p>
                                        <p className="text-[8px] text-slate-500 uppercase">{h.date} • {h.type}</p>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <p className={`font-black ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>{h.type === 'Payment' ? '+' : '-'}${parseFloat(h.amount).toFixed(2)}</p>
                                        <button onClick={() => {
                                            if(confirm("Delete this history entry?")) {
                                                const filtered = clients.find(cl => cl.id === h.clientId).history.filter((_, idx) => idx !== (clients.find(cl => cl.id === h.clientId).history.findIndex(x => x.timestamp === h.timestamp)));
                                                db.ref(`clients/${h.clientId}`).update({history: filtered});
                                            }
                                        }} className="text-red-500 text-xs">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* CLIENT DASHBOARD (RESTORED) */}
                {!isAdmin && view === 'client_home' && (
                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-800 p-10 rounded-[40px] text-white shadow-2xl relative overflow-hidden">
                            <div className="relative z-10">
                                <p className="text-[10px] font-black uppercase opacity-60 tracking-widest">Your Current Balance</p>
                                {clientData ? (
                                    <>
                                        <h2 className="text-6xl font-black mt-2">${parseFloat(clientData.interestAmount).toLocaleString()}</h2>
                                        <p className="mt-4 text-xs font-bold bg-white/20 inline-block px-4 py-2 rounded-full uppercase">Next Payment Due: {clientData.dueDate}</p>
                                    </>
                                ) : (
                                    <p className="text-xl font-bold mt-4 italic opacity-50">No active portfolio found.</p>
                                )}
                            </div>
                        </div>
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <h3 className="text-white font-black uppercase text-xs mb-4 tracking-widest">My Recent Transactions</h3>
                            <div className="space-y-3">
                                {clientData?.history?.slice(-5).reverse().map((h, i) => (
                                    <div key={i} className="flex justify-between items-center py-3 border-b border-slate-800">
                                        <p className="text-slate-400 text-[10px] uppercase font-bold">{h.date} • {h.type}</p>
                                        <p className={`font-black ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>{h.type === 'Payment' ? '-' : '+'}${parseFloat(h.amount).toFixed(2)}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}
                
                {/* ... (Other views like add, pending, admin_reqs remain identical to full system logic) ... */}
            </main>

            {/* MODAL: RECORD PAYMENT (FIXED BUTTON) */}
            {payingClient && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95 backdrop-blur-sm">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 shadow-2xl">
                        <h2 className="text-white font-black text-center uppercase mb-6 tracking-widest italic text-xl">Record {payingClient.name}</h2>
                        <div className="space-y-4">
                            <input type="date" id="recDate" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" defaultValue={new Date().toISOString().split('T')[0]} />
                            <input type="number" id="recAmt" placeholder="0.00" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-4xl font-black text-center" />
                            <button onClick={async () => {
                                const val = parseFloat(document.getElementById('recAmt').value);
                                if(!val) return;
                                const h = { amount: val, date: document.getElementById('recDate').value, type: "Payment", timestamp: Date.now() };
                                const newHistory = [...(payingClient.history || []), h];
                                await db.ref(`clients/${payingClient.id}`).update({
                                    interestAmount: Math.max(0, parseFloat(payingClient.interestAmount) - val),
                                    history: newHistory
                                });
                                setPayingClient(null);
                                alert("Payment Recorded Successfully!");
                            }} className="w-full bg-green-600 text-white py-5 rounded-2xl font-black uppercase shadow-lg hover:scale-105 transition-transform">Confirm Payment</button>
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px] mt-2">Cancel</button>
                        </div>
                    </div>
                </div>
            )}

            {/* MESSAGE MODAL */}
            {messagingClient && (
                <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/90">
                    <div className="bg-[#1e293b] w-full max-w-md p-8 rounded-[40px] border border-slate-700">
                        <h3 className="text-white font-black uppercase mb-4 text-xs italic">Send Alert to {messagingClient.name}</h3>
                        <textarea id="popNote" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs h-32 mb-4 border border-slate-800" placeholder="Type message..."></textarea>
                        <div className="flex gap-2">
                            <button onClick={() => setMessagingClient(null)} className="flex-1 text-slate-500 font-black uppercase text-[10px]">Cancel</button>
                            <button onClick={async () => {
                                const msg = document.getElementById('popNote').value;
                                await db.ref(`clients/${messagingClient.id}`).update({adminNote: msg});
                                setMessagingClient(null);
                                alert("Sent!");
                            }} className="flex-1 bg-yellow-600 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Send Alert</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

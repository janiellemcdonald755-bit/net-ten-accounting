<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
        db.ref('pending_registrations').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setPendingUsers(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;

    // --- LOGIC FOR HISTORY VIEW ---
    const allInterestCollected = clients.flatMap(c => 
        (c.history || []).filter(h => h.type === "Payment").map(h => ({...h, clientName: c.name}))
    ).sort((a, b) => b.timestamp - a.timestamp);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700">
                    <div className="flex flex-col items-center mb-8">
                        <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" 
                             alt="Logo" className="w-24 h-24 mb-4 object-contain" />
                        <h1 className="text-2xl font-black text-white italic uppercase tracking-tighter">Net Ten Ltd</h1>
                    </div>

                    {!isRegistering ? (
                        /* LOGIN FORM */
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } 
                            catch (err) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <input name="email" type="email" placeholder="Email / Username" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Sign In</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="w-full text-slate-500 font-bold text-[10px] uppercase tracking-widest mt-2">Create New Account</button>
                        </form>
                    ) : (
                        /* REGISTRATION FORM */
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({ ...d, timestamp: Date.now() });
                            alert("Application Submitted! Admin will review your details.");
                            setIsRegistering(false);
                        }} className="space-y-4">
                            <input name="username" placeholder="Username" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Submit Registration</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="w-full text-slate-500 font-bold text-[10px] uppercase tracking-widest mt-2">Back to Login</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    const SidebarLink = ({ id, label, icon }) => (
        <button onClick={() => setView(id)} className={`w-full flex items-center gap-3 px-6 py-4 text-[10px] font-black uppercase tracking-widest transition-all ${view === id ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800'}`}>
            <span>{icon}</span> {label}
        </button>
    );

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans">
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8 object-contain" />
                    <h1 className="text-lg font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="flex-1 py-4">
                    {isAdmin ? (
                        <>
                            <SidebarLink id="home" label="Portfolios" icon="📂" />
                            <SidebarLink id="history" label="Collected" icon="📈" />
                            <SidebarLink id="reqs" label="Loan Inbox" icon="📨" />
                            <SidebarLink id="pending" label="New Registrations" icon="🔔" />
                            <SidebarLink id="add" label="New Portfolio" icon="➕" />
                        </>
                    ) : (
                        <>
                            <SidebarLink id="client_home" label="My Account" icon="👤" />
                            <SidebarLink id="client_apply" label="Loan/Top-Up" icon="💰" />
                            <SidebarLink id="client_history" label="History" icon="📜" />
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-6 p-4 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-900/20">Sign Out</button>
            </aside>

            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN: COLLECTION HISTORY (FIXED) */}
                {isAdmin && view === 'history' && (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Interest Collected</h2>
                        <div className="space-y-3">
                            {allInterestCollected.map((h, i) => (
                                <div key={i} className="bg-[#1e293b] p-5 rounded-3xl border border-slate-800 flex justify-between items-center shadow-lg">
                                    <div>
                                        <p className="text-blue-400 text-[10px] font-black uppercase tracking-widest">{h.clientName}</p>
                                        <p className="text-white text-xs font-bold">{h.date} • {h.method}</p>
                                    </div>
                                    <p className="text-xl font-black text-green-400">+${parseFloat(h.amount).toFixed(2)}</p>
                                </div>
                            ))}
                            {allInterestCollected.length === 0 && <p className="text-slate-500 italic text-center py-10">No collections recorded yet.</p>}
                        </div>
                    </div>
                )}

                {/* ADMIN: NEW REGISTRATIONS VIEW */}
                {isAdmin && view === 'pending' && (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Access Requests</h2>
                        <div className="grid gap-4">
                            {pendingUsers.map(p => (
                                <div key={p.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 shadow-xl">
                                    <div className="grid grid-cols-2 gap-4 text-xs">
                                        <div><p className="text-slate-500 uppercase font-black">Username</p><p className="text-white font-bold">{p.username}</p></div>
                                        <div><p className="text-slate-500 uppercase font-black">Email</p><p className="text-blue-400 font-bold">{p.email}</p></div>
                                        <div><p className="text-slate-500 uppercase font-black">Password</p><p className="text-green-400 font-bold">{p.password}</p></div>
                                        <div><p className="text-slate-500 uppercase font-black">Phone</p><p className="text-white font-bold">{p.phone}</p></div>
                                    </div>
                                    <div className="mt-4 flex gap-2">
                                        <button onClick={() => {
                                            navigator.clipboard.writeText(`Email: ${p.email} | Pass: ${p.password}`);
                                            alert("Copied! Go to Firebase Auth to create this user.");
                                        }} className="flex-1 bg-slate-700 text-white py-3 rounded-xl font-black uppercase text-[10px]">Copy Details</button>
                                        <button onClick={() => db.ref(`pending_registrations/${p.id}`).remove()} className="p-3 bg-red-900/20 text-red-500 rounded-xl">Dismiss</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* --- ALL OTHER VIEWS REMAIN IDENTICAL --- */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-end mb-8">
                            <div><p className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Active Interest Owed</p><p className="text-5xl font-black text-white">${clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0).toLocaleString()}</p></div>
                            <input type="text" placeholder="Search Portfolios..." className="bg-[#1e293b] border border-slate-700 p-4 rounded-2xl text-white text-xs w-64" onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                                    <div className="flex justify-between items-start mb-4">
                                        <div><h3 className="font-black text-white text-lg">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase font-bold">Due: {c.dueDate}</p></div>
                                        <p className="text-2xl font-black text-green-400">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                    </div>
                                    <button onClick={() => setPayingClient(c)} className="w-full bg-slate-700 text-white py-3 rounded-xl font-bold text-[9px] uppercase tracking-widest">Record Action</button>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto">
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const h = { amount: parseFloat(d.interestAmount), date: d.loanDate, type: "Loan", timestamp: Date.now(), method: d.disbursed };
                            await db.ref('clients').push({ ...d, history: [h] });
                            alert("Portfolio Created!");
                            setView('home');
                        }} className="bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 space-y-4">
                            <h2 className="text-xl font-black text-white italic uppercase mb-4">Create Portfolio</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <input name="name" placeholder="Client Full Name" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                                <input name="email" placeholder="Email Address" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" required />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                                <input name="workAddress" placeholder="Work Address" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1"><label className="text-[8px] font-black text-slate-500 uppercase ml-2">Principal</label><input name="amountOwed" type="number" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required /></div>
                                <div className="space-y-1"><label className="text-[8px] font-black text-slate-500 uppercase ml-2">Total (+25%)</label><input name="interestAmount" value={tempInterest} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs font-black" required /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1"><label className="text-[8px] font-black text-slate-500 uppercase ml-2">Date Borrowed</label><input name="loanDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required /></div>
                                <div className="space-y-1"><label className="text-[8px] font-black text-slate-500 uppercase ml-2">Due Date</label><input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required /></div>
                            </div>
                            <select name="disbursed" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-slate-800"><option>Face to Face</option><option>Online/App</option></select>
                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase tracking-widest mt-4">Save Client Portfolio</button>
                        </form>
                    </div>
                )}
            </main>

            {/* MODAL: ADJUSTER (PAYMENT/TOPUP) */}
            {payingClient && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 shadow-2xl">
                        <div className="flex justify-between border-b border-slate-800 pb-2 mb-6">
                            <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Receive Payment</button>
                            <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>New Loan / Top-Up</button>
                        </div>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2">Date</label><input type="date" id="adjDate" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" defaultValue={new Date().toISOString().split('T')[0]} /></div>
                                {isNewLoanView && <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2 text-green-400">New Due Date</label><input type="date" id="adjDue" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>}
                            </div>
                            <select id="adjMethod" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs"><option>Face to Face</option><option>Online/App</option></select>
                            <input type="number" id="adjAmt" placeholder={isNewLoanView ? "Principal Amount" : "Payment Amount"} onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-3xl font-black text-center" />
                            {isNewLoanView && <div className="p-4 bg-green-900/10 rounded-2xl text-center border border-green-900/20"><p className="text-[8px] font-black text-green-500 uppercase tracking-widest">Added to Due (+25%)</p><p className="text-2xl font-black text-white">${tempInterest || '0.00'}</p></div>}
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => setPayingClient(null)} className="bg-slate-800 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Cancel</button>
                                <button onClick={() => {
                                    const amt = isNewLoanView ? parseFloat(tempInterest) : parseFloat(document.getElementById('adjAmt').value);
                                    if(!amt) return;
                                    const h = { amount: amt, date: document.getElementById('adjDate').value, method: document.getElementById('adjMethod').value, type: isNewLoanView ? "Loan" : "Payment", timestamp: Date.now() };
                                    const updates = { interestAmount: isNewLoanView ? (parseFloat(payingClient.interestAmount) + amt) : Math.max(0, parseFloat(payingClient.interestAmount) - amt), history: [...(payingClient.history || []), h] };
                                    if(isNewLoanView && document.getElementById('adjDue').value) updates.dueDate = document.getElementById('adjDue').value;
                                    db.ref(`clients/${payingClient.id}`).update(updates);
                                    setPayingClient(null);
                                }} className={`font-black py-4 rounded-2xl uppercase text-[10px] text-white ${isNewLoanView ? 'bg-green-600' : 'bg-blue-600'}`}>Confirm</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

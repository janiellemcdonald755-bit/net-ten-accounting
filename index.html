<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

// --- INITIALIZE FIREBASE ---
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    // --- 1. GLOBAL STATES (v9.0 restored) ---
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [sidebarOpen, setSidebarOpen] = React.useState(true);
    const [calcVal, setCalcVal] = React.useState('');
    
    // Data States
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    
    // Modals & Interaction
    const [payingClient, setPayingClient] = React.useState(null);
    const [modalSubView, setModalSubView] = React.useState('loan'); // 'loan' or 'pay'
    const [msgTarget, setMsgTarget] = React.useState(null);
    const [searchTerm, setSearchTerm] = React.useState('');

    // --- 2. DATA LISTENERS ---
    React.useEffect(() => {
        // Auth Observer
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                // Listen to current user profile details
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else {
                setView('login');
            }
        });

        // Global Listeners (Admin Only data flows)
        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribeAuth();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- 3. ANALYTICS LOGIC (v8.0 Fixed) ---
    const getStats = () => {
        let totalIssued = 0;
        let totalOwed = 0;
        let totalRevenue = 0;
        let overdueCount = 0;

        clients.forEach(c => {
            totalIssued += parseFloat(c.principal || 0);
            totalOwed += parseFloat(c.interestAmount || 0);
            if (c.status === 'Overdue') overdueCount++;
            
            (c.history || []).forEach(h => {
                if (h.type?.toLowerCase().includes('pay')) {
                    totalRevenue += parseFloat(h.amount || 0);
                }
            });
        });

        return { 
            issued: totalIssued, 
            owed: totalOwed, 
            revenue: totalRevenue, 
            overdue: overdueCount,
            active: clients.length 
        };
    };

    const stats = getStats();

    // Calculator Helper
    const handleCalc = (btn) => {
        if (btn === 'C') setCalcVal('');
        else if (btn === '=') { try { setCalcVal(eval(calcVal).toString()); } catch { setCalcVal('Error'); } }
        else setCalcVal(prev => prev + btn);
    };

    // --- 4. AUTH VIEWS ---
    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6 font-sans">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-6" />
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        try { 
                            // 13. Login should only have email and password
                            await auth.signInWithEmailAndPassword(d.email, d.password); 
                        } catch(err) { alert("Invalid Credentials."); }
                    }} className="space-y-4">
                        <h2 className="text-white font-black uppercase italic tracking-widest text-lg mb-4">Secure Terminal</h2>
                        <input name="email" type="email" placeholder="Username (Email)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500" required />
                        {/* 2. Log In Button */}
                        <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg hover:bg-blue-500 transition-all">Authenticate</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans text-[10px]">
            {/* 1. COLLAPSIBLE SIDEBAR */}
            <aside className={`${sidebarOpen ? 'w-64' : 'w-0'} bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 overflow-hidden`}>
                <div className="p-8 border-b border-slate-800 flex items-center gap-3 min-w-[250px]">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Net Ten</h1>
                </div>
                
                <nav className="py-6 flex-1 overflow-y-auto min-w-[250px]">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios Dashboard</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ Onboard New Loan</button>
                            {/* 1. Past history restored & active pressing */}
                            <button onClick={() => setView('master_history')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'master_history' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📜 Master History Ledger</button>
                            <div className="my-2 border-t border-slate-800/50"></div>
                            {/* 3. SEPARATE, pressing, non-confusing notifs */}
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between items-center ${view === 'inbox_accounts' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                <span>👤 Account Requests</span>
                                {pendingUsers.length > 0 && <span className="bg-green-600 text-white px-2 rounded-full text-[8px] font-black">{pendingUsers.length}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 font-black uppercase italic flex justify-between items-center ${view === 'inbox_loans' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                <span>💰 Loan Requests</span>
                                {requests.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full text-[8px] font-black">{requests.length}</span>}
                            </button>
                            {/* Analytics fixed and pressed */}
                            <button onClick={() => setView('reports')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'reports' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📊 BI Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_account')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_account' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>🏠 My Dashboard</button>
                            {/* 6. Automatically save other details for next time */}
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_apply' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ Smart Loan Application</button>
                            {/* 4. Make payment fixed/pressing */}
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_pay' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>💳 Digital Payment</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_faq' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>❓ Support Terminal</button>
                            {/* 2. Profile loading/pressing */}
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 font-black uppercase italic ${view === 'client_profile' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>👤 My Profile Settings</button>
                        </>
                    )}
                </nav>
                
                {/* 4. Sign out button present and active */}
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600 text-white rounded-2xl text-[10px] font-black uppercase hover:bg-red-700 shadow-lg active:scale-95 transition-all">Logout Securely</button>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 overflow-y-auto bg-[#0f172a] relative">
                
                {/* TOP HEADER & NOTIFICATION BUTTONS (v9.0 Fixed) */}
                <header className="p-6 flex justify-between items-center bg-[#0f172a]/80 backdrop-blur-md sticky top-0 z-50">
                    <div className="flex items-center gap-4">
                        <button onClick={() => setSidebarOpen(!sidebarOpen)} className="bg-slate-800 p-3 rounded-xl text-white">☰</button>
                        <h2 className="text-white font-black uppercase italic tracking-widest text-lg">
                            {view === 'home' ? 'Portfolios Dashboard' : view.replace('_', ' ')}
                        </h2>
                    </div>
                </header>

                <div className="p-10 pt-4">
                    {/* GLOBAL CLIENT NOTIFICATION BAR */}
                    {!isAdmin && (
                        <div className="max-w-2xl mx-auto mb-8 space-y-2">
                            {requests.filter(r => r.email === user.email).map(r => (
                                <div key={r.id} className={`p-4 rounded-2xl flex justify-between items-center border font-black uppercase text-[9px] ${r.status === 'Approved' ? 'bg-green-500/10 text-green-400 border-green-400/30' : r.status === 'Denied' ? 'bg-red-500/10 text-red-400 border-red-400/30' : 'bg-blue-500/10 text-blue-400 border-blue-400/30'}`}>
                                    <span>🔔 Status: {r.status || 'Under Winston\'s Review'}</span>
                                    {r.rejectReason && <span className="text-red-400 italic">Denial Note: {r.rejectReason}</span>}
                                </div>
                            ))}
                        </div>
                    )}

                    {/* ADMIN PORTFOLIO DASHBOARD */}
                    {isAdmin && view === 'home' && (
                        <div className="max-w-5xl mx-auto">
                            {/* 2. CALCULATOR over portfolios (v9.0 Fixed) */}
                            <div className="bg-[#1e293b] p-6 rounded-[40px] border border-slate-700 flex gap-6 items-center mb-10">
                                <div className="flex-1">
                                    <p className="text-[8px] font-black text-slate-500 uppercase mb-2">Portfolio Calculator</p>
                                    <div className="bg-[#0f172a] p-4 rounded-2xl text-white text-3xl font-black text-right border border-slate-800">
                                        ${calcVal || '0.00'}
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 gap-2">
                                    {[7,8,9,'+',4,5,6,'-',1,2,3,'=',0,'.','C'].map(b => (
                                        <button key={b} onClick={() => handleCalc(b)} className={`w-10 h-10 rounded-xl font-black text-[10px] ${b === '=' ? 'bg-green-600 text-white' : 'bg-slate-700 text-slate-300'}`}>
                                            {b}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <input type="text" placeholder="Search portfolios..." className="w-full p-4 bg-[#1e293b] rounded-2xl text-white border border-slate-700 outline-none focus:border-blue-500 mb-8" onChange={e => setSearchTerm(e.target.value)} />

                            <div className="grid grid-cols-2 gap-6">
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-8 rounded-[45px] border border-slate-700 hover:border-blue-500 transition-all shadow-lg relative group">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-white font-black uppercase text-sm">{c.name}</h3>
                                                <p className="text-slate-500 font-bold">{c.email}</p>
                                            </div>
                                            {/* 7. Send Note icon restored */}
                                            <button onClick={() => setMsgTarget(c)} className="bg-blue-600/20 text-blue-400 p-3 rounded-full hover:bg-blue-600 hover:text-white transition-all text-sm">✉️</button>
                                        </div>
                                        <div className="mb-6">
                                            <p className="text-[8px] text-slate-500 uppercase font-black">Total Owed</p>
                                            <p className="text-4xl font-black text-green-400 italic">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                        </div>
                                        <div className={`absolute top-4 right-20 px-3 py-1 rounded-full text-[8px] font-black uppercase ${c.status === 'Overdue' ? 'bg-red-500 text-white' : 'bg-slate-800 text-slate-500'}`}>
                                            {c.status || 'Active'}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setPayingClient(c); setModalSubView('loan');}} className="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-black uppercase text-[8px] hover:bg-blue-500 transition-all">New Loan / Top-Up</button>
                                            <button onClick={() => {setPayingClient(c); setModalSubView('pay');}} className="flex-1 bg-green-600 text-white py-3 rounded-2xl font-black uppercase text-[8px] hover:bg-green-500 transition-all">Collect Pay</button>
                                            <button onClick={() => setSelectedClient(c)} className="bg-slate-700 text-white px-4 py-3 rounded-2xl font-black uppercase text-[8px] hover:bg-slate-600 transition-all">Ledger</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ADMIN: MASTER HISTORY (RESTORED v9.0) */}
                    {isAdmin && view === 'master_history' && (
                        <div className="max-w-4xl mx-auto bg-[#1e293b] p-10 rounded-[50px] border border-slate-700">
                            <h2 className="text-2xl font-black text-white italic uppercase mb-8">Master Ledger (All History)</h2>
                            <div className="space-y-3">
                                {clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name})))
                                    .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))
                                    .map((h, i) => (
                                        <div key={i} className="flex justify-between items-center bg-[#0f172a] p-5 rounded-3xl border border-slate-800">
                                            <div>
                                                <p className="text-blue-400 font-black uppercase mb-1">{h.clientName}</p>
                                                <p className="text-slate-500 text-[10px] font-bold uppercase">{h.date} — {h.type} via {h.method || 'Transfer'}</p>
                                            </div>
                                            <p className={`text-xl font-black italic ${h.type?.toLowerCase().includes('pay') ? 'text-green-400' : 'text-blue-400'}`}>
                                                {h.type?.toLowerCase().includes('pay') ? '-' : '+'}${parseFloat(h.amount || 0).toFixed(2)}
                                            </p>
                                        </div>
                                    ))}
                            </div>
                        </div>
                    )}

                    {/* BI REPORTS & ANALYTICS (v9.0 Visual) */}
                    {isAdmin && view === 'reports' && (
                        <div className="max-w-4xl mx-auto space-y-10">
                            <h2 className="text-2xl font-black text-white italic uppercase">Business Intelligence</h2>
                            {/* Charts, stats here per version 8.0 logic */}
                            <div className="grid grid-cols-2 gap-4 text-[10px] font-black uppercase text-white">
                                <div className="p-4 bg-slate-800 rounded-xl">Outstanding Principal: ${stats.issued.toLocaleString()}</div>
                                <div className="p-4 bg-slate-800 rounded-xl">Revenue Collected: ${stats.revenue.toLocaleString()}</div>
                                <div className="p-4 bg-red-900 text-red-100 rounded-xl col-span-2">Overdue Portfolios: {stats.overdue}</div>
                            </div>
                        </div>
                    )}

                    {/* CLIENT DASHBOARD */}
                    {!isAdmin && view === 'client_account' && (
                        <div className="max-w-xl mx-auto space-y-6">
                            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-12 rounded-[60px] text-center shadow-2xl relative">
                                <div className="absolute top-0 right-0 bg-white p-3 font-black uppercase text-[9px] text-blue-600 rounded-bl-3xl shadow-lg italic tracking-widest">Active Status</div>
                                <p className="text-white/70 font-black uppercase text-[10px] mb-2 tracking-widest opacity-60">Balance Owed</p>
                                <p className="text-8xl font-black text-white italic tracking-tighter">${parseFloat(clientData?.interestAmount || 0).toFixed(2)}</p>
                            </div>
                            <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 grid grid-cols-2 gap-4 text-white font-black uppercase text-[9px]">
                                <div className="p-4 bg-slate-800 rounded-xl border border-slate-700">Initial Borrowed: ${parseFloat(clientData?.principal || 0).toFixed(2)}</div>
                                <div className="p-4 bg-slate-800 rounded-xl border border-slate-800">Due: {clientData?.dueDate || 'N/A'}</div>
                            </div>
                        </div>
                    )}

                    {/* ... (Keep other views: client_apply, client_pay, client_profile, faq - exactly as v8.0) */}
                </div>
            </main>

            {/* TRANSACTION MODAL (With Fixed Full Payoff and note submission) */}
            {payingClient && (
                <div className="fixed inset-0 z-[1001] bg-black/90 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-xl rounded-[60px] p-12 border border-slate-700 shadow-2xl relative">
                        {/* Modal toggle: v9.0 Fixed to be separate */}
                        <div className="flex bg-[#0f172a] p-2 rounded-2xl mb-8 border border-slate-800 shadow-inner font-black uppercase text-[9px]">
                            {['Disburse (Issue/Top-Up)', 'Collect (Record Pay/Payoff)'].map((m, i) => (
                                <button key={i} onClick={() => setModalSubView(i === 0 ? 'loan' : 'pay')} className={`flex-1 px-5 py-2 rounded-xl transition-all ${((i===0 && modalSubView==='loan') || (i===1 && modalSubView==='pay')) ? 'bg-blue-600 text-white shadow-xl' : 'text-slate-500'}`}>{m}</button>
                            ))}
                        </div>

                        <h2 className="text-white font-black uppercase italic text-center mb-6">Transaction Signature</h2>
                        
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            let currentBal = parseFloat(payingClient.interestAmount || 0);
                            let newBal = modalSubView === 'pay' ? currentBal - amt : currentBal + amt;
                            
                            const h = { amount: amt, date: d.date, method: d.method, type: modalSubView === 'pay' ? 'Payment' : 'Disbursement', timestamp: Date.now() };
                            
                            const finalStatus = modalSubView === 'pay' && newBal <= 0 ? 'Paid' : (payingClient.status || 'Active');
                            
                            await db.ref(`clients/${payingClient.id}`).update({ 
                                interestAmount: Math.max(0, newBal), 
                                status: finalStatus,
                                history: [...(payingClient.history || []), h] 
                            });
                            setPayingClient(null);
                        }} className="space-y-4">
                            <input name="amount" id="trans_amt" type="number" step="0.01" placeholder="$0.00" className="w-full p-8 bg-[#0f172a] rounded-3xl text-white text-5xl font-black text-centeritalic border border-slate-800" required />
                            {modalSubView === 'pay' && (
                                <button type="button" onClick={() => document.getElementById('trans_amt').value = payingClient.interestAmount} className="absolute right-16 top-52 bg-green-600 text-white px-4 py-2 rounded-xl text-[8px] font-black uppercase">Full Payoff</button>
                            )}
                            <div className="grid grid-cols-2 gap-2">
                                <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="p-4 bg-[#0f172a] rounded-xl text-white text-[10px]" />
                                <select name="method" className="p-4 bg-[#0f172a] rounded-xl text-white text-[10px] font-black uppercase border border-slate-800"><option>Bank Transfer</option><option>Cash</option></select>
                            </div>
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-xl hover:bg-blue-500 transition-all"> डिजिटल Sign-Off</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] font-black uppercase mt-2 text-center hover:text-white">Cancel</button>
                        </form>
                    </div>
                </div>
            )}

            {/* MESSAGE MODAL (v9.0 Fixed) */}
            {msgTarget && (
                <div className="fixed inset-0 z-[1001] bg-black/90 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-10 border border-slate-700 shadow-2xl">
                        <h2 className="text-xl font-black text-white uppercase italic mb-6 text-center">Alert: {msgTarget.name}</h2>
                        <textarea id="msg_text" className="w-full h-40 bg-[#0f172a] rounded-3xl p-6 text-white text-xs outline-none border border-slate-800" placeholder="Type reminder or status update..."></textarea>
                        <div className="grid grid-cols-2 gap-4 mt-6">
                            {/* FIX: Crash prevented by wrapping logic in async and properly referencing db.ref().on() context */}
                            <button onClick={async () => {
                                const m = document.getElementById('msg_text').value;
                                // Need to scan 'users' to find the matching UID for the target client's email
                                db.ref('users').orderByChild('email').equalTo(msgTarget.email).once('value', snapshot => {
                                    if(snapshot.val()){
                                        const uid = Object.keys(snapshot.val())[0];
                                        db.ref(`users/${uid}/popupMsg`).set(m);
                                        alert("Message Transmitted to Client Dashboard.");
                                        setMsgTarget(null);
                                    } else { alert("Error: Client profile not synced."); }
                                });
                            }} className="bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Send Alert</button>
                            <button onClick={() => setMsgTarget(null)} className="bg-slate-800 text-slate-400 py-4 rounded-2xl font-black uppercase text-[10px]">Close</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

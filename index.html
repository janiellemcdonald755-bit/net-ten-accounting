<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [selectedClient, setSelectedClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [msgTarget, setMsgTarget] = React.useState(null);

    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                    if (data?.popupMsg) {
                        alert(`MESSAGE FROM NET TEN: ${data.popupMsg}`);
                        db.ref(`users/${u.uid}/popupMsg`).remove();
                    }
                });
                if (u.email !== ADMIN_EMAIL) setView('client_home');
                else setView('home');
            } else { setView('login'); }
        });

        db.ref('clients').on('value', snap => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('pending_registrations').on('value', snap => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setPendingUsers(list);
        });
        db.ref('requests').on('value', snap => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });

        return () => unsubscribe();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- LOGIN & REGISTRATION ---
    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-24 h-24 mx-auto mb-4" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Log In</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4">Apply for Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, timestamp: Date.now()});
                            alert("Application Sent!");
                            setIsRegistering(false);
                        }} className="space-y-4">
                            <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase">Submit Application</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4">Back</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden">
            {/* SIDEBAR */}
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 shrink-0 flex flex-col">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8" />
                    <h1 className="text-lg font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-4 flex-1">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">📂 Portfolios</button>
                            <button onClick={() => setView('add')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">➕ Add Portfolio</button>
                            <button onClick={() => setView('loan_reqs')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">💰 Loan Requests ({requests.length})</button>
                            <button onClick={() => setView('history')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">📜 History</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_home')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">🏠 My Account</button>
                            <button onClick={() => setView('client_apply')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">➕ Apply for Loan</button>
                            <button onClick={() => setView('client_pay')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">💳 Make Payment</button>
                            <button onClick={() => setView('client_profile')} className="w-full text-left px-6 py-4 text-[10px] font-black text-white uppercase hover:bg-slate-800 italic">👤 My Profile</button>
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-6 p-4 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase">Sign Out</button>
            </aside>

            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN: DASHBOARD */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <input type="text" placeholder="Search Client..." className="w-full p-4 bg-[#1e293b] rounded-2xl text-white text-xs mb-8 border border-slate-700" onChange={e => setSearchTerm(e.target.value)} />
                        <div className="grid grid-cols-2 gap-4">
                            {clients.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 relative">
                                    <div className="flex justify-between items-start mb-4">
                                        <div><h3 className="text-white font-black uppercase text-xs">{c.name}</h3><p className="text-[9px] text-slate-500 uppercase">Due: {c.dueDate}</p></div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setMsgTarget(c)} className="text-blue-400">🔔</button>
                                            <button onClick={() => { if(confirm("Delete Portfolio?")) db.ref(`clients/${c.id}`).remove(); }} className="text-red-500">🗑️</button>
                                        </div>
                                    </div>
                                    <p className="text-3xl font-black text-green-400 italic mb-4">${parseFloat(c.interestAmount).toFixed(2)}</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => { setPayingClient(c); setIsNewLoanView(false); }} className="flex-1 bg-blue-600 text-white py-3 rounded-xl text-[8px] font-black uppercase">Record Pay/Topup</button>
                                        <button onClick={() => setSelectedClient(c)} className="bg-slate-700 text-white px-4 py-3 rounded-xl text-[8px] font-black uppercase">Details</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN: ADD PORTFOLIO (WITH PRINCIPAL, INTEREST, DISBURSEMENT) */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                         <h2 className="text-white font-black uppercase italic mb-6">Launch New Portfolio</h2>
                         <form onSubmit={async (e) => {
                             e.preventDefault();
                             const d = Object.fromEntries(new FormData(e.target).entries());
                             const total = parseFloat(d.principal) + parseFloat(d.interest);
                             const h = { amount: total, date: d.dateBorrowed, type: "Initial Loan", method: d.disbursement, timestamp: Date.now() };
                             await db.ref('clients').push({ ...d, interestAmount: total, history: [h] });
                             alert("Portfolio Created!");
                             setView('home');
                         }} className="grid grid-cols-2 gap-4">
                             <input name="name" placeholder="Full Name" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                             <input name="email" placeholder="Email" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                             <input name="employerPhone" placeholder="Employer Phone #" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                             <input name="principal" type="number" placeholder="Principal Amount ($)" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                             <input name="interest" type="number" placeholder="Interest Amount ($)" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                             <input name="dateBorrowed" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                             <input name="dueDate" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                             <select name="disbursement" className="col-span-2 p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800">
                                 <option>Bank Transfer</option><option>Cash</option><option>Mobile App</option>
                             </select>
                             <button className="col-span-2 bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Save Portfolio</button>
                         </form>
                    </div>
                )}

                {/* ADMIN: LOAN REQUESTS APPROVAL */}
                {isAdmin && view === 'loan_reqs' && (
                    <div className="max-w-2xl mx-auto space-y-4">
                        <h2 className="text-white font-black italic uppercase mb-6">Pending Loan Applications</h2>
                        {requests.map(r => (
                            <div key={r.id} className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700">
                                <div className="flex justify-between items-start mb-4">
                                    <div><p className="text-white font-black uppercase text-xs">{r.name}</p><p className="text-[10px] text-blue-400">${r.amount} Requested</p></div>
                                    <button onClick={() => db.ref(`requests/${r.id}`).remove()} className="text-red-500 text-[9px]">Dismiss</button>
                                </div>
                                <div className="bg-[#0f172a] p-4 rounded-xl mb-4 text-[10px] text-slate-400 grid grid-cols-2 gap-2">
                                    <p>Bank: {r.bankName}</p><p>Acc#: {r.accountNum}</p>
                                    <p className="col-span-2 italic">Reason: {r.reason || "N/A"}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                )}

                {/* CLIENT: MAKE PAYMENT SCREEN */}
                {!isAdmin && view === 'client_pay' && (
                    <div className="max-w-xl mx-auto text-center bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-white font-black uppercase mb-6 italic">How to Repay</h2>
                        <div className="bg-blue-600/10 p-8 rounded-3xl border border-blue-500/20 mb-6">
                            <p className="text-blue-400 font-black uppercase text-xs mb-2">Electronic Transfer</p>
                            <p className="text-white text-[11px] mb-4 leading-relaxed">Payments can be made via NCB Bank Transfer. Contact Winston to receive current account details.</p>
                            <a href={`mailto:${ADMIN_EMAIL}`} className="bg-blue-600 text-white px-8 py-3 rounded-xl text-[10px] font-black uppercase inline-block shadow-lg">Request Bank Info</a>
                        </div>
                        <div className="bg-[#0f172a] p-6 rounded-3xl text-left border border-slate-800">
                            <p className="text-slate-500 font-black uppercase text-[9px] mb-4 text-center tracking-widest">In-Person Collection</p>
                            <form onSubmit={(e) => { e.preventDefault(); alert("Admin has been notified for pickup!"); }}>
                                <label className="text-[8px] text-slate-500 uppercase ml-2">Preferred Meeting Date</label>
                                <input type="date" className="w-full p-4 bg-slate-800 rounded-xl text-white text-xs mb-4 mt-1" required />
                                <button className="w-full bg-slate-700 text-white py-4 rounded-xl text-[9px] font-black uppercase">Schedule Cash Pickup</button>
                            </form>
                        </div>
                    </div>
                )}

                {/* CLIENT: PROFILE (WITH EMPLOYER PHONE) */}
                {!isAdmin && view === 'client_profile' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-2xl font-black text-white italic uppercase mb-8">My Profile Data</h2>
                        <div className="grid grid-cols-2 gap-4">
                            {[
                                {l: 'Full Name', v: clientData?.name || userData?.name},
                                {l: 'Email', v: user.email},
                                {l: 'Employer Phone', v: clientData?.employerPhone || 'Contact Admin'},
                                {l: 'Current Address', v: clientData?.address || 'N/A'},
                                {l: 'Borrowed Date', v: clientData?.dateBorrowed || 'N/A'},
                                {l: 'Portfolio Status', v: 'Active Account'}
                            ].map((item, i) => (
                                <div key={i} className="bg-[#0f172a] p-5 rounded-2xl border border-slate-800">
                                    <label className="text-[9px] text-slate-500 uppercase block mb-1 font-black">{item.l}</label>
                                    <p className="text-white text-xs font-bold">{item.v}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </main>

            {/* RECORD PAYMENT MODAL (WITH FULL PAYOFF & TOPUP) */}
            {payingClient && (
                <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 shadow-2xl">
                        <div className="flex justify-between border-b border-slate-800 pb-4 mb-8">
                            <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400 pb-2' : 'text-slate-500'}`}>Receive Pay</button>
                            <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400 pb-2' : 'text-slate-500'}`}>Add Top-up</button>
                        </div>
                        <div className="space-y-4">
                            <input type="number" id="adjAmt" placeholder="Amount ($)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-2xl font-black border border-slate-800" />
                            <input type="date" id="adjDate" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <select id="adjMethod" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800">
                                <option>Bank Transfer</option><option>Cash Payment</option><option>Full Payoff</option>
                            </select>
                            <button onClick={async () => {
                                const val = parseFloat(document.getElementById('adjAmt').value);
                                const meth = document.getElementById('adjMethod').value;
                                const date = document.getElementById('adjDate').value;
                                if(!val) return;
                                const h = { amount: val, date: date, method: meth, type: isNewLoanView ? "Top Up" : "Payment", timestamp: Date.now() };
                                const newTotal = isNewLoanView ? (parseFloat(payingClient.interestAmount) + val) : Math.max(0, parseFloat(payingClient.interestAmount) - val);
                                await db.ref(`clients/${payingClient.id}`).update({ interestAmount: newTotal, history: [...(payingClient.history || []), h] });
                                setPayingClient(null);
                            }} className="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase shadow-lg">Confirm Transaction</button>
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] font-black uppercase mt-2">Close</button>
                        </div>
                    </div>
                </div>
            )}

            {/* SEND POPUP MODAL */}
            {msgTarget && (
                <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-black/95">
                    <div className="bg-[#1e293b] w-full max-w-sm rounded-[30px] p-8 border border-slate-700">
                        <h2 className="text-white font-black uppercase text-[10px] mb-4">Message to {msgTarget.name}</h2>
                        <textarea id="popMsg" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs h-32 border border-slate-800" placeholder="Type notification here..."></textarea>
                        <button onClick={async () => {
                            const msg = document.getElementById('popMsg').value;
                            db.ref('users').orderByChild('email').equalTo(msgTarget.email).once('value', s => {
                                if(s.val()){
                                    const uid = Object.keys(s.val())[0];
                                    db.ref(`users/${uid}/popupMsg`).set(msg);
                                    alert("Message Queued!");
                                    setMsgTarget(null);
                                } else { alert("Client user account not found!"); }
                            });
                        }} className="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase mt-4">Send Alert</button>
                        <button onClick={() => setMsgTarget(null)} className="w-full text-slate-500 mt-4 text-[9px] font-black uppercase">Cancel</button>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

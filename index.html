<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [payingClient, setPayingClient] = React.useState(null);
    const [selectedClient, setSelectedClient] = React.useState(null);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [msgTarget, setMsgTarget] = React.useState(null);
    const [txnMode, setTxnMode] = React.useState('loan');
    const [reportPeriod, setReportPeriod] = React.useState('monthly');

    // --- DATA FETCHING & SYNC ---
    React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => {
                    const data = s.val();
                    setUserData(data);
                });
                if (u.email !== ADMIN_EMAIL) setView('client_account');
            } else {
                setView('login');
            }
        });

        // Fixed Loaders
        db.ref('clients').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setClients(list);
        });

        db.ref('requests').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setRequests(list);
        });

        db.ref('pending_registrations').on('value', s => {
            const list = [];
            if (s.val()) Object.keys(s.val()).forEach(k => list.push({id: k, ...s.val()[k]}));
            setPendingUsers(list);
        });

        return () => unsubscribe();
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;
    const clientData = clients.find(c => c.email === user?.email);

    // --- UTILITIES ---
    const sendNotification = (userId, message) => {
        db.ref(`users/${userId}/notifications`).push({
            text: message,
            timestamp: Date.now(),
            read: false
        });
    };

    // --- AUTH UI ---
    if (!user) {
        return (
            <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-6">
                <div className="bg-[#1e293b] p-10 rounded-[50px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-24 h-24 mx-auto mb-6" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(err) { alert("Invalid Credentials"); }
                        }} className="space-y-4">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-xl mb-4">Secure Terminal</h2>
                            <input name="email" type="text" placeholder="Email" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white border border-slate-800 outline-none" required />
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg">Sign In</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto">Request Access</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, status: 'pending', timestamp: Date.now()});
                            alert("Registration submitted for approval!");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <h2 className="text-white font-black uppercase italic tracking-widest text-center text-xl mb-4">Onboarding</h2>
                            <input name="username" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Choose Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase">Submit for Review</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="text-slate-500 text-[10px] font-black uppercase mt-4 block mx-auto text-center">Back to Login</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden font-sans">
            
            {/* SIDEBAR */}
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col shrink-0">
                <div className="p-8 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-10 h-10" />
                    <h1 className="text-xl font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-6 flex-1 overflow-y-auto">
                    {isAdmin ? (
                        <>
                            <button onClick={() => setView('home')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'home' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📂 Portfolios</button>
                            <button onClick={() => setView('add')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'add' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ New Entry</button>
                            <button onClick={() => setView('inbox_accounts')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic flex justify-between ${view === 'inbox_accounts' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                👤 Accounts {pendingUsers.length > 0 && <span className="bg-green-600 text-white px-2 rounded-full">{pendingUsers.length}</span>}
                            </button>
                            <button onClick={() => setView('inbox_loans')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic flex justify-between ${view === 'inbox_loans' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>
                                💰 Loan Requests {requests.length > 0 && <span className="bg-blue-600 text-white px-2 rounded-full">{requests.length}</span>}
                            </button>
                            <button onClick={() => setView('reports')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'reports' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>📊 Analytics</button>
                        </>
                    ) : (
                        <>
                            <button onClick={() => setView('client_account')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'client_account' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>🏠 Dashboard</button>
                            <button onClick={() => setView('client_apply')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'client_apply' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>➕ Apply Now</button>
                            <button onClick={() => setView('client_pay')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'client_pay' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>💳 Payment</button>
                            <button onClick={() => setView('client_faq')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'client_faq' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>❓ FAQ/Support</button>
                            <button onClick={() => setView('client_profile')} className={`w-full text-left px-8 py-4 text-[10px] font-black uppercase italic ${view === 'client_profile' ? 'text-blue-400 bg-slate-800' : 'text-slate-400'}`}>👤 Profile</button>
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-8 p-4 bg-red-600/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-500/20">Log Out</button>
            </aside>

            {/* CONTENT AREA */}
            <main className="flex-1 overflow-y-auto p-10">
                
                {/* VIEW: ADMIN HOME */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-5xl mx-auto">
                        <div className="flex items-center gap-4 mb-8">
                            <input type="text" placeholder="Search portfolios..." className="flex-1 p-5 bg-[#1e293b] rounded-3xl text-white text-xs border border-slate-700" onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-6">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-8 rounded-[45px] border border-slate-700 shadow-lg">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="text-white font-black uppercase text-sm">{c.name}</h3>
                                            <p className="text-[9px] text-slate-500 font-bold">{c.email}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setMsgTarget(c)} className="bg-slate-800 p-3 rounded-2xl text-blue-400 text-xs">✉️</button>
                                        </div>
                                    </div>
                                    <div className="mb-6">
                                        <p className="text-slate-500 text-[9px] font-black uppercase mb-1">Balance</p>
                                        <p className="text-4xl font-black text-green-400 italic">${parseFloat(c.interestAmount || 0).toFixed(2)}</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => {setPayingClient(c); setTxnMode('loan');}} className="flex-1 bg-blue-600 text-white py-4 rounded-2xl text-[9px] font-black uppercase">Loan/TopUp</button>
                                        <button onClick={() => {setPayingClient(c); setTxnMode('pay');}} className="flex-1 bg-green-600 text-white py-4 rounded-2xl text-[9px] font-black uppercase">Payment</button>
                                        <button onClick={() => setSelectedClient(c)} className="bg-slate-700 text-white px-6 py-4 rounded-2xl text-[9px] font-black uppercase">Ledger</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* VIEW: ADMIN LOAN INBOX (FIXED) */}
                {isAdmin && view === 'inbox_loans' && (
                    <div className="max-w-4xl mx-auto space-y-6">
                        <h2 className="text-2xl font-black text-white uppercase italic">Loan Queue</h2>
                        {requests.length === 0 && <p className="text-slate-500 font-black text-xs uppercase">Queue Clear</p>}
                        {requests.map(req => (
                            <div key={req.id} className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 grid grid-cols-2 gap-8">
                                <div>
                                    <h4 className="text-blue-400 font-black uppercase text-xs mb-4">Client Request</h4>
                                    <p className="text-white font-black text-xl mb-2">{req.name}</p>
                                    <p className="text-green-400 font-black text-3xl italic">${req.amount}</p>
                                    <p className="text-slate-500 text-[10px] mt-4 uppercase"><b>Bank:</b> {req.bankBranch} ({req.accountNumber})</p>
                                    <p className="text-slate-500 text-[10px] uppercase"><b>Term:</b> {req.term}</p>
                                </div>
                                <div className="space-y-4">
                                    <button onClick={async () => {
                                        if(!confirm("Approve this loan?")) return;
                                        const newRef = db.ref('clients').push();
                                        await newRef.set({
                                            name: req.name,
                                            email: req.email,
                                            principal: req.amount,
                                            interestAmount: req.amount, // Admin adjusts interest later
                                            loanType: req.term,
                                            status: 'Active',
                                            history: [{amount: req.amount, date: new Date().toISOString().split('T')[0], type: 'Initial Loan', method: 'Direct Deposit', timestamp: Date.now()}]
                                        });
                                        db.ref(`requests/${req.id}`).remove();
                                        // Find user UID by email to send notif
                                        db.ref('users').orderByChild('email').equalTo(req.email).once('value', s => {
                                            const uId = Object.keys(s.val())[0];
                                            sendNotification(uId, `Your loan of $${req.amount} has been APPROVED!`);
                                        });
                                    }} className="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase">Approve & Open Portfolio</button>
                                    <button onClick={() => {
                                        const reason = prompt("Reason for denial?");
                                        if(reason) {
                                            db.ref(`requests/${req.id}`).remove();
                                            db.ref('users').orderByChild('email').equalTo(req.email).once('value', s => {
                                                const uId = Object.keys(s.val())[0];
                                                sendNotification(uId, `Loan DENIED: ${reason}`);
                                            });
                                        }
                                    }} className="w-full bg-red-600/20 text-red-500 font-black py-4 rounded-2xl uppercase border border-red-500/20">Deny Request</button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}

                {/* VIEW: CLIENT DASHBOARD (WITH NOTIFICATIONS) */}
                {!isAdmin && view === 'client_account' && (
                    <div className="max-w-xl mx-auto space-y-6">
                        <div className="bg-[#1e293b] p-10 rounded-[50px] border border-slate-700 relative overflow-hidden">
                            <h3 className="text-white font-black uppercase text-xs mb-4 flex items-center gap-2">🔔 Notifications</h3>
                            <div className="space-y-2">
                                {Object.values(userData?.notifications || {}).reverse().map((n, i) => (
                                    <div key={i} className="bg-[#0f172a] p-4 rounded-2xl border border-slate-800 text-[10px] text-white font-bold">
                                        {n.text} <span className="block text-slate-500 text-[8px] mt-1">{new Date(n.timestamp).toLocaleString()}</span>
                                    </div>
                                ))}
                                {(!userData?.notifications) && <p className="text-slate-600 text-[10px] uppercase font-black">No new alerts</p>}
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-12 rounded-[60px] text-center shadow-2xl">
                            <p className="text-white/60 font-black uppercase text-[10px] mb-2 tracking-widest">Balance Due</p>
                            <p className="text-7xl font-black text-white italic tracking-tighter">${parseFloat(clientData?.interestAmount || 0).toFixed(2)}</p>
                        </div>
                    </div>
                )}

                {/* VIEW: CLIENT NEW APPLICATION (RE-DONE) */}
                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-12 rounded-[60px] border border-slate-700 shadow-2xl">
                        <h2 className="text-3xl font-black text-white italic uppercase mb-8">Loan Application</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ 
                                ...d, 
                                name: userData.username, 
                                email: user.email, 
                                status: 'Pending', 
                                timestamp: Date.now()
                            });
                            alert("Application Submitted for Admin Review!");
                            setView('client_account');
                        }} className="grid grid-cols-2 gap-5">
                            <div className="col-span-2">
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4 mb-2 block">Requested Amount ($)</label>
                                <input name="amount" type="number" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white font-black" required />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4 mb-2 block">Term</label>
                                <select name="term" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black uppercase">
                                    <option>Fortnightly</option>
                                    <option>Monthly</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4 mb-2 block">ID Number</label>
                                <input name="idNum" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                            </div>
                            <div className="col-span-2">
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4 mb-2 block">Proof of Income / Address (URL or Note)</label>
                                <textarea name="proof" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] h-24" placeholder="Paste image link or detailed info..."></textarea>
                            </div>
                            <div className="col-span-1">
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4 mb-2 block">Bank Branch</label>
                                <input name="bankBranch" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                            </div>
                            <div className="col-span-1">
                                <label className="text-[10px] text-slate-500 font-black uppercase ml-4 mb-2 block">Account Number</label>
                                <input name="accountNumber" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" required />
                            </div>
                            <button className="col-span-2 bg-blue-600 text-white font-black py-6 rounded-[30px] uppercase mt-4 shadow-xl">Submit Application</button>
                        </form>
                    </div>
                )}

                {/* VIEW: CLIENT PAYMENTS */}
                {!isAdmin && view === 'client_pay' && (
                    <div className="max-w-xl mx-auto space-y-6">
                        <div className="bg-[#1e293b] p-10 rounded-[50px] border border-slate-700 text-center">
                            <h2 className="text-2xl font-black text-white uppercase italic mb-4">Make a Payment</h2>
                            <div className="bg-blue-600/10 p-6 rounded-3xl border border-blue-500/20 mb-8">
                                <p className="text-blue-400 text-[10px] font-black uppercase mb-2">Instructions</p>
                                <p className="text-white text-xs leading-relaxed">
                                    Payments are currently accepted via <b>Bank Transfer</b>. 
                                    Please send your payment and contact Admin at <b>(876) 318-0099</b> with your receipt.
                                </p>
                            </div>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                alert("Payment Intent Sent! Admin will verify your transfer.");
                            }} className="space-y-4">
                                <input type="number" placeholder="Payment Amount ($)" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white font-black" />
                                <input type="date" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                                <button className="w-full bg-green-600 text-white font-black py-5 rounded-2xl uppercase">Log Payment Intent</button>
                            </form>
                        </div>
                    </div>
                )}

                {/* VIEW: FAQ & SUPPORT */}
                {!isAdmin && view === 'client_faq' && (
                    <div className="max-w-2xl mx-auto space-y-4">
                        <h2 className="text-2xl font-black text-white uppercase italic mb-6 text-center">Support Center</h2>
                        
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 flex items-center justify-between">
                            <div>
                                <p className="text-slate-500 text-[10px] font-black uppercase">Direct Chat Support</p>
                                <p className="text-white font-black text-2xl italic">(876) 318-0099</p>
                            </div>
                            <a href="tel:8763180099" className="bg-green-600 p-4 rounded-2xl text-white font-black uppercase text-[10px]">Call Now</a>
                        </div>

                        {[
                            {q: "How long is approval?", a: "Most loan applications are reviewed within 24-48 business hours."},
                            {q: "Payment methods?", a: "We primarily accept bank transfers. Please contact support for account details."},
                            {q: "Late fees?", a: "Late fees vary by loan term. Check your agreement or contact your admin."}
                        ].map((item, i) => (
                            <div key={i} className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700">
                                <p className="text-blue-400 font-black uppercase text-[10px] mb-2">Q: {item.q}</p>
                                <p className="text-slate-300 text-xs leading-relaxed">{item.a}</p>
                            </div>
                        ))}
                    </div>
                )}

            </main>

            {/* --- ADMIN MODALS --- */}
            {payingClient && (
                <div className="fixed inset-0 z-[1001] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
                    <div className="bg-[#1e293b] w-full max-w-xl rounded-[60px] p-12 border border-slate-700">
                        <h2 className="text-3xl font-black text-white italic uppercase text-center mb-8">{txnMode === 'loan' ? 'Issue Funds' : 'Collect Payment'}</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const amt = parseFloat(d.amount);
                            let newBal = parseFloat(payingClient.interestAmount || 0);
                            if (txnMode === 'pay') newBal -= amt; else newBal += amt;
                            const h = { amount: amt, date: d.date, method: d.method, type: txnMode === 'pay' ? 'Payment' : 'Loan Update', timestamp: Date.now() };
                            await db.ref(`clients/${payingClient.id}`).update({ 
                                interestAmount: Math.max(0, newBal), 
                                history: [...(payingClient.history || []), h] 
                            });
                            setPayingClient(null);
                        }} className="space-y-4">
                            <input name="amount" type="number" step="0.01" placeholder="Amount ($)" className="w-full p-6 bg-[#0f172a] rounded-3xl text-white text-3xl font-black" required />
                            <select name="method" className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px] font-black uppercase">
                                <option>Bank Transfer</option><option>Cash</option>
                            </select>
                            <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-5 bg-[#0f172a] rounded-2xl text-white text-[10px]" />
                            <button className={`w-full py-5 rounded-2xl font-black uppercase text-white ${txnMode === 'loan' ? 'bg-blue-600' : 'bg-green-600'}`}>Process Transaction</button>
                            <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-[10px] font-black uppercase text-center">Cancel</button>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

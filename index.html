    {/* --- 1. ADD NEW PORTFOLIO VIEW --- */}
    {isAdmin && view === 'add' && (
        <div className="max-w-xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
            <h2 className="text-white font-black uppercase italic mb-8">Add New Portfolio</h2>
            <form onSubmit={async (e) => {
                e.preventDefault();
                const d = Object.fromEntries(new FormData(e.target).entries());
                const newClient = {
                    ...d,
                    interestAmount: d.principal, // Initially balance = principal
                    history: [{
                        date: new Date().toLocaleDateString(),
                        type: 'Initial Loan',
                        amount: d.principal,
                        method: 'System'
                    }]
                };
                await db.ref('clients').push(newClient);
                alert("Portfolio Created!");
                setView('home');
            }} className="grid grid-cols-2 gap-4">
                <input name="name" placeholder="Client Name" className="col-span-2 p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                <input name="email" type="email" placeholder="Client Email" className="col-span-2 p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                <input name="principal" type="number" placeholder="Principal Amount ($)" className="p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                <input name="interestRate" type="number" placeholder="Interest Rate (%)" className="p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                <input name="dueDate" type="date" className="p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                <input name="employerPhone" placeholder="Employer Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" />
                <button className="col-span-2 bg-blue-600 text-white font-black py-5 rounded-2xl uppercase mt-4">Create Portfolio</button>
            </form>
        </div>
    )}

    {/* --- 2. TRANSACTION MODAL (Record Pay / New Loan / Top Up) --- */}
    {payingClient && (
        <div className="fixed inset-0 z-[1001] bg-black/90 flex items-center justify-center p-6 backdrop-blur-md">
            <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700">
                <h2 className="text-white font-black uppercase italic mb-2 text-center">Transaction</h2>
                <p className="text-slate-500 text-[10px] text-center mb-6 uppercase">Client: {payingClient.name}</p>
                
                <form onSubmit={async (e) => {
                    e.preventDefault();
                    const d = Object.fromEntries(new FormData(e.target).entries());
                    const amount = parseFloat(d.amount);
                    const type = d.type; // "Payment", "New Loan", or "Top Up"
                    
                    let newBalance = parseFloat(payingClient.interestAmount);
                    
                    // Logic for math
                    if (type === 'Payment') {
                        newBalance -= amount;
                    } else {
                        newBalance += amount;
                    }

                    const newHistoryEntry = {
                        date: new Date().toLocaleDateString(),
                        amount: amount,
                        type: type,
                        method: d.method || 'Cash'
                    };

                    const updatedHistory = [...(payingClient.history || []), newHistoryEntry];

                    await db.ref(`clients/${payingClient.id}`).update({
                        interestAmount: newBalance,
                        history: updatedHistory
                    });

                    alert(`${type} Recorded!`);
                    setPayingClient(null);
                }} className="space-y-4">
                    <div className="flex gap-2">
                        <select name="type" className="flex-1 p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800 text-xs font-bold">
                            <option value="Payment">Record Pay</option>
                            <option value="New Loan">New Loan</option>
                            <option value="Top Up">Top Up</option>
                        </select>
                        <select name="method" className="flex-1 p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800 text-xs font-bold">
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Cash">Cash</option>
                            <option value="Cheque">Cheque</option>
                        </select>
                    </div>
                    
                    <input name="amount" type="number" step="0.01" placeholder="Amount ($)" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800 text-xl font-black" required />
                    
                    <div className="flex gap-3 pt-4">
                        <button type="button" onClick={() => setPayingClient(null)} className="flex-1 bg-slate-800 text-slate-400 py-4 rounded-xl font-black uppercase text-[10px]">Cancel</button>
                        <button type="submit" className="flex-1 bg-green-600 text-white py-4 rounded-xl font-black uppercase text-[10px]">Post Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    )}

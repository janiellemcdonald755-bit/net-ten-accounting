<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Accounting</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Paste your Firebase keys here! 
// (You can find these in your Firebase Project Settings)
const firebaseConfig = {
  apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
  authDomain: "net-ten-accounting.firebaseapp.com",
  projectId: "net-ten-accounting",
  storageBucket: "net-ten-accounting.appspot.com",
  messagingSenderId: "1095937995425",
  appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

// This "activates" the connection
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();
        // --- YOUR ACTUAL APP CODE ---
       const App = () => {
    const [transactions, setTransactions] = React.useState([]);
    const [loading, setLoading] = React.useState(true);

    // This listens to your Firebase Database in real-time!
    React.useEffect(() => {
        const unsubscribe = db.collection('transactions')
            .onSnapshot((snapshot) => {
                const data = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                setTransactions(data);
                setLoading(false);
            });
        return () => unsubscribe();
    }, []);

    // Logic to calculate totals
    const totalIncome = transactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + Number(t.amount), 0);

    const totalExpense = transactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + Number(t.amount), 0);

    if (loading) return <div className="p-10 text-center">Loading your books...</div>;

    return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-8">
            <div className="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
                <h1 className="text-2xl font-bold mb-6">Net Ten Accounting</h1>

                <div className="grid grid-cols-2 gap-4 mb-6">
                    <div className="bg-blue-50 p-4 rounded-lg">
                        <p className="text-sm text-blue-600 font-medium">Income</p>
                        <p className="text-xl font-bold text-blue-900">${totalIncome.toFixed(2)}</p>
                    </div>
                    <div className="bg-red-50 p-4 rounded-lg">
                        <p className="text-sm text-red-600 font-medium">Expenses</p>
                        <p className="text-xl font-bold text-red-900">${totalExpense.toFixed(2)}</p>
                    </div>
                </div>

                <div className="space-y-2">
                    <h2 className="text-lg font-semibold">Transactions</h2>
                    {transactions.length === 0 ? (
                        <p className="text-gray-500 italic">No records yet.</p>
                    ) : (
                        transactions.map(t => (
                            <div key={t.id} className="flex justify-between p-2 border-b">
                                <span>{t.name}</span>
                                <span className={t.type === 'income' ? 'text-green-600' : 'text-red-600'}>
                                    {t.type === 'income' ? '+' : '-'}${Number(t.amount).toFixed(2)}
                                </span>
                            </div>
                        ))
                    )}
                </div>
            </div>
        </div>
    );
};

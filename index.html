<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [showPayModal, setShowPayModal] = React.useState(false);
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    const [msgTarget, setMsgTarget] = React.useState(null);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
        });
        return () => clientsRef.off();
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        let finalEmail = loginId.includes('@') ? loginId : `${loginId.replace(/[^0-9]/g, '')}@netten.com`;
        auth.signInWithEmailAndPassword(finalEmail, password).catch(err => alert("Login failed."));
    };

    const isAdmin = user?.email === ADMIN_EMAIL;
    const myPortfolio = clients.find(c => c.email?.toLowerCase() === user?.email?.toLowerCase());

    const activeTotalOut = clients.reduce((acc, c) => {
        return acc + (parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0));
    }, 0);

    const filteredClients = clients.filter(c => 
        c.name?.toLowerCase().includes(searchTerm.toLowerCase()) || 
        c.phone?.includes(searchTerm)
    );

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700 text-left">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4 object-contain" />
                    <h1 className="text-3xl font-black text-blue-400 mb-2 uppercase italic tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleLogin} className="space-y-4 mt-6">
                        <input type="text" placeholder="Phone or Email" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setLoginId(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg">Sign In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200 font-sans">
            <header className="sticky top-0 z-50 bg-[#1e293b]/80 backdrop-blur-md p-5 border-b border-slate-700 flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8 object-contain" />
                    <h1 className="text-md font-black text-white uppercase italic text-sm">Net Ten Ltd</h1>
                </div>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div className="animate-in fade-in">
                        {/* ADMIN VIEW - (Functionality remains the same as previously fixed version) */}
                        <div className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700 shadow-xl">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('add')} className={`flex-1 py-3 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Add New</button>
                        </div>
                        {/* ... Admin Home/Add/Edit logic here ... */}
                        {view === 'home' && (
                            <>
                                <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-[32px] mb-6 shadow-2xl text-left border border-blue-400/30">
                                    <p className="text-[10px] font-black text-blue-100 uppercase tracking-widest mb-1">Total Active Owed</p>
                                    <p className="text-4xl font-black text-white italic tracking-tighter">${activeTotalOut.toFixed(2)}</p>
                                </div>
                                <div className="relative mb-6">
                                    <input type="text" placeholder="Search name or number..." className="w-full p-4 pl-12 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none focus:border-blue-500 transition-all shadow-lg" onChange={(e) => setSearchTerm(e.target.value)} />
                                    <span className="absolute left-4 top-4 opacity-30 text-lg">🔍</span>
                                </div>
                                {filteredClients.map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 text-left shadow-xl">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 className="font-black text-white text-lg leading-tight">{c.name}</h3>
                                                <p className="text-[9px] text-blue-400 font-bold uppercase tracking-wide">{c.phone}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-black text-lg text-green-400">${(parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0)).toFixed(2)}</p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => setPayingClient(c)} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Record Pay</button>
                                            <button onClick={() => setMsgTarget(c)} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Message</button>
                                            <button onClick={() => setEditingClient(c)} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}
                        {/* RE-INSERTING ADMIN ADD/EDIT MODALS (Simplified for brevity) */}
                        {view === 'add' && (
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const email = d.email || `${d.phone.replace(/[^0-9]/g, '')}@netten.com`;
                                await db.ref('clients').push({...d, email, interestAmount: parseFloat(d.interestAmount || 0), additionalFunds: parseFloat(d.additionalFunds || 0), amountOwed: parseFloat(d.amountOwed || 0), history: []});
                                alert("Added!"); setView('home');
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3 text-left">
                                <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                <input name="phone" placeholder="Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                <div className="grid grid-cols-3 gap-2">
                                    <input name="amountOwed" placeholder="Principal" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" />
                                    <input name="additionalFunds" placeholder="TopUp" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" />
                                    <input name="interestAmount" placeholder="Interest" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-green-900/30" />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase">Save Portfolio</button>
                            </form>
                        )}
                        {payingClient && (
                            <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const payAmt = parseFloat(e.target.payAmt.value);
                                    let remaining = payAmt;
                                    let newInterest = payingClient.interestAmount || 0;
                                    let newTopUp = payingClient.additionalFunds || 0;
                                    if (remaining <= newInterest) { newInterest -= remaining; remaining = 0; } 
                                    else { remaining -= newInterest; newInterest = 0; newTopUp = Math.max(0, newTopUp - remaining); }
                                    const newHistory = [...(payingClient.history || []), { amount: payAmt, date: e.target.payDate.value, timestamp: Date.now() }];
                                    db.ref(`clients/${payingClient.id}`).update({ interestAmount: newInterest, additionalFunds: newTopUp, history: newHistory });
                                    setPayingClient(null); alert("Recorded!");
                                }} className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-4">
                                    <h3 className="text-xl font-black text-white uppercase italic">Record Payment</h3>
                                    <input type="number" name="payAmt" step="any" placeholder="Amount Paid $" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required />
                                    <input type="date" name="payDate" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white" required />
                                    <button type="submit" className="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Confirm</button>
                                    <button type="button" onClick={() => setPayingClient(null)} className="w-full text-slate-500 font-bold uppercase text-[10px]">Cancel</button>
                                </form>
                            </div>
                        )}
                    </div>
                ) : (
                    myPortfolio ? (
                        <div className="animate-in fade-in">
                            <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl border border-slate-700 mb-6 text-center">
                                <p className="text-slate-500 font-bold text-xs uppercase mb-1 tracking-widest">Active Balance Due</p>
                                <h2 className="text-5xl font-black text-green-400 mb-8 italic tracking-tighter">${(parseFloat(myPortfolio.interestAmount || 0) + parseFloat(myPortfolio.additionalFunds || 0)).toFixed(2)}</h2>
                                <button onClick={() => setShowPayModal(true)} className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase text-sm shadow-xl">Schedule Meeting</button>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-3 mb-6">
                                <div className="bg-[#1e293b] p-4 rounded-2xl border border-slate-700 text-left">
                                    <p className="text-[8px] font-black text-slate-500 uppercase mb-1">Borrowed Date</p>
                                    <p className="font-black text-white text-[10px]">{myPortfolio.dateBorrowed || 'N/A'}</p>
                                </div>
                                <div className="bg-[#1e293b] p-4 rounded-2xl border border-slate-700 text-left">
                                    <p className="text-[8px] font-black text-red-500 uppercase mb-1">Due Date</p>
                                    <p className="font-black text-red-400 text-[10px]">{myPortfolio.datePaid || 'TBD'}</p>
                                </div>
                            </div>

                            {/* RESTORED HISTORY DASHBOARD */}
                            <div className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 text-left mb-6 shadow-xl">
                                <h3 className="text-xs font-black text-blue-400 uppercase italic mb-4 tracking-widest">Payment History</h3>
                                <div className="space-y-3 max-h-48 overflow-y-auto pr-2">
                                    {myPortfolio.history && myPortfolio.history.length > 0 ? (
                                        myPortfolio.history.sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                            <div key={i} className="flex justify-between items-center py-2 border-b border-slate-700/50">
                                                <div>
                                                    <p className="text-white font-black text-xs">${parseFloat(h.amount).toFixed(2)}</p>
                                                    <p className="text-[8px] text-slate-500 font-bold uppercase">{h.date}</p>
                                                </div>
                                                <div className="text-[7px] font-black text-green-500/50 uppercase italic">Cleared</div>
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-[9px] text-slate-500 font-bold uppercase italic text-center py-4">No payments recorded yet.</p>
                                    )}
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-[#1e293b] p-3 rounded-2xl border border-slate-700 text-left shadow-md"><p className="text-[7px] font-black text-slate-500 uppercase mb-1">Interest</p><p className="font-black text-white text-[9px]">${parseFloat(myPortfolio.interestAmount || 0).toFixed(0)}</p></div>
                                <div className="bg-[#1e293b] p-3 rounded-2xl border border-slate-700 text-left shadow-md"><p className="text-[7px] font-black text-slate-500 uppercase mb-1">Top-Up</p><p className="font-black text-white text-[9px]">${parseFloat(myPortfolio.additionalFunds || 0).toFixed(0)}</p></div>
                                <div className="bg-[#0f172a] p-3 rounded-2xl border border-blue-900/30 text-left shadow-inner"><p className="text-[7px] font-black text-blue-500 uppercase mb-1 text-[6px]">Principal (Ref)</p><p className="font-black text-blue-300 text-[9px]">${parseFloat(myPortfolio.amountOwed || 0).toFixed(0)}</p></div>
                            </div>

                            {showPayModal && (
                                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#0f172a]/90 backdrop-blur-sm">
                                    <div className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 text-left shadow-2xl">
                                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black text-white uppercase italic">Schedule Meeting</h3><button onClick={() => setShowPayModal(false)} className="text-slate-500 text-2xl">×</button></div>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const str = `${e.target.d.value} @ ${e.target.t.value}`;
                                            db.ref(`clients/${myPortfolio.id}`).update({ meetingRequest: str });
                                            alert("Request Sent!"); setShowPayModal(false);
                                        }} className="space-y-4">
                                            <input type="date" name="d" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-700" required />
                                            <input type="time" name="t" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-700" />
                                            <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase shadow-lg">Confirm</button>
                                        </form>
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : <div className="text-center p-10 text-slate-600 font-black uppercase tracking-widest animate-pulse">Loading Profile...</div>
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

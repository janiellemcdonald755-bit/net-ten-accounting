<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [requests, setRequests] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('requests').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setRequests(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;

    // --- CALCULATION LOGIC ---
    const allHistory = clients.flatMap(c => (c.history || []).map(h => ({...h, cName: c.name, cId: c.id})));
    const totalOwedNow = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount) || 0), 0);
    const totalCollected = allHistory.filter(h => h.type === "Payment").reduce((acc, h) => acc + (parseFloat(h.amount) || 0), 0);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700">
                    <h1 className="text-3xl font-black text-blue-400 mb-6 italic text-center uppercase tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const d = Object.fromEntries(new FormData(e.target).entries());
                        try {
                            if (d.mode === 'register') {
                                const cred = await auth.createUserWithEmailAndPassword(d.email, d.password);
                                await db.ref(`users/${cred.user.uid}`).set({ name: d.name, email: d.email, phone: d.phone, role: 'client', approved: false, timestamp: Date.now() });
                            } else {
                                await auth.signInWithEmailAndPassword(d.email, d.password);
                            }
                        } catch (err) { alert(err.message); }
                    }} className="space-y-4">
                        <input name="name" placeholder="Full Name (Register Only)" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" />
                        <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" />
                        <input name="email" type="email" placeholder="Email Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                        <div className="flex gap-2 pt-2">
                            <button name="mode" value="login" className="flex-1 bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Sign In</button>
                            <button name="mode" value="register" className="flex-1 border border-slate-600 text-white font-black py-4 rounded-2xl uppercase">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        );
    }

    const SidebarLink = ({ id, label, icon }) => (
        <button onClick={() => setView(id)} className={`w-full flex items-center gap-3 px-6 py-4 text-[10px] font-black uppercase tracking-widest transition-all ${view === id ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800'}`}>
            <span>{icon}</span> {label}
        </button>
    );

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden">
            {/* SIDE NAVIGATION */}
            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col">
                <div className="p-6 border-b border-slate-800">
                    <h1 className="text-xl font-black text-blue-400 italic">NET TEN</h1>
                    <p className="text-[8px] text-slate-500 font-bold uppercase mt-1">{isAdmin ? 'Admin Control' : userData?.name}</p>
                </div>
                
                <nav className="flex-1 py-4">
                    {isAdmin ? (
                        <>
                            <SidebarLink id="home" label="Portfolios" icon="📂" />
                            <SidebarLink id="history" label="Interest Collected" icon="📈" />
                            <SidebarLink id="reqs" label="Loan Inbox" icon="📨" />
                            <SidebarLink id="users" label="New Registrations" icon="🔔" />
                            <SidebarLink id="add" label="Add Portfolio" icon="➕" />
                        </>
                    ) : (
                        <>
                            <SidebarLink id="client_home" label="My Account" icon="👤" />
                            <SidebarLink id="client_apply" label="Apply for Loan" icon="💰" />
                            <SidebarLink id="client_history" label="Loan History" icon="📜" />
                            <SidebarLink id="client_support" label="Support/FAQ" icon="💬" />
                        </>
                    )}
                </nav>

                <button onClick={() => auth.signOut()} className="m-6 p-4 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-900/20">Sign Out</button>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN VIEWS */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-blue-600/10 border border-blue-600/20 p-8 rounded-[40px] mb-8 flex justify-between items-center">
                            <div><p className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Total Interest Owed</p><p className="text-5xl font-black text-white">${totalOwedNow.toLocaleString()}</p></div>
                            <input type="text" placeholder="Search..." className="bg-[#0f172a] border border-slate-800 p-4 rounded-2xl text-white outline-none w-64" onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 shadow-xl">
                                    <div className="flex justify-between items-start mb-4">
                                        <div><h3 className="font-black text-white text-lg">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase">Due: {c.dueDate}</p></div>
                                        <p className="text-2xl font-black text-green-400">${(parseFloat(c.interestAmount || 0)).toFixed(2)}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setPayingClient(c)} className="flex-1 bg-slate-700 text-white py-3 rounded-xl font-bold text-[9px] uppercase">Adjust Balance</button>
                                        <button onClick={() => { if(confirm("Delete?")) db.ref(`clients/${c.id}`).remove(); }} className="p-3 bg-red-900/10 text-red-500 rounded-xl border border-red-900/50">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {isAdmin && view === 'history' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-green-600/10 border border-green-600/20 p-8 rounded-[40px] mb-8">
                            <p className="text-[10px] font-black text-green-400 uppercase tracking-widest text-center">Total Interest Collected</p>
                            <p className="text-5xl font-black text-white text-center">${totalCollected.toLocaleString()}</p>
                        </div>
                        <div className="bg-[#1e293b] rounded-[32px] border border-slate-700 overflow-hidden">
                            {allHistory.sort((a,b) => b.timestamp - a.timestamp).map((h, i) => (
                                <div key={i} className="flex justify-between items-center p-5 border-b border-slate-800">
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => {
                                            const cl = clients.find(x => x.id === h.cId);
                                            const newH = cl.history.filter(item => item.timestamp !== h.timestamp);
                                            db.ref(`clients/${h.cId}`).update({
                                                history: newH,
                                                interestAmount: h.type === "Payment" ? (parseFloat(cl.interestAmount) + parseFloat(h.amount)) : (parseFloat(cl.interestAmount) - parseFloat(h.amount))
                                            });
                                        }} className="text-red-500 text-xs">✕</button>
                                        <div><p className="text-white font-black text-xs uppercase">{h.cName}</p><p className="text-[8px] text-slate-500">{h.date} • {h.method}</p></div>
                                    </div>
                                    <p className={`font-black text-sm ${h.type === "Payment" ? 'text-green-400' : 'text-red-400'}`}>{h.type === "Payment" ? '-' : '+'}${parseFloat(h.amount).toFixed(2)}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* CLIENT VIEWS */}
                {!isAdmin && view === 'client_home' && (
                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-10 rounded-[40px] text-white shadow-2xl relative overflow-hidden">
                            <h2 className="text-sm font-black uppercase opacity-70 mb-2">My Current Balance</h2>
                            {clients.filter(c => c.email === user.email).map(c => (
                                <div key={c.id}>
                                    <p className="text-6xl font-black tracking-tighter">${parseFloat(c.interestAmount || 0).toLocaleString()}</p>
                                    <p className="mt-4 text-[10px] font-bold uppercase">Next Payment Due: {c.dueDate || 'TBA'}</p>
                                </div>
                            ))}
                        </div>
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <h3 className="font-black text-white uppercase text-xs mb-4">Personal Info</h3>
                            <div className="grid grid-cols-2 gap-4 text-[10px]">
                                <div><p className="text-slate-500 uppercase font-black">Name</p><p className="text-white">{userData?.name}</p></div>
                                <div><p className="text-slate-500 uppercase font-black">Email</p><p className="text-white">{user.email}</p></div>
                                <div><p className="text-slate-500 uppercase font-black">Phone</p><p className="text-white">{userData?.phone || 'Not set'}</p></div>
                            </div>
                        </div>
                    </div>
                )}

                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-xl mx-auto">
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, name: userData.name, email: user.email, status: 'Pending', timestamp: Date.now() });
                            alert("Request Sent to Admin!");
                            setView('client_home');
                        }} className="bg-[#1e293b] p-10 rounded-[40px] border border-slate-700 space-y-4 shadow-2xl">
                            <h2 className="text-xl font-black text-white italic uppercase mb-4">Request New Loan</h2>
                            <div className="space-y-1">
                                <label className="text-[8px] font-black text-slate-500 uppercase ml-2">Loan Amount</label>
                                <input name="amount" type="number" placeholder="0.00" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none border border-slate-800" required />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[8px] font-black text-slate-500 uppercase ml-2">Income Source / Proof</label>
                                <textarea name="incomeInfo" placeholder="Tell us how you receive your income..." className="w-full p-4 bg-[#0f172a] rounded-2xl text-white h-24 text-xs border border-slate-800" />
                            </div>
                            <div className="p-6 bg-blue-900/10 rounded-3xl border border-blue-900/20 space-y-3">
                                <p className="text-[9px] font-black text-blue-400 uppercase text-center">Banking Details (For Online Transfer)</p>
                                <input name="bankName" placeholder="Bank Name" className="w-full bg-transparent border-b border-slate-800 p-2 text-xs text-white" />
                                <input name="accNumber" placeholder="Account Number" className="w-full bg-transparent border-b border-slate-800 p-2 text-xs text-white" />
                            </div>
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-lg tracking-widest">Submit Application</button>
                        </form>
                    </div>
                )}

                {!isAdmin && view === 'client_history' && (
                    <div className="max-w-2xl mx-auto">
                         <h2 className="text-xl font-black text-white italic uppercase mb-6">Recent Status & History</h2>
                         <div className="space-y-4">
                            {requests.filter(r => r.email === user.email).map(r => (
                                <div key={r.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 flex justify-between items-center">
                                    <div>
                                        <p className="text-xs font-black text-white uppercase">Loan Request: ${r.amount}</p>
                                        <p className="text-[8px] text-slate-500 uppercase">{new Date(r.timestamp).toLocaleDateString()}</p>
                                    </div>
                                    <div className="text-right">
                                        <span className={`text-[8px] font-black px-3 py-1 rounded-full uppercase ${r.status === 'Approved' ? 'bg-green-600 text-white' : r.status === 'Rejected' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-400'}`}>{r.status}</span>
                                        {r.rejectionReason && <p className="text-[8px] text-red-400 mt-2 italic font-bold">Reason: {r.rejectionReason}</p>}
                                    </div>
                                </div>
                            ))}
                         </div>
                    </div>
                )}

                {!isAdmin && view === 'client_support' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6 text-center">Support & Help</h2>
                        <div className="space-y-6 text-xs text-slate-400">
                            <div className="p-4 bg-[#0f172a] rounded-2xl border border-slate-800">
                                <p className="font-black text-white uppercase mb-1">How do I get a loan?</p>
                                <p>Go to "Apply for Loan", fill in the amount and your income info. Admin will review it shortly.</p>
                            </div>
                            <div className="p-4 bg-[#0f172a] rounded-2xl border border-slate-800">
                                <p className="font-black text-white uppercase mb-1">How is the transfer made?</p>
                                <p>If approved, funds are sent via the banking info you provided or face-to-face.</p>
                            </div>
                            <a href="tel:8763180099" className="block w-full bg-green-600 text-center text-white py-4 rounded-2xl font-black text-sm uppercase">Call Support: (876) 318-0099</a>
                        </div>
                    </div>
                )}

                {/* ADMIN NOTIFICATION VIEWS */}
                {isAdmin && view === 'users' && (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">New Registrations</h2>
                        <div className="grid gap-4">
                            {/* Logic to list users who aren't in clients list yet */}
                            <p className="text-slate-500 text-xs italic">All new sign-ups appear here for verification.</p>
                        </div>
                    </div>
                )}

                {isAdmin && view === 'reqs' && (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Loan Inbox</h2>
                        <div className="grid gap-4">
                            {requests.filter(r => r.status === 'Pending').map(r => (
                                <div key={r.id} className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700 shadow-xl">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="text-lg font-black text-white">{r.name}</h3>
                                            <p className="text-[10px] text-blue-400 font-bold uppercase">{r.email}</p>
                                        </div>
                                        <p className="text-3xl font-black text-green-400">${r.amount}</p>
                                    </div>
                                    <div className="bg-[#0f172a] p-4 rounded-2xl text-[10px] text-slate-400 mb-4">
                                        <p className="font-black text-slate-500 uppercase mb-1">Income/Income Details:</p>
                                        <p>{r.incomeInfo || "No info provided"}</p>
                                        <hr className="my-2 border-slate-800" />
                                        <p className="font-black text-slate-500 uppercase mb-1">Banking:</p>
                                        <p>{r.bankName ? `${r.bankName} - ${r.accNumber}` : "Face to Face requested"}</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => db.ref(`requests/${r.id}`).update({ status: 'Approved' })} className="flex-1 bg-green-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Approve</button>
                                        <button onClick={() => {
                                            const reason = prompt("Enter rejection reason:");
                                            db.ref(`requests/${r.id}`).update({ status: 'Rejected', rejectionReason: reason });
                                        }} className="flex-1 bg-red-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Reject</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </main>

            {/* ADJUSTMENT MODAL (FIXED LOAN FORM) */}
            {payingClient && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 shadow-2xl">
                        <div className="flex justify-between border-b border-slate-800 pb-2 mb-6">
                            <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Receive Payment</button>
                            <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>Issue New Loan</button>
                        </div>
                        
                        {!isNewLoanView ? (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="date" id="pDate" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs" defaultValue={new Date().toISOString().split('T')[0]} />
                                    <select id="pMethod" className="p-4 bg-[#0f172a] rounded-2xl text-white text-xs"><option>Cash</option><option>Online/App</option><option>Face to Face</option></select>
                                </div>
                                <input type="number" id="pAmt" placeholder="0.00" className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-4xl font-black text-center" />
                                <div className="grid grid-cols-2 gap-2 pt-2">
                                    <button onClick={() => setPayingClient(null)} className="bg-slate-800 text-slate-400 py-4 rounded-2xl font-black uppercase text-[10px]">Cancel</button>
                                    <button onClick={() => {
                                        const amt = parseFloat(document.getElementById('pAmt').value);
                                        if(!amt) return;
                                        const h = { amount: amt, date: document.getElementById('pDate').value, method: document.getElementById('pMethod').value, type: "Payment", timestamp: Date.now() };
                                        db.ref(`clients/${payingClient.id}`).update({ interestAmount: Math.max(0, (parseFloat(payingClient.interestAmount) || 0) - amt), history: [...(payingClient.history || []), h] });
                                        setPayingClient(null);
                                    }} className="bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Record Payment</button>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-2">
                                    <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2">Borrowed Date</label><input type="date" id="lDate" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" defaultValue={new Date().toISOString().split('T')[0]} /></div>
                                    <div className="space-y-1"><label className="text-[7px] text-slate-500 uppercase ml-2">Due Date</label><input type="date" id="lDue" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /></div>
                                </div>
                                <select id="lMethod" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs"><option>Online/App</option><option>Face to Face</option><option>Bank Transfer</option></select>
                                <input type="number" step="any" placeholder="Principal Amount" onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white font-black" />
                                <div className="p-4 bg-green-900/10 rounded-2xl text-center border border-green-900/20">
                                    <p className="text-[8px] font-black uppercase text-green-500">Adding to Balance (+25%)</p>
                                    <p className="text-2xl font-black text-white">${tempInterest || '0.00'}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setPayingClient(null)} className="bg-slate-800 text-slate-400 py-4 rounded-2xl font-black uppercase text-[10px]">Cancel</button>
                                    <button onClick={() => {
                                        const val = parseFloat(tempInterest || 0);
                                        if(!val) return;
                                        const h = { amount: val, date: document.getElementById('lDate').value, method: document.getElementById('lMethod').value, type: "Loan", timestamp: Date.now() };
                                        db.ref(`clients/${payingClient.id}`).update({ interestAmount: (parseFloat(payingClient.interestAmount) || 0) + val, dueDate: document.getElementById('lDue').value, history: [...(payingClient.history || []), h] });
                                        setPayingClient(null);
                                    }} className="bg-green-600 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Issue Loan</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));

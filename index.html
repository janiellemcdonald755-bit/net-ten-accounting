<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "winstonhmcdonald@gmail.com";

const App = () => {
    const [user, setUser] = React.useState(null);
    const [userData, setUserData] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [isRegistering, setIsRegistering] = React.useState(false);
    const [clients, setClients] = React.useState([]);
    const [pendingUsers, setPendingUsers] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [payingClient, setPayingClient] = React.useState(null);
    const [editingClient, setEditingClient] = React.useState(null);
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);
    const [tempInterest, setTempInterest] = React.useState('');

    React.useEffect(() => {
        auth.onAuthStateChanged(u => {
            setUser(u);
            if (u) {
                db.ref(`users/${u.uid}`).on('value', s => setUserData(s.val()));
            }
        });
        db.ref('clients').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setClients(list);
        });
        db.ref('pending_registrations').on('value', (snap) => {
            const list = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => list.push({id: k, ...snap.val()[k]}));
            setPendingUsers(list);
        });
    }, []);

    const isAdmin = user?.email === ADMIN_EMAIL;

    // --- RECLAIMED HISTORY LOGIC ---
    const allHistory = clients.flatMap(c => 
        (c.history || []).map(h => ({...h, clientName: c.name, clientId: c.id}))
    ).sort((a, b) => b.timestamp - a.timestamp);

    const handlePrincipalCalc = (val) => {
        const num = parseFloat(val);
        setTempInterest(num ? (num * 1.25).toFixed(2) : '');
    };

    // --- AUTH VIEWS ---
    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-700 text-center">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-24 h-24 mx-auto mb-4 object-contain" />
                    {!isRegistering ? (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            try { await auth.signInWithEmailAndPassword(d.email, d.password); } catch(e) { alert("Access Denied"); }
                        }} className="space-y-4">
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white border border-slate-800" required />
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">Log In</button>
                            <button type="button" onClick={() => setIsRegistering(true)} className="text-slate-500 text-[10px] font-bold uppercase">Apply for Account</button>
                        </form>
                    ) : (
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('pending_registrations').push({...d, timestamp: Date.now()});
                            alert("Application Sent!");
                            setIsRegistering(false);
                        }} className="space-y-4 text-left">
                            <input name="username" placeholder="Username" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="email" type="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="phone" placeholder="Phone Number" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <input name="password" type="password" placeholder="Create Password" className="w-full p-4 bg-[#0f172a] rounded-xl text-white border border-slate-800" required />
                            <button className="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase">Submit Application</button>
                            <button type="button" onClick={() => setIsRegistering(false)} className="w-full text-slate-500 text-[10px] font-bold uppercase text-center">Back</button>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    const SidebarLink = ({ id, label, icon }) => (
        <button onClick={() => setView(id)} className={`w-full flex items-center gap-3 px-6 py-4 text-[10px] font-black uppercase tracking-widest ${view === id ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800'}`}>
            <span>{icon}</span> {label}
        </button>
    );

    return (
        <div className="min-h-screen bg-[#0f172a] flex overflow-hidden">
            {/* USER AGREEMENT MODAL */}
            {userData && !userData.agreed && (
                <div className="fixed inset-0 z-[100] bg-[#0f172a] p-8 flex items-center justify-center">
                    <div className="bg-[#1e293b] p-8 rounded-[40px] max-w-lg border border-slate-700">
                        <h2 className="text-xl font-black text-white italic mb-4 uppercase">User Agreement</h2>
                        <div className="text-[10px] text-slate-400 leading-relaxed h-64 overflow-y-auto mb-6 p-4 bg-[#0f172a] rounded-2xl">
                            By using Net Ten Ltd, you agree that all loans carry a 25% interest rate. 
                            Late payments may result in additional fees. You authorize Net Ten Ltd to contact 
                            provided employer numbers for verification purposes. Repayment must be made 
                            via authorized methods only. Failure to repay may result in legal action.
                        </div>
                        <button onClick={() => db.ref(`users/${user.uid}`).update({agreed: true})} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase">I Accept & Agree</button>
                    </div>
                </div>
            )}

            <aside className="w-64 bg-[#1e293b] border-r border-slate-800 shrink-0">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8 object-contain" />
                    <h1 className="text-lg font-black text-white italic uppercase">Net Ten</h1>
                </div>
                <nav className="py-4">
                    {isAdmin ? (
                        <>
                            <SidebarLink id="home" label="Portfolios" icon="📂" />
                            <SidebarLink id="history" label="Collected/Loans" icon="📈" />
                            <SidebarLink id="pending" label="Registrations" icon="🔔" />
                            <SidebarLink id="add" label="New Portfolio" icon="➕" />
                        </>
                    ) : (
                        <>
                            <SidebarLink id="client_home" label="My Account" icon="👤" />
                            <SidebarLink id="client_apply" label="Apply/Top-Up" icon="💰" />
                            <SidebarLink id="client_history" label="My History" icon="📜" />
                            <SidebarLink id="client_privacy" label="Privacy" icon="⚖️" />
                        </>
                    )}
                </nav>
                <button onClick={() => auth.signOut()} className="m-6 p-4 w-52 bg-red-900/10 text-red-500 rounded-2xl text-[10px] font-black uppercase border border-red-900/20">Sign Out</button>
            </aside>

            <main className="flex-1 overflow-y-auto p-8">
                {/* ADMIN: PORTFOLIOS + EDIT/DELETE */}
                {isAdmin && view === 'home' && (
                    <div className="max-w-4xl mx-auto">
                        <input type="text" placeholder="Search..." className="w-full mb-6 bg-[#1e293b] border border-slate-700 p-4 rounded-2xl text-white text-xs" onChange={e => setSearchTerm(e.target.value)} />
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                <div key={c.id} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700">
                                    <div className="flex justify-between items-start mb-4">
                                        <div><h3 className="font-black text-white">{c.name}</h3><p className="text-[8px] text-slate-500 uppercase">Due: {c.dueDate}</p></div>
                                        <p className="text-xl font-black text-green-400">${parseFloat(c.interestAmount).toFixed(2)}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setPayingClient(c)} className="flex-1 bg-blue-600 text-white py-2 rounded-xl font-black text-[9px] uppercase">Record</button>
                                        <button onClick={() => setEditingClient(c)} className="flex-1 bg-slate-700 text-white py-2 rounded-xl font-black text-[9px] uppercase">Edit</button>
                                        <button onClick={() => { if(confirm("Delete?")) db.ref(`clients/${c.id}`).remove(); }} className="bg-red-900/20 text-red-500 px-3 rounded-xl">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN: FULL HISTORY */}
                {isAdmin && view === 'history' && (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Full Financial Log</h2>
                        <div className="space-y-2">
                            {allHistory.map((h, i) => (
                                <div key={i} className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                    <div><p className="text-white font-bold text-xs">{h.clientName}</p><p className="text-[8px] text-slate-500 uppercase">{h.date} • {h.type}</p></div>
                                    <p className={`font-black ${h.type === 'Payment' ? 'text-green-400' : 'text-blue-400'}`}>{h.type === 'Payment' ? '+' : '-'}${parseFloat(h.amount).toFixed(2)}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ADMIN: NEW PORTFOLIO (WITH EMPLOYER NUMBER) */}
                {isAdmin && view === 'add' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">New Client Portfolio</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            const h = { amount: parseFloat(d.interestAmount), date: d.loanDate, type: "Loan", timestamp: Date.now(), method: "Initial" };
                            await db.ref('clients').push({ ...d, history: [h] });
                            alert("Success!");
                            setView('home');
                        }} className="space-y-4">
                            <input name="name" placeholder="Full Name" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                            <input name="email" placeholder="Email" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                            <div className="grid grid-cols-2 gap-4">
                                <input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                <input name="employerNumber" placeholder="Employer #" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <input name="amountOwed" type="number" placeholder="Principal" onChange={(e) => handlePrincipalCalc(e.target.value)} className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                                <input name="interestAmount" value={tempInterest} placeholder="Total + 25%" className="p-4 bg-[#0f172a] rounded-xl text-white font-black text-xs" required />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <input name="loanDate" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                                <input name="dueDate" type="date" className="p-4 bg-[#0f172a] rounded-xl text-white text-xs" required />
                            </div>
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Create Portfolio</button>
                        </form>
                    </div>
                )}

                {/* CLIENT DASHBOARD: ACCOUNT INFO */}
                {!isAdmin && view === 'client_home' && (
                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white">
                            <p className="text-[10px] font-black uppercase opacity-60">Balance Due</p>
                            {clients.filter(c => c.email === user.email).map(c => (
                                <div key={c.id}>
                                    <h2 className="text-5xl font-black">${parseFloat(c.interestAmount).toLocaleString()}</h2>
                                    <p className="mt-2 text-xs">Due Date: {c.dueDate}</p>
                                </div>
                            ))}
                        </div>
                        <div className="bg-[#1e293b] p-8 rounded-[40px] border border-slate-700">
                            <h3 className="text-white font-black uppercase text-xs mb-4">My Information</h3>
                            <div className="space-y-4 text-[10px] text-slate-400">
                                <p>USER: <span className="text-white font-bold">{userData?.username}</span></p>
                                <p>NAME: <span className="text-white font-bold">{userData?.name}</span></p>
                                <p>EMAIL: <span className="text-white font-bold">{userData?.email}</span></p>
                            </div>
                        </div>
                    </div>
                )}

                {/* CLIENT: TOP UP / LOAN APPLICATION */}
                {!isAdmin && view === 'client_apply' && (
                    <div className="max-w-xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6 text-center">Request Top-Up</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref('requests').push({ ...d, email: user.email, timestamp: Date.now() });
                            alert("Request Sent!");
                        }} className="space-y-4">
                            <input name="amount" type="number" placeholder="Requested Amount" className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" required />
                            <textarea name="reason" placeholder="Reason for loan/top-up..." className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs h-32 border border-slate-800"></textarea>
                            <button className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Submit Request</button>
                        </form>
                    </div>
                )}

                {/* CLIENT: PRIVACY POLICY */}
                {!isAdmin && view === 'client_privacy' && (
                    <div className="max-w-2xl mx-auto bg-[#1e293b] p-10 rounded-[40px] border border-slate-700">
                        <h2 className="text-xl font-black text-white italic uppercase mb-6">Privacy & Policy</h2>
                        <div className="text-[11px] text-slate-400 space-y-4">
                            <p>1. Data Collection: We collect your name, phone, and employment data strictly for credit assessment.</p>
                            <p>2. Data Security: Your information is encrypted via Firebase SSL protocols.</p>
                            <p>3. Third Parties: We do not sell your data. We only contact employers for verification.</p>
                        </div>
                    </div>
                )}
            </main>

            {/* MODAL: EDIT PORTFOLIO */}
            {editingClient && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#0f172a]/90 backdrop-blur-sm">
                    <div className="bg-[#1e293b] w-full max-w-md p-8 rounded-[40px] border border-slate-700">
                        <h3 className="text-white font-black uppercase mb-4">Edit {editingClient.name}</h3>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const d = Object.fromEntries(new FormData(e.target).entries());
                            await db.ref(`clients/${editingClient.id}`).update(d);
                            setEditingClient(null);
                        }} className="space-y-3">
                            <input name="name" defaultValue={editingClient.name} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="phone" defaultValue={editingClient.phone} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="employerNumber" defaultValue={editingClient.employerNumber} placeholder="Employer #" className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <input name="dueDate" type="date" defaultValue={editingClient.dueDate} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" />
                            <div className="flex gap-2">
                                <button type="button" onClick={() => setEditingClient(null)} className="flex-1 bg-slate-800 text-white py-3 rounded-xl">Cancel</button>
                                <button className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black">SAVE</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {/* MODAL: ACTION (PAYMENT / TOPUP) */}
            {payingClient && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-[40px] p-8 border border-slate-700 shadow-2xl">
                        <div className="flex justify-between border-b border-slate-800 pb-2 mb-6">
                            <button onClick={() => setIsNewLoanView(false)} className={`text-[10px] font-black uppercase ${!isNewLoanView ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-500'}`}>Receive Payment</button>
                            <button onClick={() => setIsNewLoanView(true)} className={`text-[10px] font-black uppercase ${isNewLoanView ? 'text-green-400 border-b-2 border-green-400' : 'text-slate-500'}`}>New Loan</button>
                        </div>
                        <div className="space-y-4">
                            <input type="date" id="adjDate" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" defaultValue={new Date().toISOString().split('T')[0]} />
                            <input type="number" id="adjAmt" placeholder={isNewLoanView ? "Principal" : "Payment"} onChange={(e) => handlePrincipalCalc(e.target.value)} className="w-full p-6 bg-[#0f172a] rounded-2xl text-white text-3xl font-black text-center" />
                            {isNewLoanView && <div className="p-4 bg-green-900/10 rounded-2xl text-center"><p className="text-2xl font-black text-white">${tempInterest}</p></div>}
                            <button onClick={async () => {
                                const amt = isNewLoanView ? parseFloat(tempInterest) : parseFloat(document.getElementById('adjAmt').value);
                                if(!amt) return;
                                const h = { amount: amt, date: document.getElementById('adjDate').value, type: isNewLoanView ? "Loan" : "Payment", timestamp: Date.now() };
                                const updates = { interestAmount: isNewLoanView ? (parseFloat(payingClient.interestAmount) + amt) : Math.max(0, parseFloat(payingClient.interestAmount) - amt), history: [...(payingClient.history || []), h] };
                                await db.ref(`clients/${payingClient.id}`).update(updates);
                                setPayingClient(null);
                            }} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase">Post Transaction</button>
                            <button onClick={() => setPayingClient(null)} className="w-full text-slate-500 text-xs font-bold uppercase">Cancel</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

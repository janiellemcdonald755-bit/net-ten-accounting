<!DOCTYPE html>
<html>
<head>
    <title>Net Ten Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIG (Paste your real keys here!)
        const firebaseConfig = {
    apiKey: "AIzaSyBEpUog1zPTTSIG_oVX4o8ENZsDTO3kRzE",
    authDomain: "net-ten-accounting.firebaseapp.com",
    databaseURL: "https://net-ten-accounting-default-rtdb.firebaseio.com",
    projectId: "net-ten-accounting",
    storageBucket: "net-ten-accounting.appspot.com",
    messagingSenderId: "1095937995425",
    appId: "1:1095937995425:web:9d2089d7044a007e6336e0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('home'); 
    const [clients, setClients] = React.useState([]);
    const [searchTerm, setSearchTerm] = React.useState('');
    const [loginId, setLoginId] = React.useState('');
    const [password, setPassword] = React.useState('');
    
    // States for Modals
    const [editingClient, setEditingClient] = React.useState(null);
    const [payingClient, setPayingClient] = React.useState(null);
    
    // States for Filtering
    const [historyFilter, setHistoryFilter] = React.useState('all'); 
    const [customStart, setCustomStart] = React.useState('');
    const [customEnd, setCustomEnd] = React.useState('');
    
    // States for Calculations
    const [tempPrincipal, setTempPrincipal] = React.useState('');
    const [tempInterest, setTempInterest] = React.useState('');
    const [payAmt, setPayAmt] = React.useState('');
    const [isNewLoanView, setIsNewLoanView] = React.useState(false);

    const ADMIN_EMAIL = "winstonhmcdonald@gmail.com"; 

    React.useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u));
        const clientsRef = db.ref('clients');
        clientsRef.on('value', (snap) => {
            const data = snap.val();
            const list = [];
            if (data) Object.keys(data).forEach(k => list.push({id: k, ...data[k]}));
            setClients(list);
        });
        return () => clientsRef.off();
    }, []);

    const handleLogin = (e) => {
        e.preventDefault();
        let finalEmail = loginId.includes('@') ? loginId : `${loginId.replace(/[^0-9]/g, '')}@netten.com`;
        auth.signInWithEmailAndPassword(finalEmail, password).catch(err => alert("Login failed."));
    };

    const isAdmin = user?.email === ADMIN_EMAIL;

    // --- Filter Logic ---
    const getFilteredHistory = () => {
        const now = new Date();
        const startOfDay = new Date(new Date().setHours(0,0,0,0)).getTime();
        const startOfWeek = new Date(new Date().setDate(now.getDate() - now.getDay())).getTime();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        let cStart = customStart ? new Date(customStart).getTime() : 0;
        let cEnd = customEnd ? new Date(customEnd).setHours(23,59,59,999) : Date.now();

        const all = clients.flatMap(c => (c.history || []).map(h => ({ ...h, clientId: c.id, clientName: c.name })));
        return all.filter(h => {
            if (historyFilter === 'day') return h.timestamp >= startOfDay;
            if (historyFilter === 'week') return h.timestamp >= startOfWeek;
            if (historyFilter === 'month') return h.timestamp >= startOfMonth;
            if (historyFilter === 'custom') return h.timestamp >= cStart && h.timestamp <= cEnd;
            return true;
        }).sort((a, b) => b.timestamp - a.timestamp);
    };

    const filteredHistory = getFilteredHistory();
    const periodTotal = filteredHistory.reduce((acc, h) => acc + parseFloat(h.amount || 0), 0);
    const activeTotalOut = clients.reduce((acc, c) => acc + (parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0)), 0);

    const handleCalc = (val) => {
        setTempPrincipal(val);
        const num = parseFloat(val);
        if(!isNaN(num)) setTempInterest((num * 0.25).toFixed(2));
    };

    if (!user) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                <div className="bg-[#1e293b] p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-700">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-20 h-20 mx-auto mb-4 object-contain" />
                    <h1 className="text-3xl font-black text-blue-400 mb-2 uppercase italic italic tracking-tighter">Net Ten Ltd</h1>
                    <form onSubmit={handleLogin} className="space-y-4 mt-6">
                        <input type="text" placeholder="Admin ID / Phone" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setLoginId(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-[#0f172a] rounded-2xl border border-slate-700 text-white outline-none" onChange={e => setPassword(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Sign In</button>
                    </form>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-24 bg-[#0f172a] text-slate-200 font-sans">
            <header className="sticky top-0 z-50 bg-[#1e293b]/80 backdrop-blur-md p-5 border-b border-slate-700 flex justify-between items-center">
                <div className="flex items-center gap-3">
                    <img src="https://image2url.com/r2/default/images/1774110665422-b7648686-3a6e-4dd7-8fb7-81e80f230e33.png" className="w-8 h-8 object-contain" />
                    <h1 className="text-md font-black text-white uppercase italic text-sm">Net Ten Ltd</h1>
                </div>
                <button onClick={() => auth.signOut()} className="text-[9px] font-black text-red-400 border border-red-900/50 px-3 py-1 rounded-full uppercase">Logout</button>
            </header>

            <main className="p-4 max-w-lg mx-auto">
                {isAdmin ? (
                    <div>
                        <nav className="flex bg-[#1e293b] p-1 rounded-2xl mb-6 border border-slate-700">
                            <button onClick={() => setView('home')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'home' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Portfolios</button>
                            <button onClick={() => setView('history')} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'history' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>History</button>
                            <button onClick={() => { setView('add'); setTempPrincipal(''); setTempInterest(''); }} className={`flex-1 py-3 rounded-xl text-[8px] font-black uppercase ${view === 'add' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>New Client</button>
                        </nav>

                        {view === 'home' && (
                            <>
                                <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-[32px] mb-6 border border-blue-400/30">
                                    <p className="text-[10px] font-black text-blue-100 uppercase mb-1">Total Outstanding</p>
                                    <p className="text-4xl font-black text-white italic tracking-tighter">${activeTotalOut.toFixed(2)}</p>
                                </div>
                                <input type="text" placeholder="Search portfolios..." className="w-full p-4 mb-6 bg-[#1e293b] rounded-2xl border border-slate-700 text-white outline-none" onChange={(e) => setSearchTerm(e.target.value)} />
                                {clients.filter(c => c.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <div key={c.id} className="bg-[#1e293b] p-5 rounded-[32px] border border-slate-700 mb-4 shadow-xl">
                                        <div className="flex justify-between items-start">
                                            <div><h3 className="font-black text-white text-lg">{c.name}</h3><p className="text-[8px] text-slate-500 font-black uppercase tracking-tighter">DUE: {c.dueDate || 'N/A'}</p></div>
                                            <div className="text-right"><p className="font-black text-xl text-green-400 tracking-tighter">${(parseFloat(c.interestAmount || 0) + parseFloat(c.additionalFunds || 0)).toFixed(2)}</p></div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 mt-4">
                                            <button onClick={() => { setPayingClient(c); setPayAmt(''); setIsNewLoanView(false); }} className="bg-slate-700 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Payment/Loan</button>
                                            <button onClick={() => { setEditingClient(c); setTempPrincipal(c.amountOwed); setTempInterest(c.interestAmount); }} className="bg-blue-900/30 text-blue-400 border border-blue-900/50 py-3 rounded-xl font-bold text-[8px] uppercase">Details</button>
                                            <button onClick={() => { const m = prompt("Note for " + c.name); if(m) db.ref(`clients/${c.id}`).update({ directMsg: m }); }} className="bg-blue-600 text-white py-3 rounded-xl font-bold text-[8px] uppercase">Note</button>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}

                        {view === 'history' && (
                            <div>
                                <div className="bg-green-900/20 border border-green-900/30 p-6 rounded-[32px] mb-4 text-center">
                                    <p className="text-green-500 font-black text-[10px] uppercase mb-1">Total Collected</p>
                                    <p className="text-4xl font-black text-white italic tracking-tighter">${periodTotal.toFixed(2)}</p>
                                </div>
                                <div className="flex flex-wrap bg-[#1e293b] p-1 rounded-2xl mb-4 border border-slate-700">
                                    {['all', 'day', 'week', 'month', 'custom'].map(f => (
                                        <button key={f} onClick={() => setHistoryFilter(f)} className={`flex-1 py-2 rounded-xl text-[8px] font-black uppercase ${historyFilter === f ? 'bg-green-600 text-white' : 'text-slate-500'}`}>{f}</button>
                                    ))}
                                </div>
                                {historyFilter === 'custom' && (
                                    <div className="grid grid-cols-2 gap-2 mb-6 animate-in slide-in-from-top">
                                        <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                        <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className="p-3 bg-[#0f172a] rounded-xl text-white text-xs border border-slate-800" />
                                    </div>
                                )}
                                <div className="space-y-3">
                                    {filteredHistory.map((h, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-[#1e293b] rounded-2xl border border-slate-800 shadow-md">
                                            <div><p className="text-blue-400 font-black text-[10px] uppercase">{h.clientName}</p><p className="text-[8px] text-slate-500 font-bold uppercase">{h.date}</p></div>
                                            <p className="font-black text-green-400 text-md">${parseFloat(h.amount).toFixed(2)}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'add' && (
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const d = Object.fromEntries(new FormData(e.target).entries());
                                const email = `${d.phone.replace(/[^0-9]/g, '')}@netten.com`;
                                await db.ref('clients').push({
                                    ...d, 
                                    email, 
                                    interestAmount: parseFloat(d.interestAmount || 0), 
                                    amountOwed: parseFloat(d.amountOwed || 0), 
                                    additionalFunds: parseFloat(d.additionalFunds || 0)
                                });
                                alert("Record Created!"); setView('home');
                            }} className="bg-[#1e293b] p-6 rounded-[32px] border border-slate-700 space-y-3">
                                <h2 className="text-lg font-black text-white uppercase italic">New Portfolio</h2>
                                <div className="grid grid-cols-2 gap-3"><input name="name" placeholder="Name" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required /><input name="phone" placeholder="Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" required /></div>
                                <input name="workAddress" placeholder="Work Address" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white outline-none" />
                                <div className="grid grid-cols-2 gap-3"><input name="empPhone" placeholder="Emp Phone" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" /><input name="location" placeholder="Work Location" className="p-4 bg-[#0f172a] rounded-2xl text-white outline-none" /></div>
                                <div className="grid grid-cols-2 gap-3 pt-2"><input name="loanDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" /><input name="dueDate" type="date" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs border border-red-900/20" required /></div>
                                <div className="grid grid-cols-3 gap-2">
                                    <input name="amountOwed" placeholder="Principal" type="number" step="any" value={tempPrincipal} onChange={(e) => handleCalc(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" />
                                    <input name="additionalFunds" placeholder="Top-Up" type="number" step="any" className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" />
                                    <input name="interestAmount" placeholder="Interest" type="number" step="any" value={tempInterest} onChange={(e) => setTempInterest(e.target.value)} className="w-full p-4 bg-[#0f172a] rounded-2xl text-white text-xs" required />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase mt-2 shadow-lg">Save Profile</button>
                            </form>
                        )}

                        {editingClient && (
                            <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-[#0f172a]/95 backdrop-blur-md">
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const d = Object.fromEntries(new FormData(e.target).entries());
                                    db.ref(`clients/${editingClient.id}`).update({
                                        ...d, 
                                        interestAmount: parseFloat(d.interestAmount || 0), 
                                        amountOwed: parseFloat(d.amountOwed || 0),
                                        additionalFunds: parseFloat(d.additionalFunds || 0)
                                    });
                                    setEditingClient(null); alert("Updated!");
                                }} className="bg-[#1e293b] w-full max-w-md rounded-[32px] p-8 border border-slate-700 space-y-4 overflow-y-auto max-h-[90vh]">
                                    <h3 className="text-xl font-black text-white uppercase italic">Edit Client</h3>
                                    <input name="name" defaultValue={editingClient.name} className="w-full p-4 bg-[#0f172a] rounded-xl text-white" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input name="dueDate" type="date" defaultValue={editingClient.dueDate} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                        <input name="phone" defaultValue={editingClient.phone} className="w-full p-4 bg-[#0f172a] rounded-xl text-white text-xs" />
                                    </div>
                                    <input name="workAddress" defaultValue={editingClient.workAddress} className="w-full p-4 bg-[#0f172a] rounded-xl text-white" />
                                    <div className="grid grid-cols-3 gap-2 pt-2">
                                        <div className="space-y-1"><label className="text-[7px] uppercase font-black ml-1">Principal</label><input name="amountOwed" type="number" step="any" defaultValue={editingClient.amountOwed} className="w-full p-3 bg-[#0f172a] rounded-xl text-white text-xs" /></div>
                                        <div className="space-y-1"><label className="text-[7px] uppercase font-black ml-1">
